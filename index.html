      <label class="btn quiet phbtn">画像を選ぶ
        <input type="file" accept="image/*" id="hb-pick"></label>
      ${h.img?`<button class="btn quiet" id="hb-imgdel">写しを消す</button>`:""}
    </div>
    ${h.img?`<div style="margin-top:10px">
        <img src="${h.img}" alt="請求書の写し" style="max-width:100%;border-radius:8px;border:1px solid var(--line,#ddd)">
        <p class="note">${esc(h.imgAt||"")}に添付。タップで拡大はできません（大きく見たいときは元の画像を開いてください）。</p>
      </div>`:`<p class="note">まだ入っていません。</p>`}
    <p class="note">いま保存しているデータぜんたいは ${Math.round(dataSize()/1024)}KB です。
      ${dataSize()>3500000?`<b style="color:var(--alert)">大きくなってきました。</b>
        古い月の写しを消すか、JSONに書き出して外に置いてください。`:""}</p>
  </div>`;
}
function bindHpbBill(m){
  const msg=(t,ok)=>{const e=document.getElementById("hb-msg"); if(!e) return;
    e.textContent=t; e.style.color=ok?"var(--accent)":"var(--alert)";};
  const need=()=>{
    if(!db.hpb) db.hpb={};
    if(!db.hpb[m]) db.hpb[m]={at:today(),rows:[],smart:{}};
    return db.hpb[m];
  };
  document.querySelectorAll("[data-adjn]").forEach(i=>i.oninput=()=>{
    hpbAdj[+i.dataset.adjn].n=i.value; });
  document.querySelectorAll("[data-adjv]").forEach(i=>i.oninput=()=>{
    hpbAdj[+i.dataset.adjv].v=+i.value||0; });
  document.querySelectorAll("[data-adjdel]").forEach(b=>b.onclick=()=>{
    hpbAdj.splice(+b.dataset.adjdel,1); renderHpb(); });
  document.getElementById("hb-addadj").onclick=()=>{ hpbAdj.push({n:"",v:0}); renderHpb(); };
  document.getElementById("hb-save").onclick=async()=>{
    const r=need();
    r.bill={grant:+document.getElementById("hb-grant").value||0,
            pt:+document.getElementById("hb-pt").value||0,
            adj:hpbAdj.filter(x=>x.n||x.v).map(x=>({n:x.n,v:+x.v||0})),
            note:document.getElementById("hb-note").value.trim(),
            at:today()};
    await save(); hpbAdjLoad(m,true); renderHpb(); renderVisit(); toast("請求書の数字を保存しました");
  };
  const del=document.getElementById("hb-del");
  if(del) del.onclick=async()=>{
    if(!confirm("請求書から転記した数字を消します。よろしいですか？"))return;
    delete db.hpb[m].bill; hpbAdj=[]; await save(); hpbAdjLoad(m,true); renderHpb(); renderVisit();
    toast("消しました");
  };
  const shot=async e=>{
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    msg("読み込み中…",true);
    try{
      const d=await shrinkImage(f,1400,0.7);
      const r=need(); r.img=d; r.imgAt=today();
      await save(); renderHpb(); toast(`請求書の写しを入れました（約${Math.round(d.length/1024)}KB）`);
    }catch(err){ msg("入れられませんでした："+err.message,false); }
  };
  document.getElementById("hb-shot").onchange=shot;
  document.getElementById("hb-pick").onchange=shot;
  const idel=document.getElementById("hb-imgdel");
  if(idel) idel.onclick=async()=>{
    if(!confirm("請求書の写しを消します。よろしいですか？"))return;
    delete db.hpb[m].img; delete db.hpb[m].imgAt; await save(); renderHpb(); toast("消しました");
  };
}

function hpbDraftMonth(){
  const all=[...((hpbDraft.bill||{}).rows||[]),...((hpbDraft.smart||{}).rows||[])];
  const t={};
  all.forEach(x=>{ const m=(x.date||"").slice(0,7); if(m) t[m]=(t[m]||0)+1; });
  const ks=Object.keys(t).sort((a,b)=>t[b]-t[a]);
  return {m:ks[0]||stMonth, all:ks};
}
function renderHpb(){
  const el=document.getElementById("hpbhost"); if(!el) return;
  const cur=hpbSales(stMonth);
  const d=hpbDraft, dm=hpbDraftMonth();

  ((d.smart||{}).rows||[]).forEach(x=>{ smMap[x.no]=(smMap[x.no]||0)+x.amt; });

  // 下書きの集計（反映前でも数字を見せる）
  let pay=0,pt=0,gift=0,grant=0;

  const smart=Object.values(smMap).reduce((a,b)=>a+b,0);
  const off=pt+gift+smart, gross=pay+pt+gift;
  const orphan=Object.keys(smMap).filter(no=>!((d.bill||{}).rows||[]).some(x=>x.no===no));

  el.innerHTML=`
    <div class="sheet">
      <p class="note" style="margin:0 0 12px">サロンボードの
        <b>「振込・請求明細」</b>と<b>「スマート支払い振込・明細」</b>のCSVを入れてください。

        スマート支払い）が分かるので、売上に足して月の締めを合わせられます。
        <b>ファイルの中身だけを見て、どちらの明細かを判断します</b>（名前は変えても大丈夫です）。</p>
      <div class="actions">
        <label class="btn phbtn">CSVを選ぶ（2つ同時でも可）
          <input type="file" id="hp-file" accept=".csv,text/csv,text/plain" multiple></label>
        ${(d.bill||d.smart)?`<button class="btn quiet" id="hp-clear">読み込みをやめる</button>`:""}

      <p class="note" id="hp-msg" ${d.err?'style="color:var(--alert)"':""}>${esc(d.err||"")}</p>
      <p class="note">読めるのは <b>.csv</b> だけです。Shift_JIS のままで大丈夫です。</p>
    </div>

    ${(d.bill||d.smart)?`
    <div class="sheet">
      <div class="schbar" style="margin:0 0 10px">
        <span class="title">読み取った内容</span>
        <select class="f-in" id="hp-month" style="width:auto">
          ${(dm.all.length?dm.all:[dm.m]).map(x=>
            `<option value="${x}"${x===dm.m?" selected":""}>${x.replace("-","年")}月ぶんとして入れる</option>`).join("")}
        </select>
      </div>
      <table class="chk an"><tbody>
        <tr><th>振込・請求明細</th><td>${d.bill?`${d.bill.rows.length}件`:'<b style="color:var(--alert)">まだ</b>'}</td></tr>
        <tr><th>スマート支払い明細</th><td>${d.smart?`${d.smart.rows.length}件`:'<b style="color:var(--alert)">まだ</b>'}</td></tr>
        ${line("施術総額（税込）",gross,"bdtot")}
        ${line("　来店処理金額",pay)}
        ${line("　利用ポイント",pt)}
        ${line("　利用ギフト券",gift)}
        ${line("うちスマート支払い（事前決済）",smart)}
        ${line("Squareに載らない＝売上に足すぶん",off,"bdtot")}
        ${line("店頭で受け取る＝Squareに入っているはず",pay-smart)}
        <tr><th>付与ポイント（原価に足す）</th><td>${grant}pt ＝ ${yen(grant)}</td></tr>
      </tbody></table>
      <div class="actions">
        <button class="btn" id="hp-apply"${d.bill?"":" disabled"}>この月に反映する</button>
      </div>
      <p class="note">
        ${d.bill?"":`<b style="color:var(--alert)">振込・請求明細が入っていないので反映できません。</b>`}
        ${orphan.length?`<br><b style="color:var(--alert)">スマート支払いのうち ${orphan.length}件が、請求明細に同じ予約番号で見つかりません。</b>
          月がまたがっているかもしれません（${esc(orphan.slice(0,3).join("・"))}）。`:""}
        ${bad.length?`<br><b style="color:var(--alert)">付与ポイントが検算（税抜の1%）と合わない行が ${bad.length}件あります。</b>
          ${esc(bad.slice(0,3).map(x=>x.name).join("・"))} など。`:""}
        ${((d.bill||{}).rows||[]).some(x=>x.fix)?`<br>訂正のある行があります。<b>差引後の数字</b>で計算しています。`:""}

    <div class="sheet" style="margin-top:14px">
      <label class="f">${stMonth.replace("-","年")}月に入っているぶん</label>

          入れ直すときは、もう一度CSVを読ませて反映すれば置きかわります。</p>
        <div class="actions"><button class="btn quiet" id="hp-undo">この月のぶんを取り消す</button></div>`
      :`<p class="note">この月はまだ取り込んでいません。</p>`}

      ここで足すと二重になります。だから足していません。<br>
      付与ポイントは店が負担する原資なので、1pt＝1円として月締めの原価に入れています。
      実際の請求書と数字が違うときは、手数料や税のぶんかもしれません。見比べてください。</p>`;

  const msg=(t,ok)=>{const e=document.getElementById("hp-msg"); if(!e) return;
    e.textContent=t; e.style.color=ok?"var(--accent)":"var(--alert)";};

  document.getElementById("hp-file").onchange=async e=>{
    const files=[...e.target.files]; if(!files.length) return;
    hpbDraft.err="";
    for(const f of files){
      try{
        const txt=await readTextFile(f);
        const p=parseHpb(txt);
        if(p.kind==="smart") hpbDraft.smart=p; else hpbDraft.bill=p;
        hpbDraft.files.push(f.name);
      }catch(err){ hpbDraft.err=`${f.name}：${err.message}`; }

    renderHpb();
    if(!hpbDraft.err) msg(`読みました（${hpbDraft.bill?"請求明細":""}${hpbDraft.bill&&hpbDraft.smart?"・":""}${hpbDraft.smart?"スマート支払い":""}）`,true);

    delete db.hpb[stMonth]; await save(); renderHpb(); renderVisit(); toast("取り消しました");
  };
}

/* お誕生日から、いまの年齢。生年月日が無い／0000始まりなら null */
function custAge(c){
  if(!c.birth||c.birth.startsWith("0000")||c.birth.length<10) return null;
  const t=today();
  let a=(+t.slice(0,4))-(+c.birth.slice(0,4));
  if(t.slice(5)<c.birth.slice(5)) a--;
  return (a>=0&&a<130)?a:null;
}
/* 累計ご利用金額と、この1年ぶん。カルテの price を足す（Square取込も手書きも同じ） */
function custMoney(c){
  const y1=shiftDay(today(),-365);
  let tot=0,yr=0;
  chartsOf(c.id).forEach(k=>{
    const p=+k.price||0; if(!p) return;
    tot+=p; if(k.date>=y1) yr+=p;
  });
  return {tot,yr};
}
/* いちばん新しいカルテの担当者 */
function staffOf(c){
  const ks=chartsOf(c.id);
  return (ks[0]&&ks[0].staff)||"";
}
/* この方が条件に当てはまるか。すべてを満たすこと（カルテッツと同じAND） */
function segMatch(c,cr){
  if(!cr) return true;
  const has=v=>v!==undefined&&v!==null&&v!=="";
  if(cr.line==="1"&&!(c.lineId&&!c.lineBlocked)) return false;
  if(cr.line==="0"&&c.lineId) return false;
  if(Array.isArray(cr.bdMonths)&&cr.bdMonths.length){
    if(!c.birth||c.birth.startsWith("0000")) return false;
    if(!cr.bdMonths.includes(+c.birth.slice(5,7))) return false;
  }
  if(cr.bdThis==="1"){
    if(!c.birth||c.birth.startsWith("0000")) return false;
    if(c.birth.slice(5,7)!==today().slice(5,7)) return false;
  }
  if(has(cr.afrom)||has(cr.ato)){
    const a=custAge(c); if(a===null) return false;
    if(has(cr.afrom)&&a<+cr.afrom) return false;
    if(has(cr.ato)&&a>+cr.ato) return false;
  }
  if(has(cr.tag)){
    const t=(c.tags||"");
    if(!String(cr.tag).split(/[,、\s]+/).filter(Boolean).every(x=>t.includes(x))) return false;
  }
  if(has(cr.staff)&&staffOf(c)!==cr.staff) return false;
  const p=pace(c);
  if(has(cr.rfrom)||has(cr.rto)){
    if(!p) return false;
    if(has(cr.rfrom)&&p.since<+cr.rfrom) return false;
    if(has(cr.rto)&&p.since>+cr.rto) return false;
  }
  if(has(cr.vfrom)||has(cr.vto)){
    const n=visitsOf(c).length;
    if(has(cr.vfrom)&&n<+cr.vfrom) return false;
    if(has(cr.vto)&&n>+cr.vto) return false;
  }
  if(has(cr.tfrom)||has(cr.tto)||has(cr.yfrom)||has(cr.yto)){
    const m=custMoney(c);
    if(has(cr.tfrom)&&m.tot<+cr.tfrom) return false;
    if(has(cr.tto)&&m.tot>+cr.tto) return false;
    if(has(cr.yfrom)&&m.yr<+cr.yfrom) return false;
    if(has(cr.yto)&&m.yr>+cr.yto) return false;
  }
  if(cr.next==="1"&&!nextApptOf(c.id,today())) return false;
  if(cr.next==="0"&&nextApptOf(c.id,today())) return false;
  if(cr.pace==="1"&&!(p&&(p.lv==="risk"||p.lv==="soon"))) return false;
  return true;
}

function segMembers(cr){ return db.customers.filter(c=>segMatch(c,cr)); }
function segNameOf(id){ const s=segById(id); return s?s.name:"（未設定）"; }

function cpGive(cpId,cid){
  cpGiveInit();
  const cp=cpById(cpId); if(!cp||!cid) return null;
  const at=today();
  const g={id:"g"+Date.now().toString(36)+Math.floor(Math.random()*1000),
           cp:cpId, cid:cid, at:at, end:cpEndDate(cp,at), used:[]};
  db.cpgive.push(g);
  /* 保存容量のために古いぶんから落とす（端末の localStorage は5MBしかない） */
  if(db.cpgive.length>5000) db.cpgive=db.cpgive.slice(-5000);
  return g;
}
/* その方がいま使えるクーポン。期限切れと使いきりを外す */
function cpHeld(cid,on){
  cpGiveInit(); const t=on||today();
  return db.cpgive.filter(g=>g.cid===cid).filter(g=>{
    const cp=cpById(g.cp); if(!cp) return false;
    if(g.end && g.end<t) return false;
    return (g.used||[]).length < (+cp.times||1);
  });
}
function cpStat(cpId){
  cpGiveInit();
  const gs=db.cpgive.filter(g=>g.cp===cpId);
  return {gave:gs.length,
          used:gs.filter(g=>(g.used||[]).length).length,
          live:gs.filter(g=>cpHeld(g.cid).some(x=>x.id===g.id)).length};
}
async function cpUse(gid){
  cpGiveInit();
  const g=db.cpgive.find(x=>x.id===gid); if(!g) return;
  if(!Array.isArray(g.used)) g.used=[];
  const cp=cpById(g.cp);
  if(g.used.length>=(+((cp||{}).times)||1)) return;   /* 回数を超えて押させない */
  g.used.push(today()); await save();
}
async function cpUnuse(gid){
  cpGiveInit();
  const g=db.cpgive.find(x=>x.id===gid);
  if(!g||!Array.isArray(g.used)||!g.used.length) return;
  g.used.pop(); await save();
}

/* 配った記録の一覧。新しい順に60件まで（多くなると画面が重くなるため） */
function cpGiveHtml(){
  cpGiveInit();
  const t=today();
  const all=db.cpgive.slice().sort((a,b)=>a.at<b.at?1:-1);
  const rows=all.slice(0,60).map(g=>{
    const cp=cpById(g.cp), c=db.customers.find(x=>x.id===g.cid);
    const n=(g.used||[]).length, max=cp?(+cp.times||1):1;
    const dead=!!(g.end&&g.end<t);
    const live=n<max&&!dead;
    const st=n>=max?"使いきり":dead?"期限切れ":"使えます";
    return `<div class="pc"><div class="ph-row" style="cursor:default">
      <span class="pi ph" style="background:${live?"var(--accent)":"var(--ink3)"}">${n}</span>
      <div class="pn"><b>${esc(c?c.name:"（名簿にない方）")}
        <em style="font-style:normal;color:var(--ink3)">　${esc(cp?cp.name:"（消えたクーポン）")}</em></b>
        <span class="sub">配った日 ${g.at.replace(/-/g,"/")}
          ／ ${g.end?"期限 "+g.end.replace(/-/g,"/"):"期限なし"}
          ／ ${st}（${n}／${max}回）</span></div>
      ${live?`<button class="btn quiet qrbtn" data-cpuse="${g.id}">使った</button>`:""}
      ${n?`<button class="btn ghost qrbtn" data-cpunuse="${g.id}">取り消す</button>`:""}
    </div></div>`;
  }).join("");
  const live=all.filter(g=>{const cp=cpById(g.cp);
    return cp&&!(g.end&&g.end<t)&&(g.used||[]).length<(+cp.times||1);}).length;
  const used=all.filter(g=>(g.used||[]).length).length;
  return `<div class="sheet" style="margin-top:14px">
      <label class="f">配った記録</label>
      <p class="note">フォローUPで<b>クーポン付きの文を送ると、ここに1件たまります</b>。
        お会計のときに「使った」を押してください。押し間違えたら「取り消す」で戻せます。<br>
        ★ お客様がLINEの画面で使ったかどうかは、こちらからは分かりません。<b>押した記録だけが頼り</b>です。</p>
      <div class="tiles" style="margin:10px 0">
        <div class="tile"><span class="t-l">配った</span><span class="t-v">${all.length}件</span></div>
        <div class="tile"><span class="t-l">いま使える</span><span class="t-v">${live}件</span></div>
        <div class="tile"><span class="t-l">使われた</span><span class="t-v">${used}件</span></div>
      </div>
    </div>
    <div class="plist">${rows||`<div class="empty" style="padding:26px"><b>まだ1件も配っていません</b></div>`}</div>
    ${all.length>60?`<p class="note">新しい順に60件だけ出しています（ぜんぶで ${all.length}件）。</p>`:""}`;
}

function ensureLine(){
  const s=Object.assign({},LINE0,db.line||{});
  if(!Array.isArray(s.reminds)) s.reminds=LINE0.reminds.map(x=>Object.assign({},x));
  if(!Array.isArray(s.follows)) s.follows=LINE0.follows.map(x=>Object.assign({},x));

  if(s.richOn===undefined) s.richOn=true;

  s.rm=Object.assign({layout:"kou5",base:"",book:"",title:"salon de kou",
                      chatBarText:"メニュー",ink:"#5C5045",lastId:"",lastAt:""}, s.rm||{});
  if(!RMLAY[s.rm.layout]) s.rm.layout="kou5";

     ★ 毎回入れてはいけない。ensureLine は renderLine のたびに通るので、
       人が消した値をそのつど勝手に戻してしまう。
       db.rmver で1回に限る（セグメント segver ・クーポン cpver と同じ考え方） */
  if(db.rmver!==224){
    if(!String(s.rm.base||"").trim()) s.rm.base=RM_BASE0;
    if(!String(s.rm.book||"").trim()) s.rm.book=RM_BOOK0;
    db.rmver=224;
  }
  db.line=s;
  if(!db.linesent||typeof db.linesent!=="object") db.linesent={};
  cpGiveInit();
  /* セグメントとクーポンは、無ければカルテッツの中身を入れて始める。
     人が消したぶんを勝手に戻さないよう、db.segver / db.cpver で1回だけ入れる */
  if(!Array.isArray(db.segs)||db.segver!==1){
    if(!Array.isArray(db.segs)) db.segs=[];
    SEGSEED.forEach(x=>{ if(!db.segs.some(y=>y.id===x.id))
      db.segs.push({id:x.id,name:x.name,desc:x.desc,cr:Object.assign({},x.cr)}); });

  if(!Array.isArray(db.coupons)||db.cpver!==1){
    if(!Array.isArray(db.coupons)) db.coupons=[];
    CPSEED.forEach(x=>{ if(!db.coupons.some(y=>y.id===x.id))
      db.coupons.push(Object.assign({},x)); });
    db.cpver=1;
  }
  return s;
}

  catch(e){
    const ta=document.createElement("textarea");

    document.body.appendChild(ta); ta.select();
    let ok=false; try{ ok=document.execCommand("copy"); }catch(_){}
    ta.remove(); return ok;
  }
}

/* 予約リマインドの1通ぶん。上の文＋ご予約日時＋下の文＋次回のご案内＋署名 */
function remindText(r,c,a){
  const nm=(c&&c.name)||a.name||"";
  const p=[];
  if(nm) p.push(`${nm}様`);
  if(r.top) p.push(fill(r.top,c||{name:nm},a));
  p.push(apptBlock(a));
  if(r.bot) p.push(fill(r.bot,c||{name:nm},a));
  const nx=nextBlock(a.cid,a.date); if(nx) p.push(nx);
  const sg=signLine(); if(sg) p.push(sg);
  return p.filter(Boolean).join("\n\n");
}

/* ---------- フォローUPの「通知するタイミング」（v216） ----------
   2026-09-08 に実物のカルテッツを見たら、フォローUPの編集画面は
   グループ名／通知タイトル（30字）／対象セグメント／ステータス／設定有効期間／
   通知するタイミング（5種）／タイトル画像／テキスト本文 だった。
   v105は「最終来店からN日後」しか無かったので、5種を足し、
   もとの形は6つめ（visit＝うち独自）として残した。 */
const TIMS={
  once :"指定日時（1回だけ）",
  year :"毎年の指定日時",
  month:"毎月の指定日時",
  week :"毎月指定の曜日",
  day  :"毎日の指定時間",
  visit:"最終来店から◯日後（うち独自）"
};
const WKT={"0":"毎週","1":"第1週","2":"第2週","3":"第3週","4":"第4週","5":"奇数の週","6":"偶数の週"};
/* その日が月末か */
function isLastDay(ds){ return D(ds).getMonth()!==D(shiftDay(ds,1)).getMonth(); }
/* その日は「何回目のその曜日」か（1〜5） */
function nthWeekOf(ds){ return Math.floor(((+ds.slice(8,10))-1)/7)+1; }
function dayHit(ds,d){ return String(d)==="end"?isLastDay(ds):((+ds.slice(8,10))===(+d)); }
/* 設定有効期間の中か */
function inTerm(f,ds){
  if(f.start&&ds<f.start.slice(0,10)) return false;
  if(f.end&&ds>f.end.slice(0,10)) return false;
  return true;
}
/* きょうが、そのルールの送る日か */
function followDue(f,ds){
  const tm=f.tim||{t:"visit",days:30};
  if(tm.t==="visit"||tm.t==="day") return true;
  if(tm.t==="once")  return String(tm.date||"").slice(0,10)===ds;
  if(tm.t==="year")  return ((+ds.slice(5,7))===(+tm.m))&&dayHit(ds,tm.d);
  if(tm.t==="month") return dayHit(ds,tm.d);
  if(tm.t==="week"){
    if(D(ds).getDay()!==(+tm.w)) return false;
    const wt=String(tm.wt||"0"), n=nthWeekOf(ds);
    if(wt==="0") return true;
    if(wt==="5") return n%2===1;
    if(wt==="6") return n%2===0;
    return n===(+wt);
  }
  return false;
}
/* タイミングを1行で言いあらわす */
function timText(f){
  const tm=f.tim||{};
  if(tm.t==="once")  return `${String(tm.date||"").replace("T"," ").replace(/-/g,"/")} に1回だけ`;
  if(tm.t==="year")  return `毎年 ${tm.m}月${tm.d==="end"?"末":tm.d+"日"} ${tm.at||""}ごろ`;
  if(tm.t==="month") return `毎月 ${tm.d==="end"?"月末":tm.d+"日"} ${tm.at||""}ごろ`;
  if(tm.t==="week")  return `${WKT[String(tm.wt||"0")]}の${DOW[+tm.w||0]}曜日 ${tm.at||""}ごろ`;
  if(tm.t==="day")   return `毎日 ${tm.at||""}ごろ`;
  return `最終来店から ちょうど${+tm.days||0}日後`;
}
/* 二重送信よけの合い言葉。visit は「その方の最終来店日」、
   ほかは「送る日」で数える（毎日・毎月でも1日1回になる） */
function followTag(f,c){
  const tm=f.tim||{};
  if(tm.t==="visit"){ const p=pace(c); return p?p.last:""; }
  return today();
}
/* フォローUPの1通ぶん。通知タイトル＋本文＋クーポン＋次回のご案内＋署名 */
function followText(f,c){
  const p=[];
  if(f.title) p.push(fill(f.title,c));
  p.push(fill(f.text||"",c));
  const cp=couponBlock(f.coupon); if(cp) p.push(cp);
  const nx=nextBlock(c.id,today()); if(nx) p.push(nx);
  const sg=signLine(); if(sg) p.push(sg);
  return p.filter(Boolean).join("\n\n");
}
/* そのルールが今日送るぶん。
   ①設定有効期間の中 ②きょうが送る日 ③対象セグメントに当てはまる
   ④LINEでつながっている（ブロックされていない）
   visit のときだけ「最終来店からちょうどN日」でさらに絞る。
   「N日以上」にすると押した日に何十通も飛ぶので、ちょうどN日にしてある */
function followTargets(f){
  const ds=today();
  if(!inTerm(f,ds)||!followDue(f,ds)) return [];
  const tm=f.tim||{};
  let list=db.customers.filter(c=>c.lineId&&!c.lineBlocked);
  if(tm.t==="visit"){
    const n=+tm.days||0;
    list=list.filter(c=>{ const p=pace(c); return p&&p.since===n; });
  }
  const sg=segById(f.segId);
  if(sg) list=list.filter(c=>segMatch(c,sg.cr));
  return list;
}
/* 二重送信よけ。同じルール×同じ相手×同じきっかけは1回だけ */
function lineSentKey(rid,cid,tag){ return `${rid}|${cid}|${tag}`; }
function lineSentAt(k){ return (db.linesent||{})[k]||""; }
async function markLineSent(k){
  if(!db.linesent) db.linesent={};
  db.linesent[k]=today();
  const ks=Object.keys(db.linesent);
  if(ks.length>3000) ks.slice(0,ks.length-3000).forEach(x=>delete db.linesent[x]);
  await save();
}

/* 画像つきで送れるようにした（v222）。★ img を渡さなければ v216 までと1バイトも変わらない。
   画像は **https の URL** で渡す（LINEの決まり。中継役が image メッセージに組み立てる）。
   中継役 v23 以上が要る。古いままだと文字だけ届く */
async function lineSend(cids,text,img){
  const q=img&&/^https:\/\//.test(img)?`&img=${encodeURIComponent(img)}`:"";
  if(cids.length===1) { await relayGet("push",`&c=${cids[0]}&text=${encodeURIComponent(text)}${q}`); return 1; }
  const j=await relayGet("multicast",`&c=${cids.join(",")}&text=${encodeURIComponent(text)}${q}`);
  return j.sent||cids.length;
}

/* ==================== リッチメニュー（v222） ====================

     カルテッツの「各種設定 → 画面デザイン」は、**4種類のリッチメニュー画像**だった
     （ビューティー／ラグジュアリー／スタイリッシュ／ポップ。実物は**ラグジュアリー**）。
     画像は 1250×843＝LINEの 2500×1686 の半分。中身は 3×2 のマス目で、

     canvas に描いて、そのまま base64 で中継役へ送る。**画像ファイルを1枚も持たずに済む**し、

     URLだけのメニューは **Webhook を付け替えなくても動く**。

      {k:"card",  x:833,  y:843, w:834,  h:843, en:"Member card", ja:"会員証",     bg:"#EBE5DA", ic:"card"},

/* 行き先。お客様ページの置き場所（公開URL）＋ページ名で組み立てる。
   ★ ご予約だけは外（ホットペッパー）なので、そのまま使う */
function rmLink(k){
  const s=(db.line&&db.line.rm)||{};
  const base=String(s.base||"").replace(/\/+$/,"");
  const at=p=>base?base+"/"+p:"";
  return {book:String(s.book||""),
          my:at("kou-mypage_2.html?p=my"),
          coupon:at("kou-mypage_2.html?p=coupon"),
          card:at("kou-mypage_2.html?p=card"),
          about:at("kou-salon.html")}[k]||"";
}

/* LINEに渡す定義。**ここが仕様どおりでないと LINE は 400 を返して理由を言ってくれない**ので、
   送る前に rmCheck() で自分で確かめる */
function rmDef(){
  const s=(db.line&&db.line.rm)||{};
  const lay=RMLAY[s.layout]||RMLAY.kou5;
  return {
    size:{width:lay.size.w,height:lay.size.h},
    selected:true,
    name:String(s.title||"salon de kou").slice(0,300),
    chatBarText:String(s.chatBarText||"メニュー").slice(0,14),
    areas:lay.cells.map(c=>({
      bounds:{x:c.x,y:c.y,width:c.w,height:c.h},
      action:{type:"uri",label:c.ja.slice(0,20),uri:rmLink(c.k)}
    }))
  };
}

/* 送る前の自己点検。**LINEに叩かれる前に、こちらで止める** */
function rmCheck(){
  const s=(db.line&&db.line.rm)||{};
  const lay=RMLAY[s.layout]||RMLAY.kou5;
  const ng=[];
  if(!String(s.base||"").trim()) ng.push("お客様ページの置き場所（公開URL）が未入力です");
  else if(!/^https:\/\//.test(s.base)) ng.push("お客様ページの置き場所は https:// で始まる必要があります");
  if(!String(s.book||"").trim()) ng.push("ご予約の行き先（ホットペッパーのURL）が未入力です");
  else if(!/^https:\/\//.test(s.book)) ng.push("ご予約の行き先は https:// で始まる必要があります");
  lay.cells.forEach(c=>{
    const u=rmLink(c.k);
    if(u&&!/^https:\/\//.test(u)) ng.push(`「${c.ja}」の行き先が https:// になっていません`);
  });
  /* マス目の合計が、決めた大きさとぴったり合っているか */
  const w=lay.size.w,h=lay.size.h;
  lay.cells.forEach(c=>{
    if(c.x<0||c.y<0||c.x+c.w>w||c.y+c.h>h) ng.push(`「${c.ja}」のマスが枠からはみ出しています`);
  });
  const area=lay.cells.reduce((a,c)=>a+c.w*c.h,0);
  if(area!==w*h) ng.push(`マスの合計が画像の大きさと合いません（${area} ≠ ${w*h}）`);
  const rl=db.relay||{};
  if(!(rl.url&&rl.key)) ng.push("中継役のURLと合言葉が未設定です（連携タブ → 連携設定）");
  return ng;
}

/* 線画のしるし。**塗りつぶさず線だけ**にしてある（PNGがよく縮むので、
   LINEの1MB制限にゆとりが出る） */
function rmIcon(g,kind,cx,cy,r){
  g.save(); g.translate(cx,cy); g.lineWidth=Math.max(3,r*0.075);
  g.strokeStyle=g.fillStyle; g.lineJoin="round"; g.lineCap="round";
  const R=(x,y,w,h,rad)=>{ g.beginPath();
    g.moveTo(x+rad,y); g.lineTo(x+w-rad,y); g.quadraticCurveTo(x+w,y,x+w,y+rad);
    g.lineTo(x+w,y+h-rad); g.quadraticCurveTo(x+w,y+h,x+w-rad,y+h);
    g.lineTo(x+rad,y+h); g.quadraticCurveTo(x,y+h,x,y+h-rad);
    g.lineTo(x,y+rad); g.quadraticCurveTo(x,y,x+rad,y); g.closePath(); };
  if(kind==="cal"){                       /* カレンダー＝ご予約 */
    R(-r,-r*0.78,r*2,r*1.66,r*0.16); g.stroke();
    g.beginPath(); g.moveTo(-r,-r*0.3); g.lineTo(r,-r*0.3); g.stroke();
    g.beginPath(); g.moveTo(-r*0.45,-r*1.05); g.lineTo(-r*0.45,-r*0.55); g.stroke();
    g.beginPath(); g.moveTo( r*0.45,-r*1.05); g.lineTo( r*0.45,-r*0.55); g.stroke();
    g.beginPath(); g.arc(0,r*0.35,r*0.17,0,7); g.fill();
  }else if(kind==="user"){                /* 人＝マイページ */
    g.beginPath(); g.arc(0,-r*0.38,r*0.42,0,7); g.stroke();
    g.beginPath(); g.arc(0,r*1.02,r*0.85,Math.PI*1.12,Math.PI*1.88); g.stroke();
  }else if(kind==="ticket"){              /* チケット＝クーポン */
    R(-r,-r*0.55,r*1.5,r*1.1,r*0.12); g.stroke();
    g.beginPath(); g.moveTo(r*0.62,-r*0.62); g.lineTo(r*1.0,-r*0.2);
    g.lineTo(r*1.0,r*0.62); g.lineTo(r*0.62,r*0.2); g.closePath(); g.stroke();
  }else if(kind==="card"){                /* カード＝会員証 */
    R(-r,-r*0.62,r*2,r*1.24,r*0.14); g.stroke();
    R(-r*0.75,-r*0.3,r*0.6,r*0.6,r*0.06); g.fill();
    g.beginPath(); g.moveTo(r*0.05,-r*0.12); g.lineTo(r*0.75,-r*0.12); g.stroke();
    g.beginPath(); g.moveTo(r*0.05, r*0.22); g.lineTo(r*0.55, r*0.22); g.stroke();
  }else if(kind==="pin"){                 /* ピン＝店舗情報 */
    g.beginPath(); g.arc(0,-r*0.42,r*0.4,0,7); g.fill();
    g.beginPath(); g.moveTo(0,-r*0.05); g.lineTo(0,r*0.95); g.stroke();
  }
  g.restore();
}

/* 2500×1686 に描く。**canvas の大きさは必ず実寸**にする
   （縮めて描いてから引き伸ばすと、LINEで見たときに文字がにじむ） */
function rmDraw(cv){
  const s=(db.line&&db.line.rm)||{};
  const lay=RMLAY[s.layout]||RMLAY.kou5;
  const W=lay.size.w,H=lay.size.h;
  cv.width=W; cv.height=H;
  const g=cv.getContext("2d");
  const ink=s.ink||"#5C5045";
  g.fillStyle="#F6F3ED"; g.fillRect(0,0,W,H);
  lay.cells.forEach(c=>{
    g.fillStyle=c.bg; g.fillRect(c.x,c.y,c.w,c.h);
    const cx=c.x+c.w/2, cy=c.y+c.h/2;
    /* 行き先が空のマスは、うすく×を出して「まだ決まっていない」と分かるようにする */
    const linked=!!rmLink(c.k);
    g.fillStyle=ink; g.globalAlpha=linked?1:0.32;
    rmIcon(g,c.ic,cx,cy-c.h*0.17,c.h*0.105);
    g.textAlign="center"; g.textBaseline="alphabetic";
    g.font=`${Math.round(c.h*0.115)}px "Times New Roman", "Hiragino Mincho ProN", serif`;
    g.fillText(c.en,cx,cy+c.h*0.115);
    g.font=`${Math.round(c.h*0.062)}px "Hiragino Sans", "Yu Gothic", sans-serif`;
    g.fillText(c.ja,cx,cy+c.h*0.225);
    g.globalAlpha=1;
  });
  /* マスの境目。白い細線を重ねて、絵として1枚に見えるようにする */
  g.strokeStyle="rgba(255,255,255,.9)"; g.lineWidth=6;
  lay.cells.forEach(c=>g.strokeRect(c.x,c.y,c.w,c.h));
  return cv;
}

/* 画像を base64 にする。★ **LINEのリッチメニュー画像は1MBまで。**
   平らな色ばかりなので PNG でまず縮み、だめなら JPEG に落とす */
function rmImage(cv){
  let d=cv.toDataURL("image/png"), t="PNG";
  const size=x=>Math.round(x.length*3/4);
  if(size(d)>1000000){ d=cv.toDataURL("image/jpeg",0.92); t="JPEG"; }
  return {data:d,type:t,bytes:size(d)};
}

  const newId=p=>p+Date.now().toString(36)+Math.floor(Math.random()*1000);
  const g=id=>{const e=document.getElementById(id); return e?e.value.trim():"";};
  const gn=id=>{const v=g(id); return v===""?"":(+v);};

  if(linePage==="remind"){
    document.getElementById("lr-add").onclick=()=>{ lineEdit="new"; renderLine(); };
    document.getElementById("lr-imgsave").onclick=async()=>{
      db.line.remindImg=g("lr-img"); await save(); msg("保存しました",true);
    };
    el.querySelectorAll("[data-redit]").forEach(b=>b.onclick=()=>{ lineEdit=b.dataset.redit; renderLine(); });
    el.querySelectorAll("[data-rdel]").forEach(b=>b.onclick=async()=>{
      const r=db.line.reminds.find(x=>x.id===b.dataset.rdel);
      if(!confirm(`「${r.days}日前に通知」を消します。よろしいですか？`))return;
      db.line.reminds=db.line.reminds.filter(x=>x.id!==b.dataset.rdel);
      lineEdit=null; await save(); renderLine(); toast("消しました");
    });
    if(lineEdit){
      document.getElementById("lf-cancel").onclick=()=>{ lineEdit=null; renderLine(); };
      document.getElementById("lf-save").onclick=async()=>{
        const o={days:Math.max(0,+document.getElementById("lf-days").value||0),
                 at:document.getElementById("lf-at").value||"13:00",
                 on:document.getElementById("lf-on").checked,
                 top:document.getElementById("lf-top").value,
                 bot:document.getElementById("lf-bot").value};
        if(lineEdit==="new") db.line.reminds.push(Object.assign({id:newId("rm")},o));
        else Object.assign(db.line.reminds.find(x=>x.id===lineEdit),o);
        db.line.reminds.sort((a,b)=>a.days-b.days);
        lineEdit=null; await save(); renderLine(); toast("保存しました");
      };
    }
    const pick=v=>{
      const [rid,aid]=v.split(":");
      const r=db.line.reminds.find(x=>x.id===rid);
      const a=db.appts.find(x=>x.id===aid);
      const c=db.customers.find(x=>x.id===a.cid)||{name:a.name};
      return {r,a,c,text:remindText(r,c,a)};
    };
    el.querySelectorAll("[data-rcopy]").forEach(b=>b.onclick=async()=>{
      const ok=await copyText(pick(b.dataset.rcopy).text);
      toast(ok?"文面をコピーしました":"コピーできませんでした。文面を長押しで選んでください");
    });
    el.querySelectorAll("[data-rsend]").forEach(b=>b.onclick=async()=>{
      const {r,a,c,text}=pick(b.dataset.rsend);
      if(!confirm(`${c.name}様にLINEを送ります。通数を1通消費します。よろしいですか？`))return;
      try{ await lineSend([c.id],text,db.line.remindImg);
        await markLineSent(lineSentKey(r.id,a.cid||a.id,a.id));
        renderLine(); toast(`${c.name}様に送信しました`); }
      catch(e){ msg("失敗："+e.message,false); }
    });
    el.querySelectorAll("[data-rall]").forEach(b=>b.onclick=async()=>{
      const r=db.line.reminds.find(x=>x.id===b.dataset.rall);
      const list=remindTargets(r).filter(a=>{
        const c=db.customers.find(x=>x.id===a.cid); return c&&c.lineId&&!c.lineBlocked;});
      if(!list.length){ msg("LINE連携ずみの方がいません",false); return; }
      if(!confirm(`${list.length}名に送信します。通数を${list.length}通消費します。よろしいですか？`))return;
      msg("送信中…",true);
      try{
        for(const a of list){
          const c=db.customers.find(x=>x.id===a.cid);
          await lineSend([c.id],remindText(r,c,a),db.line.remindImg);
          await markLineSent(lineSentKey(r.id,a.cid||a.id,a.id));
        }

      document.getElementById("fu-save").onclick=async()=>{

        if(t==="year"){ tim.m=gn("fu-m")||1; tim.d=g("fu-d")||"1"; }
        if(t==="month") tim.d=g("fu-d")||"1";
        if(t==="week"){ tim.wt=g("fu-wt")||"0"; tim.w=gn("fu-w")||0; }
        if(t==="visit") tim.days=Math.max(1,gn("fu-days")||30);
        if(t==="once"&&!tim.date){ msg("日時を入れてください",false); return; }
        const o={group:g("fu-group"),title:g("fu-title").slice(0,30),
                 segId:g("fu-seg"),on:document.getElementById("fu-on").checked,
                 start:g("fu-start"),end:g("fu-end"),tim,
                 coupon:g("fu-cp"),img:g("fu-img"),
                 text:document.getElementById("fu-text").value};
        if(!o.text.trim()){ msg("テキスト本文を入れてください",false); return; }
        if(lineEdit==="new") db.line.follows.push(Object.assign({id:newId("fu")},o));
        else Object.assign(db.line.follows.find(x=>x.id===lineEdit),o);
        lineEdit=null; fuTim=null; await save(); renderLine(); toast("保存しました");
      };
    }
    const pickF=v=>{
      const [fid,cid]=v.split(":");
      const f=db.line.follows.find(x=>x.id===fid);
      const c=db.customers.find(x=>x.id===cid);
      return {f,c,text:followText(f,c)};
    };
    el.querySelectorAll("[data-fcopy]").forEach(b=>b.onclick=async()=>{
      const ok=await copyText(pickF(b.dataset.fcopy).text);
      toast(ok?"文面をコピーしました":"コピーできませんでした。文面を長押しで選んでください");
    });
    el.querySelectorAll("[data-fsend]").forEach(b=>b.onclick=async()=>{
      const {f,c,text}=pickF(b.dataset.fsend);
      if(!confirm(`${c.name}様にLINEを送ります。通数を1通消費します。よろしいですか？`))return;
      try{ await lineSend([c.id],text,f.img);
        if(f.coupon) cpGive(f.coupon,c.id);
        await markLineSent(lineSentKey(f.id,c.id,followTag(f,c)));
        renderLine(); toast(`${c.name}様に送信しました`); }
      catch(e){ msg("失敗："+e.message,false); }
    });
    el.querySelectorAll("[data-fall]").forEach(b=>b.onclick=async()=>{
      const f=db.line.follows.find(x=>x.id===b.dataset.fall);
      const list=followTargets(f);
      if(!list.length){ msg("今日が対象の方はいません",false); return; }
      if(!confirm(`${list.length}名に送信します。通数を${list.length}通消費します。よろしいですか？`))return;
      msg("送信中…",true);
      try{
        for(const c of list){
          await lineSend([c.id],followText(f,c),f.img);
          if(f.coupon) cpGive(f.coupon,c.id);
          await markLineSent(lineSentKey(f.id,c.id,followTag(f,c)));
        }
        renderLine(); toast(`${list.length}名に送信しました`);
      }catch(e){ msg("失敗："+e.message,false); }
    });

  }else if(linePage==="seg"){
    document.getElementById("sg-add").onclick=()=>{ segEdit="new"; renderLine(); };
    el.querySelectorAll("[data-sgedit]").forEach(b=>b.onclick=()=>{ segEdit=b.dataset.sgedit; renderLine(); });
    el.querySelectorAll("[data-sgdel]").forEach(b=>b.onclick=async()=>{
      const s=(db.segs||[]).find(x=>x.id===b.dataset.sgdel);
      const used=db.line.follows.filter(f=>f.segId===s.id).length;
      if(!confirm(`「${s.name}」を消します。${used?`このセグメントを使っているフォローUPが${used}本あります（対象なしになります）。`:""}よろしいですか？`))return;
      db.segs=db.segs.filter(x=>x.id!==s.id);
      segEdit=null; await save(); renderLine(); toast("消しました");
    });
    if(segEdit){
      const read=()=>{
        const cr={};
        const put=(k,v)=>{ if(v!==""&&v!==undefined&&v!==null&&!Number.isNaN(v)) cr[k]=v; };
        put("line",g("sg-line")); put("next",g("sg-next"));
        put("afrom",gn("sg-afrom")); put("ato",gn("sg-ato"));
        if(document.getElementById("sg-bdthis").checked) cr.bdThis="1";
        const bm=g("sg-bdm").split(/[,、\s]+/).map(x=>+x).filter(x=>x>=1&&x<=12);
        if(bm.length) cr.bdMonths=bm;
        put("tag",g("sg-tag")); put("staff",g("sg-staff"));
        put("rfrom",gn("sg-rfrom")); put("rto",gn("sg-rto"));
        put("vfrom",gn("sg-vfrom")); put("vto",gn("sg-vto"));
        put("tfrom",gn("sg-tfrom")); put("tto",gn("sg-tto"));
        put("yfrom",gn("sg-yfrom")); put("yto",gn("sg-yto"));
        if(document.getElementById("sg-pace").checked) cr.pace="1";
        return cr;
      };
      document.getElementById("sg-cancel").onclick=()=>{ segEdit=null; renderLine(); };
      document.getElementById("sg-count").onclick=()=>{
        const n=segMembers(read()).length;
        const e=document.getElementById("sg-msg");
        e.textContent=`いまの条件に当てはまるのは ${n}名／${db.customers.length}名です`;
        e.style.color="var(--accent)";
      };
      document.getElementById("sg-save").onclick=async()=>{
        const name=g("sg-name");
        if(!name){ const e=document.getElementById("sg-msg"); e.textContent="セグメント名を入れてください"; e.style.color="var(--alert)"; return; }
        const o={name,desc:document.getElementById("sg-desc").value,cr:read()};
        if(segEdit==="new") db.segs.push(Object.assign({id:newId("sg")},o));
        else Object.assign(db.segs.find(x=>x.id===segEdit),o);
        segEdit=null; await save(); renderLine(); toast("保存しました");
      };
    }

  }else if(linePage==="coupon"){
    /* 配った記録の消し込み（v222）。押し間違えても「取り消す」で戻せる */
    el.querySelectorAll("[data-cpuse]").forEach(b=>b.onclick=async()=>{
      await cpUse(b.dataset.cpuse); renderLine(); toast("使ったことにしました");
    });
    el.querySelectorAll("[data-cpunuse]").forEach(b=>b.onclick=async()=>{
      await cpUnuse(b.dataset.cpunuse); renderLine(); toast("取り消しました");
    });
    document.getElementById("cp-add").onclick=()=>{ cpEdit="new"; renderLine(); };
    el.querySelectorAll("[data-cpedit]").forEach(b=>b.onclick=()=>{ cpEdit=b.dataset.cpedit; renderLine(); });
    el.querySelectorAll("[data-cpdel]").forEach(b=>b.onclick=async()=>{
      const cp=(db.coupons||[]).find(x=>x.id===b.dataset.cpdel);
      const used=db.line.follows.filter(f=>f.coupon===cp.id).length;
      if(!confirm(`「${cp.name}」を消します。${used?`このクーポンを使っているフォローUPが${used}本あります（クーポン文が消えます）。`:""}よろしいですか？`))return;
      db.coupons=db.coupons.filter(x=>x.id!==cp.id);
      cpEdit=null; await save(); renderLine(); toast("消しました");
    });
    if(cpEdit){
      document.getElementById("cp-cancel").onclick=()=>{ cpEdit=null; renderLine(); };
      document.getElementById("cp-save").onclick=async()=>{
        const name=g("cp-name");
        if(!name){ msg("クーポン名を入れてください",false); return; }
        const o={name,body:document.getElementById("cp-body").value,
                 kind:g("cp-kind"),open:document.getElementById("cp-open").checked,
                 endType:g("cp-endtype"),days:Math.max(1,gn("cp-days")||30),
                 endDate:g("cp-enddate"),times:Math.max(1,gn("cp-times")||1)};
        if(cpEdit==="new") db.coupons.push(Object.assign({id:newId("cp")},o));
        else Object.assign(db.coupons.find(x=>x.id===cpEdit),o);
        cpEdit=null; await save(); renderLine(); toast("保存しました");
      };
    }

  }else if(linePage==="tone"){
    el.querySelectorAll("[data-tone]").forEach(b=>b.onclick=async()=>{
      db.line.tone=b.dataset.tone; await save(); renderLine();
    });
    document.getElementById("lt-save").onclick=async()=>{
      db.line.sign=document.getElementById("lt-sign").value.trim();
      db.line.signOn=document.getElementById("lt-signon").checked;
      await save(); renderLine(); toast("保存しました");
    };
    document.getElementById("lt-rich").onchange=async e=>{
      db.line.richOn=e.target.checked; await save();
    };

  }else if(linePage==="next"){
    document.getElementById("ln-mode").onchange=async e=>{
      db.line.nextMode=e.target.value; await save(); renderLine();
    };
    document.getElementById("ln-save").onclick=async()=>{
      db.line.nextText=document.getElementById("ln-text").value;
      await save(); renderLine(); toast("保存しました");
    };

  }else if(linePage==="rich"){
    /* 絵を描く。ページを出すたびに1回。**canvas は実寸（2500×1686）で持ち、
       画面では CSS で縮めて見せている**（縮めて描くとLINEで文字がにじむ） */
    const cv=document.getElementById("rm-cv");
    const paint=()=>{
      if(!cv) return;
      try{
        rmDraw(cv);
        const im=rmImage(cv);
        const sz=document.getElementById("rm-size");
        if(sz) sz.innerHTML=`${im.type}／約 ${(im.bytes/1024).toFixed(0)} KB`
          +(im.bytes>1000000?` <b class="warn">★ LINEの上限（1MB）を超えています</b>`:"（LINEの上限は1MB）");
      }catch(e){
        const sz=document.getElementById("rm-size");
        if(sz) sz.textContent="絵を描けませんでした："+e.message;
      }
    };
    paint();

    const put=(id,v)=>{const e=document.getElementById(id); if(e) e.value=v;};
    const out=document.getElementById("rm-out");
    const show=t=>{ if(out){ out.style.display="block"; out.textContent=t; } };
    /* 中継役が古いと「action を指定してください（…）」が返る。
       そのままだと何が悪いのか伝わらないので、言いかえる */
    const relayMsg=e=>{
      const m=String(e&&e.message||e);
      if(/action を指定/.test(m)) return "中継役が古いです。square-relay_23.gs を貼って、"
        +"「デプロイを管理 → 新しいバージョン → デプロイ」までやり直してください。";
      return m;
    };

    const b=id=>document.getElementById(id);
    if(b("rm-save")) b("rm-save").onclick=async()=>{
      const g2=id=>{const e=document.getElementById(id); return e?e.value.trim():"";};
      db.line.rm.base=g2("rm-base").replace(/\/+$/,"");
      db.line.rm.book=g2("rm-book");
      db.line.rm.title=g2("rm-title")||"salon de kou";
      db.line.rm.chatBarText=(g2("rm-bar")||"メニュー").slice(0,14);
      await save(); msg("保存しました",true); renderLine();
    };
    if(b("rm-redraw")) b("rm-redraw").onclick=()=>paint();
    if(b("rm-dl")) b("rm-dl").onclick=()=>{
      if(!cv) return;
      const im=rmImage(cv);
      const a=document.createElement("a");
      a.href=im.data; a.download="richmenu-"+new Date().toISOString().slice(0,10)+(im.type==="PNG"?".png":".jpg");
      document.body.appendChild(a); a.click(); a.remove();
    };

    if(b("rm-peek")) b("rm-peek").onclick=async()=>{
      show("いまLINEに出ているものを見に行っています…");
      try{
        const j=await relayGet("rmlist");
        const ms=j.menus||[];
        show(`LINEにあるリッチメニュー ${ms.length}件\n`
          +`いま既定に出ているもの：${j.default||"（設定なし）"}\n`
          +(j.alias&&j.alias.length?`切り替えタブ（エイリアス）：${j.alias.length}件\n`:"")
          +ms.map(m=>`・${m.richMenuId}　${m.name||""}　${(m.areas||[]).length}マス`).join("\n"));
      }catch(e){ show("見に行けませんでした：\n"+relayMsg(e)); }
    };

    if(b("rm-put")) b("rm-put").onclick=async()=>{
      const ng=rmCheck();
      if(ng.length){ show("まだ足りません：\n"+ng.map(x=>"・"+x).join("\n")); return; }
      if(!confirm("いまお客様の画面に出ているのは、カルテッツのリッチメニューです。\n\n"
        +"差し替えると、施術記録・マイページ・会員証の3つが\n"
        +"カルテッツのページに行けなくなります（既定のメニューはチャネルに1つだけのため）。\n\n"
        +"差し替えますか？")) return;
      const btn=b("rm-put"); btn.disabled=true;
      try{
        show("① 絵を用意しています…");
        const c2=document.createElement("canvas"); rmDraw(c2);
        const im=rmImage(c2);
        if(im.bytes>1000000) throw new Error("画像が1MBを超えました（"+(im.bytes/1024/1024).toFixed(2)+"MB）。文字や色を減らしてください。");
        show("② リッチメニューの枠を作っています…");
        const r1=await relayPost("rmcreate",{def:rmDef()});
        const id=r1.richMenuId||r1.id;
        if(!id) throw new Error("richMenuId が返ってきませんでした");
        show("③ 絵を貼っています（"+(im.bytes/1024).toFixed(0)+"KB）…");
        await relayPost("rmimg",{id:id,data:im.data});
        show("④ 既定のメニューにしています…");
        /* ★ 中継役 v23 は rmdefault／rmclear を GET で受ける（POSTの口は rmimg と rmcreate だけ）。
           戻りの before は**差し替える前に出ていたメニューの番号**。控えておけば戻せる */
        const d4=await relayGet("rmdefault","&id="+encodeURIComponent(id));
        if(d4&&d4.before&&d4.before!==id) db.line.rm.prevId=d4.before;
        db.line.rm.lastId=id; db.line.rm.lastAt=new Date().toISOString();
        await save();
        show("出しました。\nリッチメニューID："+id
          +(db.line.rm.prevId?"\n差し替える前に出ていたもの："+db.line.rm.prevId+"（戻したいときはこの番号）":"")
          +"\n\n★ ご自分のLINEでトークを開き直して、5つのボタンを1つずつ押して確かめてください。"
          +"\n★ 反映まで少し時間がかかることがあります。");
      }catch(e){ show("出せませんでした：\n"+relayMsg(e)); }
      btn.disabled=false; renderLine();
    };

    if(b("rm-clear")) b("rm-clear").onclick=async()=>{
      if(!confirm("既定のリッチメニューを外します。\nお客様の画面からメニューが消えます（カルテッツのものも戻りません）。\nよろしいですか？")) return;
      show("外しています…");
      try{ await relayGet("rmclear"); show("外しました。"); }
      catch(e){ show("外せませんでした：\n"+relayMsg(e)); }
    };
  }else if(linePage==="conn"){
    document.getElementById("lc-save").onclick=async()=>{
      db.line.oaId=document.getElementById("lc-oa").value.trim();
      await save(); msg("保存しました",true);
    };
    document.getElementById("lc-test").onclick=async()=>{
      msg("確認中…",true);
      try{ const q=await relayGet("quota");
        msg(`つながりました。今月 ${q.used} 通送信ずみ／上限 ${q.limit} 通（${q.type}）`,true); }
      catch(e){ msg("つながりません："+e.message,false); }
    };
  }
}

  const targets=()=>{
    if(lineTab==="birth") return birthdayThisMonth(m).filter(c=>c.lineId);
    if(lineTab==="churn") return db.customers.filter(c=>{const p=pace(c);
      return c.lineId&&p&&(p.lv==="risk"||p.lv==="soon");});

        <button class="btn ghost qrbtn" data-id="${c.id}">QRを出す</button>

  }else if(lineTab==="inbox"){

      <label class="f" for="l-tpl">① 友だち全員に送る文面</label>

    ${box===null?`<p class="note">「② 返信を取り込む」を押すと、まだ紐づいていない方からの返信が並びます。</p>`

        <div class="pn"><b>${esc(x.disp||"（LINE名なし）")}</b>
          <span class="sub">${esc(x.at)}　${esc(x.text.slice(0,40))}</span></div>
        <select class="f-in" data-sel="${i}" style="width:auto;max-width:170px">
          <option value="">名簿から選ぶ…</option>
          ${db.customers.filter(c=>!c.lineId).map(c=>
            `<option value="${c.id}"${c.id===x.cid?" selected":""}>${esc(c.name)}${c.tel?"／"+esc(c.tel.slice(-4)):""}</option>`).join("")}

        <button class="btn qrbtn" data-bind="${i}">結びつける</button>

      ${x.cid?`<p class="note" style="margin:0 14px 12px;color:var(--accent)">
        自動で「${esc(x.cname)}」さんと判定しました（${x.tel?"電話番号が一致":"お名前が一致"}）</p>`
        :`<p class="note" style="margin:0 14px 12px">名簿の候補が見つかりませんでした。手で選んでください。</p>`}
      </div>`).join("")}</div>`
    :`<div class="empty" style="padding:34px"><b>未処理の返信はありません</b></div>`}`;
  }else if(lineTab==="remind"){
    const off=(db.line&&db.line.rmOffset)!==undefined?db.line.rmOffset:1;

    </div>
    <div class="plist">${list.length?list.map(a=>{

        <div class="preview" style="margin:0 14px 14px">${esc(msgText)}</div>

      :`<div class="empty" style="padding:34px"><b>予約がありません</b>この日はご来店の予定が入っていません</div>`}</div>
    <p class="note">未連携の方は「文面をコピー」して、LINEのチャット画面に貼って送ってください。
      手で送るチャット返信は通数を消費しません。</p>`;
  }else{
    body=`<div class="sheet">
      <label class="f" for="l-tpl">送る文面</label>
      <textarea class="f-in" id="l-tpl" style="min-height:120px">${esc(lineText||tpl[lineTab])}</textarea>
      <p class="note">{name} はお名前に、{since} は最終来店からの日数に置きかわります。</p>
      <div class="actions">
        <button class="btn" id="l-send">選んだ ${lineSel.size} 名に送る</button>
        <button class="btn quiet" id="l-all">全員を選ぶ</button>
        <button class="btn quiet" id="l-none">選択を外す</button>

/* ---------- 分析 ---------- */
const RETAILWORD=["JOLEL","ワコナル","カニューレ","DEAD SEA","コフレ","パフ","バスソルト"];
let anTab="new";

function anBase(){
  const V={}, byCust={};
  db.customers.forEach(c=>{
    const v=visitsOf(c);
    if(v.length){ V[c.id]=v; byCust[c.id]=c; }
  });
  return {V,byCust};
}
function splitItems(k){
  return (k.menu+"／"+(k.goods||"")).split("／").filter(Boolean)
    .map(x=>x.replace(/×\d+$/,"").trim());
}
const isRetail=n=>RETAILWORD.some(r=>n.includes(r));
const ageOf=b=>(b&&!b.startsWith('0000'))?Math.floor((D(today())-D(b))/(365.25*86400000)):null;
const ageBand=a=>a==null?"不明":a<20?"10代":a<30?"20代":a<40?"30代":a<50?"40代":a<60?"50代":"60代〜";
const pct=(a,b)=>b?Math.round(a/b*100)+"%":"—";
const bar=(v,max)=>`<span class="bar" style="width:${max?Math.round(v/max*100):0}%"></span>`;

/* 月別 新規・来店・定着 */
function monthly(){
  const {V}=anBase();
  const first={}, vm={};
  Object.entries(V).forEach(([id,v])=>{
    first[id]=v[0];
    v.forEach(d=>{ const k=d.slice(0,7); (vm[k]=vm[k]||new Set()).add(id); });
  });
  return Object.keys(vm).sort().map(k=>{
    const newbies=Object.keys(first).filter(id=>first[id].slice(0,7)===k);
    const stay=newbies.filter(id=>V[id].length>=2).length;
    return {m:k, visits:vm[k].size, nw:newbies.length,
            repeat:vm[k].size-newbies.length, stay, newbies:newbies.length};
  });
}
/* 何回目で離れるか */
function retention(){
  const {V}=anBase();
  const cont={}, gap={};
  Object.values(V).forEach(v=>{
    for(let i=0;i<v.length;i++){
      cont[i+1]=(cont[i+1]||0)+1;
      if(v[i+1]) (gap[i+1]=gap[i+1]||[]).push(days(v[i],v[i+1]));
    }
  });
  const all=[].concat(...Object.values(gap));
  const overall=all.length?Math.round(all.reduce((a,b)=>a+b,0)/all.length):0;
  return {rows:Object.keys(cont).map(Number).filter(n=>n<=10).map(n=>{
    const g=gap[n]||[];
    return {n, reached:cont[n], next:cont[n+1]||0,
            avg:g.length?Math.round(g.reduce((a,b)=>a+b,0)/g.length):null};
  }), overall};
}
/* 年代別の人気メニュー */
function byAge(){
  const out={};
  db.charts.forEach(k=>{
    const c=db.customers.find(x=>x.id===k.cid); if(!c) return;
    const b=ageBand(ageOf(c.birth));
    out[b]=out[b]||{people:new Set(),menu:{}};
    out[b].people.add(c.id);
    splitItems(k).filter(n=>!isRetail(n)).forEach(n=>out[b].menu[n]=(out[b].menu[n]||0)+1);
  });
  return Object.entries(out).map(([band,v])=>({band,people:v.people.size,
    top:Object.entries(v.menu).sort((a,b)=>b[1]-a[1]).slice(0,4)}))
    .sort((a,b)=>b.people-a.people);
}
/* メニュー／物販の利用と再利用 */
function itemStats(retail){
  const t={};
  db.charts.forEach(k=>{
    const c=k.cid; if(!c) return;
    splitItems(k).filter(n=>isRetail(n)===retail).forEach(n=>{
      t[n]=t[n]||{n:0,people:{}};
      t[n].n++; t[n].people[c]=(t[n].people[c]||0)+1;
    });
  });
  return Object.entries(t).map(([name,v])=>{
    const ppl=Object.keys(v.people).length;
    const again=Object.values(v.people).filter(x=>x>=2).length;
    return {name, n:v.n, ppl, again, per:v.n/ppl, rate:ppl?again/ppl:0};
  }).sort((a,b)=>b.n-a.n);
}

function renderAn(){
  const el=document.getElementById("an");
  const tab=(k,l)=>`<button class="chip${anTab===k?" on":""}" data-a="${k}">${l}</button>`;
  let body="";

  if(anTab==="new"){
    const rows=monthly(), max=Math.max(...rows.map(r=>r.visits));
    body=`<table class="chk an"><thead><tr><th>月</th><th>来店人数</th><th>新規</th>
      <th>リピート</th><th>新規率</th><th>新規の定着率</th><th></th></tr></thead><tbody>
      ${rows.slice().reverse().map(r=>`<tr><th>${r.m.replace("-","/")}</th>
        <td>${r.visits}</td><td class="hi">${r.nw}</td><td>${r.repeat}</td>
        <td>${pct(r.nw,r.visits)}</td>
        <td class="${r.newbies&&r.stay/r.newbies<0.4?"ng":"ok"}">${r.newbies?pct(r.stay,r.newbies):"—"}</td>
        <td class="barcell">${bar(r.visits,max)}</td></tr>`).join("")}
    </tbody></table>
    <p class="note">「新規の定着率」は、その月に初めて来た方のうち2回目以降も来た割合です。
      直近2か月はまだ再来の機会が来ていないので低く出ます。
      履歴は2025年2月からなので、2025年2〜3月の新規は実際より多く見えます（それ以前の来店が分からないため）。</p>`;
  }

  if(anTab==="drop"){
    const {rows,overall}=retention();
    body=`<table class="chk an"><thead><tr><th>回数</th><th>到達した人数</th>
      <th>次も来た割合</th><th>次までの平均</th><th>全体平均との差</th></tr></thead><tbody>
      ${rows.map(r=>`<tr><th>${r.n}回目</th><td>${r.reached}</td>
        <td class="${r.reached&&r.next/r.reached<0.7?"ng":"ok"}">${pct(r.next,r.reached)}</td>
        <td>${r.avg?r.avg+"日":"—"}</td>
        <td class="${r.avg&&r.avg>overall?"ng":"ok"}">${r.avg?(r.avg-overall>0?"+":"")+(r.avg-overall)+"日":"—"}</td>
      </tr>`).join("")}
    </tbody></table>
    <p class="note">全体の平均来店間隔は ${overall}日 です。
      間隔が全体平均より長い回は、次の来店が遠のきかけているところです。</p>`;
  }

  if(anTab==="age"){
    body=byAge().map(a=>{
      const max=a.top[0]?a.top[0][1]:1;
      return `<div class="sheet" style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;align-items:baseline">
          <b style="font-family:var(--min);font-size:17px">${a.band}</b>
          <span class="note" style="margin:0">${a.people}名</span></div>
        <table class="chk an" style="margin-top:8px"><tbody>
        ${a.top.map(([n,v])=>`<tr><th>${esc(n)}</th><td>${v}回</td>
          <td class="barcell">${bar(v,max)}</td></tr>`).join("")}
        </tbody></table></div>`;
    }).join("")
    +`<p class="note">生年月日が登録されている方だけが年代に振り分けられます。未登録の方は「不明」に入ります。</p>`;
  }

  /* 来店ペース（v94で「売上・来店」タブから移した）。
     売上はSquareの数字、こちらは来店の記録から出しているので別のタブに分けた */
  if(anTab==="pace") body=paceBody();

  if(anTab==="menu"||anTab==="goods"){
    const retail=anTab==="goods";
    const list=itemStats(retail).filter(x=>retail?x.ppl>=1:x.ppl>=5);
    body=`<table class="chk an"><thead><tr><th>${retail?"商品":"メニュー"}</th>
      <th>${retail?"購入":"利用"}人数</th><th>${retail?"購入":"利用"}回数</th>
      <th>1人あたり</th><th>${retail?"再購入":"再利用"}した人</th><th>その率</th></tr></thead><tbody>
      ${list.map(x=>`<tr><th>${esc(x.name)}</th><td>${x.ppl}</td><td>${x.n}</td>
        <td class="hi">${x.per.toFixed(1)}回</td><td>${x.again}</td>
        <td class="${x.rate>=0.5?"ok":x.rate<0.2?"ng":""}">${pct(x.again,x.ppl)}</td></tr>`).join("")}
    </tbody></table>
    <p class="note">${retail?"リピートの高い商品は入荷を切らさないほうがいい商品です。":
      "「1人あたり」が多いメニューは通ってもらえるメニュー、少ないものは一度きりで終わっているメニューです（5人以上が利用したものだけ表示）。"}</p>`;
  }

  el.innerHTML=`<div class="filt" style="margin-top:0">
      ${tab("pace","来店ペース")}${tab("new","新規とリピート")}${tab("drop","何回目で離れるか")}
      ${tab("age","年代別メニュー")}${tab("menu","メニュー別")}${tab("goods","物販")}

    </div><div id="anbody">${body}</div>`;
  el.querySelectorAll(".chip[data-a]").forEach(b=>b.onclick=()=>{anTab=b.dataset.a;renderAn()});
  if(anTab==="close") renderClose();
  if(anTab==="pace") bindPace(el);
}

/* ---------- 来店ペース（v94：売上タブから分析タブへ移した） ---------- */
function paceBody(){
  const rows=db.customers.map(c=>({c,p:pace(c)})).filter(x=>x.p);
  const cnt=lv=>rows.filter(x=>x.p.lv===lv).length;
  const show=rows.filter(x=>vFilter==="all"?true:x.p.lv===vFilter)
    .sort((a,b)=>(b.p.ratio||0)-(a.p.ratio||0)||b.p.since-a.p.since);
  const tab=(k,label)=>`<button class="chip${vFilter===k?" on":""}" data-v="${k}">${label}
    <em>${k==="all"?rows.length:cnt(k)}</em></button>`;
  return `<div class="filt" style="margin-top:0">
      ${tab("risk","失客の可能性")}${tab("soon","そろそろ連絡")}${tab("once","初回のみ")}
      ${tab("booked","予約済み")}${tab("all","すべて")}
    </div>
    <div class="plist">${show.length?show.map(({c,p})=>{
      const [lab,cls]=LV[p.lv];
      return `<div class="pc"><div class="ph-row" data-id="${c.id}">
        <span class="pi ph" style="background:${hue(c.name)}">${esc(c.name[0])}</span>
        <div class="pn"><b>${esc(c.name)}</b>
          <span class="sub">来店${p.n}回　${p.avg?`平均 ${p.avg}日おき`:"間隔まだ不明"}　最終 ${p.last.replace(/-/g,"/")}</span></div>
        <div class="pq ${cls}"><b>${p.since}</b><span>日経過</span>
          ${lab?`<em>${lab}</em>`:""}</div>
      </div></div>`;
    }).join(""):`<div class="empty" style="padding:34px"><b>該当する方はいません</b></div>`}</div>
    <p class="note">「失客の可能性」は、前回から平均来店間隔の2倍以上あいている方です（45日以上経過した場合のみ）。
      先の予約が入っている方は除いています。名前をタップするとカルテが開きます。</p>`;
}
function bindPace(el){
  el.querySelectorAll(".chip[data-v]").forEach(b=>b.onclick=()=>{vFilter=b.dataset.v;renderAn()});
  el.querySelectorAll(".ph-row[data-id]").forEach(r=>r.onclick=()=>{
    sel=r.dataset.id; editing=false;
    setTab("list"); document.getElementById("app").dataset.view="detail";
    renderList(); renderDetail();
  });
}


/* ---------- Gmailからホットペッパーの予約を取り込む ---------- */
/* v226：取り込んだお客様のお名前を、知らせの文にする。
   ★ 長くなりすぎないよう3名まで。残りは「ほかN名」 */
function impWho(r){
  const n=(r&&r.names)||[];
  if(!n.length) return "";
  return `（${n.slice(0,3).join("・")}${n.length>3?` ほか${n.length-3}名`:""}）`;
}
const tel10=t=>String(t||"").replace(/[^0-9]/g,"");
function matchCustomer(name,kana,tel){
  const t=tel10(tel);
  if(t){ const byTel=db.customers.find(c=>tel10(c.tel)&&tel10(c.tel)===t); if(byTel) return byTel; }
  const n=String(name||"").replace(/\s+/g,"");
  const byName=db.customers.filter(c=>c.name.replace(/\s+/g,"")===n);
  if(byName.length===1) return byName[0];
  if(byName.length>1&&kana){                       // 同姓同名はカナで絞る
    const k=db.customers.find(c=>byName.includes(c)&&c.kana&&c.kana.replace(/\s+/g,"")===kana);
    if(k) return k;
  }
  return byName[0]||null;
}
/* 起動時に静かに取り込む */
async function autoFetchMail(){
  const c=db.relay||{};
  /* v204：ここが2つ食い違っていた。
     ① **中継役の有無を `db.relay` で見ていた。** v132から設定は端末ごと（`conf`）に移り、
        QRで設定した端末は `db.relay` を書かない。実際に読みに行く `relayGet` は
        `relayUrl`（conf を先に見る）を通るのに、この入口だけ古い場所を見ていたので、
        **つながっているのに予約メールだけ黙って取り込まれない**ことがあった。
     ② **「アプリを開いたときに自動で読み込む」のチェックを一度も見ていなかった。**
        画面には切り替えがあるのに、外しても取り込まれていた。
        既定は今までどおり「読み込む」（覚えが無いときは on）。 */
  if(!relayUrl("ping")) return;
  if(c.autofetch===false) return;
  try{
    const rows=(await fetchMail(c.days||30)).filter(x=>!x.dup);
    if(!rows.length) return;
    const r=applyMail(rows);
    await save(); renderList();
    if(document.getElementById("app").dataset.tab==="sched") renderSched();
    const bits=[];
    if(r.add) bits.push(`新しい予約${r.add}件`);
    if(r.upd) bits.push(`変更${r.upd}件`);
    if(r.cancel) bits.push(`取消${r.cancel}件`);
    if(r.newc) bits.push(`新規のお客様${r.newc}名`);
    /* v226：**誰を取り込んだのか**をその場で出す（利用者の指示）。
       件数だけではメールを見に行くしかなかった。スケジュールでは当日だけ枠が付く */
    if(bits.length) toast("予約メールから "+bits.join("／")+" を取り込みました"+impWho(r));
  }catch(e){ /* 通信できないときは黙って見送る */ }
}
async function fetchMail(days){
  const j=await relayGet("mail",`&days=${days||14}`);
  return (j.mail||[]).map(x=>{
    const c=matchCustomer(x.name,x.kana,x.tel);
    const p=c?pace(c):null;
    const known=!!(p&&p.n>0);
    const row={...x, cid:c?c.id:null, cname:c?c.name:""};
    const a=findAppt(row);
    row.isNew=!known;
    row.tag=x.hpbNew?(known?"HPB新規・当店再来":"新規"):(known?"再来":"新規");
    row.diff=a&&x.kind!=="cancel"?diffOf(a,x):[];
    row.dup=!!a&&x.kind!=="cancel"&&!row.diff.length;
    row.act=x.kind==="cancel"?(a?"取消":"該当なし")
           :a?(row.diff.length?"変更":"取込ずみ"):"新しい予約";
    return row;
  });
}
function findAppt(x){
  if(x.resNo){ const a=db.appts.find(y=>y.resNo===x.resNo); if(a) return a; }
  if(x.id){ const a=db.appts.find(y=>y.mailId===x.id); if(a) return a; }
  // 予約番号がないメール用：同じ人・同じ日
  return db.appts.find(y=>y.src==="HPB"&&y.date===x.date&&
    (x.cid?y.cid===x.cid:y.name===x.name))||null;
}
function diffOf(a,x){
  const d=[];
  if(a.date!==x.date) d.push(`日付 ${a.date.slice(5)}→${x.date.slice(5)}`);
  if(a.start!==x.start) d.push(`時刻 ${a.start}→${x.start}`);
  if(x.minutes&&a.dur!==x.minutes) d.push(`所要 ${a.dur}→${x.minutes}分`);
  if(x.menu&&a.menu!==x.menu) d.push("メニュー変更");
  return d;
}
function applyMail(rows){
  let add=0,upd=0,cancel=0,newc=0,revive=0;
  /* ★ v226：**取り込んだ日**を予約に控える（`a.imp`）。スケジュールの札に枠が付く。
     利用者の指示：「アプリを開けたら『予約を取り込みました』と出るが、
     誰を取り込んだのか結局メールを見に行かないと分からない。
     当日取り込んだ予約だけ色を変えておけば『この人を取り込んだんだ』と直感的に分かる」。
     ★ 当日しか光らないので、あとで消す手入れは要らない（`a.imp===today()` で見ている）。
     ★ 名前も一緒に返して、そのまま知らせに出す */
  const imp=today(); const names=[]; const noteName=n=>{ if(n&&!names.includes(n)) names.push(n); };
  rows.forEach(x=>{
    const exist=findAppt(x);
    if(x.kind==="cancel"){
      if(exist){ exist.status="cancel"; exist.mailId=x.id; exist.imp=imp; cancel++;
                 noteName(exist.name||x.name); }
      return;
    }
    let c=x.cid?db.customers.find(y=>y.id===x.cid):null;
    if(!c&&exist) c=db.customers.find(y=>y.id===exist.cid);
    /* ★★★ v212：**作る前に、その方がもう名簿にいないかを見る。** ★★★
       ここが見ていなかったので、ホットペッパーの予約メールを読むたびに
       **すでにいる方がもう1件できる**ことがあった。
       2026-09-07、利用者の指摘（カルテ1168と1169）から実データを見たら、
         no.284　坪井麻穂（tags:"HPB"・予約メールから自動でできた・電話なし）
         no.285　坪井麻穂（Squareから足した・電話あり）
       の2件になっていて、cid が違うので
         ・Square取り込みが手書きカルテを格上げできず（v188の道が当たらない）
         ・「同じ日のカルテ」のまとめ案内も出ない（cidで見ていたため）
       が同時に起きていた。名簿8組・カルテ2組が同じ形だった。

       ★ 電話（数字だけ）→ お名前（ひらがな・カタカナ・空白のゆれを無視）の順で探す。
         同姓同名の別人に付くことは理屈のうえではありうるが、
         **黙って2件目を作るほうが実害が大きい**（お客様の記録が2つに割れる）。
         付け先が違ったときは「別の方に付け替える」で直せる。 */
    if(!c){
      const t=tel10(x.tel);
      c=(t.length>=10?db.customers.find(y=>tel10(y.tel)===t):null)||findCustByName(x.name)||null;
      if(c){
        if(!c.kana&&x.kana) c.kana=x.kana;
        if(!c.tel&&x.tel) c.tel=x.tel;
      }
    }
    if(!c){
      c={id:uid(),name:x.name||"（名前不明）",kana:x.kana||"",tel:x.tel||"",
         birth:"",first:x.date,tags:"HPB",addr:"",caution:"",memo:""};
      db.customers.push(c); newc++;
    }
    /* ---------- 人が直した欄は上書きしない（v158） ----------
       利用者の指摘：**「ホットペッパーでメニューを決めて予約しても、来店して急に
       メニューを変更した場合、修正できない状態」**

       原因はここ。`menu:x.menu||…` で**メールの値がいつも勝つ**ようにしていた。
       「アプリを開いたときに自動で読み込む」を入れていると、直しても
       **開き直すたびに元のメニューに戻る**。それで「修正できない」になっていた。

       予約の編集で人が変えた欄は `a.edited` に印が付く（v158）。印のある欄は
       メールで上書きしない。★ 予約番号（resNo）や取消は今までどおりメールが正。 */
    const ed=(exist&&exist.edited)||{};
    const keep=(f,v)=>(exist&&ed[f])?exist[f]:v;
    const o={cid:c.id, name:c.name, date:keep("date",x.date), start:keep("start",x.start),
      dur:keep("dur",x.minutes||(exist?exist.dur:60)),
      staff:keep("staff",/川口/.test(x.staff)?"川口香子":/水野/.test(x.staff)?"水野奈津子":(exist?exist.staff:STAFF[0])),
      kind:keep("kind",x.isNew?"新規":"再来"),
      menu:keep("menu",x.menu||(exist?exist.menu:"")), src:"HPB",
      price:x.price||0, kana:x.kana||"", hpbNew:!!x.hpbNew,
      note:keep("note",x.note||(exist?exist.note:"")), allday:false,
      mailId:x.id, resNo:x.resNo,
      /* v204：ここで無条件に `status:""` としていたので、**人が手で付けた取消が
         毎回もとに戻っていた**（ホットペッパー側は取消になっていないため）。
         人が付けた印（`edited.stat`）があるとき、あるいは古いデータで印は無いが
         「キャンセル」と書いてあるときは、そのまま残す。
         ★ ホットペッパーからの取消メールは上の `x.kind==="cancel"` で先に処理して
           return しているので、この行はそれを邪魔しない */
      status:(exist&&(ed.stat||/キャンセル/.test(exist.stat||"")))?(exist.status||""):""};
    if(x.kana&&!c.kana) c.kana=x.kana;
    if(exist){
      if(exist.status==="cancel") revive++;
      /* ★ v226：**中身が本当に変わったときだけ**「今日取り込んだ」印を付ける。
         人が手で直した欄（`a.edited`）はメールで上書きしない（v158）ので、
         その予約は**いつまでも「差分あり」**と見なされ、毎朝ここを通る。
         無条件に印を付けると、**何も取り込んでいないのに毎日枠が光る** */
      const b4=JSON.stringify(exist);
      Object.assign(exist,o);
      if(JSON.stringify(exist)!==b4) exist.imp=imp;
      upd++;
    }
    else { db.appts.push(Object.assign({id:uid(),created:nowStamp()},o,{imp})); add++; }
    noteName(c.name);
  });
  return {add,upd,cancel,newc,revive,names};
}

  const dv=cfg.days||30;
  box.innerHTML=`<div class="actions" style="align-items:center">
      <button class="btn" id="m-fetch">メールを読む</button>
      <select class="f-in" id="m-days" style="width:auto">
        ${[14,30,60,90,180].map(d=>`<option value="${d}"${d===dv?" selected":""}>過去${d}日ぶん</option>`).join("")}
      </select>
      <button class="btn quiet" id="m-raw">解析できないときはこちら</button>
    </div>
    <label style="display:block;margin-top:10px;font-size:13px;color:var(--ink2);cursor:pointer">
      ${/* v204：既定は**自動で読み込む**（利用者の指示）。覚えが無いときも入れておく。
             ここが `cfg.autofetch?` だったので、実際は取り込んでいるのにチェックが
             外れて見えていた（画面と中身が食い違っていた） */""}
      <input type="checkbox" id="m-auto" ${cfg.autofetch!==false?"checked":""}>
      アプリを開いたときに自動で読み込む（確認なしでスケジュールに反映）</label>
    <p class="note" id="m-msg"></p><div id="m-list"></div>`;
  const msg=(t,ok)=>{const e=document.getElementById("m-msg");
    e.textContent=t; e.style.color=ok?"var(--accent)":"var(--alert)";};

  document.getElementById("m-days").onchange=async e=>{
    db.relay=Object.assign({},db.relay,{days:+e.target.value}); await save();
  };
  document.getElementById("m-auto").onchange=async e=>{
    db.relay=Object.assign({},db.relay,{autofetch:e.target.checked}); await save();
    msg(e.target.checked?"次に開いたときから自動で読み込みます":"自動読み込みをやめました",true);
  };
  document.getElementById("m-fetch").onclick=async()=>{
    msg("Gmailを確認中…",true);
    try{
      const rows=await fetchMail(+document.getElementById("m-days").value||30);
      if(!rows.length){ msg("予約メールが見つかりませんでした",false); return; }
      window.__mail=rows;
      const done=rows.filter(x=>x.dup).length;   // すでにスケジュールに入っているぶん
      document.getElementById("m-list").innerHTML=`
        <table class="chk an"><thead><tr><th>来店日時</th><th>お客様</th><th>区分・金額</th>
          <th>メニュー</th><th>状態</th></tr></thead><tbody>
        ${rows.map((x,i)=>`<tr>
          <th>${x.date?x.date.slice(5).replace("-","/")+" "+x.start:"—"}</th>
          <td style="text-align:left">${esc(x.name)}${x.cname&&x.cname!==x.name?`<br><small>→ ${esc(x.cname)}</small>`:""}</td>
          <td class="${x.isNew?"ng":"ok"}">${x.kind==="cancel"?"取消":x.tag}
            ${x.price?`<br><small>¥${x.price.toLocaleString()}</small>`:""}</td>
          <td style="text-align:left">${esc((x.menu||"").slice(0,26))}</td>
          <td class="${x.act==="変更"?"ng":""}">${x.act}${x.diff.length?`<br><small>${esc(x.diff.join("／"))}</small>`:""}
            ${!x.cid&&x.kind!=="cancel"?"<br><small>名簿になし</small>":""}</td></tr>`).join("")}
        </tbody></table>
        <div class="actions"><button class="btn" id="m-apply">スケジュールに反映する</button></div>
        <label style="display:block;margin-top:8px;font-size:12px;color:var(--ink2);cursor:pointer">
          <input type="checkbox" id="m-force"> 「取込ずみ」もふくめて入れ直す</label>
        <p class="note">「名簿になし」の方は、反映すると新しいお客様として登録されます。${
          done?`<br><b>この${done}件はすでにスケジュールに入っています。</b>
            そのままでは反映しても何も変わりません。入れ直したいときは上のチェックを入れてください。`:""}</p>`;
      msg(`${rows.length}件の予約メールを読みました${done?`（うち${done}件は取込ずみ）`:""}`,true);
      // 反映は try/catch で包む。包まないと、途中で失敗したときに
      // 画面が何も変わらず「押しても動かない」ように見える（v83で踏んだ）
      document.getElementById("m-apply").onclick=async()=>{
        const btn=document.getElementById("m-apply");
        const force=document.getElementById("m-force").checked;
        const target=force?window.__mail:window.__mail.filter(x=>!x.dup);
        if(!target.length){
          msg("反映するものがありません。読み取った予約はすべてスケジュールに入っています（入れ直すなら下のチェックを入れてください）",false);
          return;
        }
        btn.disabled=true; btn.textContent="反映中…";
        try{
          const r=applyMail(target);
          await save(); renderList(); renderSched();
          const bits=[];
          if(r.add) bits.push(`新しい予約 ${r.add}件`);
          if(r.upd) bits.push(`変更 ${r.upd}件${r.revive?`（うち取消からの復活${r.revive}件）`:""}`);
          if(r.cancel) bits.push(`取消 ${r.cancel}件`);
          if(r.newc) bits.push(`新しいお客様 ${r.newc}名`);
          const t=bits.length
            ? `スケジュールに反映しました：${bits.join("／")}${impWho(r)}。スケジュールでは今日のぶんに枠が付きます`
            : "反映しましたが、変わったところはありませんでした（すでに同じ内容が入っています）";
          msg(t,!!bits.length); toast(t);
          btn.textContent="反映しました";
        }catch(e){
          btn.disabled=false; btn.textContent="スケジュールに反映する";
          msg("反映できませんでした："+e.message,false);
          console.error(e);
        }
      };
    }catch(e){ msg("失敗："+e.message,false); }
  };
  document.getElementById("m-raw").onclick=async()=>{
    msg("取得中…",true);
    try{ const j=await relayGet("mailraw","&days=30");
      document.getElementById("m-list").innerHTML=(j.raw||[]).map(r=>
        `<div class="sheet"><b>${esc(r.subject)}</b>
         <p class="note">${esc(r.from)}</p>
         <pre class="raw">${esc(r.body)}</pre></div>`).join("")
        ||"<p class='note'>メールが見つかりませんでした</p>";
      msg("この本文をそのままClaudeに貼れば、読み取りを合わせられます",true);
    }catch(e){ msg("失敗："+e.message,false); }
  };
}

/* ---------- csv ---------- */
function csv(rows,name){
  const body=rows.map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\r\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob(["\uFEFF"+body],{type:"text/csv"}));
  a.download=name; a.click(); URL.revokeObjectURL(a.href);
}

      if(c.adv){ c.in=(c.in||0)+c.adv; c.adv=0; }
    }));
    await save(); renderList(); renderDetail(); toast("読み込みました");
  }catch(err){ toast("読み込めませんでした："+err.message); }
  e.target.value="";
};

};

/* ソースに焼き込んだ Squareの名簿の写し（202名・撮った日は不明）を入れる。
   **まっさらな端末で最初に開いたときだけ**使う。
   v99まではfooterに「Squareの名簿を取り込む」というボタンで出していたが、
   名前に反して Square と通信しておらず「押したから同期された」と誤解を招くので消した。
   Squareと突き合わせたいときは 連携→お客様の照合（`renderCustSync`）を使うこと */
function importSeed(){
  const key=c=>(c.name||"")+"|"+(c.tel||"");
  const have=new Set(db.customers.map(key));
  let n=0;
  SEED.forEach(([fam,giv,tel,birth,addr,tag])=>{
    const o={id:uid(),name:(fam+giv).trim(),kana:"",tel,birth,first:"",tags:tag,addr,caution:"",memo:""};
    if(have.has(key(o))) return;
    have.add(key(o)); db.customers.push(o); n++;
  });
  return n;
}

/* ---------- 開いたら勝手に最新にする（v127） ----------
   利用者の指示：「アプリを開けたら同期してくれたらボタンは要らない。
   電波が悪くて同期できなかったときのためにホームのボタンだけ残せばよい」。

   ★ v101で自動更新を入れ、**v104で利用者の指示で外した**経緯がある（「手動で更新する」）。
     v127で**方針が変わって戻した**。次に触る人が「また外れている」と勘違いしないよう明記しておく。

   弊害の検討（入れる前に確かめたこと）：
   ・二重にならないか … `syncOrders` は売上を差し替え、カルテは決済ID、現金も決済IDで判定する。
     何度呼んでも増えない
   ・過去の月が勝手に変わらないか … **取りに行くのは今月だけ。** 締めた月は触らない
   ・起動が遅くならないか … 画面を先に出してから裏で走らせる（await しない）
   ・通信できないとき … 黙って諦める。ホームの「アプリを最新にする」で手で押せる
   ・名簿や商品が勝手に増えないか … 照合は**結果を作るだけ**。反映は人が押す（v99・v108の方針のまま） */
async function autoSyncOnOpen(){
  if(!relayUrl("ping")) return;              // 中継役が未設定なら何もしない
  try{
    const m=today().slice(0,7);
    sqAuto.busy=true; renderHome();
    const r=await syncSquareMonth(m);
    try{
      if(r.menuList&&r.menuList.length){
        prodSync=prodMatch(r.menuList); prodPick={}; prodAdd={};
        prodSync.sqOnly.forEach(x=>{ prodAdd[x.sqid]=true; });
        prodView=prodSync.near.length?"near":(prodSync.sqOnly.length?"sqonly":"hit");
      }
      const jc=await relayGet("customers");
      custSync=custMatch(jc.customers||[]); custPick={};
      custView=custSync.near.length?"near":(custSync.sqOnly.length?"sqonly":"hit");
      await nameNolink(jc.customers||[]);   // v156：名簿にいない方の名前を控えに書く
    }catch(e){}
    sqAuto.at=nowStamp(); sqAuto.n=r.orders; sqAuto.err=""; sqAuto.busy=false;
    repaintAfterSync();
  }catch(e){
    sqAuto.busy=false; sqAuto.err=e.message||"通信できません";
    renderHome();
  }
}

})();
