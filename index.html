      <div style="grid-column:1/-1${a.off?";display:none":""}"><label class="f" for="a-name">お客様・件名</label>
        <input class="f-in" id="a-name" list="custlist" autocomplete="off" value="${esc(a.name)}" placeholder="名簿から選ぶ／新規や休暇は直接入力">
        <datalist id="custlist">${db.customers.map(c=>`<option value="${esc(c.name)}" label="${esc(c.tel||"")}">`).join("")}</datalist></div>
      <div><label class="f" for="a-date">日付</label><input class="f-in" id="a-date" type="date" value="${a.date}"></div>
      <div style="${a.off?"display:none":""}"><label class="f" for="a-kind">区分</label><select class="f-in" id="a-kind">
        ${["再来","新規"].map(k=>`<option${k===a.kind?" selected":""}>${k}</option>`).join("")}</select></div>
      <div><label class="f" for="a-staff">担当</label>
        <div style="display:flex;gap:7px;align-items:center">
          <span id="a-chip" style="width:15px;height:15px;border-radius:4px;flex:none;background:${colOf(a)}"></span>
          <select class="f-in" id="a-staff">${STAFF.map(s=>`<option${s===a.staff?" selected":""}>${s}</option>`).join("")}</select>
        </div></div>
      <div style="${a.off?"display:none":""}"><label class="f" for="a-src">予約経路</label><select class="f-in" id="a-src">
        ${SRC.map(s=>`<option${s===a.src?" selected":""}>${s}</option>`).join("")}</select></div>
      <div><label class="f" for="a-start">開始</label><input class="f-in" id="a-start" type="time" step="900" value="${a.start}" ${a.allday?"disabled":""}></div>
      <div><label class="f" for="a-dur">所要（分）</label><input class="f-in" id="a-dur" type="number" min="15" step="15" value="${a.dur}" ${a.allday?"disabled":""}></div>
      <div style="grid-column:1/-1${a.off?";display:none":""}"><label class="f" for="a-menu">メニュー</label>
        <input class="f-in" id="a-menu" list="menulist2" autocomplete="off" value="${esc(a.menu)}" placeholder="打ち始めるとSquareのメニューから候補が出ます">
        <span class="note">来店して急に変わったときは、ここを書き直して保存してください。
          <b>直した欄は、次のホットペッパーのメール取り込みで上書きしません。</b></span>
        <datalist id="menulist2">${MENUS().map(m=>`<option value="${esc(m.n)}" label="${esc(m.cat)}／${m.p?"¥"+m.p.toLocaleString():"都度見積"}">`).join("")}</datalist></div>
      <div style="grid-column:1/-1"><label class="f" for="a-note">メモ</label><input class="f-in" id="a-note" value="${esc(a.note)}"></div>
      <div style="grid-column:1/-1"><label style="font-size:13px;color:var(--ink2);cursor:pointer">

        ${a.status==="cancel"?`<label style="font-size:13px;color:var(--alert);cursor:pointer;display:block;margin-top:6px">

  if(box.scrollIntoView) box.scrollIntoView({behavior:"smooth",block:"nearest"});

  /* いま画面に入っている値を拾う（描き直す前に消えないように） */
  const readApForm=()=>{
    const g=id=>{const e=document.getElementById(id); return e?e.value:"";};
    return {name:g("a-name"), date:g("a-date"), start:g("a-start"),
            dur:+g("a-dur")||60, staff:g("a-staff"), kind:g("a-kind"),
            menu:g("a-menu"), src:g("a-src"), note:g("a-note")};
  };
  document.getElementById("a-off").onchange=e=>{

    apEdit=Object.assign({},apEdit,readApForm(),{off:k});
    if(k){

      const lbl=OFFLBL(k);
      if(!apEdit.name||OFFKINDS.some(x=>x[1]===apEdit.name)) apEdit.name=lbl;
      apEdit.allday=(k==="day");
      const t=OFFTIME[k];
      if(t){ apEdit.start=t.start; apEdit.dur=t.dur; }
      apEdit.menu=""; apEdit.src="直接";
    }else if(OFFKINDS.some(x=>x[1]===apEdit.name)){ apEdit.name=""; apEdit.allday=false; }

    colOf({staff:document.getElementById("a-staff").value, kind:document.getElementById("a-kind").value});
  document.getElementById("a-staff").onchange=chip;
  document.getElementById("a-kind").onchange=chip;
  document.getElementById("a-all").onchange=e=>{ st.disabled=dur.disabled=e.target.checked; };
  document.getElementById("a-menu").oninput=e=>{
    const m=MENUS().find(x=>x.n===e.target.value.trim());
    if(m) dur.value=m.min||guessDur(m.n);
  };
  document.getElementById("a-name").onchange=e=>{
    const c=db.customers.find(x=>x.name===e.target.value.trim());
    document.getElementById("a-kind").value=(c&&chartsOf(c.id).length)?"再来":"新規";
    chip();
  };
  document.getElementById("a-save").onclick=async()=>{
    const g=id=>document.getElementById(id).value.trim();
    if(!g("a-name")){ toast("お客様のお名前または件名を入れてください"); return; }
    const all=document.getElementById("a-all").checked;
    const hit=db.customers.find(c=>c.name===g("a-name"));
    const o={id:a.id||uid(), cid:hit?hit.id:null, name:g("a-name"), date:g("a-date"),
             start:all?"":g("a-start"), dur:all?0:(+g("a-dur")||60), staff:g("a-staff"),
             kind:g("a-kind"), menu:g("a-menu"), src:g("a-src"), note:g("a-note"), allday:all,
             off:g("a-off")};
    const was=a.id?db.appts.find(x=>x.id===a.id):null;
    if(was){
      /* v158：ホットペッパーの控え（メールと結びつける番号・金額・カナ・取消の状態）を**残す**。
         これまでは丸ごと置きかえていたので、直すたびに resNo と mailId が消え、
         取消ずみの印まで外れていた */
      ["mailId","resNo","price","kana","hpbNew","stat","status"].forEach(f=>{
        if(o[f]===undefined&&was[f]!==undefined) o[f]=was[f];
      });
      /* ★ 人が変えた欄に印を付ける。次のメール取り込みで上書きしないため（applyMail 参照） */
      const ed=Object.assign({},was.edited);
      ["menu","staff","dur","start","date","kind","note"].forEach(f=>{
        if(String(o[f]==null?"":o[f])!==String(was[f]==null?"":was[f])) ed[f]=1;
      });
      if(Object.keys(ed).length) o.edited=ed;
      db.appts[db.appts.findIndex(x=>x.id===a.id)]=Object.assign({created:a.created},o);
    }
    else db.appts.push(Object.assign({created:nowStamp()},o));
    schDate=o.date; apEdit=null;
    await save(); renderSched(); toast("保存しました");
  };
  document.getElementById("a-cancel").onclick=()=>{apEdit=null;renderSched()};
  if(a.id){
    document.getElementById("a-del").onclick=async()=>{
      if(!confirm("この予定を削除します。よろしいですか？"))return;
      db.appts=db.appts.filter(x=>x.id!==a.id); apEdit=null;
      await save(); renderSched(); toast("削除しました");
    };
    const kb=document.getElementById("a-karte");
    if(kb) kb.onclick=()=>{
      const c=db.customers.find(x=>x.id===a.cid)||db.customers.find(x=>x.name===a.name);
      if(!c){ toast("このお客様がまだ名簿にいません。先に登録してください"); return; }
      prefill={date:a.date,staff:a.staff,menu:a.menu};
      karteOpen=true; kNewForce=false;             // v154
      sel=c.id; editing=false; apEdit=null;
      setTab("list"); document.getElementById("app").dataset.view="detail";
      renderList(); renderDetail();
    };
  }
}
function guessDur(name){
  const m=name.match(/(\d{2,3})\s*(分|min)/); if(m) return +m[1];
  for(const n of [150,120,90,70,60]) if(name.includes(String(n))) return n;
  return 60;
}

            x.items?`　${esc(x.items)}`:""}</span>
          ${x.name?`<button class="btn quiet" data-addsq="${esc(x.sqid)}">名簿に追加</button>`

  const hCust=document.getElementById("h-cust");
  if(hCust) hCust.onclick=()=>{ setTab("sync"); setSyncPage("cust"); };
  const hProd=document.getElementById("h-prod");
  if(hProd) hProd.onclick=()=>{ setTab("sync"); setSyncPage("prod"); };
  el.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>setTab(b.dataset.go));
  el.querySelectorAll("[data-ht]").forEach(b=>b.onclick=()=>{

const QC=[];
const QK=[];
const QVER="quartets-2026-08-14";

/* ---------- カルテッツからの移行 ---------- */
const qNorm=s=>(s||"").replace(/[\s　]/g,"");
function importQuartets(){
  let cNew=0,cUpd=0,line=0,kNew=0,kDup=0;
  // 顧客
  const byName={}, byTel={};
  db.customers.forEach(c=>{ byName[qNorm(c.name)]=c; if(tel10(c.tel)) byTel[tel10(c.tel)]=c; });
  const byQ={};
  QC.forEach(([code,name,kana,tel,line0])=>{
    let c=byName[qNorm(name)]||(tel?byTel[tel]:null);
    if(!c){
      c={id:uid(),name,kana,tel,birth:"",first:"",tags:"",addr:"",caution:"",memo:""};
      db.customers.push(c); byName[qNorm(name)]=c; if(tel) byTel[tel]=c; cNew++;
    } else cUpd++;
    if(!c.kana&&kana) c.kana=kana;
    if(!c.tel&&tel) c.tel=tel;
    c.qcode=code;
    if(line0){ c.lineId=c.lineId||("Q:"+code); c.lineBlocked=(line0==="blk"); if(line0==="ok") line++; }
    byQ[code]=c;
  });
  // カルテ（同じ人・同じ日はカルテッツ側で上書き、無ければ追加）
  const idx={};
  db.charts.forEach(k=>{ idx[k.cid+"|"+k.date]=k; });
  QK.forEach(([code,d,st,menu,cond,orders,pay,disc,kind],i)=>{
    const c=byQ[code]; if(!c) return;
    const date=`20${d.slice(0,2)}-${d.slice(2,4)}-${d.slice(4,6)}`;
    const staff=st==="水"?"水野奈津子":"川口香子";
    const cur=idx[c.id+"|"+date];
    if(cur){
      cur.menu=menu||cur.menu; cur.staff=staff;
      if(pay) cur.price=pay;
      cur.skin=cond||cur.skin; cur.goods=orders||cur.goods;
      cur.kind=kind; cur.disc=disc; cur.qid="q"+i; kDup++;
    }else{
      const k={id:uid(),cid:c.id,date,staff,menu,price:pay,parts:"",machine:"",level:"",
        skin:cond,goods:orders,next:"",note:"",kind,disc,src:"quartets",qid:"q"+i};
      db.charts.push(k); idx[c.id+"|"+date]=k; kNew++;
    }
  });
  return {cNew,cUpd,line,kNew,kDup};
}

/* ---------- カルテ管理（一覧・ページング・詳細） ---------- */
let kQ="", kSort="new", kPer=25, kPage=1;
const spentOf=cid=>chartsOf(cid).reduce((a,k)=>a+(k.price||0),0);
function karteNo(k){
  if(!k.no){
    k.no=(db.charts.reduce((m,x)=>Math.max(m,x.no||0),0))+1;
  }
  return k.no;
}
function allCharts(){
  const list=db.charts.map(k=>({k,c:db.customers.find(x=>x.id===k.cid)||null}))
    .filter(x=>x.c);
  const q=kQ.trim().toLowerCase();
  const f=q?list.filter(x=>[x.c.name,x.c.kana,x.c.tel,x.k.menu,x.k.date,x.k.staff]
      .join(" ").toLowerCase().includes(q)):list;
  const s={new:(a,b)=>b.k.date.localeCompare(a.k.date)||(b.k.no||0)-(a.k.no||0),
           old:(a,b)=>a.k.date.localeCompare(b.k.date)||(a.k.no||0)-(b.k.no||0),
           high:(a,b)=>(b.k.price||0)-(a.k.price||0),
           name:(a,b)=>(a.c.kana||a.c.name).localeCompare(b.c.kana||b.c.name,"ja")}[kSort];
  return f.sort(s);
}

function renderKarte(){
  const el=document.getElementById("karte");
  const list=allCharts();
  const pages=Math.max(1,Math.ceil(list.length/kPer));
  if(kPage>pages) kPage=pages;
  const from=(kPage-1)*kPer, page=list.slice(from,from+kPer);

  const pager=()=>{
    const out=[]; const add=n=>out.push(`<button class="pg${n===kPage?" on":""}" data-pg="${n}">${n}</button>`);
    out.push(`<button class="pg" data-pg="${Math.max(1,kPage-1)}">‹</button>`);
    const set=new Set([1,2,3,pages-1,pages,kPage-1,kPage,kPage+1]);
    let last=0;
    [...set].filter(n=>n>=1&&n<=pages).sort((a,b)=>a-b).forEach(n=>{
      if(n-last>1) out.push('<span class="pgdot">…</span>');
      add(n); last=n;
    });
    out.push(`<button class="pg" data-pg="${Math.min(pages,kPage+1)}">›</button>`);
    return out.join("");
  };

  el.innerHTML=`
    <div class="khead">
      <h2>カルテ一覧</h2>
      ${sqBtnHtml("k-sq2")}
      <select class="f-in" id="k-per" style="width:auto">
        ${[25,50,100].map(n=>`<option value="${n}"${n===kPer?" selected":""}>1ページ ${n}件</option>`).join("")}
      </select>
      <select class="f-in" id="k-sort" style="width:auto">
        ${[["new","新しい順"],["old","古い順"],["high","金額の高い順"],["name","お名前順"]]
          .map(([v,l])=>`<option value="${v}"${v===kSort?" selected":""}>${l}</option>`).join("")}
      </select>
      <input class="f-in" id="k-q" placeholder="お名前・メニュー・日付で検索" value="${esc(kQ)}" style="max-width:240px">
    </div>
    <div class="kpager">${pager()}</div>
    <div class="kbar"><b>カルテ</b>
      <span>${list.length?`${from+1}〜${Math.min(from+kPer,list.length)}件目を表示`:"該当なし"}　合計${list.length}件</span></div>
    <div class="klist">${page.map(({k,c})=>{
      const line=c.lineId?(c.lineBlocked?["被ブロック","blk"]:["LINE送信OK","ok"]):["LINE未連携","no"];
      return `<div class="krow" data-k="${k.id}">
        <span class="kno">${karteNo(k)}</span>
        <span class="kdate">${k.date.replace(/-/g,"/")}</span>
        <span class="kstaff">${esc(k.staff||"")}</span>
        <span class="kyen">${k.price?yen(k.price):"—"}</span>
        <span class="kcust">
          <span class="kbadges"><span class="lbadge ${line[1]}">${line[0]}</span>
            <span class="qno">${custNo(c)}</span></span>
          <b>${esc(c.name)}</b>${c.kana?`<span>（${esc(c.kana)}）</span>`:""}
          ${c.tel?`<em>${telFmt(c.tel)}</em>`:""}
          <small>${karteIsGoodsOnly(k)?"【物販】":""}${esc(karteTitle(k).slice(0,44))}</small>
        </span>
        <button class="kdet" data-kc="${c.id}">この方の一覧</button>
        <button class="kdet" data-k="${k.id}">詳細</button>
      </div>`;}).join("")||'<div class="empty" style="padding:40px"><b>カルテがありません</b></div>'}
    </div>
    <div class="kpager">${pager()}</div>`;

  bindSqBtn("k-sq2",()=>renderKarte());
  const q=document.getElementById("k-q");
  q.oninput=()=>{kQ=q.value; kPage=1; renderKarte();
    const n=document.getElementById("k-q"); n.focus(); n.setSelectionRange(n.value.length,n.value.length);};
  document.getElementById("k-per").onchange=e=>{kPer=+e.target.value;kPage=1;renderKarte()};
  document.getElementById("k-sort").onchange=e=>{kSort=e.target.value;kPage=1;renderKarte()};
  el.querySelectorAll(".pg").forEach(b=>b.onclick=()=>{kPage=+b.dataset.pg;renderKarte();
    el.scrollIntoView({behavior:"smooth",block:"start"})});
  el.querySelectorAll("[data-kc]").forEach(b=>b.onclick=e=>{
    e.stopPropagation(); openCustKarteList(b.dataset.kc);   // v158：その方のカルテを並べて選ぶ
  });
  el.querySelectorAll(".kdet[data-k],.krow").forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    openKarteModal(b.dataset.k);
  });
}

/* ---------- 指でも押せるようにする（v196） ----------
   利用者の指摘：**「パソコンではスケジュールの時間帯でクリックしたら入力できたが、
   iPad（タッチパネル）では反応しない」**

   原因は click のほう。iOS の Safari は、リンクでもボタンでもない普通の <div> に
   click を配らない。配るかどうかの見分けに **cursor:pointer** を使っている。
   月表示のマス（`.mc`）には cursor:pointer が付いていたので iPad でも押せていたが、
   週・日表示の時間帯（`.cbody .cday`）には付いていなかった。

   直しは2つ重ねてある。
     1. CSS に `cursor:pointer` を足す（iOS に「押せる」と教える）
     2. click ではなく **pointerup** で拾う（マウスも指も同じ道を通る）
   2 のほうが確実なので、click は使わずに置き換えた。

   ★ 表は縦にスクロールする。指を滑らせたときに予約の入力欄が開いてしまわないよう、
     **動いた距離が10px以内・押していた時間が700ms以内**のときだけタップとみなす。
     スクロールが始まると pointercancel が来るので、そこでも取り消している。 */
function tapOn(el,fn){
  let x0=0,y0=0,t0=0,id=null;
  el.addEventListener("pointerdown",e=>{
    if(e.button&&e.button!==0){ id=null; return; }
    x0=e.clientX; y0=e.clientY; t0=Date.now(); id=e.pointerId;
  },{passive:true});
  el.addEventListener("pointerup",e=>{
    if(id===null||e.pointerId!==id) return;
    id=null;
    if(Math.abs(e.clientX-x0)>10||Math.abs(e.clientY-y0)>10) return;   // スクロールした
    if(Date.now()-t0>700) return;                                      // 長押しだった
    fn(e);
  });
  el.addEventListener("pointercancel",()=>{ id=null; });
}

/* 長押しで予約をつかんで、別の時間・別の日へ動かす */
function enableDrag(root,days){
  let st=null;
  root.querySelectorAll(".cbody .ev").forEach(elv=>{
    elv.addEventListener("pointerdown",e=>{
      if(e.button&&e.button!==0) return;
      const a=db.appts.find(x=>x.id===elv.dataset.id); if(!a) return;
      st={elv,a,x0:e.clientX,y0:e.clientY,on:false,moved:false,
        t:setTimeout(()=>{
          st.on=true; elv.classList.add("dragging");
          elv.setPointerCapture(e.pointerId);

    elv.addEventListener("pointermove",e=>{

      if(Math.abs(e.clientX-st.x0)>6||Math.abs(e.clientY-st.y0)>6) st.moved=true;
      if(!st.on) return;
      e.preventDefault();
      const hit=hitSlot(e.clientX,e.clientY,days);
      if(hit) showGhost(hit.date,hit.time);
    });
    const end=async e=>{
      if(!st) return;
      clearTimeout(st.t);
      const was=st.on, a=st.a, elv2=st.elv;
      elv2.classList.remove("dragging");
      const hit=was?hitSlot(e.clientX,e.clientY,days):null;
      st=null; hideGhost();
      if(!was){ if(!e.__noopen) openApModal(a); return; }
      if(!hit||(hit.date===a.date&&hit.time===a.start)){ renderSched(); return; }
      const from=`${a.date.slice(5).replace("-","/")} ${a.start}`;
      a.date=hit.date; a.start=hit.time;
      await save(); schDate=hit.date; renderSched(); renderList();
      toast(`${a.name}様の予約を ${from} → ${hit.date.slice(5).replace("-","/")} ${hit.time} に移しました`);
    };
    elv.addEventListener("pointerup",end);
    elv.addEventListener("pointercancel",e=>{ if(st){clearTimeout(st.t); st.elv.classList.remove("dragging"); st=null; hideGhost();} });
  });
}
function hitSlot(x,y,days){
  const el=document.elementFromPoint(x,y);
  const col=el&&el.closest?el.closest(".cbody .cday"):null;
  if(!col||!col.dataset.d) return null;
  const r=col.getBoundingClientRect();
  const min=Math.round((OPEN*60+(y-r.top)/PXH*60)/15)*15;
  return {date:col.dataset.d,time:toHM(Math.max(OPEN*60,Math.min(min,CLOSE*60-15)))};
}

/* 写真は長辺320pxのJPEGに縮めて保存する（保存容量を食わないように） */
function shrinkImage(file,max=320,q=0.72){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error("画像を読めませんでした"));
    fr.onload=()=>{
      const im=new Image();
      im.onerror=()=>rej(new Error("画像を開けませんでした"));
      im.onload=()=>{
        const r=Math.min(1,max/Math.max(im.width,im.height));
        const w=Math.round(im.width*r), h=Math.round(im.height*r);
        const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
        cv.getContext("2d").drawImage(im,0,0,w,h);
        res(cv.toDataURL("image/jpeg",q));
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
/* ドライブから来た写真（データURL）も、同じように長辺で縮める（v134） */
function shrinkDataUrl(d,max=640,q=0.72){
  return new Promise((res,rej)=>{
    const im=new Image();
    im.onerror=()=>rej(new Error("画像を開けませんでした"));
    im.onload=()=>{
      const r=Math.min(1,max/Math.max(im.width,im.height));
      const w=Math.round(im.width*r), h=Math.round(im.height*r);
      const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
      cv.getContext("2d").drawImage(im,0,0,w,h);
      res(cv.toDataURL("image/jpeg",q));
    };
    im.src=d;
  });
}

     外部アプリがフォトのライブラリ全体を読む権限も廃止された（自分が上げた写真だけ）。
     **だから「フォトの一覧」は作れない。** 代わりに
     **カルテ用のフォルダを1つ決めて、そこを最初に開く**ようにした。

   `db.gdhome`＝{id,name}。db に入れるので6台ぜんぶで同じ場所が開く。 */
const gdHome=()=>(db.gdhome&&db.gdhome.id)?db.gdhome:null;
let gd={folder:"",name:"マイドライブ",parent:"",pics:[],folders:[],q:"",busy:false,err:"",more:false,take:null};
function openDrivePicker(take){
  const h=gdHome();
  gd={folder:h?h.id:"",name:h?h.name:"マイドライブ",parent:"",pics:[],folders:[],
      q:"",busy:true,err:"",more:false,take:take};
  document.getElementById("gdmodal")?.remove();
  const ov=document.createElement("div");
  ov.id="gdmodal"; ov.className="mo-ov";
  document.body.appendChild(ov);
  ov.onclick=e=>{ if(e.target===ov) closeDrivePicker(); };
  drawDrivePicker();
  gdLoad(gd.folder,"");
}
function closeDrivePicker(){ document.getElementById("gdmodal")?.remove(); }
async function gdLoad(folder,q){
  gd.busy=true; gd.err=""; drawDrivePicker();
  try{
    const j=await relayGet("drivepics",
      "&folder="+encodeURIComponent(folder||"")+"&q="+encodeURIComponent(q||""));
    gd.folder=folder||""; gd.q=q||"";
    gd.name=j.name||"マイドライブ"; gd.parent=j.parent||"";
    gd.folders=j.folders||[]; gd.pics=j.pics||[]; gd.more=!!j.more;
  }catch(e){ gd.err=e.message||"ドライブにつながりません"; gd.pics=[]; gd.folders=[]; gd.more=false; }
  gd.busy=false; drawDrivePicker();
}
async function gdPick(id){
  const take=gd.take;
  try{
    gd.busy=true; drawDrivePicker();
    const j=await relayGet("drivepic","&id="+encodeURIComponent(id));
    if(!j.data) throw new Error("その写真を取れませんでした");
    const d=await shrinkDataUrl(j.data,640,0.72).catch(()=>{
      throw new Error("画像を開けませんでした（HEICなど、ブラウザが開けない形式かもしれません）");
    });
    if(take&&take(d)===false){ gd.busy=false; drawDrivePicker(); return; }
    closeDrivePicker(); toast("ドライブの写真を入れました");
  }catch(e){ gd.busy=false; gd.err=e.message||"写真を取れませんでした"; drawDrivePicker(); }
}

const STLBL=f=>({open:"月初",in:"入荷",sold:stKinds.includes("物販")?"販売":"販売（在庫合わせ）",

function breakdown(k,total){
  const rows=db.products.filter(p=>stKinds.includes(p.kind)).map(p=>{
    const c=cell(stMonth,p.id);
    const q=k==="end"?endQty(c):c[k];
    return {p,q,amt:q*p.cost};
  }).filter(r=>r.q!==0).sort((a,b)=>Math.abs(b.amt)-Math.abs(a.amt)||b.q-a.q);
  if(!rows.length) return `<div class="bd"><p class="note" style="margin:0">
    ${TLBL(k)}の動きはこの月にありません。</p></div>`;
  return `<div class="bd">
    <div class="bdhead"><b>${TLBL(k)}の内訳　${stMonth.replace("-","年")}月</b>
      <button class="nav" id="bd-close">閉じる</button></div>
    <table class="chk an"><thead><tr><th>商品</th><th>数量</th><th>仕入単価</th><th>金額</th></tr></thead>

}

   それまで「商品」タブと「材料」タブに分かれていたものを、

   中身（renderStock・renderRecipe・renderMenu）は前のまま、置き場所だけ変えている。 */

/* v172：利用者の指示 **「スタッフ購入で一覧から入力するのではなく、商品からスタッフ欄の

/* ---------- 棚卸し（v166） ----------
   利用者の指摘：**「帳簿の月末・数えた実数はここ（商品のカード）で入力すると、
   いちいち次の商品をクリックしないといけないから手間がかかる。
   別のページで、在庫の管理は一覧で数だけ数えるようにするだけの個別のページを設けたほうが良い」**

   そのとおりだった。1品ずつカードを開いて閉じてを繰り返す作りだったので、
   30品目あれば30回開け閉めしていた。**一覧のまま、数だけ続けて入れる**画面にする。
   ・キーボードの Enter（iPadの「改行」）で**次の欄へ**移る
   ・数える対象は「この月に動いたもの」だけ（v128の考え方のまま）。動いていないものは出さない
   ・商品と材料をまとめて1枚に出す（タブを行き来しなくていい）
   ★ 商品・材料のカードからは棚卸しの行を外した。あちらは
     「どの商品がどうなったか、その結果いくつ残っているか」を見る場所にする（利用者の指示）。 */
/* v170：利用者の指示 **「動いていない74品目も出すは必要ないかな。
   動いたものを上にまとめて、動いていないものはここから下と色で分けるとか、
   直感でわかるようにして」** → ボタンで出し入れするのをやめ、
   **上＝数えるもの／下＝数えなくてよいもの**の1枚にした。境目に線と一言を入れ、
   下は薄い灰色で沈める。`cntAll` は使わなくなったが、外の検査から見えるので残す */
let cntAll=false;
/* ---------- Squareの在庫数を読む（v196） ----------
   利用者の指示：**「スクエアで商品在庫を入力したから在庫をスクエアと連携してほしい。
   また消耗品へ繰入したり、スタッフ購入は今のように原価管理したい。
   そうなるとアプリでは原価の管理だけになって…」**

   ★ この改修で何が変わって、何が変わらないか
     変わる   … **物販の「いくつ残っているか」の出どころが Square になる。**
                読むだけで、Square の在庫はアプリからは動かさない
     変わらない … 原価（仕入単価）はアプリが持つ。**消耗品へ繰入・スタッフ購入・
                材料の使用は今までどおりアプリで入力**する。金額はぜんぶアプリで出す

   ★ 入れ先を「棚卸しの実数（cnt）」にした理由
     月末在庫は `endQty = 帳簿(open+in-sold-gift-use-staff) − loss` で出ている。
     実数を入れると `loss = 帳簿 − 実数` が入るので、**月末在庫はそのまま実数になる**。
     つまり cnt に入れるだけで「Squareの数が月末在庫」になり、
     **データの形を1つも変えずに**Squareを在庫の正としてあつかえる。
     川口さんが入れた数字も、過去の月も、いっさい動かない。

   ★ 引き当ての順番は バリエーションID → 品目ID → 品名。
     ID で当たったものが確かで、品名は最後の手段（Squareと同じ名前のときだけ当たる）。
     当たらなかったものは触らない（黙って0にしない）。 */
async function syncInventory(){
  const j=await relayGet("inventory");
  const list=j.counts||[];
  const byVar={}, byItem={}, byName={};
  list.forEach(x=>{
    if(x.qty===null||x.qty===undefined) return;      // 追跡していない品。0と取り違えない
    const q=+x.qty||0;
    byVar[x.v]=(byVar[x.v]||0)+q;
    if(x.item) byItem[x.item]=(byItem[x.item]||0)+q;
    const k=MNORM(x.name); if(k) byName[k]=(byName[k]||0)+q;
  });
  const map={}, miss=[];
  db.products.forEach(p=>{
    if(p.kind!=="物販") return;                      // 材料・消耗品はSquareに在庫が無い
    const vs=(p.sqvar||[]).filter(v=>byVar[v]!==undefined);
    let q=null, how="";
    if(vs.length){ q=vs.reduce((a,v)=>a+byVar[v],0); how="バリエーション"; }
    else if(p.sqid&&byItem[p.sqid]!==undefined){ q=byItem[p.sqid]; how="品目"; }
    else if(byName[MNORM(p.n)]!==undefined){ q=byName[MNORM(p.n)]; how="品名"; }
    if(q===null){ miss.push(p.n); return; }
    map[p.id]={q:Math.round(q),how};
  });
  db.sqinv={at:today(),n:Object.keys(map).length,map,miss:miss.slice(0,60),
            tracked:Object.keys(byVar).length};
  await save();
  return db.sqinv;
}
/* その商品のSquare在庫（物販で、引き当てられたものだけ数を返す） */
function sqInvOf(p){
  if(!p||p.kind!=="物販") return null;
  const v=((db.sqinv||{}).map||{})[p.id];
  return v?Math.round(+v.q||0):null;
}

/* 棚卸しの画面に出す「Squareの在庫」の案内（v196）。
   読むボタンと、読んだ数を実数に入れるボタンの2段。
   ★ 読むだけでは在庫の数字は1つも動かない。動くのは2つめを押したときだけ。
     （このアプリの決まりごと：**反映は人が押す**。誤読が在庫と原価に直行しないように） */
function sqBoxHtml(all){
  const iv=db.sqinv||{}, got=all.filter(r=>r.sq!==null);
  const diff=got.filter(r=>!(r.has&&(+r.c.cnt||0)===r.sq));
  const goods=all.filter(r=>r.p.kind==="物販").length;
  return `<div class="bd" style="margin:0 0 14px">
    <div class="bdhead"><b>Squareの在庫</b>
      <span class="sp"></span>
      <button class="btn quiet" id="ct-sqread" type="button">Squareから在庫数を読む</button>
      ${got.length?`<button class="btn" id="ct-sqput" type="button">
        Squareの数を実数に入れる${diff.length?`（${diff.length}品目）`:""}</button>`:""}
    </div>
    <p class="note" style="margin:8px 0 0">
      ${iv.at?`<b>${iv.at.replace(/-/g,"/")}</b> に読みました。
        物販 ${goods}品目のうち <b>${got.length}品目</b>がSquareと結びついています。`
             :`<b>まだ一度も読んでいません。</b>「Squareから在庫数を読む」を押してください。`}
      ${iv.at&&iv.miss&&iv.miss.length?`<br><b style="color:var(--alert)">
        Squareに見あたらない物販が ${iv.miss.length}品目</b>：${iv.miss.slice(0,8).map(esc).join("／")}${
        iv.miss.length>8?" ほか":""}
        <br>これは<b>Squareで在庫を追跡していない</b>か、<b>商品の照合がまだ</b>のどちらかです。
        照合は「連携」タブ →「商品の照合（Squareのカタログ）」。結びついていないものは触りません`:""}
      <br><b>読むだけでは在庫の数字は動きません。</b>「実数に入れる」を押したときだけ入ります。
      Squareの在庫をアプリから書き換えることはありません（<b>読むだけ</b>）。
      <br><b>材料と消耗品はSquareに在庫が無い</b>ので、今までどおり手で数えてください。</p>
  </div>`;
}

function renderCount(){
  const el=document.getElementById(stHost); if(!el) return;
  const kinds=["物販","材料"];
  const q=stQ.trim().toLowerCase();
  const mk=p=>{
    const c=cell(stMonth,p.id), bk=bookQty(c);
    const has=!(c.cnt===undefined||c.cnt===null||c.cnt==="");
    return {p,c,bk,has,d:has?(+c.cnt||0)-bk:0,mv:stState(stMonth,p),
            sq:sqInvOf(p)};                       // v196：Squareの在庫数（無ければ null）
  };
  const all=db.products.filter(p=>kinds.includes(p.kind)).map(mk)
    .filter(r=>!q||(r.p.n+r.p.cat).toLowerCase().includes(q));
  const byName=(a,b)=>(a.p.kind===b.p.kind?0:a.p.kind==="物販"?-1:1)
    ||a.p.n.localeCompare(b.p.n,"ja");
  /* 上：この月に動いたもの。**まだ数えていないものを先頭**に持ってくる（次に触る行だから） */
  const move=all.filter(r=>r.mv.k!=="none").sort((a,b)=>(a.has?1:0)-(b.has?1:0)||byName(a,b));
  /* 下：先月から動いていないもの。数えなくても合っている */
  const none=all.filter(r=>r.mv.k==="none").sort(byName);
  const cs=stCountSum(stMonth,kinds);

  /* 1行ぶん。i は Enter で次へ移るときの順番（上から通しで振る）
     ★ v182：**「差」の列をやめた。** 利用者の指示：
       「棚卸の数と仕入れたのちの合計は差額なんて出す必要ないよね？」
       数えた実数がそのまま月末在庫になるので、帳簿との差を赤く出す意味がない。
       （差そのものは月末在庫をそろえるために内側では持っている） */
  const line=(r,i,off)=>`<tr class="${off?"ct-none":(r.has?"ct-done":"")}">
    <th>${esc(r.p.n)}<br><small style="color:var(--ink3)">${esc(r.p.cat)}　仕入 ${yen(r.p.cost)}</small></th>
    <td><span class="kb" style="background:${KCOL[r.p.kind]}">${r.p.kind}</span></td>
    <td class="${off?"":"hi"}">${r.bk}</td>
    <td>${r.sq===null?`<span style="color:var(--ink3)">—</span>`
      :`<b style="font-family:var(--mono)">${r.sq}</b>${
        r.has&&(+r.c.cnt||0)!==r.sq?`<br><small style="color:var(--alert)">実数と ${
          ((+r.c.cnt||0)-r.sq)>0?"+":""}${(+r.c.cnt||0)-r.sq}</small>`:""}`}</td>
    <td>${i==null?`<span style="color:var(--ink3)">—</span>`
      :`<input type="number" step="1" data-ct="${r.p.id}" data-i="${i}"
        value="${r.has?+r.c.cnt:""}" placeholder="—"
        style="width:80px;padding:6px 8px;border:1px solid var(--line);border-radius:8px">`}</td>
    <td>${r.has?`<button class="btn quiet" type="button" data-ctclr="${r.p.id}">取り消す</button>`
      :(off?`<span class="note" style="margin:0">数えなくてよい</span>`
           :`<button class="btn quiet" type="button" data-ctok="${r.p.id}">帳簿どおり</button>`)}</td>
  </tr>`;

  el.innerHTML=`
    <div class="schbar">
      <button class="nav" id="ct-pm">前月</button>
      <button class="nav" id="ct-nm">次月</button>
      <span class="title">${stMonth.replace("-","年")}月　棚卸し</span>
    </div>
    <div class="invbar">
      <div class="iv"><span>数えるもの</span><b>${cs.move}</b></div>
      <div class="iv"><span>数えた</span><b style="color:var(--accent)">${cs.ok+cs.ng}</b></div>
      <div class="iv"><span>のこり</span><b style="color:${cs.todo?"#7A5309":"var(--ink3)"}">${cs.todo}</b></div>
      <span class="sp"></span>
      <button class="btn quiet" id="ct-allok">のこりを帳簿どおりで確定</button>
    </div>
    <p class="note" style="margin:-6px 0 12px">
      <b>数えた実数を入れるだけ。</b>Enter（改行）で次の欄へ移ります。
      入れた数がそのまま月末在庫になります。</p>
    ${sqBoxHtml(all)}
    <div class="filt">
      <input id="ctq" class="f-in" placeholder="品名で探す" value="${esc(stQ)}" style="max-width:220px">
    </div>
    ${(move.length||none.length)?`<div style="overflow-x:auto"><table class="chk an" style="min-width:440px"><thead><tr>
        <th style="text-align:left">品名</th><th>区分</th><th>帳簿の月末</th>
        <th>Squareの在庫</th><th>数えた実数</th><th></th>
      </tr></thead><tbody>
      ${move.length?move.map((r,i)=>line(r,i,false)).join("")
        :`<tr><td colspan="6" class="how">${q?"見つかりませんでした":"この月に動いたものはありません"}</td></tr>`}
      ${none.length?`<tr class="ct-sep"><th colspan="6">
        <button class="chip${cntAll?" on":""}" id="ct-none" type="button">${
          cntAll?"とじる":`数えなくてよい ${none.length}品目を見る`}</button>
        　先月から動いていないので、<b>月初のまま合っています</b></th></tr>
      ${cntAll?none.map(r=>line(r,null,true)).join(""):""}`:""}
      </tbody></table></div>`
      :`<div class="empty" style="padding:34px"><b>見つかりませんでした</b></div>`}`;

  const qi=document.getElementById("ctq");
  qi.addEventListener("compositionstart",()=>{qi.dataset.ime="1"});
  qi.addEventListener("compositionend",()=>{delete qi.dataset.ime; qi.oninput();});
  qi.oninput=()=>{ if(qi.dataset.ime) return;
    const pos=qi.selectionStart; stQ=qi.value; renderCount();
    const n=document.getElementById("ctq");
    if(n){ n.focus(); n.setSelectionRange(pos,pos); } };
  /* v182：数えなくてよいものは折りたたむ。数えるのが2件でも65行スクロールしていた */
  const nb=document.getElementById("ct-none");
  if(nb) nb.onclick=()=>{ cntAll=!cntAll; renderCount(); };
  document.getElementById("ct-pm").onclick=()=>{ stMonth=shiftMonth(stMonth,-1); renderCount(); };
  document.getElementById("ct-nm").onclick=()=>{ stMonth=shiftMonth(stMonth,1); renderCount(); };
  /* v196：Squareの在庫を読む／入れる */
  const sqRead=document.getElementById("ct-sqread");
  if(sqRead) sqRead.onclick=async()=>{
    sqRead.disabled=true; sqRead.textContent="Squareから読んでいます…";
    try{
      const r=await syncInventory();
      renderCount();
      toast(r.n?`Squareの在庫を ${r.n}品目ぶん読みました`
                :"Squareで在庫を追跡している物販が見つかりませんでした");
    }catch(e){
      sqRead.disabled=false; sqRead.textContent="Squareから在庫数を読む";
      toast("読めませんでした："+e.message);
    }
  };
  const sqPut=document.getElementById("ct-sqput");
  if(sqPut) sqPut.onclick=async()=>{
    const t=all.filter(r=>r.sq!==null&&!(r.has&&(+r.c.cnt||0)===r.sq));
    if(!t.length){ toast("入れ直すものはありません"); return; }
    if(!confirm(`Squareの在庫数を「数えた実数」に入れます（${t.length}品目）。
入れた数がそのまま月末在庫になります。
${t.slice(0,12).map(r=>`　${r.p.n}　${r.has?(+r.c.cnt||0)+" → ":""}${r.sq}`).join("\n")}${t.length>12?"\n　…ほか "+(t.length-12)+"品目":""}

よろしいですか？`))return;
    t.forEach(r=>{ r.c.cnt=r.sq; r.c.loss=bookQty(r.c)-r.sq; r.c.cntAt=today(); });
    await save(); renderCount(); toast(`${t.length}品目をSquareの在庫数にそろえました`);
  };
  document.getElementById("ct-allok").onclick=async()=>{
    const yet=move.filter(r=>!r.has);            // ★下の「動いていない」ぶんは触らない
    if(!yet.length){ toast("まだ数えていないものはありません"); return; }
    if(!confirm(`まだ数えていない ${yet.length}品目を、帳簿どおりで確定します。
（数えた実数＝帳簿の月末。月末在庫は帳簿のままになります）
よろしいですか？`))return;
    yet.forEach(r=>{ r.c.loss=0; r.c.cnt=bookQty(r.c); r.c.cntAt=today(); });
    await save(); renderInv(); toast(`${yet.length}品目を帳簿どおりで確定しました`);
  };
  el.querySelectorAll("[data-ct]").forEach(i=>{
    i.onkeydown=e=>{ if(e.key!=="Enter") return;
      e.preventDefault(); i.blur();
      const nx=el.querySelector(`[data-ct][data-i="${(+i.dataset.i||0)+1}"]`);
      if(nx){ nx.focus(); nx.select&&nx.select(); }
    };
    i.onchange=async()=>{
      const c=cell(stMonth,i.dataset.ct), p=db.products.find(x=>x.id===i.dataset.ct);
      let msg="";
      if(i.value===""){ delete c.cnt; delete c.cntAt; c.loss=0;
        msg=`${p.n}の実数を消しました`; }
      else{
        const n=Math.round(+i.value||0);
        c.cnt=n; c.loss=bookQty(c)-n; c.cntAt=today();
        msg=`${p.n}の月末在庫を ${n} にしました`;
      }
      await save(); renderCount(); toast(msg);
    };
  });
  el.querySelectorAll("[data-ctok]").forEach(b=>b.onclick=async()=>{
    const c=cell(stMonth,b.dataset.ctok), p=db.products.find(x=>x.id===b.dataset.ctok);
    c.loss=0; c.cnt=bookQty(c); c.cntAt=today();
    await save(); renderCount(); toast(`${p.n}を帳簿どおり ${c.cnt} で確定しました`);
  });
  el.querySelectorAll("[data-ctclr]").forEach(b=>b.onclick=async()=>{
    const c=cell(stMonth,b.dataset.ctclr), p=db.products.find(x=>x.id===b.dataset.ctclr);
    delete c.cnt; delete c.cntAt; c.loss=0;
    await save(); renderCount(); toast(`${p.n}の棚卸しを取り消しました`);
  });
}

/* メニューの追加・編集・削除 */
function renderMenu(){
  const el=document.getElementById(stHost); if(!el) return;
  const list=MENUS().filter(m=>!stQ||(m.n+m.cat).toLowerCase().includes(stQ.toLowerCase()));
  const cats=[...new Set(MENUS().map(m=>m.cat))];
  el.innerHTML=`
    <div class="filt">
      <input id="mq" class="f-in" placeholder="メニュー名で探す" value="${esc(stQ)}" style="max-width:220px">
      <button class="btn" id="m-add">メニューを追加</button>
    </div>
    <div class="plist">${list.map(m=>`
      <div class="pc open" data-m="${m.id}">
        <div class="pe" style="border-top:0;padding-top:12px">
          <label style="grid-column:1/-1"><span>メニュー名</span>
            <input type="text" data-m="${m.id}" data-f="n" value="${esc(m.n)}" style="text-align:left"></label>
          <label><span>カテゴリ</span>
            <input type="text" list="mcats" data-m="${m.id}" data-f="cat" value="${esc(m.cat)}" style="text-align:left"></label>
          <label><span>料金（円）</span>
            <input type="number" step="100" data-m="${m.id}" data-f="p" value="${m.p||""}"></label>
          <label><span>所要（分）</span>
            <input type="number" step="5" data-m="${m.id}" data-f="min" value="${m.min||""}"></label>
          <label style="display:flex;align-items:flex-end;justify-content:flex-end">
            <button class="pdel" type="button" data-del="${m.id}">削除</button></label>
        </div>
      </div>`).join("")||'<div class="empty" style="padding:34px"><b>見つかりませんでした</b></div>'}
    </div>
    <datalist id="mcats">${cats.map(c=>`<option value="${esc(c)}">`).join("")}</datalist>
    <p class="note">ここで直したメニューは、カルテと予約の入力候補にそのまま反映されます。</p>`;

  const q=document.getElementById("mq");
  q.addEventListener("compositionstart",()=>{q.dataset.ime="1"});
  q.addEventListener("compositionend",()=>{delete q.dataset.ime; q.oninput();});
  q.oninput=()=>{ if(q.dataset.ime) return;
    const pos=q.selectionStart; stQ=q.value; renderMenu();
    const n=document.getElementById("mq");
    if(n){ n.focus(); n.setSelectionRange(pos,pos); } };
  document.getElementById("m-add").onclick=async()=>{
    if(!Array.isArray(db.menu)||!db.menu.length) db.menu=MENUS().map(x=>Object.assign({},x));
    db.menu.unshift({id:uid(),cat:"新規カテゴリ",n:"新しいメニュー",p:0,min:60});
    stQ=""; await save(); renderMenu();   /* v166：連携タブの中で開くので自分を描き直す */
  };
  el.querySelectorAll("[data-f]").forEach(i=>i.onchange=async()=>{
    const m=db.menu.find(x=>x.id===i.dataset.m);
    m[i.dataset.f]=(i.dataset.f==="p"||i.dataset.f==="min")?(+i.value||0):i.value.trim();
    await save(); renderMenu();
  });
  el.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{
    const m=db.menu.find(x=>x.id===b.dataset.del);
    if(!confirm(`「${m.n}」を削除します。よろしいですか？`))return;
    db.menu=db.menu.filter(x=>x.id!==m.id);
    await save(); renderMenu(); toast("削除しました");   /* v166 */
  });
}

/* v172：見出しの一行（askq）は外した。表の見出しで用が足りる。
   「担当」の列も外した（利用者：**カルテでわかるから要らない**）。
   スタッフ購入は**入力した結果の表**をここに出す（タブはやめた）。

   v176：**上の大きな数字（invbar）も外した。**
   利用者：「一覧を作ってくれたからこの表記はもういらないから消去して。
   今残ってる商品の合計も今の在庫の合計を見ればわかるから必要ない。材料も同じことが言える」
   3つとも**すぐ下の表のいちばん下（合計の行）に同じ数字がある**ので、二度書きだった。
     いま残っている商品／材料 … 「いまの在庫」の合計の行
     ◯月に売れた（原価）      … 会計タブの年間一覧の「商品原価」
     ◯月にカルテで使った材料  … 「◯月に使った材料」の合計の行
     ◯月のスタッフ購入        … 「◯月のスタッフ購入」の合計の行 */
function stSimple(m){
  const goods=stKinds.includes("物販"), mats=stKinds.includes("材料");
  if(!goods&&!mats) return "";                    // 消耗品タブは在庫として数えない
  const mm=+m.slice(5);
  const now=stockNow(stKinds,m), nowYen=sumYen(now);
  const stockTbl=(what)=>now.length
    ? `<table class="chk an"><thead><tr>
        <th>${what}</th><th>数量</th><th>単価</th><th>合計金額</th></tr></thead><tbody>
      ${now.map(r=>`<tr><th>${esc(r.p.n)}</th><td class="hi">${r.q}</td>
        <td>${yen(r.cost)}</td><td>${yen(r.yen)}</td></tr>`).join("")}
      <tr class="bdtot"><th>合計　${now.length}品目</th>
        <td>${now.reduce((a,r)=>a+r.q,0)}</td><td></td><td>${yen(nowYen)}</td></tr>
      </tbody></table>`
    : `<p class="note">残っている${what}がありません。</p>`;
  if(goods){
    return `<div class="divider"><h2>いまの在庫</h2></div>
      ${stockTbl("商品")}`;
  }
  const us=matUses(m), usYen=sumYen(us);
  return `<div class="divider"><h2>${mm}月に使った材料　${us.length}件</h2></div>
    ${us.length?`<table class="chk an"><thead><tr>
        <th>いつ</th><th>だれに</th><th>何を</th>
        <th>数量</th><th>単価</th><th>金額</th></tr></thead><tbody>
      ${us.map(r=>`<tr><th>${esc(String(r.date).slice(5).replace("-","/"))}</th>
        <td>${esc(r.who)}</td><td>${esc(r.n)}</td>
        <td class="hi">${r.qty}</td><td>${yen(r.cost)}</td><td>${yen(r.yen)}</td></tr>`).join("")}
      <tr class="bdtot"><th>合計</th><td></td><td>${us.length}件</td>
        <td>${us.reduce((a,r)=>a+r.qty,0)}</td><td></td><td>${yen(usYen)}</td></tr>
      </tbody></table>
      <p class="note">この合計が、そのまま月締めの材料原価になります。</p>`
      :`<p class="note">${mm}月のカルテに使用材料の記録がありません。</p>`}
    <div class="divider"><h2>いまの在庫</h2></div>
    ${stockTbl("材料")}`;
}

      </div>`:""}

  };

  };
}

/* ---------- メニュー→材料（レシピ） ---------- */
let rcSel=null, rcQ="";
const KIND={use:"使用（経費）",sold:"売上原価"};

function menuCounts(m){
  if(MCNT[m]) return MCNT[m];
  const c={};
  db.charts.forEach(k=>{ if(k.date&&k.date.slice(0,7)===m&&k.menu) c[k.menu]=(c[k.menu]||0)+1; });
  return c;
}
/* レシピ × メニュー回数 → 材料ごとの予測消費 */
function predict(m){
  const cnt=menuCounts(m), out={};
  Object.entries(db.recipes).forEach(([menu,list])=>{
    const n=cnt[menu]||0; if(!n) return;
    list.forEach(([pid,q,kind])=>{
      out[pid]=out[pid]||{use:0,sold:0};
      out[pid][kind]+=n*q;
    });
  });
  return out;
}

function renderRecipe(){
  const el=document.getElementById(rcHost);
  if(!el) return;
  const cnt=menuCounts(stMonth);
  const pid2p=Object.fromEntries(db.products.map(p=>[p.id,p]));
  const used=Object.keys(cnt).filter(m=>cnt[m]>0);
  const menus=[...new Set([...used,...MENUS().map(x=>x.n),...Object.keys(db.recipes)])]
    .filter(m=>!rcQ||m.toLowerCase().includes(rcQ.toLowerCase()))
    .sort((a,b)=>(cnt[b]||0)-(cnt[a]||0)||a.localeCompare(b,"ja"));

  const pred=predict(stMonth);
  let chk="", diff=0;
  Object.keys(pred).sort().forEach(pid=>{
    const p=pid2p[pid]; if(!p) return;
    const st=cell(stMonth,pid);
    const pv=pred[pid].use+pred[pid].sold, av=st.use+st.sold;
    const d=Math.round(pv)-av; if(d) diff++;
    chk+=`<tr><th>${esc(p.n)}</th>
      <td>${Math.round(pv*100)/100}</td><td>${av}</td>
      <td class="${d===0?"ok":"ng"}">${d===0?"一致":(d>0?"+":"")+d}</td></tr>`;
  });

  const ed=()=>{
    if(!rcSel) return `<div class="empty" style="padding:34px"><b>メニューを選んでください</b>
      左の一覧から選ぶと、そこで使う材料を登録できます</div>`;
    const list=db.recipes[rcSel]||[];
    return `<div class="sheet">

      ${list.length?list.map(([pid,q,kind],i)=>{
        const p=pid2p[pid]||{n:"（削除された商品）",cost:0};

        </div>`;
      }).join(""):`<p class="note" style="margin:0 0 12px">まだ材料が登録されていません。</p>`}
      <div class="rrow add">

        <button class="btn ghost" id="r-add">追加</button>
      </div>
    </div>`;
  };

  el.innerHTML=`
    <div class="schbar">
      <button class="nav" id="rpm">前月</button>
      <button class="nav" id="rnm">次月</button>
      <span class="title">${stMonth.replace("-","年")}月で検算</span>
      <button class="btn" id="r-apply">この月の在庫に反映</button>
    </div>
    <p class="note" style="margin:0 0 14px">メニュー1回あたりの材料の数を決めると、施術回数から材料の消費を自動で計算します。
      ボトルものは小数で入れてください（0.02 なら約50回で1本）。下の検算が「一致」に近づくよう数字を調整していきます。</p>
    <div class="rcols">
      <div class="rlist">
        <input id="rq" class="f-in" placeholder="メニューを探す" value="${esc(rcQ)}">
        ${menus.slice(0,80).map(m=>`<button class="rmenu${rcSel===m?" on":""}" data-m="${esc(m)}">
          <span>${esc(m)}</span>
          <em>${cnt[m]?cnt[m]+"回":""}${db.recipes[m]?` ・材料${db.recipes[m].length}`:""}</em>
        </button>`).join("")}
      </div>
      <div class="redit">${ed()}
        <div class="divider"><h2>検算　${stMonth.replace("-","年")}月</h2></div>
        ${chk?`<table class="chk"><thead><tr><th>材料</th><th>レシピ予測</th><th>在庫表の実績</th><th>差</th></tr></thead>
          <tbody>${chk}</tbody></table>
          <p class="note">${diff?`${diff}件ずれています。数量を調整すると一致に近づきます。`:"すべて一致しています。"}</p>`
        :`<p class="note">まだ計算できる材料がありません。</p>`}

  document.getElementById("rpm").onclick=()=>{stMonth=shiftMonth(stMonth,-1);renderRecipe()};
  document.getElementById("rnm").onclick=()=>{stMonth=shiftMonth(stMonth,1);renderRecipe()};

  const add=document.getElementById("r-add");
  if(add) add.onclick=async()=>{
    const pid=document.getElementById("r-p").value;
    if(!pid){ toast("材料を選んでください"); return; }
    db.recipes[rcSel]=db.recipes[rcSel]||[];
    db.recipes[rcSel].push([pid,+document.getElementById("r-q").value||1,document.getElementById("r-k").value]);
    await save(); renderRecipe();
  };
  el.querySelectorAll(".rrow [data-i]").forEach(i=>i.onchange=async()=>{
    const row=db.recipes[rcSel][+i.dataset.i];

    await save(); renderRecipe();

    db.recipes[rcSel].splice(+b.dataset.i,1);
    if(!db.relay) db.relay={url:"",key:""};
  ensureLine();
  if(!db.tpl) db.tpl=Object.assign({},TPL0);
  if(!db.recipes[rcSel].length) delete db.recipes[rcSel];
    await save(); renderRecipe();
  });
  document.getElementById("r-apply").onclick=async()=>{
    const pr=predict(stMonth), ks=Object.keys(pr);
    if(!ks.length){ toast("計算できる材料がありません"); return; }
    if(!confirm(`${stMonth.replace("-","年")}月の在庫の「消耗品」「販売」欄を、レシピの計算結果で上書きします。よろしいですか？`))return;
    ks.forEach(pid=>{
      const c=cell(stMonth,pid);
      if(pr[pid].use) c.use=Math.round(pr[pid].use);
      if(pr[pid].sold) c.sold=Math.round(pr[pid].sold);
    });
    await save(); renderRecipe(); toast(`${ks.length}件の材料を在庫に反映しました`);
  };
}

/* ---------- 来店ペースと失客アラート ---------- */
let vFilter="risk";

const ymd=s=>`20${s.slice(0,2)}-${s.slice(2,4)}-${s.slice(4,6)}`;
const days=(a,b)=>Math.round((D(b)-D(a))/DAY);

/* Squareの履歴 ＋ アプリで書いたカルテ を合わせた来店日 */
function visitsOf(c){
  /* v132：VISITS はデータの中（db.visits）へ移した */
  const s=((db.visits||{})[c.name]||"").split(",").filter(Boolean).map(ymd);
  const k=chartsOf(c.id).map(x=>x.date);
  return [...new Set([...s,...k])].sort();
}
function pace(c){
  const v=visitsOf(c);
  if(!v.length) return null;
  const last=v[v.length-1], since=days(last,today());
  let avg=null;
  if(v.length>=2){
    let t=0; for(let i=1;i<v.length;i++) t+=days(v[i-1],v[i]);
    avg=Math.round(t/(v.length-1));
  }
  const booked=db.appts.some(a=>isBooking(a)&&a.cid===c.id&&a.date>=today());
  const ratio=avg?since/avg:null;
  let lv="ok";
  if(booked) lv="booked";
  else if(avg&&ratio>=2&&since>=45) lv="risk";
  else if(avg&&ratio>=1.5) lv="soon";
  else if(!avg&&since>=60) lv="once";
  return {v,last,since,avg,ratio,booked,lv,n:v.length};
}
const LV={risk:["失客の可能性","bad"],soon:["そろそろ連絡","low"],
          once:["初回のみ","low"],booked:["予約済み","ok"],ok:["","ok"]};

/* 月の予約から売上予定 */
/* ---------- 売上の出どころ（v78） ----------
   Squareの売上は db.sqsales（syncOrders が注文の合計をそのまま控えたもの）から取る。
   db.charts から足し上げないのは、名簿と結びつかない決済がカルテにならず丸ごと落ちるため
   （現金出納帳を v75 で直したのと同じ理由）。
   ACTUAL はソースに手で書いた控えなので、取り込みずみの月では使わない */
/* v96：Squareぶんは「純売上高」（税・チップ・サービス料を抜いた、返金を引いたあとの数字）を
   表に出す。税込の合計徴収額は gross に入れて画面に併記する。
   v95までに取り込んだ月は分けた金額を持っていないので、そのときは net=yen のまま
   （＝税込）にして、画面に「税込のまま」と出す。黙って税抜のふりはしない */
/* v100：**売上はSquareを通った金額だけ**。カルテに手で入れた金額は1円も足さない。
   （利用者の方針：お金が発生したら必ずSquareで決済する。Square以外の例外は認めない）
   手入力ぶん（manual／mn件）は数えないが、**捨てずに持って画面に出す**。
   v95の色分け（Squareのカルテ＝白／手入力＝黄）はそのまま残し、
   「数えていない金額がいくらあるか」を必ず見せる。黙って落とさない */
function monthSales(m){
  const mrows=db.charts.filter(k=>(k.date||"").slice(0,7)===m&&k.src!=="square");
  const manual=mrows.reduce((a,k)=>a+(+k.price||0),0);   // 数えない。参考に出すだけ
  const rec=(db.sqsales||{})[m];
  if(rec){
    const parts=!!rec.parts, sq=parts?(rec.net||0):(rec.yen||0);
    return {yen:sq, sq, gross:rec.yen||0, tax:rec.tax||0, tip:rec.tip||0, svc:rec.svc||0,
            disc:rec.disc||0, ret:rec.ret||0, parts, manual, mn:mrows.length,
            // v102：カルテにならなかった決済。v101以前の取り込みには無いので null（＝分からない）
            nolink:rec.nolink||null, nolinkYen:rec.nolinkYen||0,
            n:rec.n, at:rec.at, src:"square"};
  }
  // 手で控えた月次確定売上。取り込みずみの月では使わない。
  // v132：ソースに焼き込んでいた ACTUAL を **データの中（db.actual）へ移した。**
  // 公開の置き場所に本体を置くので、売上や個人情報をファイルに残さないため
  const AC=(db.actual||{});
  if(AC[m]) return {yen:AC[m], sq:AC[m], gross:AC[m], parts:false,
                        manual, mn:mrows.length, src:"hand"};
  // 取り込んでいない月は0。カルテの手入力で埋め合わせない
  return {yen:0, sq:0, gross:0, parts:false, manual, mn:mrows.length, src:"none"};
}
function daySales(d){
  const rec=(db.sqsales||{})[d.slice(0,7)];
  const mrows=db.charts.filter(k=>k.date===d&&k.src!=="square");
  const manual=mrows.reduce((a,k)=>a+(+k.price||0),0);
  if(rec&&rec.days){
    const parts=!!rec.parts;
    const sq=parts?((rec.dnet||{})[d]||0):(rec.days[d]||0);
    return {yen:sq, sq, gross:rec.days[d]||0, parts, manual, mn:mrows.length, src:"square"};
  }
  return {yen:0, sq:0, gross:0, parts:false, manual, mn:mrows.length, src:"none"};
}

function forecast(m){
  const list=db.appts.filter(a=>isBooking(a)&&a.date.slice(0,7)===m);
  const amt=a=>{
    if(a.price) return a.price;                    // 予約メールの金額を優先
    const h=MENUS().find(x=>x.n===a.menu);
    return h&&h.p?h.p:0;
  };
  let sum=0, future=0, fn=0, unknown=0;
  list.forEach(a=>{
    const v=amt(a); if(!v) unknown++;
    sum+=v;
    if(a.date>=today()){ future+=v; fn++; }        // まだ来ていない予約
  });
  // v106：サロンボードのSquareに載らないぶん（ポイント・ギフト券・スマート支払い）を足す
  const ms=monthSales(m), hp=hpbSales(m), actual=ms.yen+hp.off;
  return {n:list.length, sum, future, fn, unknown, actual, ms, hp, mikomi:actual+future};
}

/* ---------- タイルの根拠になる明細 ---------- */
const cname=id=>(db.customers.find(c=>c.id===id)||{}).name||"";

/* 予約の明細。futureOnly なら今日以降だけ */
function apptRows(m,futureOnly){
  const amt=a=>{
    if(a.price) return a.price;
    const h=MENUS().find(x=>x.n===a.menu);
    return h&&h.p?h.p:0;
  };
  return db.appts
    .filter(a=>isBooking(a)&&a.date.slice(0,7)===m
               &&(!futureOnly||a.date>=today()))
    .sort((a,b)=>(a.date+(a.start||"")).localeCompare(b.date+(b.start||"")))
    .map(a=>({cid:a.cid, date:a.date, time:a.start||"",
              name:a.name||cname(a.cid)||"（お名前なし）",
              menu:a.menu||"", amt:amt(a), staff:a.staff||""}));
}

/* カルテの明細。p は "2026-08"（月）でも "2026-08-14"（日）でもよい */
function karteRows(p){
  return db.charts
    .filter(k=>(k.date||"").startsWith(p))
    .sort((a,b)=>a.date.localeCompare(b.date))
    .map(k=>({cid:k.cid, date:k.date, time:"",
              name:cname(k.cid)||"（不明なお客様）",
              menu:[k.menu,k.goods].filter(Boolean).join("／"),
              amt:+k.price||0, staff:k.staff||"", ret:+k.ret||0,   // ret＝返金（v104）
              src:k.src==="square"?"square":"hand"}));   // 出どころ（v95：色で分ける）
}
/* ---------- 名簿と結びつかなかった決済（v102） ----------
   Squareの決済のうち、お客様が名簿と結びつかずカルテにならなかったぶん。
   **売上には数えている**（Squareを通ったお金なので）。ただし誰のぶんか分からないので
   カルテが作れない。黙って埋もれさせると「タイルと一覧が合わない」の原因になるため、
   件数・金額・中身を必ず画面に出し、直し方（お客様の照合）まで書く */
function nolinkHtml(i){
  if(!i||i.src!=="square") return "";
  if(!i.nolink) return `<p class="note">この月は v101以前の取り込みなので、
    <b>名簿と結びつかなかった決済があるかどうか分かりません。</b>
    「いま取り込む」を押すと出ます。</p>`;
  if(!i.nolink.length) return `<p class="note" style="color:var(--accent)">
    この月の決済は<b>すべて名簿と結びついています</b>（カルテになっていない決済はありません）。</p>`;
  return `<div class="sheet" style="margin:0 0 12px;border-color:var(--alert)">
      <b style="font-family:var(--min);color:var(--alert)">名簿と結びつかなかった決済　${i.nolink.length}件・${yen(i.nolinkYen)}（税込）</b>
      <p class="note" style="margin:6px 0 8px">この決済は<b>売上に数えています</b>（Squareを通ったお金なので）。
        ただし誰のぶんか分からないため<b>カルテになっていません</b>。
        「連携」→「お客様の照合」でSquareの名簿を結びつけてから取り込み直すと、カルテになります。</p>
      <table class="chk an"><thead><tr><th>日付</th><th>内容</th><th>金額（税込）</th></tr></thead><tbody>
      ${i.nolink.map(x=>`<tr><th>${x.date.slice(5).replace("-","/")}</th>
        <td class="hi">${esc(x.items||"（品目なし）")}<br><small style="color:var(--ink3)">${
          x.cust?"Squareではお客様が選ばれていますが、アプリの名簿と結びついていません"
                :"Squareでお客様を選ばずに決済されています"}</small></td>
        <td>${yen(x.yen)}</td></tr>`).join("")}
      <tr class="bdtot"><th>合計</th><td></td><td>${yen(i.nolinkYen)}</td></tr>
      </tbody></table>
    </div>`;
}

/* ---------- メニュー別・物販の売上（v94） ----------
   Squareの注文明細（syncOrders が db.sqsales[m].items に品名でまとめて控えたもの）を、
   Squareのカタログ（db.sqcat＝商品カテゴリと、施術か物販か）でまとめて出す。
   カタログに無い品名は 商品マスタ → メニュー → 言葉づかい の順に当て、
   それでも分からないものは「分類なし」に入れる（勝手にどちらかへ寄せない） */
function sqItemInfo(name){
  const k=MNORM(name);
  const c=((db.sqcat||{}).map||{})[k];
  if(c) return {cat:c.cat||"分類なし", retail:!!c.r, how:"square"};
  const p=(db.products||[]).find(x=>MNORM(x.n)===k);
  if(p) return {cat:p.cat||"分類なし", retail:true, how:"master"};
  const mn=MENUS().find(x=>MNORM(x.n)===k);
  if(mn) return {cat:mn.cat||"分類なし", retail:false, how:"menu"};
  return {cat:"分類なし", retail:isRetail(name), how:"guess"};
}
function itemSales(m){
  const rec=(db.sqsales||{})[m]||null;
  const items=(rec&&rec.items&&Object.keys(rec.items).length)?rec.items:null;
  // v96：品目の金額も純売上（税抜）にそろえる。分けた金額を持っていない古い取り込みは税込のまま
  const parts=!!(rec&&rec.parts);
  const val=it=>parts?(it.net||0):(it.yen||0);
  const out={have:!!items, at:rec?rec.at||"":"", sq:rec?(parts?rec.net||0:rec.yen||0):0,
             parts, gross:rec?rec.yen||0:0,
             menu:[], goods:[], menuYen:0, goodsYen:0, menuQty:0, goodsQty:0, guess:0};
  if(!items) return out;
  const g={menu:{},goods:{}};
  Object.values(items).forEach(it=>{
    const info=sqItemInfo(it.n), side=info.retail?"goods":"menu", v=val(it);
    const c=g[side][info.cat]=g[side][info.cat]||{cat:info.cat,yen:0,qty:0,items:[]};
    c.yen+=v; c.qty+=it.q||0;
    c.items.push({n:it.n||"（名前なし）",qty:it.q||0,yen:v,how:info.how});
    out[side+"Yen"]+=v; out[side+"Qty"]+=it.q||0;
    if(info.how==="guess") out.guess++;
  });
  const srt=o=>Object.values(o).sort((a,b)=>b.yen-a.yen)
    .map(c=>({...c,items:c.items.slice().sort((a,b)=>b.yen-a.yen)}));
  out.menu=srt(g.menu); out.goods=srt(g.goods);
  return out;
}
/* カテゴリの行をタップすると、その中の品目が開く（縦に全部並べない） */
function salesTable(side,groups,total,net){
  const lbl=side==="goods"?"物販":"メニュー";
  if(!groups.length) return `<p class="note">この月は${lbl}の売上がありません。</p>`;
  const max=groups[0].yen||1, qty=groups.reduce((a,c)=>a+c.qty,0);
  const rows=groups.map(c=>{
    const key=side+"|"+c.cat, op=!!vOpenCat[key];
    return `<tr class="scat" data-k="${esc(key)}"><th>${op?"▾":"▸"} ${esc(c.cat)}
        <small style="color:var(--ink3)">　${c.items.length}品目</small></th>
      <td>${c.qty}</td><td class="hi">${yen(c.yen)}</td><td>${pct(c.yen,total)}</td>
      <td class="barcell">${bar(c.yen,max)}</td></tr>`
      +(op?c.items.map(x=>`<tr class="sitem"><th style="padding-left:32px">${esc(x.n)}${
          x.how==="guess"?'<small style="color:var(--alert)">　カタログに無い品名</small>':""}</th>
        <td>${x.qty}</td><td>${yen(x.yen)}</td><td>${pct(x.yen,total)}</td>
        <td class="barcell">${bar(x.yen,max)}</td></tr>`).join(""):"");
  }).join("");
  return `<table class="chk an"><thead><tr>
      <th>${side==="goods"?"商品カテゴリ／商品":"メニューのカテゴリ／メニュー"}</th>
      <th>点数</th><th>${net?"純売上":"売上（税込）"}</th><th>構成比</th><th></th></tr></thead>
    <tbody>${rows}
      <tr class="bdtot"><th>合計　${groups.length}カテゴリ</th><td>${qty}</td>
        <td>${yen(total)}</td><td></td><td></td></tr></tbody></table>`;
}

const CHARTS0=[];

/* ---------- 過去のSquare注文をカルテに取り込む ---------- */
const RETAIL=["JOLEL　ＵＶジェル","ワコナルビューティー","ワコナル10包","ワコナル30包",
              "カニューレ","DEAD SEA バスソルト","2025 コフレ","パフ"];
function importCharts(){
  const byName={}; db.customers.forEach(c=>byName[c.name]=c);
  const seen=new Set(db.charts.filter(k=>k.sqid).map(k=>k.sqid));
  let added=0, skipped=0;
  CHARTS0.forEach(([name,d,items,amt,hibi],idx)=>{
    const c=byName[name]; if(!c){ skipped++; return; }
    const date=`20${d.slice(0,2)}-${d.slice(2,4)}-${d.slice(4,6)}`;
    const sqid="sq"+idx;
    if(seen.has(sqid)) return;
    seen.add(sqid);
    const parts=items.split("／");
    const goods=parts.filter(x=>RETAIL.some(r=>x.startsWith(r)));
    const menu=parts.filter(x=>!goods.includes(x));
    db.charts.push({id:uid(),cid:c.id,date,staff:hibi?"その他":"川口香子",
      menu:menu.join("／"), price:amt, parts:"", machine:"", level:"", shots:"",
      skin:"", goods:goods.join("／"), next:"", note:"", src:"square", sqid});
    added++;
  });
  return {added,skipped};
}
/* 顧客ごとの購入履歴（物販だけ集計） */
function purchases(cid){
  const t={};
  chartsOf(cid).forEach(k=>(k.goods||"").split("／").filter(Boolean).forEach(g=>{
    const m=g.match(/^(.*?)(?:×(\d+))?$/);
    t[m[1]]=(t[m[1]]||0)+(+m[2]||1);
  }));
  return Object.entries(t).sort((a,b)=>b[1]-a[1]);
}


/* ---------- 月締め ---------- */
/* 消耗品は在庫に入れず、買った月にそのまま経費にする（v82）。
   仕入れの取り込み履歴から、その月ぶんの消耗品だけを足し上げる */
function supplyCost(m){
  return (db.buys||[]).filter(b=>b.month===m)
    .reduce((a,b)=>a+(b.items||[]).filter(it=>it.kind==="消耗品")
      .reduce((x,it)=>x+(it.qty||0)*(it.price||0),0),0);
}
function supplyRows(m){
  const t={};
  (db.buys||[]).filter(b=>b.month===m).forEach(b=>(b.items||[])
    .filter(it=>it.kind==="消耗品").forEach(it=>{
      const k=it.n||it.pid;
      if(!t[k]) t[k]={n:k,qty:0,yen:0,src:b.src};
      t[k].qty+=it.qty||0; t[k].yen+=(it.qty||0)*(it.price||0);
    }));
  return Object.values(t).sort((a,b)=>b.yen-a.yen);
}

/* ---------- 川口さんの立替（v129） ----------
   利用者の指示：**川口立替分を、仕入れで「商品」「材料」「消耗品」に分けて入力した
   すべての合計を立替として計算してほしい。**

   仕入れの伝票1枚ごとに「払ったのは誰か」を持たせた（`adv`）。
     kawa  … 川口さんが立て替えた → 支払明細の「立替」に入る
     salon … 店が直接払った       → 立替に入れない

   持っていない古い伝票は **川口さんの立替として扱う**（それまで仕入れはすべて
   川口さんが立て替えていたため。CLAUDE.md「立替は川口さんが立て替えて仕入れているぶん」）。
   区分（商品・材料・消耗品）で分けずに、**3つとも合計する**。
   消耗品も川口さんが立て替えて買っているので、返す金額に変わりはないため。 */
const advOf=b=>((b&&b.adv)==="salon"?"salon":"kawa");
function advBuy(m){
  const bs=(db.buys||[]).filter(b=>b.month===m&&advOf(b)==="kawa");
  const kind=k=>bs.reduce((a,b)=>a+(b.items||[])
    .filter(it=>(it.kind||"物販")===k).reduce((x,it)=>x+(it.qty||0)*(it.price||0),0),0);
  const goods=kind("物販"), mat=kind("材料"), supply=kind("消耗品");
  // 伝票の合計（税や端数の丸めを含む）と、品目の積み上げがずれることがある。
  // 立替は**実際に払った額**なので、伝票の合計のほうを正とする
  const total=bs.reduce((a,b)=>a+(b.total||0),0);
  return {n:bs.length, goods, mat, supply, items:goods+mat+supply, total,
          rows:bs.map(b=>({id:b.id,src:b.src,date:b.date,no:b.no||"",total:b.total||0,
                           n:(b.items||[]).length}))};
}
/* ---------- サロンボード（ホットペッパービューティー）の明細（v106） ----------

   月に1度おろす2つのCSVを読む。1行めの見出しで見分ける。

   ① 振込・請求明細
      予約番号／来店日時／予約者名／来店処理金額(税込)／利用ポイント／利用ギフト券／
      付与ポイント／訂正処理日／訂正コメント／差引利用ポイント／差引利用ギフト券／差引付与ポイント
   ② スマート支払い振込・明細
      予約番号／来店日時／お客様氏名／決済日時／スマート支払い売上

   ★ 金額の意味（2026-07の実物で確かめた）
     付与ポイントが「(来店処理金額＋利用ポイント＋利用ギフト券)÷1.1 の1%（切り捨て）」に
     ぴったり合ったので、次のように読める。

       施術総額（税込）   ＝ 来店処理金額 ＋ 利用ポイント ＋ 利用ギフト券
       来店処理金額       ＝ お客様が実際に払う額
       スマート支払い     ＝ そのうち事前にオンラインで払われたぶん（店頭を通らない）
       Squareに載るはず   ＝ 来店処理金額 − スマート支払い
       Squareに載らない   ＝ 利用ポイント ＋ 利用ギフト券 ＋ スマート支払い ← これを売上に足す
       付与ポイント       ＝ 店が負担する原資。1pt＝1円として原価に足す

   ★ ここはv100の「売上はSquareを通った金額だけ」から外れる。
     外していい理由は、この3つが**Squareを通りようがない**（リクルートから後日振り込まれる）ため。
     手入力のカルテを足さない方針は変えていない。 */
function csvRows(text){
  return String(text||"").replace(/\r/g,"").split("\n").filter(l=>l.trim()).map(l=>{
    const out=[]; let cur="", q=false;
    for(let i=0;i<l.length;i++){
      const ch=l[i];
      if(q){ if(ch==='"'){ if(l[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=ch; }
      else if(ch==='"') q=true;
      else if(ch===","){ out.push(cur); cur=""; }
      else cur+=ch;
    }
    out.push(cur);
    return out.map(s=>s.trim());
  });
}
const hpbNum=s=>{ const n=+String(s||"").replace(/[^\d.\-]/g,""); return isFinite(n)?Math.round(n):0; };
const hpbDate=s=>{
  const m=String(s||"").match(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  return m?`${m[1]}-${String(m[2]).padStart(2,"0")}-${String(m[3]).padStart(2,"0")}`:"";
};
/* CSV1本を読む。どちらの明細かは見出しで決める（ファイル名には頼らない） */
function parseHpb(text){
  const rows=csvRows(text);
  if(!rows.length) throw new Error("中身がありません");
  const h=rows[0].map(x=>x.replace(/\s/g,""));
  const at=n=>h.findIndex(x=>x.indexOf(n)>=0);
  const eq=n=>h.findIndex(x=>x.indexOf(n)===0);
  const iNo=at("予約番号");
  if(iNo<0) throw new Error("「予約番号」の列がありません。サロンボードの明細CSVか確かめてください");
  const iDate=at("来店日時");
  const iSmart=at("スマート支払い");
  const body=rows.slice(1).filter(r=>r[iNo]);
  if(!body.length) throw new Error("明細が1行もありません");
  if(iSmart>=0){
    return {kind:"smart", rows:body.map(r=>({
      no:r[iNo], date:hpbDate(r[iDate]), name:r[at("氏名")]||"",
      paid:hpbDate(r[at("決済日時")]), amt:hpbNum(r[iSmart])}))};
  }
  const iPay=eq("来店処理金額"), iPt=eq("利用ポイント"), iGf=eq("利用ギフト券"), iGr=eq("付与ポイント");
  if(iPay<0) throw new Error("「来店処理金額」の列がありません");
  const cPt=eq("差引利用ポイント"), cGf=eq("差引利用ギフト券"), cGr=eq("差引付与ポイント");
  const iFix=eq("訂正処理日"), iCm=eq("訂正コメント");
  // 訂正があった行は「差引◯◯」に入れ直された数字が入る。空なら元の数字を使う
  const pick=(r,a,b)=>{ const v=b>=0?r[b]:""; return v!==""&&v!==undefined?hpbNum(v):(a>=0?hpbNum(r[a]):0); };
  return {kind:"bill", rows:body.map(r=>({
    no:r[iNo], date:hpbDate(r[iDate]), name:r[at("者名")]||r[2]||"",
    pay:hpbNum(r[iPay]),
    pt:pick(r,iPt,cPt), gift:pick(r,iGf,cGf), grant:pick(r,iGr,cGr),
    fix:iFix>=0&&r[iFix]?r[iFix]:"", cm:iCm>=0?(r[iCm]||""):""}))};
}
/* 取り込みずみの月をまとめる。何も無ければ全部0で have:false を返す */
function hpbSales(m){
  const r=(db.hpb||{})[m];
  // ★ v116：ここが v107 の追加ぶん（bgrant/bpt/adj/adjSum）を返しておらず、
  //   サロンボードを取り込んでいない月で hpbFlow の足し算が **NaN** になっていた。
  //   画面には ¥0 と出るので気づきにくく、小計・報酬・支払合計まで全部0になっていた。
  //   **返す形は have:true のときと必ずそろえること。**
  if(!r) return {have:false,n:0,pay:0,pt:0,gift:0,grant:0,smart:0,ns:0,
                 off:0,store:0,gross:0,fix:0,at:"",
                 hasBill:false,bgrant:0,bpt:0,adj:[],adjSum:0,
                 bnote:"",bat:"",img:"",imgAt:""};
  let pay=0,pt=0,gift=0,grant=0,fix=0;
  (r.rows||[]).forEach(x=>{ pay+=x.pay||0; pt+=x.pt||0; gift+=x.gift||0; grant+=x.grant||0; if(x.fix) fix++; });
  const sm=r.smart||{};
  const smart=Object.values(sm).reduce((a,b)=>a+(+b||0),0);
  // v107：請求書から手で転記したぶん。明細CSVからは出てこない数字なのでここに持つ
  const b=r.bill||null;
  const adj=(b&&Array.isArray(b.adj))?b.adj:[];
  return {have:true, n:(r.rows||[]).length, pay, pt, gift, grant, smart,
          ns:Object.keys(sm).length,
          off:pt+gift+smart,        // Squareに載らない＝売上に足すぶん
          store:pay-smart,          // Squareに載っているはずのぶん
          gross:pay+pt+gift,        // 施術総額（税込）
          fix, at:r.at||"",
          hasBill:!!b, bgrant:b?(+b.grant||0):0, bpt:b?(+b.pt||0):0,
          adj, adjSum:adj.reduce((a,x)=>a+(+x.v||0),0),
          bnote:b?(b.note||""):"", bat:b?(b.at||""):"",
          img:r.img||"", imgAt:r.imgAt||""};
}
/* お金の流れ（利用者の「お金の流れ_2026年7月.pdf」の①②をそのまま出す。v107）
   ① 実際の売上   … Squareの純売上高 ＋ ポイント・ギフト券 ＋ スマート支払い（明細CSVから）
   ② 実態に合わせる … Squareの純売上高 − ポイント付加分 ＋ ポイント利用分 ＋ スマート支払い ± そのほか
                      （①とちがい、こちらは**請求書から転記した数字**を使う）
   ①は売上、②は実際に入ってくるお金。**別のものなので混ぜない。** */
/* Squareの決済手数料（v117）。中継役v11が返したぶんを月ごとに控えてある。
   取り込んでいない月は have:false を返し、これまでどおり手入力（そのほかの調整）に頼る */
function sqFee(m){
  const rec=(db.sqsales||{})[m];
  const has=!!(rec&&rec.fee!==undefined&&rec.fee!==null);
  return {have:has, yen:has?Math.round(+rec.fee||0):0, n:has?(+rec.feeN||0):0};
}
/* 「そのほかの調整」に手数料らしい行が残っていないか（自動と二重になる） */
function feeDupRows(m){
  return (hpbSales(m).adj||[]).filter(x=>/手数料|fee/i.test(x.n||""));
}
function hpbFlow(m){
  const ms=monthSales(m), h=hpbSales(m), f=sqFee(m);
  // 欠けた項目があっても NaN を画面に出さない（v116。上の不具合の再発よけ）
  const n0=v=>Number(v)||0;
  const sales=n0(ms.yen)+n0(h.off);                                     // ①
  // v117：手数料は自動（Squareから）。手入力の「そのほかの調整」もそのまま効く
  const sub=n0(ms.yen)-n0(h.bgrant)+n0(h.bpt)+n0(h.smart)+n0(h.adjSum)-n0(f.yen); // ②
  return {m, ms, h, fee:f, sq:ms.yen, sales, sub, have:h.have, hasBill:h.hasBill};
}
/* 付与ポイントの検算。税抜の1%（切り捨て）と合うか。合わない行は画面に出す */
function hpbGrantCheck(rows){
  return (rows||[]).filter(x=>{
    const g=Math.floor(((x.pay||0)+(x.pt||0)+(x.gift||0))/1.1*0.01);
    return Math.abs(g-(x.grant||0))>1;
  });
}

/* ---------- 耳つぼジュエリー（場所代方式・v109） ----------
   施術者は水野さんで、サロンは場所を貸しているだけ。
   **1件につき1,000円だけがサロンの売上**で、残りは水野さんに払う。
   例：3,500円の1件なら サロン1,000円／水野さん2,500円。
   支払明細書の「耳つぼ控除 −2,500」はこの残りのこと。v107までは手で入れていたが、
   Squareのカテゴリから件数と金額が取れるので自動で出す */
function mimiSales(m){
  const s=db.mimi||{cat:"耳ツボジュエリー",unit:1000,on:true};
  const z={have:false,on:!!s.on,cat:s.cat,unit:+s.unit||0,qty:0,yen:0,place:0,pay:0};
  if(!s.on) return z;
  const is=itemSales(m);
  if(!is.have) return z;
  const k=MNORM(s.cat);
  const cs=[...is.menu,...is.goods].filter(c=>MNORM(c.cat)===k);
  if(!cs.length) return z;
  const qty=cs.reduce((a,c)=>a+c.qty,0), yen=cs.reduce((a,c)=>a+c.yen,0);
  const place=qty*(+s.unit||0);
  return {have:true,on:true,cat:s.cat,unit:+s.unit||0,qty,yen,
          place:Math.min(place,yen),           // 場所代＝サロンの売上
          pay:Math.max(0,yen-place)};          // 水野さんへ払うぶん
}

/* ---------- 支払明細（v110） ----------
   実物「2026年7月支払明細書（川口香子さん宛）」の計算をそのまま入れた。

     小計（純売上・サロンボードぶん計算ずみ）      512,096

     物販原価 … **売れた商品の原価**（在庫表の 販売数×原価）。「仕入れた額」ではない
     立替     … **物販原価 ＋ 差分**。川口さんが商品を立て替えて仕入れているので、
                売れたぶんの元値をそのまま返すのが基本。

     パート負担 … **（水野さんの支払額 − 耳つぼぶん）× 4割**。

   水野さんは**時給＋耳つぼジュエリー**。
     耳つぼは場所代方式（mimiSales）で計算した「水野さんへ」のぶんをそのまま渡す。
     2026年7月なら 時給ぶん8,000 ＋ 耳つぼ2,500 ＝ 10,500。 */
/* 立替を「仕入れの合計」で出しはじめる月（v129）。
   これより前の月は、紙と一致を確かめた v110 の出しかた（物販原価＋差分）のままにする */
const TATEBUY_FROM="2026-08";
function payMonth(m){
  if(!db.pay) db.pay={rate:0.4,mizuWage:1000,months:{}};
  if(!db.pay.months) db.pay.months={};
  return db.pay.months[m]||{};
}
const payBlank=v=>(v===undefined||v===null||v==="");
function payKawa(m){
  const c=closing(m), s=payMonth(m).kawa||{};
  const sub=c.netAdj;                                           // 小計
  // v114：物販原価は「Squareで売れたぶん（在庫表）」だけでは足りない。
  // プレゼントとキャンペーンで渡した商品はSquareを通らないので、カルテから足す
  const costGoods=c.cGoods, costGift=c.cGift, costCamp=c.cCamp;
  const autoCost=costGoods+costGift+costCamp;
  const cost=payBlank(s.cost)?autoCost:(+s.cost||0);
  const base=sub-cost;                                          // 報酬の対象額
  const rate=(db.pay.rate===undefined?0.4:+db.pay.rate);
  const share=Math.floor(base*rate);                            // 4割（切り捨て）
  /* 立替の出しかたは2つある（v129）。
       buy  … **仕入れで「川口さんの立替」にした伝票の合計**（商品・材料・消耗品ぜんぶ）。
              利用者の指示どおりの出しかた。2026年8月ぶんからはこちらが既定
       cost … 物販原価 ＋ 差分。v110〜v128の出しかた。
              **2026年7月までは紙と一致させた実績があるので、こちらのまま**にしてある
     どちらにするかは月ごとに選べる（`kawa.tateSrc`）。 */
  const adv=advBuy(m);
  const tateAdd=+s.tateAdd||0;
  const tateSrc=s.tateSrc||(m>=TATEBUY_FROM?"buy":"cost");
  const autoTateCost=cost+tateAdd;                              // 従来の出しかた
  const autoTateBuy=adv.total+tateAdd;                          // 仕入れの合計＋差分
  const autoTate=tateSrc==="buy"?autoTateBuy:autoTateCost;
  const tate=payBlank(s.tate)?autoTate:(+s.tate||0);
  // パート負担＝（水野さんの支払額 − 耳つぼぶん）× 4割
  const mz=payMizu(m);
  const partRate=(db.pay.partRate===undefined?0.4:+db.pay.partRate);
  const autoPart=Math.round(mz.hand*partRate);
  const part=payBlank(s.part)?autoPart:(+s.part||0);
  return {m,sub,cost,autoCost,costGoods,costGift,costCamp,handCost:!payBlank(s.cost),
          base,rate,share,
          tate,autoTate,tateAdd,handTate:!payBlank(s.tate),
          tateSrc,autoTateBuy,autoTateCost,adv,
          part,autoPart,partRate,handPart:!payBlank(s.part),
          mzHand:mz.hand,mzTotal:mz.total,mzMimi:mz.mimi,
          total:share+tate-part,note:s.note||""};
}
/* 水野さんの支払明細（実物「2026年7月・合計15,100円」に合わせた）

     備考             時間   時給    金額

     顔脱毛            1      800     800
     キャンペーン準備  5.5   1,200   6,600
     合計                          15,100

   時給の仕事（全身60分・キャンペーン準備）と件数の仕事（Sパーツ10分・顔脱毛）が
   同じ表に混ざるので、**行ごとに単価を持つ**形にしてある。時給いくらの一本ではない。
   耳つぼジュエリーの行だけは自動で、場所代方式（mimiSales）の「水野さんへ」のぶんが入る。 */
function payMizu(m){
  const s=payMonth(m).mizu||{}, mi=mimiSales(m);
  const rows=(Array.isArray(s.rows)?s.rows:[]).map(r=>({
    n:r.n||"", q:+r.q||0, unit:+r.unit||0,

  const hand=rows.reduce((a,r)=>a+r.amt,0);
  const all=rows.slice();

  return {m, rows:all, hand, mimi:mi.pay, mimiQty:mi.qty, mimiYen:mi.yen,

/* ---------- カルテから原価を引き込む（v114） ----------
   プレゼントとキャンペーンで渡した商品は **Squareを通らない**（または品名が残らない）ので、
   Squareの取り込みからは原価が出せない。カルテの「プレゼントした商品」
   「キャンペーンで渡した商品」を集計してここで拾う。

   在庫表にも gift 列があるが、あれは**在庫の数を合わせるための手入力**。
   二重に数えないよう、**原価はカルテのぶんだけ**を使い、
   在庫表と食い違うときは画面に出して「在庫に反映」で揃えられるようにしてある。 */
function chartPickCost(m,key){
  const cost=id=>{const p=db.products.find(x=>x.id===id); return p?(p.cost||0):0;};
  const t={};
  let yenSum=0;
  db.charts.filter(k=>(k.date||"").slice(0,7)===m).forEach(k=>{
    (k[key]||[]).forEach(x=>{
      const q=+x.qty||1;
      t[x.pid]=(t[x.pid]||0)+q;
      yenSum+=q*cost(x.pid);
    });
  });
  return {yen:yenSum, qty:t,
          rows:Object.entries(t).map(([pid,q])=>{
            const p=db.products.find(y=>y.id===pid);
            return {pid, n:p?p.n:"（消えた商品）", qty:q, cost:cost(pid), yen:q*cost(pid)};
          }).sort((a,b)=>b.yen-a.yen)};
}
const chartGiftCost=m=>chartPickCost(m,"gifts");
const chartCampCost=m=>chartPickCost(m,"camps");

/* 同じ来店にカルテが2件ないか（v120）
   利用者の7月のデータで見つかった：同じ日・同じお客様に

   **金額は売上に二重計上されない**（v100で手入力を数えないと決めたため）が、

function dupCharts(m){
  const ch=db.charts.filter(k=>(k.date||"").slice(0,7)===m);
  const byKey={};
  ch.forEach(k=>{
    const key=(k.date||"")+"|"+(k.cid||k.name||"");
    (byKey[key]=byKey[key]||[]).push(k);
  });
  const out=[];
  Object.entries(byKey).forEach(([key,list])=>{
    const sq=list.filter(k=>k.src==="square"), hand=list.filter(k=>k.src!=="square");
    if(sq.length&&hand.length){
      const cost=id=>{const p=db.products.find(x=>x.id===id); return p?(p.cost||0):0;};
      const matYen=a=>a.reduce((x,k)=>x+(k.mats||[]).reduce((y,v)=>y+(+v.qty||1)*cost(v.pid),0),0);
      const gftYen=a=>a.reduce((x,k)=>x+[...(k.gifts||[]),...(k.camps||[])]
        .reduce((y,v)=>y+(+v.qty||1)*cost(v.pid),0),0);
      out.push({date:list[0].date, name:cname(list[0].cid)||list[0].name||"（お名前なし）",
        nSq:sq.length, nHand:hand.length,
        dupCost:Math.min(matYen(sq)+gftYen(sq), matYen(hand)+gftYen(hand))});
    }
  });
  return out.sort((a,b)=>a.date.localeCompare(b.date));
}

/* ---------- カルテの重複を片づける（v121）はやめた（v188） ----------
   利用者の問い：**「重複を片付ける、いるか？必要ないなら消して」**

   重複ができる道を `syncOrders` で塞いだので（同じ日・同じお客様に手で書いたカルテが
   あれば、新しく作らずにそれをSquareのカルテに格上げする）、**片づける相手がいなくなった**。
   いまのデータ1,075件・27か月にも重複は0組だった。

   見つけるほう（`dupCharts`）は残してある。古いデータや、手で2件作ってしまったときに
   **川口さんの支払明細と月の締めで赤く知らせる**。消すのはカルテの一覧から1件ずつ。

   要るようになったら `MERGEFILL` `chartMergePlan` `chartMergeDo` `renderChartMerge` を
   salon-de-kou-karte_186.html から持ってくること。 */
const NL=String.fromCharCode(10);   // 改行。ソースに直接書くと壊しやすいので定数にしてある
function closing(m){
  const ch=db.charts.filter(k=>k.date&&k.date.slice(0,7)===m);
  const uri=ch.reduce((a,k)=>a+(k.price||0),0);      // カルテ上の売上
  const msq=monthSales(m);
  const sqOnly=msq.yen; // Squareの売上。v96からは純売上高（税・チップを抜いたもの）。未取込はACTUALの控え
  const hp=hpbSales(m);
  const sq=sqOnly+hp.off;  // v106：Squareを通らないサロンボードぶんを足したものが月の締めの売上
  const cost=k=>{const p=db.products.find(x=>x.id===k); return p?p.cost:0;};
  // 材料：カルテで選ばれたもの
  const mat={};
  ch.forEach(k=>(k.mats||[]).forEach(x=>mat[x.pid]=(mat[x.pid]||0)+(+x.qty||1)));
  const matYen=Object.entries(mat).reduce((a,[id,q])=>a+q*cost(id),0);
  // 在庫表から
  const sum=(kind,f)=>db.products.filter(p=>p.kind===kind)
    .reduce((a,p)=>a+cell(m,p.id)[f]*p.cost,0);
  const goods=sum("物販","sold"), useYen=sum("物販","use")+sum("材料","use"), matStock=sum("材料","sold");
  const gift=sum("物販","gift")+sum("材料","gift");
  const staff=sum("物販","staff")+sum("材料","staff");
  const supply=supplyCost(m);                        // 消耗品として仕入れたぶん（v82）
  const grant=hp.grant;                              // v106：付与ポイントの原資（1pt=1円）
  const costTotal=matYen+goods+useYen+supply+grant;
  // v109：利用者の求める「純売上（サロンボードぶん計算ずみ）− 商品・材料・プレゼントの原価」
  const flow=hpbFlow(m), mimi=mimiSales(m), fee=sqFee(m);
  const cGoods=goods;                       // 商品（物販として売れたぶん）
  /* v130：材料の原価は **カルテで選んだぶんを唯一の出どころ** にする。
     利用者の指示：「同じメニューでも使う材料が違うから、カルテで材料を選んで原価を出す」。

     v129まで `matStock`（在庫表の材料の「販売」欄）も足していたが、
     この欄は「カルテの使用材料を集計して反映」で**カルテと同じ数字が書き込まれる**ので、
     押した月は材料原価がまるごと二重になっていた。
     在庫の「販売」欄は**在庫の数を合わせるため**だけに残し、原価には足さない。
     `useYen`（店内で使ったぶん・繰入）はカルテに出ないので、今までどおり足す。 */
  const cMat=matYen+useYen;                 // 材料（カルテで選んだぶん＋店内で使ったぶん）
  // v114：プレゼントとキャンペーンはカルテから引き込む（Squareを通らないため）
  const gch=chartGiftCost(m), cch=chartCampCost(m);
  const cGift=gch.yen;                      // プレゼント（カルテ）
  const cCamp=cch.yen;                      // キャンペーンで渡した商品（カルテ）
  const giftStock=gift;                     // 在庫表の gift 列（比べるために持っておく）
  const netAdj=flow.sub-mimi.pay;           // 純売上（HPB調整ずみ・耳つぼの水野さんぶんを引いたあと）
  const zan=netAdj-cGoods-cMat-cGift-cCamp; // 差引
  // v100：粗利の売上はSquareぶんだけ。取り込んでいない月をカルテ合計で埋めない
  // v106：ただしサロンボードのポイント・ギフト券・スマート支払いは別（Squareを通らない）
  return {m, ch:ch.length, uri, sq, sqOnly, hp, grant, flow, mimi, fee,
          cGoods, cMat, cGift, cCamp, giftStock, gch, cch, netAdj, zan, parts:!!msq.parts,
          mat, matYen, matStock, goods, useYen,
          supply, gift, staff, costTotal, gross:sq-costTotal, msrc:msq.src};
}

/* ---------- 現金出納帳 ----------
   Square経由の現金売上（db.charts の cash 欄、syncOrders が入れる）＋手入力の入出金 */
/* 出納帳に出す名前。今の名簿を優先し、消えていたら記録当時の名前を使う */
function cashWho(cid,fallback){
  const c=cid?db.customers.find(x=>x.id===cid):null;
  return c?c.name:(fallback||"");
}
/* その日に関係のあるお客様だけを集める。
   予約 → その日のカルテ → Squareの現金決済 → 手入力ぶん の順に拾って重複を除く。
   名簿267名を毎回ぜんぶ出すと選びにくいので、既定ではこれだけを出す（v76） */
function cashDayCust(date){
  const out=[], seen=new Set();
  const add=(cid,label)=>{
    if(!cid||seen.has(cid)) return;
    const c=db.customers.find(x=>x.id===cid); if(!c) return;
    seen.add(cid); out.push({id:c.id,label:(label?label+"　":"")+c.name});
  };
  (db.appts||[]).filter(a=>a.date===date&&a.status!=="cancel")
    .sort((a,b)=>(a.start||"").localeCompare(b.start||""))
    .forEach(a=>add(a.cid,a.start||""));
  (db.charts||[]).filter(k=>k.date===date).forEach(k=>add(k.cid,""));
  Object.values(db.cashbook.sq||{}).forEach(v=>{ if(v.date===date) add(v.cid,""); });
  (db.cashbook.entries||[]).filter(e=>e.date===date).forEach(e=>add(e.cid,""));
  return out;
}
function cashDayRows(m){
  // Squareぶんは決済1件＝1行。誰の入金かが分かるようにお客様名を添える。
  // カルテではなく決済そのものを見ているので、名簿と結びつかない決済の現金も落ちない
  const byChart={};
  db.charts.forEach(k=>{ if(k.sqid) byChart[k.sqid]=k; });
  const auto=Object.entries(db.cashbook.sq||{})
    .filter(([,v])=>v.date&&v.date.slice(0,7)===m&&v.amt)
    .map(([sqid,v])=>({date:v.date,amt:v.amt,who:cashWho(v.cid),
      note:(byChart[sqid]&&byChart[sqid].menu)||"Square現金売上",auto:true}));
  const manual=(db.cashbook.entries||[]).filter(e=>e.date&&e.date.slice(0,7)===m)
    .map(e=>({date:e.date,amt:e.amount,who:cashWho(e.cid,e.who),note:e.note,auto:false,id:e.id}));
  return [...auto,...manual].sort((a,b)=>a.date.localeCompare(b.date));
}
function cashOpening(m){
  if(db.cashbook.opening[m]!=null) return db.cashbook.opening[m];
  const pm=shiftMonth(m,-1);
  if(db.cashbook.opening[pm]==null && !cashDayRows(pm).length) return 0;   // それより前に記録が無ければ0円始まり
  return cashClosing(pm);
}
function cashClosing(m){
  return cashOpening(m)+cashDayRows(m).reduce((a,r)=>a+r.amt,0);
}

      const j=await relayGet("paytest",`&from=${m}-01&to=${last}`);
      const calls=j.calls||[];
      const ng=calls.filter(c=>c.http>=300);
      const cashSum=calls.reduce((a,c)=>a+(c["現金合計"]||0),0);
      const payNum=calls.reduce((a,c)=>a+(c.payments||0),0);
      let verdict;
      if(j.locationsHttp>=300)
        verdict=`<b style="color:var(--alert)">店舗一覧すら取れません（HTTP ${j.locationsHttp}）</b><br>トークンが正しく貼れているか確認してください。`;
      else if(ng.length)
        verdict=`<b style="color:var(--alert)">決済が読めません（HTTP ${ng[0].http}）</b><br>${ng[0].http===401?"トークンが違うか、貼り間違いです。":ng[0].http===403?"このトークンでは決済を読めません。":"詳細は下の内容を見てください。"}`;
      else if(!payNum)
        verdict=`<b>決済が0件でした</b><br>この期間・この店舗に決済がありません。月を変えて試してください。`;
      else if(!cashSum)
        verdict=`<b>決済は${payNum}件ありましたが、現金は0円でした</b><br>この月はカード・PayPay等だけだったようです。下の内訳を確認してください。`;
      else if(cashSum===sqSum)
        verdict=`<b style="color:var(--accent)">現金 ${yen(cashSum)} を確認できました</b><br>
          出納帳にも同じ ${yen(sqSum)} が入っています。<b>取り込みずみなので、これ以上やることはありません。</b>`;
      else
        verdict=`<b style="color:var(--accent)">現金 ${yen(cashSum)} を確認できました</b><br>
          いま出納帳に入っているSquareぶんは ${yen(sqSum)} で、<b>${yen(cashSum-sqSum)} ぶんがまだ入っていません。</b><br>
          <b>このボタンは数えるだけで帳簿には書きません。</b>タイルに反映するには
          「Squareの現金を取り込む」を押してください。`;

      out.innerHTML=`<div class="sheet" style="margin:10px 0">
        <p class="note" style="margin:0 0 10px">${verdict}</p>
        ${cashSum&&cashSum!==sqSum?`<p class="note" style="color:var(--alert);margin:0 0 10px">
          <b>${yen(cashSum-sqSum)} ぶんがまだ入っていません。</b>
          「アプリを最新にする」を押すと、現金もまとめて入ります。</p>`:""}
        <table class="chk"><thead><tr><th>店舗</th><th>通信</th><th>決済</th><th>現金</th><th>内訳</th></tr></thead>
        <tbody>${calls.map(c=>{
          const k=Object.entries(c["内訳"]||{}).map(([a,b])=>`${esc(a)} ${b}件`).join("、")||"—";
          return `<tr><th>${esc(c.location||"")}</th>
            <td class="${c.http>=300?"ng":"ok"}">${c.http}</td>
            <td>${c.payments!=null?c.payments+"件":"—"}</td>
            <td>${c["現金合計"]!=null?yen(c["現金合計"]):"—"}</td>
            <td style="text-align:left">${c.body?esc(String(c.body).slice(0,200)):k}</td></tr>`;
        }).join("")}</tbody></table>
        <p class="note">対象期間 ${m}-01 〜 ${last}（末日ぶんも含めて数えています）。
          この画面は読んで数えただけで、出納帳の数字は書き換えていません。</p>
      </div>`;
      // 結果の中に出した取り込みボタンは、上の本体ボタンと同じ処理につなぐ
      // v124：取り込みボタンは売上タブの1つにまとめたので、ここには置かない
    }catch(e){
      const old=/action ?を指定/.test(e.message);
      out.innerHTML=`<p class="note" style="color:var(--alert)">失敗：${esc(e.message)}${
        old?"<br><b>中継役が古いままのようです。</b> square-relay_7.gs を Apps Script に貼って、「デプロイを管理」から新バージョンでデプロイし直してください。":""}</p>`;
    }
  };
  document.getElementById("cb-opensave").onclick=async()=>{
    const v=document.getElementById("cb-open").value;
    if(v==="") delete db.cashbook.opening[m]; else db.cashbook.opening[m]=Math.round(+v||0);
    const av=document.getElementById("cb-actual").value;
    if(av==="") delete db.cashbook.actual[m]; else db.cashbook.actual[m]=Math.round(+av||0);
    await save(); renderCashbook(); toast("保存しました");
  };
  document.getElementById("cb-sheet").onclick=()=>openCashSheet(m);
  // 日付を変えたら「この日のお客様」を選び直せるようにプルダウンを作り直す
  const rebuildCust=()=>{
    const sel=document.getElementById("cb-cid");
    const keep=sel.value;
    sel.innerHTML=custOpts(document.getElementById("cb-date").value||formDate,keep);
    sel.value=keep;                       // 選んでいた方が一覧に残っていれば選択を保つ

  };

  document.getElementById("cb-allcust").onclick=()=>{ cbAll=!cbAll; rebuildCust(); };
  if(ed) document.getElementById("cb-cancel").onclick=()=>{ cbEdit=null; renderCashbook(); };
  document.getElementById("cb-add").onclick=async()=>{

    const raw=Math.round(+document.getElementById("cb-amt").value||0);
    const kind=document.getElementById("cb-kind").value;
    const note=document.getElementById("cb-note").value.trim();
