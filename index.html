function bindLineSet(el,msg){
  if(linePage==="menu"){
    el.querySelectorAll("[data-lp]").forEach(b=>b.onclick=()=>{
      linePage=b.dataset.lp; lineEdit=null; renderLine();
      const sc=document.scrollingElement||document.documentElement; if(sc) sc.scrollTop=0;
    });
    return;
  }
  const back=document.getElementById("ls-back");
  if(back) back.onclick=()=>{ linePage="menu"; lineEdit=null; renderLine(); };

  const newId=p=>p+Date.now().toString(36)+Math.floor(Math.random()*1000);

  if(linePage==="remind"){
    document.getElementById("lr-add").onclick=()=>{ lineEdit="new"; renderLine(); };
    el.querySelectorAll("[data-redit]").forEach(b=>b.onclick=()=>{ lineEdit=b.dataset.redit; renderLine(); });
    el.querySelectorAll("[data-rdel]").forEach(b=>b.onclick=async()=>{
      const r=db.line.reminds.find(x=>x.id===b.dataset.rdel);
      if(!confirm(`「${r.days}日前に通知」を消します。よろしいですか？`))return;
      db.line.reminds=db.line.reminds.filter(x=>x.id!==b.dataset.rdel);
      lineEdit=null; await save(); renderLine(); toast("消しました");
    });
    if(lineEdit){
      document.getElementById("lf-cancel").onclick=()=>{ lineEdit=null; renderLine(); };
      document.getElementById("lf-save").onclick=async()=>{
        const o={days:Math.max(0,+document.getElementById("lf-days").value||0),
                 at:document.getElementById("lf-at").value||"13:00",
                 on:document.getElementById("lf-on").checked,
                 top:document.getElementById("lf-top").value,
                 bot:document.getElementById("lf-bot").value};
        if(lineEdit==="new") db.line.reminds.push(Object.assign({id:newId("rm")},o));
        else Object.assign(db.line.reminds.find(x=>x.id===lineEdit),o);
        db.line.reminds.sort((a,b)=>a.days-b.days);
        lineEdit=null; await save(); renderLine(); toast("保存しました");
      };
    }
    const pick=v=>{
      const [rid,aid]=v.split(":");
      const r=db.line.reminds.find(x=>x.id===rid);
      const a=db.appts.find(x=>x.id===aid);
      const c=db.customers.find(x=>x.id===a.cid)||{name:a.name};
      return {r,a,c,text:remindText(r,c,a)};
    };
    el.querySelectorAll("[data-rcopy]").forEach(b=>b.onclick=async()=>{
      const ok=await copyText(pick(b.dataset.rcopy).text);
      toast(ok?"文面をコピーしました":"コピーできませんでした。文面を長押しで選んでください");
    });
    el.querySelectorAll("[data-rsend]").forEach(b=>b.onclick=async()=>{
      const {r,a,c,text}=pick(b.dataset.rsend);
      if(!confirm(`${c.name}様にLINEを送ります。通数を1通消費します。よろしいですか？`))return;
      try{ await lineSend([c.id],text);
        await markLineSent(lineSentKey(r.id,a.cid||a.id,a.id));
        renderLine(); toast(`${c.name}様に送信しました`); }
      catch(e){ msg("失敗："+e.message,false); }
    });
    el.querySelectorAll("[data-rall]").forEach(b=>b.onclick=async()=>{
      const r=db.line.reminds.find(x=>x.id===b.dataset.rall);
      const list=remindTargets(r).filter(a=>{
        const c=db.customers.find(x=>x.id===a.cid); return c&&c.lineId&&!c.lineBlocked;});
      if(!list.length){ msg("LINE連携ずみの方がいません",false); return; }
      if(!confirm(`${list.length}名に送信します。通数を${list.length}通消費します。よろしいですか？`))return;
      msg("送信中…",true);
      try{
        for(const a of list){
          const c=db.customers.find(x=>x.id===a.cid);
          await lineSend([c.id],remindText(r,c,a));
          await markLineSent(lineSentKey(r.id,a.cid||a.id,a.id));
        }
        renderLine(); toast(`${list.length}名に送信しました`);
      }catch(e){ msg("失敗："+e.message,false); }
    });

  }else if(linePage==="follow"){
    document.getElementById("lf-add").onclick=()=>{ lineEdit="new"; renderLine(); };
    el.querySelectorAll("[data-fedit]").forEach(b=>b.onclick=()=>{ lineEdit=b.dataset.fedit; renderLine(); });
    el.querySelectorAll("[data-fdel]").forEach(b=>b.onclick=async()=>{
      const f=db.line.follows.find(x=>x.id===b.dataset.fdel);
      if(!confirm(`「最終来店から${f.days}日後」を消します。よろしいですか？`))return;
      db.line.follows=db.line.follows.filter(x=>x.id!==b.dataset.fdel);
      lineEdit=null; await save(); renderLine(); toast("消しました");
    });
    if(lineEdit){
      document.getElementById("lf-cancel").onclick=()=>{ lineEdit=null; renderLine(); };
      document.getElementById("lf-save").onclick=async()=>{
        const o={days:Math.max(1,+document.getElementById("lf-days").value||1),
                 seg:document.getElementById("lf-seg").value,
                 on:document.getElementById("lf-on").checked,
                 text:document.getElementById("lf-text").value};
        if(lineEdit==="new") db.line.follows.push(Object.assign({id:newId("fu")},o));
        else Object.assign(db.line.follows.find(x=>x.id===lineEdit),o);
        db.line.follows.sort((a,b)=>a.days-b.days);
        lineEdit=null; await save(); renderLine(); toast("保存しました");
      };
    }
    const pickF=v=>{
      const [fid,cid]=v.split(":");
      const f=db.line.follows.find(x=>x.id===fid);
      const c=db.customers.find(x=>x.id===cid);
      return {f,c,text:followText(f,c)};
    };
    el.querySelectorAll("[data-fcopy]").forEach(b=>b.onclick=async()=>{
      const ok=await copyText(pickF(b.dataset.fcopy).text);
      toast(ok?"文面をコピーしました":"コピーできませんでした。文面を長押しで選んでください");
    });
    el.querySelectorAll("[data-fsend]").forEach(b=>b.onclick=async()=>{
      const {f,c,text}=pickF(b.dataset.fsend);
      if(!confirm(`${c.name}様にLINEを送ります。通数を1通消費します。よろしいですか？`))return;
      try{ await lineSend([c.id],text);
        const p=pace(c); await markLineSent(lineSentKey(f.id,c.id,p?p.last:""));
        renderLine(); toast(`${c.name}様に送信しました`); }
      catch(e){ msg("失敗："+e.message,false); }
    });
    el.querySelectorAll("[data-fall]").forEach(b=>b.onclick=async()=>{
      const f=db.line.follows.find(x=>x.id===b.dataset.fall);
      const list=followTargets(f);
      if(!list.length){ msg("今日が対象の方はいません",false); return; }
      if(!confirm(`${list.length}名に送信します。通数を${list.length}通消費します。よろしいですか？`))return;
      msg("送信中…",true);
      try{
        for(const c of list){
          await lineSend([c.id],followText(f,c));
          const p=pace(c); await markLineSent(lineSentKey(f.id,c.id,p?p.last:""));
        }
        renderLine(); toast(`${list.length}名に送信しました`);
      }catch(e){ msg("失敗："+e.message,false); }
    });

  }else if(linePage==="tone"){
    el.querySelectorAll("[data-tone]").forEach(b=>b.onclick=async()=>{
      db.line.tone=b.dataset.tone; await save(); renderLine();
    });
    document.getElementById("lt-save").onclick=async()=>{
      db.line.sign=document.getElementById("lt-sign").value.trim();
      db.line.signOn=document.getElementById("lt-signon").checked;
      await save(); renderLine(); toast("保存しました");
    };

  }else if(linePage==="next"){
    document.getElementById("ln-mode").onchange=async e=>{
      db.line.nextMode=e.target.value; await save(); renderLine();
    };
    document.getElementById("ln-save").onclick=async()=>{
      db.line.nextText=document.getElementById("ln-text").value;
      await save(); renderLine(); toast("保存しました");
    };

  }else if(linePage==="conn"){
    document.getElementById("lc-save").onclick=async()=>{
      db.line.oaId=document.getElementById("lc-oa").value.trim();
      await save(); msg("保存しました",true);
    };
    document.getElementById("lc-test").onclick=async()=>{
      msg("確認中…",true);
      try{ const q=await relayGet("quota");
        msg(`つながりました。今月 ${q.used} 通送信ずみ／上限 ${q.limit} 通（${q.type}）`,true); }
      catch(e){ msg("つながりません："+e.message,false); }
    };
  }
}

function renderLine(){
  const el=document.getElementById("line");
  ensureLine();
  const s=db.line||{oaId:""};
  const linked=db.customers.filter(c=>c.lineId&&!c.lineBlocked);
  const m=stMonth;
  const tab=(k,l,n)=>`<button class="chip${lineTab===k?" on":""}" data-l="${k}">${l}<em>${n}</em></button>`;

  const targets=()=>{
    if(lineTab==="birth") return birthdayThisMonth(m).filter(c=>c.lineId);
    if(lineTab==="churn") return db.customers.filter(c=>{const p=pace(c);
      return c.lineId&&p&&(p.lv==="risk"||p.lv==="soon");});
    if(lineTab==="bday") return linked.filter(c=>!c.birth||c.birth.startsWith("0000"));
    if(lineTab==="camp") return linked;
    return [];
  };
  const tpl=db.tpl||TPL0;
  const list=targets();

  let body="";
  if(lineTab==="set"){
    body=lineSetHtml();
  }else if(lineTab==="link"){
    body=`<div class="sheet">
      <label class="f" for="l-oa">公式アカウントのID（@から始まるもの）</label>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <input class="f-in" id="l-oa" value="${esc(s.oaId)}" placeholder="@123abcd" style="max-width:220px">
        <button class="btn quiet" id="l-save">保存</button>
        <button class="btn ghost" id="l-pull">連携状況を取り込む</button>
        <button class="btn ghost" id="l-quota">今月の残り通数</button>
      </div>
      <p class="note" id="l-msg"></p>
    </div>
    <p class="note">未連携の方のカードで「QRを出す」を押し、お客様に読んでもらいます。
      LINEのトークが開いて「登録 ○○○○○○」が入力済みになるので、送信してもらえば紐付け完了です。</p>
    <div class="plist">${db.customers.filter(c=>!c.lineId).slice(0,300).map(c=>`
      <div class="pc"><div class="ph-row">
        <span class="pi ph" style="background:${hue(c.name)}">${esc(c.name[0])}</span>
        <div class="pn"><b>${esc(c.name)}</b><span class="sub">未連携　コード ${lineCode(c)}</span></div>
        <button class="btn ghost qrbtn" data-id="${c.id}">QRを出す</button>
      </div><div class="qrbox" id="qr-${c.id}"></div></div>`).join("")}</div>`;
  }else if(lineTab==="inbox"){
    const box=window.__inbox||null;
    body=`<div class="sheet">
      <p class="note" style="margin:0 0 12px">カルテッツからの移行手順です。まず①で全員にお願いを送り、
        届いた返信を②で名簿と結びつけます。<b>お客様のLINE IDを事前に知らなくても進められます。</b></p>
      <label class="f" for="l-tpl">① 友だち全員に送る文面</label>
      <textarea class="f-in" id="l-tpl" style="min-height:150px">${esc(lineText||tpl.migrate)}</textarea>
      <div class="actions">
        <button class="btn ghost" id="l-tplsave">文面を保存</button>
        <button class="btn danger" id="i-cast">友だち全員に一斉送信</button>
        <button class="btn" id="i-pull">② 返信を取り込む</button>
      </div>
      <p class="note" id="l-msg"></p>
    </div>
    ${box===null?`<p class="note">「② 返信を取り込む」を押すと、まだ紐づいていない方からの返信が並びます。</p>`
    :box.length?`<div class="plist">${box.map((x,i)=>`
      <div class="pc"><div class="ph-row" style="cursor:default">
        <span class="pi ph" style="background:${hue(x.disp||x.userId)}">${esc((x.disp||"？")[0])}</span>
        <div class="pn"><b>${esc(x.disp||"（LINE名なし）")}</b>
          <span class="sub">${esc(x.at)}　${esc(x.text.slice(0,40))}</span></div>
        <select class="f-in" data-sel="${i}" style="width:auto;max-width:170px">
          <option value="">名簿から選ぶ…</option>
          ${db.customers.filter(c=>!c.lineId).map(c=>
            `<option value="${c.id}"${c.id===x.cid?" selected":""}>${esc(c.name)}${c.tel?"／"+esc(c.tel.slice(-4)):""}</option>`).join("")}
        </select>
        <button class="btn qrbtn" data-bind="${i}">結びつける</button>
      </div>
      ${x.cid?`<p class="note" style="margin:0 14px 12px;color:var(--accent)">
        自動で「${esc(x.cname)}」さんと判定しました（${x.tel?"電話番号が一致":"お名前が一致"}）</p>`
        :`<p class="note" style="margin:0 14px 12px">名簿の候補が見つかりませんでした。手で選んでください。</p>`}
      </div>`).join("")}</div>`
    :`<div class="empty" style="padding:34px"><b>未処理の返信はありません</b></div>`}`;
  }else if(lineTab==="remind"){
    const off=(db.line&&db.line.rmOffset)!==undefined?db.line.rmOffset:1;
    const list=remindList(off);
    const t=lineText||tpl.remind;
    body=`<div class="sheet">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px">
        <select class="f-in" id="r-off" style="width:auto">
          ${[[1,"明日"],[0,"今日"],[2,"あさって"]].map(([v,l])=>
            `<option value="${v}"${v===off?" selected":""}>${l}のご来店</option>`).join("")}
        </select>
        <span class="note" style="margin:0">${shiftDay(today(),off).replace(/-/g,"/")}　${list.length}件</span>
      </div>
      <label class="f" for="l-tpl">送る文面</label>
      <textarea class="f-in" id="l-tpl" style="min-height:130px">${esc(t)}</textarea>
      <p class="note">{name} {date} {dow} {time} {menu} {staff} が予約の内容に置きかわります。</p>
      <div class="actions">
        <button class="btn ghost" id="l-tplsave">この文面を保存</button>
        <button class="btn" id="r-sendall">LINE連携ずみの方へまとめて送る</button>
      </div>
      <p class="note" id="l-msg"></p>
    </div>
    <div class="plist">${list.length?list.map(a=>{
      const c=db.customers.find(x=>x.id===a.cid)||{id:"",name:a.name,lineId:null};
      const msgText=fill(t,c,a);
      return `<div class="pc">
        <div class="ph-row" style="cursor:default">
          <span class="pi ph" style="background:${hue(c.name||a.name)}">${esc((c.name||a.name)[0])}</span>
          <div class="pn"><b>${esc(a.start)}　${esc(c.name||a.name)}</b>
            <span class="sub">${esc((a.menu||"").slice(0,30))}　${a.dur}分　${esc(a.staff||"")}
              ${c.lineId?'<b style="color:var(--accent)">・LINE連携ずみ</b>':"・LINE未連携"}</span></div>
          <button class="btn quiet qrbtn" data-copy="${a.id}">文面をコピー</button>
          ${c.lineId?`<button class="btn qrbtn" data-send="${a.id}">送る</button>`:""}
        </div>
        <div class="preview" style="margin:0 14px 14px">${esc(msgText)}</div>
      </div>`;}).join("")
      :`<div class="empty" style="padding:34px"><b>予約がありません</b>この日はご来店の予定が入っていません</div>`}</div>
    <p class="note">未連携の方は「文面をコピー」して、LINEのチャット画面に貼って送ってください。
      手で送るチャット返信は通数を消費しません。</p>`;
  }else{
    body=`<div class="sheet">
      <label class="f" for="l-tpl">送る文面</label>
      <textarea class="f-in" id="l-tpl" style="min-height:120px">${esc(lineText||tpl[lineTab])}</textarea>
      <p class="note">{name} はお名前に、{since} は最終来店からの日数に置きかわります。</p>
      <div class="actions">
        <button class="btn" id="l-send">選んだ ${lineSel.size} 名に送る</button>
        <button class="btn quiet" id="l-all">全員を選ぶ</button>
        <button class="btn quiet" id="l-none">選択を外す</button>
        <button class="btn ghost" id="l-tplsave">この文面を保存</button>
      </div>
      <p class="note" id="l-msg"></p>
      ${lineSel.size===1?`<div class="preview">${esc(fill(lineText||tpl[lineTab],
        db.customers.find(c=>c.id===[...lineSel][0])))}</div>`:""}
    </div>
    <div class="plist">${list.length?list.map(c=>{
      const p=pace(c);
      return `<div class="pc"><div class="ph-row lrow" data-id="${c.id}">
        <input type="checkbox" ${lineSel.has(c.id)?"checked":""} data-ck="${c.id}">
        <span class="pi ph" style="background:${hue(c.name)}">${esc(c.name[0])}</span>
        <div class="pn"><b>${esc(c.name)}</b><span class="sub">
          ${lineTab==="birth"?`${c.birth.slice(5).replace("-","/")}生まれ`:""}
          ${lineTab==="bday"?"生年月日 未登録":""}
          ${p?`　最終 ${p.last.replace(/-/g,"/")}（${p.since}日前）`:""}</span></div>
      </div></div>`;}).join("")
      :`<div class="empty" style="padding:34px"><b>対象の方がいません</b>LINE連携済みの方だけが並びます</div>`}</div>`;
  }

  el.innerHTML=`
    <div class="schbar">
      <button class="nav" id="lpm">前月</button>
      <button class="nav" id="lnm">次月</button>
      <span class="title">${m.replace("-","年")}月</span>
    </div>
    <div class="sum">
      <div><span>LINE連携ずみ</span><b>${linked.length}</b></div>
      <div><span>未連携</span><b>${db.customers.length-linked.length}</b></div>
      <div><span>${m.slice(5,7)}月生まれ</span><b>${birthdayThisMonth(m).length}</b></div>
      <div><span>生年月日あり</span><b>${db.customers.filter(c=>c.birth).length}<small style="font-family:var(--jp);font-size:11px;color:var(--ink3)"> / ${db.customers.length}</small></b></div>
      <div class="adv"><span>連絡したい方</span><b>${db.customers.filter(c=>{const p=pace(c);
        return p&&(p.lv==="risk"||p.lv==="soon");}).length}</b></div>
    </div>
    <div class="filt">
      ${tab("link","連携する",db.customers.length-linked.length)}
      ${tab("birth","誕生日",birthdayThisMonth(m).filter(c=>c.lineId).length)}
      ${tab("churn","失客まえ",db.customers.filter(c=>{const p=pace(c);
        return c.lineId&&p&&(p.lv==="risk"||p.lv==="soon");}).length)}
      ${tab("bday","生年月日を聞く",linked.filter(c=>!c.birth||c.birth.startsWith("0000")).length)}
      ${tab("remind","前日リマインド",remindList(1).length)}
      ${tab("inbox","返信から紐づけ",(window.__inbox||[]).length)}
      ${tab("camp","お知らせ一斉",linked.length)}
      ${tab("set","設定",(db.line.reminds.filter(r=>r.on).length)+(db.line.follows.filter(f=>f.on).length))}
    </div>
    ${body}`;

  const msg=(t,ok)=>{const e=document.getElementById("l-msg"); if(e){
    e.textContent=t; e.style.color=ok?"var(--accent)":"var(--alert)";}};
  el.querySelectorAll(".filt .chip").forEach(b=>b.onclick=()=>{
    lineTab=b.dataset.l; lineSel=new Set(); lineText="";
    linePage="menu"; lineEdit=null; renderLine();});
  document.getElementById("lpm").onclick=()=>{stMonth=shiftMonth(stMonth,-1);renderLine()};
  document.getElementById("lnm").onclick=()=>{stMonth=shiftMonth(stMonth,1);renderLine()};

  if(lineTab==="set"){
    bindLineSet(el,msg);
  }else if(lineTab==="link"){
    document.getElementById("l-save").onclick=async()=>{
      db.line={oaId:document.getElementById("l-oa").value.trim()};
      await save(); msg("保存しました",true);
    };
    document.getElementById("l-pull").onclick=async()=>{
      msg("確認中…",true);
      try{ const r=await pullLinks(); await save(); renderLine();
        toast(`新たに連携 ${r.n}名／生年月日 ${r.b}名を取り込みました`); }
      catch(e){ msg("失敗："+e.message,false); }
    };
    document.getElementById("l-quota").onclick=async()=>{
      msg("確認中…",true);
      try{ const q=await relayGet("quota");
        msg(`今月 ${q.used} 通送信ずみ／上限 ${q.limit} 通（${q.type}）`,true); }
      catch(e){ msg("失敗："+e.message,false); }
    };
    el.querySelectorAll(".qrbtn").forEach(b=>b.onclick=async()=>{
      const c=db.customers.find(x=>x.id===b.dataset.id);
      if(!(db.line&&db.line.oaId)){ toast("先に公式アカウントのIDを保存してください"); return; }
      const box=document.getElementById("qr-"+c.id);
      if(box.innerHTML){ box.innerHTML=""; return; }
      lineCode(c); await save();
      try{ await relayGet("putcode",`&c=${c.id}&code=${c.linkcode}&name=${encodeURIComponent(c.name)}`); }
      catch(e){ toast("中継役に登録できませんでした："+e.message); }
      const q=qrcode(0,"M"); q.addData(lineUrl(c)); q.make();
      box.innerHTML=`<div class="qr">${q.createSvgTag(5,8)}</div>
        <p class="note">コード <b>${c.linkcode}</b>　読み取ると「登録 ${c.linkcode}」が入力された状態でトークが開きます。</p>`;
    });
  }else if(lineTab==="inbox"){
    const ta=document.getElementById("l-tpl");
    ta.oninput=()=>{lineText=ta.value};
    document.getElementById("l-tplsave").onclick=async()=>{
      db.tpl=Object.assign({},tpl,{migrate:ta.value}); lineText=""; await save(); msg("保存しました",true);
    };
    document.getElementById("i-cast").onclick=async()=>{
      if(!confirm(`友だち全員（約${db.customers.filter(c=>c.lineId).length||"220"}名）に一斉送信します。\n人数ぶんの通数を消費します。よろしいですか？`))return;
      msg("送信中…",true);
      try{ await relayGet("broadcast",`&text=${encodeURIComponent(ta.value)}`); msg("送信しました。返信が届いたら②を押してください",true); }
      catch(e){ msg("失敗："+e.message,false); }
    };
    document.getElementById("i-pull").onclick=async()=>{
      msg("確認中…",true);
      try{ window.__inbox=await pullInbox(); renderLine();
        toast(`未処理の返信 ${window.__inbox.length}件`); }
      catch(e){ msg("失敗："+e.message,false); }
    };
    el.querySelectorAll("[data-bind]").forEach(b=>b.onclick=async()=>{
      const i=+b.dataset.bind, x=(window.__inbox||[])[i];
      const cid=el.querySelector(`[data-sel="${i}"]`).value;
      if(!cid){ toast("名簿から選んでください"); return; }
      try{
        await bindLine(cid,x.userId);
        window.__inbox=window.__inbox.filter(y=>y.userId!==x.userId);
        renderLine(); renderList(); toast("結びつけました");
      }catch(e){ msg("失敗："+e.message,false); }
    });
  }else if(lineTab==="remind"){
    const ta=document.getElementById("l-tpl");
    ta.oninput=()=>{lineText=ta.value};
    const off=(db.line&&db.line.rmOffset)!==undefined?db.line.rmOffset:1;
    document.getElementById("r-off").onchange=async e=>{
      db.line=Object.assign({},db.line,{rmOffset:+e.target.value}); await save(); renderLine();
    };
    document.getElementById("l-tplsave").onclick=async()=>{
      db.tpl=Object.assign({},tpl,{remind:ta.value}); lineText=""; await save(); msg("保存しました",true);
    };
    const bodyText=a=>{
      const c=db.customers.find(x=>x.id===a.cid)||{name:a.name};
      return fill(ta.value,c,a);
    };
    el.querySelectorAll("[data-copy]").forEach(b=>b.onclick=async()=>{
      const a=db.appts.find(x=>x.id===b.dataset.copy);
      const ok=await copyText(bodyText(a));
      toast(ok?"文面をコピーしました":"コピーできませんでした。文面を長押しで選んでください");
    });
    el.querySelectorAll("[data-send]").forEach(b=>b.onclick=async()=>{
      const a=db.appts.find(x=>x.id===b.dataset.send);
      const c=db.customers.find(x=>x.id===a.cid);
      if(!confirm(`${c.name}様にLINEを送ります。通数を1通消費します。よろしいですか？`))return;
      try{ await lineSend([c.id],bodyText(a)); msg(`${c.name}様に送信しました`,true); }
      catch(e){ msg("失敗："+e.message,false); }
    });
    document.getElementById("r-sendall").onclick=async()=>{
      const list=remindList(off).filter(a=>{
        const c=db.customers.find(x=>x.id===a.cid); return c&&c.lineId&&!c.lineBlocked;});
      if(!list.length){ msg("LINE連携ずみの方がいません",false); return; }
      if(!confirm(`${list.length}名に送信します。通数を${list.length}通消費します。よろしいですか？`))return;
      msg("送信中…",true);
      try{
        for(const a of list) await lineSend([a.cid],bodyText(a));
        msg(`${list.length}名に送信しました`,true);
      }catch(e){ msg("失敗："+e.message,false); }
    };
  }else{
    const ta=document.getElementById("l-tpl");
    ta.oninput=()=>{lineText=ta.value};
    document.getElementById("l-all").onclick=()=>{lineSel=new Set(list.map(c=>c.id));renderLine()};
    document.getElementById("l-none").onclick=()=>{lineSel=new Set();renderLine()};
    document.getElementById("l-tplsave").onclick=async()=>{
      db.tpl=Object.assign({},tpl,{[lineTab]:ta.value}); lineText=""; await save(); msg("保存しました",true);
    };
    el.querySelectorAll("[data-ck]").forEach(x=>x.onclick=e=>{
      e.stopPropagation();
      const id=x.dataset.ck;
      if(lineSel.has(id)) lineSel.delete(id); else lineSel.add(id);
      renderLine();
    });
    el.querySelectorAll(".lrow").forEach(r=>r.onclick=()=>{
      const id=r.dataset.id;
      if(lineSel.has(id)) lineSel.delete(id); else lineSel.add(id);
      renderLine();
    });
    document.getElementById("l-send").onclick=async()=>{
      const ids=[...lineSel]; if(!ids.length){ toast("送る相手を選んでください"); return; }
      const t=ta.value;
      const personal=/{name}|{since}|{last}/.test(t);
      if(!confirm(`${ids.length}名に送信します。LINEの通数を${ids.length}通ぶん消費します。よろしいですか？`))return;
      msg("送信中…",true);
      try{
        if(personal){ for(const id of ids) await lineSend([id],fill(t,db.customers.find(c=>c.id===id))); }
        else await lineSend(ids,t);
        msg(`${ids.length}名に送信しました`,true); lineSel=new Set(); renderLine();
      }catch(e){ msg("失敗："+e.message,false); }
    };
  }
}


/* ---------- 分析 ---------- */
const RETAILWORD=["JOLEL","ワコナル","カニューレ","DEAD SEA","コフレ","パフ","バスソルト"];
let anTab="new";

function anBase(){
  const V={}, byCust={};
  db.customers.forEach(c=>{
    const v=visitsOf(c);
    if(v.length){ V[c.id]=v; byCust[c.id]=c; }
  });
  return {V,byCust};
}
function splitItems(k){
  return (k.menu+"／"+(k.goods||"")).split("／").filter(Boolean)
    .map(x=>x.replace(/×\d+$/,"").trim());
}
const isRetail=n=>RETAILWORD.some(r=>n.includes(r));
const ageOf=b=>(b&&!b.startsWith('0000'))?Math.floor((D(today())-D(b))/(365.25*86400000)):null;
const ageBand=a=>a==null?"不明":a<20?"10代":a<30?"20代":a<40?"30代":a<50?"40代":a<60?"50代":"60代〜";
const pct=(a,b)=>b?Math.round(a/b*100)+"%":"—";
const bar=(v,max)=>`<span class="bar" style="width:${max?Math.round(v/max*100):0}%"></span>`;

/* 月別 新規・来店・定着 */
function monthly(){
  const {V}=anBase();
  const first={}, vm={};
  Object.entries(V).forEach(([id,v])=>{
    first[id]=v[0];
    v.forEach(d=>{ const k=d.slice(0,7); (vm[k]=vm[k]||new Set()).add(id); });
  });
  return Object.keys(vm).sort().map(k=>{
    const newbies=Object.keys(first).filter(id=>first[id].slice(0,7)===k);
    const stay=newbies.filter(id=>V[id].length>=2).length;
    return {m:k, visits:vm[k].size, nw:newbies.length,
            repeat:vm[k].size-newbies.length, stay, newbies:newbies.length};
  });
}
/* 何回目で離れるか */
function retention(){
  const {V}=anBase();
  const cont={}, gap={};
  Object.values(V).forEach(v=>{
    for(let i=0;i<v.length;i++){
      cont[i+1]=(cont[i+1]||0)+1;
      if(v[i+1]) (gap[i+1]=gap[i+1]||[]).push(days(v[i],v[i+1]));
    }
  });
  const all=[].concat(...Object.values(gap));
  const overall=all.length?Math.round(all.reduce((a,b)=>a+b,0)/all.length):0;
  return {rows:Object.keys(cont).map(Number).filter(n=>n<=10).map(n=>{
    const g=gap[n]||[];
    return {n, reached:cont[n], next:cont[n+1]||0,
            avg:g.length?Math.round(g.reduce((a,b)=>a+b,0)/g.length):null};
  }), overall};
}
/* 年代別の人気メニュー */
function byAge(){
  const out={};
  db.charts.forEach(k=>{
    const c=db.customers.find(x=>x.id===k.cid); if(!c) return;
    const b=ageBand(ageOf(c.birth));
    out[b]=out[b]||{people:new Set(),menu:{}};
    out[b].people.add(c.id);
    splitItems(k).filter(n=>!isRetail(n)).forEach(n=>out[b].menu[n]=(out[b].menu[n]||0)+1);
  });
  return Object.entries(out).map(([band,v])=>({band,people:v.people.size,
    top:Object.entries(v.menu).sort((a,b)=>b[1]-a[1]).slice(0,4)}))
    .sort((a,b)=>b.people-a.people);
}
/* メニュー／物販の利用と再利用 */
function itemStats(retail){
  const t={};
  db.charts.forEach(k=>{
    const c=k.cid; if(!c) return;
    splitItems(k).filter(n=>isRetail(n)===retail).forEach(n=>{
      t[n]=t[n]||{n:0,people:{}};
      t[n].n++; t[n].people[c]=(t[n].people[c]||0)+1;
    });
  });
  return Object.entries(t).map(([name,v])=>{
    const ppl=Object.keys(v.people).length;
    const again=Object.values(v.people).filter(x=>x>=2).length;
    return {name, n:v.n, ppl, again, per:v.n/ppl, rate:ppl?again/ppl:0};
  }).sort((a,b)=>b.n-a.n);
}

/* ---------- Gmailからホットペッパーの予約を取り込む ---------- */
const tel10=t=>String(t||"").replace(/[^0-9]/g,"");
function matchCustomer(name,kana,tel){
  const t=tel10(tel);
  if(t){ const byTel=db.customers.find(c=>tel10(c.tel)&&tel10(c.tel)===t); if(byTel) return byTel; }
  const n=String(name||"").replace(/\s+/g,"");
  const byName=db.customers.filter(c=>c.name.replace(/\s+/g,"")===n);
  if(byName.length===1) return byName[0];
  if(byName.length>1&&kana){                       // 同姓同名はカナで絞る
    const k=db.customers.find(c=>byName.includes(c)&&c.kana&&c.kana.replace(/\s+/g,"")===kana);
    if(k) return k;
  }
  return byName[0]||null;
}
/* 起動時に静かに取り込む */
async function autoFetchMail(){
  const c=db.relay||{};
  if(!c.url||!c.key) return;   // v127：autofetch の既定をONにした（開いたら取り込む）
  try{
    const rows=(await fetchMail(c.days||30)).filter(x=>!x.dup);
    if(!rows.length) return;
    const r=applyMail(rows);
    await save(); renderList();
    if(document.getElementById("app").dataset.tab==="sched") renderSched();
    const bits=[];
    if(r.add) bits.push(`新しい予約${r.add}件`);
    if(r.upd) bits.push(`変更${r.upd}件`);
    if(r.cancel) bits.push(`取消${r.cancel}件`);
    if(r.newc) bits.push(`新規のお客様${r.newc}名`);
    if(bits.length) toast("予約メールから "+bits.join("／")+" を取り込みました");
  }catch(e){ /* 通信できないときは黙って見送る */ }
}
async function fetchMail(days){
  const j=await relayGet("mail",`&days=${days||14}`);
  return (j.mail||[]).map(x=>{
    const c=matchCustomer(x.name,x.kana,x.tel);
    const p=c?pace(c):null;
    const known=!!(p&&p.n>0);
    const row={...x, cid:c?c.id:null, cname:c?c.name:""};
    const a=findAppt(row);
    row.isNew=!known;
    row.tag=x.hpbNew?(known?"HPB新規・当店再来":"新規"):(known?"再来":"新規");
    row.diff=a&&x.kind!=="cancel"?diffOf(a,x):[];
    row.dup=!!a&&x.kind!=="cancel"&&!row.diff.length;
    row.act=x.kind==="cancel"?(a?"取消":"該当なし")
           :a?(row.diff.length?"変更":"取込ずみ"):"新しい予約";
    return row;
  });
}
function findAppt(x){
  if(x.resNo){ const a=db.appts.find(y=>y.resNo===x.resNo); if(a) return a; }
  if(x.id){ const a=db.appts.find(y=>y.mailId===x.id); if(a) return a; }
  // 予約番号がないメール用：同じ人・同じ日
  return db.appts.find(y=>y.src==="HPB"&&y.date===x.date&&
    (x.cid?y.cid===x.cid:y.name===x.name))||null;
}
function diffOf(a,x){
  const d=[];
  if(a.date!==x.date) d.push(`日付 ${a.date.slice(5)}→${x.date.slice(5)}`);
  if(a.start!==x.start) d.push(`時刻 ${a.start}→${x.start}`);
  if(x.minutes&&a.dur!==x.minutes) d.push(`所要 ${a.dur}→${x.minutes}分`);
  if(x.menu&&a.menu!==x.menu) d.push("メニュー変更");
  return d;
}
function applyMail(rows){
  let add=0,upd=0,cancel=0,newc=0,revive=0;
  rows.forEach(x=>{
    const exist=findAppt(x);
    if(x.kind==="cancel"){
      if(exist){ exist.status="cancel"; exist.mailId=x.id; cancel++; }
      return;
    }
    let c=x.cid?db.customers.find(y=>y.id===x.cid):null;
    if(!c&&exist) c=db.customers.find(y=>y.id===exist.cid);
    if(!c){
      c={id:uid(),name:x.name||"（名前不明）",kana:x.kana||"",tel:x.tel||"",
         birth:"",first:x.date,tags:"HPB",addr:"",caution:"",memo:""};
      db.customers.push(c); newc++;
    }
    /* ---------- 人が直した欄は上書きしない（v158） ----------
       利用者の指摘：**「ホットペッパーでメニューを決めて予約しても、来店して急に
       メニューを変更した場合、修正できない状態」**

       原因はここ。`menu:x.menu||…` で**メールの値がいつも勝つ**ようにしていた。
       「アプリを開いたときに自動で読み込む」を入れていると、直しても
       **開き直すたびに元のメニューに戻る**。それで「修正できない」になっていた。

       予約の編集で人が変えた欄は `a.edited` に印が付く（v158）。印のある欄は
       メールで上書きしない。★ 予約番号（resNo）や取消は今までどおりメールが正。 */
    const ed=(exist&&exist.edited)||{};
    const keep=(f,v)=>(exist&&ed[f])?exist[f]:v;
    const o={cid:c.id, name:c.name, date:keep("date",x.date), start:keep("start",x.start),
      dur:keep("dur",x.minutes||(exist?exist.dur:60)),
      staff:keep("staff",/川口/.test(x.staff)?"川口香子":/水野/.test(x.staff)?"水野奈津子":(exist?exist.staff:STAFF[0])),
      kind:keep("kind",x.isNew?"新規":"再来"),
      menu:keep("menu",x.menu||(exist?exist.menu:"")), src:"HPB",
      price:x.price||0, kana:x.kana||"", hpbNew:!!x.hpbNew,
      note:keep("note",x.note||(exist?exist.note:"")), allday:false,
      mailId:x.id, resNo:x.resNo, status:""};
    if(x.kana&&!c.kana) c.kana=x.kana;
    if(exist){ if(exist.status==="cancel") revive++; Object.assign(exist,o); upd++; }
    else { db.appts.push(Object.assign({id:uid(),created:nowStamp()},o)); add++; }
  });
  return {add,upd,cancel,newc,revive};
}

        if(!target.length){
          msg("反映するものがありません。読み取った予約はすべてスケジュールに入っています（入れ直すなら下のチェックを入れてください）",false);
          return;
        }
        btn.disabled=true; btn.textContent="反映中…";
        try{
          const r=applyMail(target);
          await save(); renderList(); renderSched();
          const bits=[];
          if(r.add) bits.push(`新しい予約 ${r.add}件`);
          if(r.upd) bits.push(`変更 ${r.upd}件${r.revive?`（うち取消からの復活${r.revive}件）`:""}`);
          if(r.cancel) bits.push(`取消 ${r.cancel}件`);
          if(r.newc) bits.push(`新しいお客様 ${r.newc}名`);
          const t=bits.length
            ? `スケジュールに反映しました：${bits.join("／")}。スケジュールタブで確認できます`
            : "反映しましたが、変わったところはありませんでした（すでに同じ内容が入っています）";
          msg(t,!!bits.length); toast(t);
          btn.textContent="反映しました";
        }catch(e){
          btn.disabled=false; btn.textContent="スケジュールに反映する";
          msg("反映できませんでした："+e.message,false);
          console.error(e);
        }
      };
    }catch(e){ msg("失敗："+e.message,false); }
  };
  document.getElementById("m-raw").onclick=async()=>{
    msg("取得中…",true);
    try{ const j=await relayGet("mailraw","&days=30");
      document.getElementById("m-list").innerHTML=(j.raw||[]).map(r=>
        `<div class="sheet"><b>${esc(r.subject)}</b>
         <p class="note">${esc(r.from)}</p>
         <pre class="raw">${esc(r.body)}</pre></div>`).join("")
        ||"<p class='note'>メールが見つかりませんでした</p>";
      msg("この本文をそのままClaudeに貼れば、読み取りを合わせられます",true);
    }catch(e){ msg("失敗："+e.message,false); }
  };
}

/* ---------- csv ---------- */
function csv(rows,name){
  const body=rows.map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\r\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob(["\uFEFF"+body],{type:"text/csv"}));
  a.download=name; a.click(); URL.revokeObjectURL(a.href);
}

/* ソースに焼き込んだ Squareの名簿の写し（202名・撮った日は不明）を入れる。
   **まっさらな端末で最初に開いたときだけ**使う。
   v99まではfooterに「Squareの名簿を取り込む」というボタンで出していたが、
   名前に反して Square と通信しておらず「押したから同期された」と誤解を招くので消した。
   Squareと突き合わせたいときは 連携→お客様の照合（`renderCustSync`）を使うこと */
function importSeed(){
  const key=c=>(c.name||"")+"|"+(c.tel||"");
  const have=new Set(db.customers.map(key));
  let n=0;
  SEED.forEach(([fam,giv,tel,birth,addr,tag])=>{
    const o={id:uid(),name:(fam+giv).trim(),kana:"",tel,birth,first:"",tags:tag,addr,caution:"",memo:""};
    if(have.has(key(o))) return;
    have.add(key(o)); db.customers.push(o); n++;
  });
  return n;
}

/* ---------- 開いたら勝手に最新にする（v127） ----------
   利用者の指示：「アプリを開けたら同期してくれたらボタンは要らない。
   電波が悪くて同期できなかったときのためにホームのボタンだけ残せばよい」。

   ★ v101で自動更新を入れ、**v104で利用者の指示で外した**経緯がある（「手動で更新する」）。
     v127で**方針が変わって戻した**。次に触る人が「また外れている」と勘違いしないよう明記しておく。

   弊害の検討（入れる前に確かめたこと）：
   ・二重にならないか … `syncOrders` は売上を差し替え、カルテは決済ID、現金も決済IDで判定する。
     何度呼んでも増えない
   ・過去の月が勝手に変わらないか … **取りに行くのは今月だけ。** 締めた月は触らない
   ・起動が遅くならないか … 画面を先に出してから裏で走らせる（await しない）
   ・通信できないとき … 黙って諦める。ホームの「アプリを最新にする」で手で押せる
   ・名簿や商品が勝手に増えないか … 照合は**結果を作るだけ**。反映は人が押す（v99・v108の方針のまま） */
async function autoSyncOnOpen(){
  if(!relayUrl("ping")) return;              // 中継役が未設定なら何もしない
  try{
    const m=today().slice(0,7);
    sqAuto.busy=true; renderHome();
    const r=await syncSquareMonth(m);
    try{
      if(r.menuList&&r.menuList.length){
        prodSync=prodMatch(r.menuList); prodPick={}; prodAdd={};
        prodSync.sqOnly.forEach(x=>{ prodAdd[x.sqid]=true; });
        prodView=prodSync.near.length?"near":(prodSync.sqOnly.length?"sqonly":"hit");
      }
      const jc=await relayGet("customers");
      custSync=custMatch(jc.customers||[]); custPick={};
      custView=custSync.near.length?"near":(custSync.sqOnly.length?"sqonly":"hit");
      await nameNolink(jc.customers||[]);   // v156：名簿にいない方の名前を控えに書く
    }catch(e){}
    sqAuto.at=nowStamp(); sqAuto.n=r.orders; sqAuto.err=""; sqAuto.busy=false;
    repaintAfterSync();
  }catch(e){
    sqAuto.busy=false; sqAuto.err=e.message||"通信できません";
    renderHome();
  }
}
