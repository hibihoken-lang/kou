/* 仕入先ごとのメールの探し方（v85）。
   既定の探し方は本文にその言葉が入っているメールを全部拾ってしまうので、
   一覧の「この差出人だけにする」で差出人を覚えさせて絞り込めるようにした。
   覚えた内容は db.buymail に残る（仕入先ごと） */
function buyMailCfg(src){
  if(!db.buymail) db.buymail={};
  if(!db.buymail[src]) db.buymail[src]={from:"",days:30};
  return db.buymail[src];
}
const BUYQ={NBS:"NBS OR エヌビーエス",ミラビス:"ミラビス OR mirabis"};
function buyMailQuery(src){
  const c=buyMailCfg(src);
  return c.from?`from:(${c.from})`:(BUYQ[src]||src);
}
/* すでに読み込んだメール。取り込みずみ（db.buys）と仕分け待ち（db.buydrafts）の両方を見る。
   取り消せば履歴から消えるので、そのメールはまた出てくる */
function buyMailDone(){
  const s=new Set();
  (db.buys||[]).forEach(b=>{ if(b.mailId) s.add(b.mailId); });
  (db.buydrafts||[]).forEach(d=>{ if(d.mailId) s.add(d.mailId); });
  return s;
}
let buyMailAll=false;      // 読み込みずみも出すか

/* 中継役ごしに仕入れメールを探す */
async function findBuyMail(){
  const out=document.getElementById("by-mailout");
  if(!out) return;
  const src=buySrc, cfg=buyMailCfg(src);
  const q=buyMailQuery(src);
  out.innerHTML=`<p class="note">メールを探しています…</p>`;
  try{
    const j=await relayGet("findmail",
      `&q=${encodeURIComponent(q)}&days=${cfg.days||30}&max=20`);
    const all=j.mails||[];
    const done=buyMailDone();
    const fresh=all.filter(m=>!done.has(m.id));
    const ms=buyMailAll?all:fresh;
    const nDone=all.length-fresh.length;

    const head=`<div class="sheet" style="margin:10px 0">
      <div class="grid">
        <div><label class="f" for="bm-days">いつまでさかのぼるか</label>
          <select class="f-in" id="bm-days">
            ${[[1,"今日"],[3,"3日以内"],[7,"1週間以内"],[30,"1か月以内"],[90,"3か月以内"]].map(([d,l])=>
              `<option value="${d}"${d===(cfg.days||30)?" selected":""}>${l}</option>`).join("")}
          </select></div>
        <div><label class="f" for="bm-from">差出人でしぼる（${esc(src)}）</label>
          <input class="f-in" id="bm-from" value="${esc(cfg.from)}" placeholder="例：order@nbs.co.jp"></div>
      </div>
      <p class="note" style="margin:8px 0 0">${cfg.from
        ? `いまは <b>${esc(cfg.from)}</b> から届いたメールだけを探しています。`
        : `いまは本文に「${esc(q)}」が入っているメールを探しています。
           <b>${esc(src)}からのメールだけにしたい</b>ときは、下の一覧で目的のメールの
           「この差出人だけにする」を押してください。`}</p>
      <div class="actions">
        <button class="btn quiet" id="bm-go">この条件でもう一度探す</button>
        ${cfg.from?`<button class="btn ghost" id="bm-clear">差出人のしぼり込みをやめる</button>`:""}
      </div>
      <label style="display:block;margin-top:10px;font-size:12px;color:var(--ink2);cursor:pointer">
        <input type="checkbox" id="bm-all"${buyMailAll?" checked":""}>
        読み込みずみのメールも出す${nDone?`（いま${nDone}件かくれています）`:""}</label>
    </div>`;

    if(!ms.length){
      out.innerHTML=head+`<p class="note">${all.length
        ? `見つかった${all.length}件は<b>すべて読み込みずみ</b>でした。新しい仕入れはありません。`
        : `この条件では見つかりませんでした。期間を広げるか、差出人のしぼり込みを見直してください。`}</p>`;
      bindMailBox(); return;
    }

    out.innerHTML=head+`<div class="sheet" style="margin:10px 0">
      <p class="note" style="margin:0 0 10px">${ms.length}件${
        nDone&&!buyMailAll?`（読み込みずみの${nDone}件はのぞいてあります）`:""}。
        取り込みたいものの「これを読み取る」を押してください。</p>
      ${ms.map((mm,i)=>{
        const dup=done.has(mm.id);
        return `<div style="border-top:1px solid var(--line);padding:10px 0">
        <b style="font-size:13px">${dup?'<span class="kb" style="background:var(--ink3)">読込ずみ</span>':""}${
          esc(mm.subject||"（件名なし）")}</b>
        <div style="font-size:11px;color:var(--ink3)">${esc(mm.received||"")}　${esc(mm.from||"")}
          ${mm.from?`<button class="cbmini" data-only="${i}" style="margin-left:6px">この差出人だけにする</button>`:""}</div>
        ${(mm.attachments||[]).map((a,k)=>`<div style="margin-top:6px;font-size:12px">
          添付：${esc(a.name)}（${Math.round((a.size||0)/1024)}KB）
          ${a.text?`<button class="cbmini" data-mail="${i}" data-att="${k}">これを読み取る</button>`
            :/\.pdf$/i.test(a.name||"")
              ?`<br><span style="color:var(--ink3)">中継役はPDFの中身を返せません。
                 このPDFをパソコンに保存して、上の<b>「伝票を添付する」</b>から読み込んでください
                 （アプリはPDFを読めます）。</span>`
              :`<span style="color:var(--ink3)">この形式は読めません</span>`}</div>`).join("")}
        <div style="margin-top:6px"><button class="cbmini" data-mail="${i}" data-att="-1">本文を読み取る</button></div>
        <pre class="raw" style="max-height:140px;margin-top:6px">${esc((mm.body||"").slice(0,1200))}</pre>
      </div>`;}).join("")}
      <p class="note">読めなかったときは、この本文をそのまま伝えてもらえれば書式に合わせて読めるようにします。</p>
    </div>`;

    bindMailBox();
    out.querySelectorAll("[data-only]").forEach(b=>b.onclick=async()=>{
      // 差出人の「＜ ＞」の中だけを取り出して覚える
      const f=String(ms[+b.dataset.only].from||"");
      const m=f.match(/<([^>]+)>/);
      cfg.from=(m?m[1]:f).trim();
      await save(); findBuyMail();
    });
    out.querySelectorAll("[data-mail]").forEach(b=>b.onclick=async()=>{
      const mm=ms[+b.dataset.mail], k=+b.dataset.att;
      const txt=k<0?mm.body:(mm.attachments[k]||{}).text;
      if(!txt){ toast("読み取れる中身がありません"); return; }
      const nd=startBuyDraft(src,txt,k<0?mm.subject:mm.attachments[k].name,txt,mm.id);
      if(nd){
        await save(); renderBuy();     // startBuyDraft がその伝票を開いている
      }else{
        // 読めなかったときは、その理由と本文をこの場に出す。
        // 本文をそのまま伝えてもらえれば、書式に合わせて読めるようにできる
        out.innerHTML=`<div class="sheet" style="margin:10px 0;border-color:var(--alert)">
          <p class="note" style="margin:0;color:var(--alert)">${esc(buyReadMsg||"明細を読み取れませんでした")}</p>
          <p class="note">下の本文をまるごとコピーして渡してください。</p>
          <pre class="raw" style="max-height:260px">${esc(txt)}</pre>
          <div class="actions"><button class="btn ghost" id="by-back">メール一覧にもどる</button></div>
        </div>`;
        buyReadMsg="";
        document.getElementById("by-back").onclick=()=>findBuyMail();
      }
    });
  }catch(e){
    const m=e.message||"";
    const old=/action ?を指定/.test(m);
    // Gmailを読む許可がまだのときのエラー。中継役の doGet は全体が try/catch なので
    // 権限エラーでも実行ログは「完了」になり、ここに error JSON だけが返ってくる。
    // 中継役を貼り直しても直らないので、承認のやり方をそのまま出す
    const auth=/権限|許可|承認|authoriz|permission|scope|PERMISSION_DENIED|ScriptError|GmailApp/i.test(m);
    out.innerHTML=`<p class="note" style="color:var(--alert)">失敗：${esc(m)}</p>${
      auth?`<div class="sheet" style="margin:10px 0;border-color:var(--alert)">
        <b style="font-family:var(--min);font-size:13px">Gmailを読む許可がまだのようです</b>
        <p class="note" style="margin:8px 0 0">中継役を貼り直しても直りません。次の手順で1回だけ承認してください。<br>
        ① Apps Script の「salon de kou 中継」を開く<br>
        ② 関数の一覧から <b>仕入れメールを見る</b> を選んで「実行」<br>
        ③ 出てきた同意画面で、自分のGoogleアカウントを選んで許可する<br>
        ④ この画面に戻って、もう一度「メールから探す」を押す<br>
        承認したあとの再デプロイは要りません。</p></div>`
      :old?`<p class="note" style="color:var(--alert)"><b>中継役が古いままです。</b>
        square-relay_8.gs を Apps Script に貼って、
        「デプロイを管理」から新バージョンでデプロイし直してください。</p>`:""}`;
  }
}

/* 探し方の設定まわりのボタン。一覧が空のときも出すので別関数にしてある */
function bindMailBox(){
  const cfg=buyMailCfg(buySrc);
  const days=document.getElementById("bm-days");
  if(days) days.onchange=async e=>{ cfg.days=+e.target.value; await save(); findBuyMail(); };
  const from=document.getElementById("bm-from");
  if(from) from.onchange=async e=>{ cfg.from=e.target.value.trim(); await save(); findBuyMail(); };
  const go=document.getElementById("bm-go");
  if(go) go.onclick=()=>findBuyMail();
  const cl=document.getElementById("bm-clear");
  if(cl) cl.onclick=async()=>{ cfg.from=""; await save(); findBuyMail(); };
  const all=document.getElementById("bm-all");
  if(all) all.onchange=e=>{ buyMailAll=e.target.checked; findBuyMail(); };
}

      <tbody>${matRows.map(([id,q])=>`<tr><th>${esc(nm(id))}</th><td class="hi">${q}</td>

        「カルテの使用材料を集計して反映」を押すと合わせられます。<br>
        <b>この欄は在庫の数を合わせるためだけのものです。</b>
        材料の原価は上の「カルテで選んだぶん」から出しているので、
        押しても押さなくても原価は変わりません（v130で二重計上をやめました）。</p>`
    :`<p class="note">この月のカルテに使用材料の記録がありません。

  document.getElementById("cl-gapply").onclick=async()=>{
    const g=chartGiftCost(stMonth), p=chartCampCost(stMonth);
    const t={};
    Object.entries(g.qty).forEach(([id,q])=>t[id]=(t[id]||0)+q);

    if(!confirm(`在庫表の「プレゼント」欄を、カルテのぶん（${Object.keys(t).length}品目）で上書きします。よろしいですか？`))return;
    Object.entries(t).forEach(([id,q])=>{ cell(stMonth,id).gift=q; });
    await save(); renderClose(); toast("在庫に反映しました");
  };
  document.getElementById("mi-save").onclick=async()=>{
    db.mimi={cat:document.getElementById("mi-cat").value.trim(),
             unit:+document.getElementById("mi-unit").value||0,

  document.getElementById("cl-pm").onclick=()=>{stMonth=shiftMonth(stMonth,-1);renderClose()};
  document.getElementById("cl-nm").onclick=()=>{stMonth=shiftMonth(stMonth,1);renderClose()};
  document.getElementById("cl-apply").onclick=async()=>{
    const ids=Object.keys(c.mat);
    if(!ids.length){ toast("反映する材料がありません"); return; }
    if(!confirm(`材料${ids.length}品目を在庫の「販売」欄に反映します。よろしいですか？`))return;
    ids.forEach(id=>cell(stMonth,id).sold=c.mat[id]);
    await save(); renderClose(); toast("反映しました");

/* ---------- 中継役ごしのSquare連携 ---------- */
function relayUrl(action,extra){
  /* v132：設定は端末ごと（conf）に持つ。古い版のデータに残っている db.relay も見る */
  const s=(conf&&conf.url&&conf.key)?conf:(db.relay||{});
  if(!s.url||!s.key) return null;
  return s.url+(s.url.includes("?")?"&":"?")+"key="+encodeURIComponent(s.key)
    +"&action="+action+(extra||"");
}
async function relayGet(action,extra){
  const u=relayUrl(action,extra);
  if(!u) throw new Error("連携設定がまだです");
  const r=await fetch(u);
  const j=await r.json();
  if(j.error) throw new Error(j.error);
  return j;
}
/* 大きいもの（写真）は URL に載らないので POST で送る（v192）。
   ★ ヘッダーを付けないこと。`Content-Type` を付けるとブラウザが先に OPTIONS を
     聞きに行き、Apps Script はそれに答えられないので通らなくなる（v132で踏んだ） */
async function relayPost(action,body){
  const u=relayUrl(action);
  if(!u) throw new Error("連携設定がまだです（連携タブの連携設定）");
  const r=await fetch(u,{method:"POST",body:JSON.stringify(body)});
  const j=await r.json();
  if(j.error) throw new Error(j.error);
  return j;
}

/* ---------- Squareの販売数を在庫の「販売」欄に入れる（v131） ----------
   利用者の指示：**商品はすべてSquareからの連携で反映すれば、かなり正確に在庫を管理できる。
   単品購入も履歴に残し、そこから原価計算に足して月締めできるようにしたい。**

   `syncOrders` は前から「何がいくつ売れたか」を数えていたが、それを在庫へ書き込むのは
   連携タブの手押しボタンだった。**そのボタンは v126 の入口整理で画面から消えていた**
   （関数だけ残って押す場所が無い）。だから物販原価（在庫の販売数×原価）は手打ち頼みで、
   2026年7月に 70,558 を手入力していたのはこれが理由。ここで自動につないだ。

   ★ 方針をひとつ変えている。CLAUDE.md の v101 メモにあった
   「在庫の『販売』とメニュー追加だけは手押しのまま（勝手に在庫を動かさない）」のうち、
   **『販売』欄だけ自動にした。** メニュー追加は今までどおり手押し（勝手に増えると困るため）。

   ★ 上書きであって足し込みではない。何度取り込んでも二重にならない。
   その月の**物販**は Square を唯一の出どころにするので、いったん0に戻してから入れ直す
   （返金で売上が消えた商品も正しく0になる）。**材料と消耗品には触らない**
   （材料の消費はSquareに出てこないため）。

   ★ v128の棚卸しとの噛み合わせ：数え終わったあとに販売数が変わると帳簿の月末がずれる。
   そこで**数えた実数（cnt）は残したまま、差（loss）を計算し直す**。
   こうすると「数えた」という事実は消えず、差だけが今の帳簿に合う。 */
/* v134：カルテの物販欄で**手で足したぶん**を月ごとに数える。
   Squareから来た行（sq）は数えない。db.sqsold（Squareぶん）と足しても二重にならない */
function manualSold(m){
  const t={};
  (db.charts||[]).forEach(k=>{
    if(String(k.date||"").slice(0,7)!==m) return;
    (k.sales||[]).forEach(x=>{ if(!x||!x.pid||x.sq) return; t[x.pid]=(t[x.pid]||0)+(+x.qty||1); });
  });
  return t;
}
/* その月の物販の「販売」欄を入れ直す（Squareぶん ＋ カルテで手入力したぶん）。
   ★足し込みではなく入れ直し。何度呼んでも二重にならない */
function applySold(months){
  let n=0;
  (months||[]).forEach(m=>{
    const sq=(db.sqsold||{})[m]||{}, man=manualSold(m);
    db.products.forEach(p=>{
      if(p.kind!=="物販") return;                 // 材料・消耗品はSquareでは追えない
      const q=Math.round(+sq[p.id]||0)+Math.round(+man[p.id]||0);
      const c=cell(m,p.id);
      if((+c.sold||0)===q) return;
      c.sold=q; n++;
      // 棚卸しずみなら、数えた実数はそのままに差を計算し直す
      if(c.cntAt&&!(c.cnt===undefined||c.cnt===null||c.cnt==="")) c.loss=bookQty(c)-(+c.cnt||0);
    });
  });
  return n;
}
/* Squareで売れた数を控えてから、その月を入れ直す。
   ★控え（db.sqsold）を残すのは、あとでカルテに物販を1件足したときに、
     Squareを取り込み直さなくても「Squareぶん＋手入力ぶん」を計算し直せるようにするため */
function applySquareSold(soldM){
  if(!db.sqsold) db.sqsold={};
  const ms=Object.keys(soldM||{});
  ms.forEach(m=>{ db.sqsold[m]=soldM[m]||{}; });
  return applySold(ms);
}
/* カルテを保存したあと、その月の在庫の販売数を入れ直す（v134）。
   ★Squareを取り込んだことのある月だけ触る。取り込んでいない月まで入れ直すと、
     在庫の画面で手入力した販売数を消してしまう */
function syncKarteSales(date){
  const m=String(date||"").slice(0,7);
  if(!m||!db.sqsold||db.sqsold[m]===undefined) return 0;
  return applySold([m]);
}
/* カルテの「使用・販売商品」の文字列を組み立てる（v134）。
   ★`goods` は今までどおり正本。購入履歴（purchases）も見出し（karteTitle）もここを読むので、
     物販の欄で選んだものを「名前×個数」で足しておく */
function goodsText(text,sales){
  const parts=String(text||"").split("／").map(s=>s.trim()).filter(Boolean);
  (sales||[]).forEach(x=>{
    const p=db.products.find(y=>y.id===x.pid); if(!p) return;
    const s=p.n+((+x.qty||1)>1?"×"+(+x.qty||1):"");
    const kn=MNORM(p.n);
    // Squareの品名（「ミラビス【定期】」など）に、アプリの商品名が含まれていたら足さない。
    // 同じ品が2つ並んで見えるのを防ぐ（v146）
    if(!parts.some(v=>MNORM(v)===MNORM(s)||(kn&&MNORM(v).includes(kn)))) parts.push(s);
  });
  return parts.join("／");
}
/* その品名がSquareの「オプション」カテゴリかどうか（v134）。
   見分けはカタログの控え（db.sqcat）。まだ控えが無ければメニュー一覧のカテゴリで見る */
function isOptName(n){
  const k=MNORM(String(n||"").replace(/×\d+$/,""));   // 「◯◯×2」の×2を外してから見る
  if(!k) return false;
  const c=((db.sqcat||{}).map||{})[k];
  if(c) return OPTCAT(c.cat);
  const m=MENUS().find(x=>MNORM(x.n)===k);
  return !!(m&&OPTCAT(m.cat));
}

/* 注文を取り込んでカルテ・在庫の販売数に反映 */
async function syncOrders(from,to,opt){
  // カタログ（商品カテゴリと、施術か物販か）を**先に**控える。
  // これが無いと明細をカテゴリでまとめられない。取れなくても取り込みは止めない。
  // ★v134：オプションかどうかの見分け（db.sqcat のカテゴリ）を使ってカルテを分けるので、
  //   注文より先に取っておく必要がある。これが「オプションもSquareと一緒に同期する」の中身
  let cats=0, menuList=null;
  // 自動更新（v101）はここを飛ばす。カタログは毎分変わらないし、通信を倍にしたくない
  if(!opt||opt.cat!==false) try{
    const jm=await relayGet("menu");
    const map={};
    (jm.menu||[]).forEach(x=>{ if(!x.name) return;
      map[MNORM(x.name)]={n:x.name,cat:x.cat||"",r:!!x.retail,p:Math.round(+x.price||0)}; });
    if(Object.keys(map).length){ db.sqcat={at:today(),map}; cats=Object.keys(map).length; }
    menuList=jm.menu||[];   // v126：同じものを商品の照合でも使う（通信を増やさない）
  }catch(e){ /* カタログが取れなくても売上の取り込みは済んでいる */ }
  const j=await relayGet("orders",`&from=${from}&to=${to}`);
  const bySq={}, byName={};
  db.customers.forEach(c=>{ if(c.sqid) bySq[c.sqid]=c; byName[c.name]=c; });
  const byChart={};
  db.charts.forEach(k=>{ if(k.sqid) byChart[k.sqid]=k; });
  // v131：売れた数は **月ごと** に持つ。在庫の「販売」欄へ自動で入れるため。
  // 取り込んだ期間の月は、売れたものが1つも無くても**空の枠を作っておく**。
  // そうしないと「返金で売上が消えた月」の販売欄が前の数字のまま残る
  const sold={}, soldM={}, newMenus={};
  for(let mm=(from||"").slice(0,7); mm&&mm<=(to||"").slice(0,7); mm=shiftMonth(mm,1)) soldM[mm]={};
  // 名簿と結びつかずカルテにならなかった決済（v102）。
  // 売上には数えているが誰のぶんか分からない。黙って埋もれさせず、月ごとに控えて画面で知らせる
  const nolinkIds=new Set();
  let added=0, merged=0, nocust=0, cash=0, cashUpd=0, fixed=0, refunded=0, retYen=0;
  (j.orders||[]).forEach(o=>{
    o.items.forEach(li=>{
      // v108：まずSquareのID（バリエーション）で引く。結んでいない品だけ品名で当てる。
      // 以前は `li.name.startsWith(x.n)` まで見ていたので、「ステム」が「ステムセラム」に
      // 当たるような取り違えが起きえた。IDで引けるものはIDだけで決める
      const p=prodBySq(li.sqid,li.name);
      if(p){
        sold[p.id]=(sold[p.id]||0)+li.qty;
        const mm=(o.date||"").slice(0,7);
        if(mm){ (soldM[mm]=soldM[mm]||{})[p.id]=(soldM[mm][p.id]||0)+li.qty; }
        return;
      }
      // Squareで新しく作られたメニューをここで拾う
      if(li.name&&!MENUS().some(y=>MNORM(y.n)===MNORM(li.name)))
        newMenus[li.name]=Math.round((li.amount||0)/(li.qty||1));
    });
    const cashAmt=Math.round(o.cash||0);
    const c=bySq[o.cust];
    // 現金は「カルテになったかどうか」と切り離して必ず控える。
    // お客様が名簿と結びつかない決済でも現金は動いているので、
    // ここで見送るとSquareの売上レポートと出納帳が合わなくなる
    if(cashAmt){
      const prev=db.cashbook.sq[o.sqid];
      if(!prev||prev.amt!==cashAmt||prev.cid!==(c?c.id:null)) cashUpd++;
      db.cashbook.sq[o.sqid]={date:o.date,amt:cashAmt,cid:c?c.id:null};
      cash+=cashAmt;
    }
    // 取り込みずみのカルテは**金額も入れ直す**（v104）。
    // Squareで返金するとその注文の合計（net_amounts）が下がるが、v103まではカルテを
    // 作ったときの金額のまま置き去りにしていた。そのため「一覧のSquareぶん」だけが
    // 返金前の金額で残り、タイル（Squareの数字）と食い違っていた。
    // ※ 前の月の注文を返金したときは、その月を取り込み直さないと直らない
    const ret=+o.ret||0;
    if(ret){ refunded++; retYen+=ret; }
    // v160：割引。金額（discount）は中継役 v9 から返っている。
    // 名前つきの内訳（discounts）は**中継役 v18 から**。無ければ金額だけ控える
    const dsc=Math.round(+o.discount||0);
    const dscs=(Array.isArray(o.discounts)?o.discounts:[])
      .map(d=>({name:String((d&&d.name)||""),amount:Math.round(+((d&&d.amount))||0)}))
      .filter(d=>d.name||d.amount);
    // v131：商品かどうかの見分けを **売れた数の集計と同じ `prodBySq`** にそろえた。
    // v134：施術の明細を「メニュー」と「オプション」に分け、買った商品は行（sales）にもする。
    //   見分けはSquareのカタログのカテゴリ。**オプションのカテゴリに入っている品目がオプション**
    const gd=o.items.filter(li=>!!prodBySq(li.sqid,li.name));
    const sv=o.items.filter(li=>!gd.includes(li));
    const nm=x=>x.name+(x.qty>1?"×"+x.qty:"");
    const opts=sv.filter(x=>isOptName(x.name)).map(nm);
    const menus=sv.filter(x=>!isOptName(x.name)).map(nm);
    const sales=gd.map(li=>({pid:prodBySq(li.sqid,li.name).id,qty:+li.qty||1,sq:true}));
    const old=byChart[o.sqid];
    if(old){
      old.cash=cashAmt;
      // v160：割引も入れ直す（金額も名前も）。Squareで割引を付け直したら追随する
      if(dsc) old.disc=dsc; else if(old.disc!==undefined) delete old.disc;
      if(dscs.length) old.discs=dscs; else if(old.discs!==undefined) delete old.discs;
      if(ret) old.ret=ret; else if(old.ret!==undefined) delete old.ret;
      if((+old.price||0)!==(+o.total||0)){ old.price=+o.total||0; fixed++; }
      // v134：前に取り込んだカルテにも内訳を入れておく（取り込み直せば埋まる）。
      // ★人が直したメニュー欄は上書きしない。内訳が無いものだけ埋める
      if(!Array.isArray(old.menus)){ old.menus=menus; old.opts=opts; }
      if(!Array.isArray(old.sales)&&sales.length) old.sales=sales;
      return;
    }
    if(!c){ nocust++; nolinkIds.add(o.sqid); return; }
    /* ---------- 手で書いたカルテがあれば、それを格上げする（v188） ----------
       利用者の問い：**「連携のカルテの『重複を片付ける』いるか？今後も重複する想定は
       考えられないよな？必要ないなら消して」**

       調べたら **1本だけ道が残っていた**。
       「川口さんが施術のあと手でカルテを書く → そのあとSquareを取り込む」と、
       Squareぶんが**もう1件**できていた（`sqid` でしか重複を見ていなかったため）。
       いまのデータ1,075件・27か月に重複は0組だが、道が開いている以上また起きる。

       **知らせて片づける作りより、そもそも2件目を作れない作りのほうが強い**（v152と同じ考え）。
       同じ日・同じお客様の手入力カルテがあれば、新しく作らずに**そのカルテをSquareのものにする**。
         Squareが正 … 金額・現金・品名（メニュー／オプション／物販）・割引・返金・sqid
         手書きは残す … 覚え書き・部位・機器・出力・ショット数・肌の状態・次回・材料・
                       プレゼント・キャンペーン・写真
       ★ 手で書いたメニューと物販の文字がSquareと違うときは、**覚え書きの先頭に残す**（消さない）。
       これで「カルテの重複を片づける」画面が要らなくなったので外した。 */
    const hand=db.charts.find(x=>x.cid===c.id&&x.date===o.date&&x.src!=="square"&&!x.sqid);
    if(hand){
      const keep=[];
      const sqMenu=joinMenu(menus,opts), sqGoods=gd.map(nm).join("／");
      if(hand.menu&&MNORM(hand.menu)!==MNORM(sqMenu)) keep.push(hand.menu);
      if(hand.goods&&MNORM(hand.goods)!==MNORM(sqGoods)) keep.push(hand.goods);
      if(keep.length) hand.note=(keep.join(NL)+(hand.note?NL+hand.note:"")).trim();
      hand.src="square"; hand.sqid=o.sqid; hand.price=o.total; hand.cash=cashAmt;
      hand.menu=sqMenu; hand.menus=menus; hand.opts=opts; hand.goods=sqGoods;
      if(sales.length) hand.sales=sales; else delete hand.sales;
      if(ret) hand.ret=ret; else delete hand.ret;
      if(dsc) hand.disc=dsc; else delete hand.disc;
      if(dscs.length) hand.discs=dscs; else delete hand.discs;
      byChart[o.sqid]=hand;                       // 同じ取り込みで2回当たらないように
      merged++;
      return;
    }
    // v131：商品かどうかの見分けを **売れた数の集計と同じ `prodBySq`** にそろえた。
    // それまでは `x.n===li.name`（名前の完全一致）だけだったので、
    // Squareで名前を変えた商品がカルテでは商品と見なされず、メニュー欄に出ていた。
    // 売れた数のほうは v108 からIDで拾っているので、2つの見分け方が食い違っていた
    const k={id:uid(),cid:c.id,date:o.date,
      /* v198：既定は川口さん。`o.staff` は Square の created_by_team_member_id ＝
         **会計を打った人**で、施術した人ではない。だれが打っても付くので、
         これで分けると事実上ぜんぶ「その他」になっていた。
         川口さん以外が施術したときは、カルテの編集画面で選び直す */
      staff:"川口香子",
      menu:joinMenu(menus,opts), menus:menus, opts:opts,
      price:o.total, parts:"",machine:"",level:"",shots:"",skin:"",
      goods:gd.map(nm).join("／"), sales:sales,
      next:"",note:"",src:"square",sqid:o.sqid,cash:cashAmt};
    if(ret) k.ret=ret;
    if(dsc) k.disc=dsc;
    if(dscs.length) k.discs=dscs;
    db.charts.push(k);
    added++;
  });
  // 売上そのものも月ごとに控える。カルテから足し上げると、名簿と結びつかない決済
  // （nocust）が丸ごと落ちてSquareの売上レポートと合わなくなる（現金と同じ理由）
  // v94：注文の明細（何がいくら売れたか）も月ごとにまとめて控える。
  // 品名でまとめるのは、注文明細に載っているのはバリエーションのIDでカタログの品目IDと
  // 別物だから。名前は MNORM を通して全角半角のゆれを吸収する
  // v96：Squareの売上レポートの「純売上高」に合わせられるよう、金額を分けて控える。
  //   純売上高 ＋消費税 ＋チップ ＋サービス料 ＝ 合計徴収額（yen）
  // 中継役が古い（v8以前）と tax/tip/svc が来ないので、そのときは net=yen のままにして
  // 「税込のまま」と画面に出す（黙って税抜のふりをしない）
  const sales={};
  const zero=()=>({yen:0,net:0,tax:0,tip:0,svc:0,disc:0,ret:0,n:0,days:{},dnet:{},items:{},
                   nolink:[],nolinkYen:0,at:today(),ver:APPVER,parts:false});
  (j.orders||[]).forEach(o=>{
    const mm=(o.date||"").slice(0,7); if(!mm) return;
    if(!sales[mm]) sales[mm]=zero();
    const S=sales[mm];
    const has=("tax" in o)||("tip" in o)||("svc" in o);
    const tax=+o.tax||0, tip=+o.tip||0, svc=+o.svc||0;
    const tot=+o.total||0, net=tot-tax-tip-svc;
    if(has) S.parts=true;
    S.yen+=tot; S.net+=net; S.tax+=tax; S.tip+=tip; S.svc+=svc;
    S.disc+=+o.discount||0; S.ret+=+o.ret||0; S.n++;
    S.days[o.date]=(S.days[o.date]||0)+tot;
    S.dnet[o.date]=(S.dnet[o.date]||0)+net;
    if(nolinkIds.has(o.sqid)){
      S.nolink.push({id:o.sqid,date:o.date,yen:tot,cust:o.cust||"",
        items:(o.items||[]).map(x=>x.name).filter(Boolean).join("／").slice(0,80)});
      S.nolinkYen+=tot;
    }
    (o.items||[]).forEach(li=>{
      const nm=li.name||"（名前なし）", k=MNORM(nm)||"（名前なし）";
      const r=S.items[k]=S.items[k]||{n:nm,q:0,yen:0,net:0,c:0};
      r.q+=(+li.qty||0); r.yen+=(+li.amount||0);
      r.net+=(+li.amount||0)-(+li.tax||0); r.c++;
    });
  });
  const tm=from.slice(0,7);
  if(!sales[tm]) sales[tm]=zero();                                   // 0件なら0円で控える
  if(!db.sqsales) db.sqsales={};
  Object.assign(db.sqsales,sales);
  // v117：Squareの決済手数料を月ごとに控える（中継役v11が返す）。
  // これまで支払明細の「そのほかの調整」に手で入れていたぶん。
  // 古い中継役では j.fee が来ないので、そのときは控えを触らない（0で上書きしない）
  if(j.fee!==undefined&&j.fee!==null){
    const fm=from.slice(0,7);
    if(db.sqsales[fm]){ db.sqsales[fm].fee=Math.round(+j.fee||0); db.sqsales[fm].feeN=+j.feeN||0; }
  }
  const stockN=applySquareSold(soldM);
  return {added,merged,nocust,sold,soldM,stockN,newMenus,cash,cashUpd,cats,fixed,refunded,retYen,menuList,
          orders:(j.orders||[]).length,sales:sales[tm]};
}

/* ---------- Squareの取り込み（手動・v104で自動更新をやめた） ----------
   v101で「3分ごと／画面に戻るたび」に取り込む自動更新を入れたが、
   **利用者の指示で v104 で外した**（自動はいらない・手で更新する）。
   残したのは「いま取り込む」ボタンと、最後に取り込んだ日の表示だけ。
   取り込みそのもの（`syncOrders`）は何度呼んでも二重にならない作りのままなので、
   また自動にしたくなったら、きっかけ（setInterval / visibilitychange / focus）を
   足すだけで戻せる。以下は当時のメモ：

   ---- ここから v101 のメモ（外した機能の説明） ----
   v100までは「この月をSquareから取り込む」を人が押すまで、決済しても数字が動かなかった。
   （売上タブ・連携タブ・出納帳のボタンはどれも押したときだけ `syncOrders` を呼んでいた）

   ここでは**今月ぶんを勝手に取り込み直す**。動くきっかけは4つ：
     ① アプリを開いたとき（起動）
     ② 「売上」タブを開いたとき
     ③ 3分ごと（画面が表に出ているあいだだけ）
     ④ 画面に戻ってきたとき（Squareで決済して、このアプリに切り替えた瞬間）
   ---- ここまで v101 のメモ ----

   何度走らせても壊れないことが前提。`syncOrders` は
   売上（`db.sqsales[m]` を丸ごと差し替え）・カルテ（`sqid` で重複を弾く）・
   現金（`db.cashbook.sq` は決済IDが鍵）のどれも**上書きなので二重に増えない**。
   在庫の「販売」とメニュー追加だけは別ボタンでの手作業のままにしてある（勝手に在庫を動かさない）。

   自動のときはカタログ（`menu`）を取りに行かない（`{cat:false}`）。
   品目のカテゴリは毎分変わるものではないし、通信を倍にしたくないため */
let sqAuto={busy:false,at:"",n:0,err:"",last:0};

/* 今月ぶんを取り込む。押したときだけ動く（v104） */
/* ---------- Squareの取り込みは1本（v124） ----------
   利用者の指摘：「取り込みボタンが工程ごとにあって混乱する。1つでよいのでは」。

   調べたら **4つのボタンが同じ `syncOrders` を呼んでいた**：
     ・売上タブ「いま取り込む」／「この月をSquareから取り込む」
     ・連携「この月の決済を取り込む」
     ・現金出納帳「Squareの現金を取り込む」／「¥Nを出納帳に取り込む」
   `syncOrders` は1回で **売上・カルテ・在庫の販売数・現金・カタログ・決済手数料** を全部入れる。
   何度呼んでも二重にならない（売上は差し替え／カルテは sqid／現金は決済ID）。
   **分ける理由が無かったので1つにまとめた。**

   ★ 一緒にしなかったものと、その理由：
     ・`syncMaster`（顧客とメニューを最新にする）… **メニューを増やす**。
       CLAUDE.md の既知の問題（炭酸スプレー等の重複）があるので、押したときだけにする
     ・お客様の照合／商品の照合 … **人が見て決めてから反映**する作り。勝手に増やさない
     ・「つながるか試すだけ」… 数えるだけで帳簿を書かない切り分け用 */
async function syncSquareMonth(m){
  const mm=m||stMonth;
  const first=mm+"-01";
  const last=`${mm}-${new Date(+mm.slice(0,4),+mm.slice(5,7),0).getDate()}`;
  const r=await syncOrders(first,last);
  await save();
  return r;
}
/* ---------- Squareで払ったのに名簿にいない方（v156） ----------
   利用者の問い：**「スクエアの顧客名がアプリになかったら、『名簿に追加しますか？』と
   アナウンスすることはできないのか？ 新規で施術の場合ホットペッパーからGmailで
   スケジュールに取り込まれてカルテを作れるが、新規で物販を急に買いに来た場合は
   スクエアから直で連携になるよね？」**

   そのとおり。**新規のお客様の入口は2つある。**
   ・施術 … サロンボード → 予約メール → `applyMail` が名簿を作る（v70）。**もう自動**
   ・物販だけの飛び込み … **Squareの決済しか手がかりが無い**。ここが手薄だった

   v126 から「Squareに、アプリに無いものがあります／お客様 N件を見る」はホームに出ていたが、
   これは**Squareの名簿にいて、アプリにいない人ぜんぶ**（何年も前の連絡先も混ざる）。
   知りたいのは「**今月うちで払ったのに、名簿にいない方**」ただ1つなので、名指しで出す。

   もとになるのは `nolink`（名簿と結びつかなかった決済。v102から月ごとに控えている）。
   ただし `nolink` に入っているのはSquareの**顧客IDだけ**で、名前が無い。
   `syncOrders` は顧客ディレクトリを見ないからで、見に行くのは照合を作るとき。
   そこで**照合を作った直後に、名前を控えへ書き足す**（`nameNolink`）。
   こうしておくと、あとで読み込み直さなくても名指しで知らせられる。 */
async function nameNolink(list){
  const by={}; (list||[]).forEach(x=>{ if(x&&x.sqid) by[x.sqid]=x; });
  let n=0;
  Object.values(db.sqsales||{}).forEach(rec=>{
    if(!rec||!Array.isArray(rec.nolink)) return;
    rec.nolink.forEach(o=>{
      const x=by[o.cust]; if(!x||!x.name) return;
      if(o.name===x.name&&o.tel===(x.tel||"")) return;
      o.name=x.name; o.tel=x.tel||""; o.birth=x.birth||""; o.addr=x.addr||""; n++;
    });
  });
  if(n) await save();
  return n;
}
/* その月の「払ったのに名簿にいない方」を、Squareのお客様ごとにまとめる。
   ★ レジでお客様を選ばずに会計したぶん（cust が空）は**ここに出さない**。
     誰のぶんか分からないので名簿には足せない（Square側で結びつけ直してもらうしかなく、
     それは sqWhyHtml と売上タブで別に知らせている） */
function sqStrangers(m){
  const rec=(db.sqsales||{})[m||today().slice(0,7)];
  const rows=(rec&&Array.isArray(rec.nolink))?rec.nolink:[];
  const have={}; db.customers.forEach(c=>{ if(c.sqid) have[c.sqid]=1; });
  const by={};
  rows.forEach(o=>{
    if(!o.cust||have[o.cust]) return;
    const g=by[o.cust]=by[o.cust]||{sqid:o.cust,name:o.name||"",tel:o.tel||"",
      birth:o.birth||"",addr:o.addr||"",yen:0,n:0,last:"",items:""};
    g.yen+=+o.yen||0; g.n++;
    if(String(o.date||"")>g.last){ g.last=o.date||""; g.items=o.items||""; }
  });
  return Object.values(by).sort((a,b)=>String(b.last).localeCompare(String(a.last)));
}

/* 取り込んだあとに「人が見て決めること」が残っているか（v126） */
function syncTodo(){
  const c=custSync?custSync.near.length+custSync.sqOnly.length:0;
  const p=prodSync?prodSync.near.length+prodSync.sqOnly.length:0;
  const out=[];
  if(c) out.push(`お客様 ${c}件`);
  if(p) out.push(`商品 ${p}件`);
  return out.length?out.join("・")+" の確認待ち":"";
}
/* いま開いている画面を描き直す（どこから押しても結果が見えるように） */
function repaintAfterSync(){
  const tab=document.getElementById("app").dataset.tab;
  /* v154：名簿も描き直す。カルテは名簿の「これまでの記録」で読むものになったので、
     開いたときの取り込み（autoSyncOnOpen）が終わったのに、名簿を見ている人だけ
     古い画面のまま、ということが起きる。
     ★ 入力欄を開いているとき（karteOpen）は詳細を描き直さない。書きかけが消えるため */
  if(tab==="list"){ renderList(); if(!karteOpen) renderDetail(); }
  else if(tab==="visit") renderVisit();

/* どのボタンから押しても同じ道を通す */
async function doSquareSync(m,say){
  if(!relayUrl("ping")){ toast("「連携」タブの連携設定を先に入れてください"); return null; }
  const mm=m||stMonth;
  if(say) say(`${mm.replace("-","年")}月を取り込んでいます…`,true);
  sqAuto.busy=true; paintAutoSq();
  try{
    const r=await syncSquareMonth(mm);
    // v126：**1回で全部そろえる。** 決済のついでに顧客とカタログの照合まで作っておく。
    // 作るだけで名簿も商品も**1件も変えない**（反映は照合の画面で人が押す）
    try{
      if(r.menuList&&r.menuList.length){
        prodSync=prodMatch(r.menuList); prodPick={}; prodAdd={};
        prodSync.sqOnly.forEach(x=>{ prodAdd[x.sqid]=true; });
        prodView=prodSync.near.length?"near":(prodSync.sqOnly.length?"sqonly":"hit");
      }
      const jc=await relayGet("customers");
      custSync=custMatch(jc.customers||[]); custPick={};
      custView=custSync.near.length?"near":(custSync.sqOnly.length?"sqonly":"hit");
      await nameNolink(jc.customers||[]);   // v156：名簿にいない方の名前を控えに書く
    }catch(e){ /* 照合が作れなくても、売上の取り込みは済んでいる */ }
    sqAuto.at=nowStamp(); sqAuto.n=r.orders; sqAuto.err=""; sqAuto.last=Date.now();
    sqAuto.busy=false; repaintAfterSync();
    const w=syncTodo();
    toast(`最新にしました（決済${r.orders}件`+(r.stockN?`／在庫の販売数 ${r.stockN}件`:"")+`）`+(w?`／${w}`:""));
    return r;
  }catch(e){
    sqAuto.busy=false; sqAuto.err=e.message||"通信できません"; sqAuto.last=Date.now();
    paintAutoSq();
    if(say) say("取り込めませんでした："+sqAuto.err,false);
    else toast("取り込めませんでした："+sqAuto.err);
    return null;
  }
}

async function syncThisMonth(){
  if(sqAuto.busy) return false;
  const m=today().slice(0,7);
  const first=m+"-01", last=`${m}-${new Date(+m.slice(0,4),+m.slice(5,7),0).getDate()}`;
  sqAuto.busy=true; sqAuto.err=""; paintAutoSq();
  try{
    const r=await syncOrders(first,last);
    sqAuto.at=nowStamp(); sqAuto.n=r.orders; sqAuto.last=Date.now();
    await save();
    const tab=document.getElementById("app").dataset.tab;
    if(tab==="visit") renderVisit();
    else if(tab==="acct"&&acctPage==="cash") renderCashbook();   /* v190：会計タブへ移した */
  }catch(e){ sqAuto.err=e.message||"通信できません"; sqAuto.last=Date.now(); }
  sqAuto.busy=false; paintAutoSq();
  return true;
}

function autoSqHtml(){
  if(!relayUrl("ping"))
    return `<b>Squareから取り込めません</b>：中継役のURLと合言葉がまだです（「連携」タブの連携設定）。`;
  const rec=(db.sqsales||{})[today().slice(0,7)];
  return `<b>今月の取り込み</b>：${
      sqAuto.busy?"<b>取り込み中…</b>"
      :sqAuto.at?`この画面で ${esc(sqAuto.at.slice(5))} に取り込みました（決済${sqAuto.n}件）`
      :rec&&rec.at?`${esc(rec.at.replace(/-/g,"/"))} に取り込みずみ（決済${rec.n}件）`
      :"まだ取り込んでいません"}
    <button class="nav" id="v-now" style="margin-left:8px">いま取り込む</button>
    ${sqAuto.err?`<br><b style="color:var(--alert)">取り込めませんでした：${esc(sqAuto.err)}</b>`:""}`;
}

function bindAutoSq(){
  const now=document.getElementById("v-now");
  if(now) now.onclick=async()=>{
    if(!relayUrl("ping")){ toast("「連携」タブの連携設定を先に入れてください"); return; }
    const ran=await syncThisMonth();
    if(ran&&!sqAuto.err) toast(`Squareから取り込みました（決済${sqAuto.n}件）`);
  };
}
function paintAutoSq(){
  const e=document.getElementById("v-auto");
  if(!e) return;
  e.innerHTML=autoSqHtml(); bindAutoSq();
}


/* 取り込み結果の売上の言い方（v96）。中継役が古いと税を分けられないので、
   そのときは「税込のまま」と正直に出して、貼り直しの手順を案内する */
function salesMsg(s){
  if(!s) return "";
  if(s.parts) return `<b>純売上 ${yen(s.net)}</b>（消費税 ${yen(s.tax)}${
    s.tip?`・チップ ${yen(s.tip)}`:""}${s.svc?`・サービス料 ${yen(s.svc)}`:""} を足した合計徴収額は ${yen(s.yen)}）`;
  return `<b>売上 ${yen(s.yen)}（税込）</b>。
    <b style="color:var(--alert)">中継役が古いので、消費税を分けられませんでした。</b>
    square-relay_9.gs を Apps Script に貼り直して「デプロイを管理」から新しいバージョンで
    デプロイすると、Squareの「純売上高」と同じ数字になります。`;
}

/* 顧客とメニューを最新に */
async function syncMaster(){
  const j=await relayGet("all",`&from=${today()}&to=${today()}`);
  let newC=0, upd=0;
  (j.customers||[]).forEach(x=>{
    let c=db.customers.find(y=>y.sqid===x.sqid)||db.customers.find(y=>y.name===x.name);
    if(!c){ c={id:uid(),name:x.name,kana:"",first:"",tags:"",caution:"",memo:""};
      db.customers.push(c); newC++; } else upd++;
    c.sqid=x.sqid; c.tel=c.tel||x.tel; c.birth=c.birth||x.birth; c.addr=c.addr||x.addr;
  });
  // メニューは上書きせず、名前で突き合わせて増分だけ足す（手で直した内容を守る）
  let mNew=0,mUpd=0;
  (j.menu||[]).filter(x=>!x.retail).forEach(x=>{
    const cur=db.menu.find(y=>MNORM(y.n)===MNORM(x.name));
    if(!cur){ db.menu.unshift({id:uid(),cat:x.cat||"未分類",n:x.name,p:x.price||0,
      min:x.minutes||guessDur(x.name),isNew:true}); mNew++; }
    else{
      if(x.price&&cur.p!==x.price){ cur.p=x.price; mUpd++; }
      if(x.minutes&&!cur.min){ cur.min=x.minutes; }
      if(x.cat&&!cur.cat) cur.cat=x.cat;
    }
  });
  return {newC,upd,mNew,mUpd};
}

/* ---------- お客様の照合（v99） ----------
   Squareの顧客ディレクトリとアプリの名簿を突き合わせる。
   売上や商品と同じで、中継役の `customers` が全件（100件ずつページ送り）返してくる。

   作りの考え方は仕入れの取り込みと同じ：**まず突き合わせて見せる → 納得したら反映**。
   「Squareの名簿を読み込む」を押した時点では名簿は1件も変わらない。

   突き合わせは3段で、当たった段を画面に出す（外したときに人が直せるように）：
     ① SquareのID（`sqid`）… 一度結びついた人は名前が変わっても外れない
     ② 電話番号（数字だけにして10桁以上）
     ③ お名前（NFKC＋空白を落として比べる。「山田 花子」と「山田花子」を同じに）
   どれも当たらないが1文字違いの人がいるときは **「似ている」** に入れて人に選ばせる。
   「山田花子」と「山田華子」のような組を黙って別人にも同一人物にもしないため。

   反映は **足すか結びつけるだけ**。名前も電話も既に入っている欄は書き換えない。消しもしない */
let custSync=null;    // 照合の結果（保存しない。画面を離れたら消える）
let custView="near";  // いま開いている区分
let custPick={};      // 似ている組の判断 {sqid:"same"|"new"}

const cNorm=s=>MNORM(String(s||"").replace(/[\s　]/g,""));

/* 編集距離。1文字違いだけを「似ている」に拾いたいので、2文字以上ずれたら早々に諦める */
function lev(a,b){
  if(a===b) return 0;
  if(Math.abs(a.length-b.length)>1) return 9;
  let prev=Array.from({length:b.length+1},(_,j)=>j);
  for(let i=1;i<=a.length;i++){
    const cur=[i];
    for(let j=1;j<=b.length;j++)
      cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    prev=cur;
  }
  return prev[b.length];
}

function custMatch(list){
  const cs=db.customers;
  const bySq={}, byTel={}, byName={};
  cs.forEach(c=>{
    if(c.sqid) bySq[c.sqid]=c;
    const t=tel10(c.tel); if(t.length>=10&&!byTel[t]) byTel[t]=c;
    const n=cNorm(c.name); if(n&&!byName[n]) byName[n]=c;
  });
  const used=new Set(), hit=[], near=[], sqOnly=[];
  (list||[]).forEach(x=>{
    const t=tel10(x.tel), n=cNorm(x.name);
    let c=null, how="";
    if(x.sqid&&bySq[x.sqid]){ c=bySq[x.sqid]; how="SquareのID"; }
    else if(t.length>=10&&byTel[t]){ c=byTel[t]; how="電話番号"; }
    else if(n&&byName[n]){ c=byName[n]; how="お名前"; }
    if(c){
      // 同じ方にSquare側の2件が当たることがある（Squareの重複登録）。
      // 黙って上書きせず、2件目は「Square側に2件」と出すだけにする
      const dup=used.has(c.id);
      used.add(c.id); hit.push({x,c,how,dup});
      return;
    }
    // 1文字違いの人がいれば「似ている」。短い名前（2文字以下）は当てにならないので拾わない
    let best=null;
    if(n.length>=3) cs.forEach(y=>{
      if(used.has(y.id)||y.sqid) return;
      const d=lev(cNorm(y.name),n);
      if(d===1&&(!best||d<best.d)) best={y,d};
    });
    if(best){ used.add(best.y.id); near.push({x,c:best.y,d:best.d}); return; }
    sqOnly.push(x);
  });
  const appOnly=cs.filter(c=>!used.has(c.id));
  return {hit,near,sqOnly,appOnly,n:(list||[]).length,at:today()};
}

function renderProdSync(){
  const el=document.getElementById("prodhost"); if(!el) return;
  const s=prodSync;
  const linked=db.products.filter(p=>p.sqid).length;
  if(!s){
    el.innerHTML=`<div class="sheet">
      <p class="note" style="margin:0 0 12px">Squareのカタログ（物販）とアプリの商品を突き合わせます。
        <b>読み込んだだけでは商品を1件も変えません。</b>中身を見て、納得してから反映してください。</p>
      <p class="note">ホームの「<b>アプリを最新にする</b>」を押すと、ここに照合が出ます。</p>
      <p class="note" id="ps-msg"></p>
      <p class="note">いまSquareと結びついている商品は <b>${linked}件</b>／${db.products.length}件です。
        結びついた商品は、売れたときに<b>SquareのIDで引き当てて</b>在庫と原価に入ります
        （品名が変わっても外れません）。</p>
    </div>`;

    return;
  }
  const tile=(k,l,n)=>`<div class="tile${prodView===k?" open":""}" data-pv="${k}">
      <span>${l}</span><b>${n}</b></div>`;
  el.innerHTML=`<div class="sheet">
      <div class="actions">

        <button class="btn" id="ps-apply">選んだ内容を反映する</button>
      </div>
      <p class="note" id="ps-msg">Squareの物販 ${s.n}件を読みました（${s.at.replace(/-/g,"/")}）。
        まだ何も変えていません。</p>
    </div>
    <div class="sum">
      ${tile("hit","一致",s.hit.length)}
      ${tile("near","似ている",s.near.length)}
      ${tile("sqonly","Squareだけ",s.sqOnly.length)}
      ${tile("apponly","アプリだけ",s.appOnly.length)}
    </div>
    ${psRows()}`;

  el.querySelectorAll(".sum .tile").forEach(t=>t.onclick=()=>{ prodView=t.dataset.pv; renderProdSync(); });
  el.querySelectorAll("[data-pp]").forEach(sel=>sel.onchange=()=>{
    prodPick[sel.dataset.pp]=sel.value; });
  el.querySelectorAll("[data-pa]").forEach(ck=>ck.onchange=()=>{
    prodAdd[ck.dataset.pa]=ck.checked; });

  document.getElementById("ps-apply").onclick=async()=>{
    let link=0, add=0, skip=0;
    const bind=(p,x)=>{ p.sqid=x.sqid; p.sqvar=(x.vars||[]).slice();
      if(x.cat&&!p.cat) p.cat=x.cat;
      if(x.price&&!p.price) p.price=x.price; };
    const make=x=>{
      const p={id:uid(),n:x.name,kind:"物販",cat:x.cat||"Square",
               price:x.price||0,cost:0,code:x.sku||"",sqid:x.sqid,sqvar:(x.vars||[]).slice()};
      db.products.push(p); add++;
    };
    s.hit.forEach(({x,p})=>{ if(!p.sqid){ bind(p,x); link++; } });
    s.near.forEach(({x,p})=>{
      const v=prodPick[x.sqid];
      if(v==="same"){ bind(p,x); link++; }
      else if(v==="new"){ make(x); }
      else if(v==="skip"){ db.sqskip[skipKey(x.sqid,p.id)]=1; skip++; }
      // 「まだ決めない」は何もしない。次に読み込んだらまた出る
    });
    s.sqOnly.forEach(x=>{ if(prodAdd[x.sqid]) make(x); });
    await save();
    prodSync=null; renderProdSync(); renderSync();
    toast(`結びつけ ${link}件／足した ${add}件${skip?`／次から聞かない ${skip}件`:""}`);
  };
}

function hpbFirstMonth(){
  const ks=Object.keys(db.hpb||{}).sort();

/* ---------- 年間一覧（v174） ----------
   利用者の指示：**「会計のページに、それぞれの年単位の2026年1月から12月までの
   売上、商品原価、材料原価、スタッフ購入分が一目でわかる一覧表を作って、
   そこで合計を管理したほうが良くないかな。今は前月、次月でめくっていかないと
   わからないけど、一覧にしたほうが直感的に何年何月の何々はいくらなんだなって
   すぐにわかるよね」**

   そのとおりだった。会計は**月をめくる作りだけ**で、年でまとめて見る場所が無かった。
   v110からの「過去の月」は24か月をただ新しい順に並べるだけで、**年の区切りも合計も無い**。
   「今年の材料原価はいくらか」を知るには、12回めくって自分で足すしかなかった。

   1月〜12月の12行に決めて、いちばん下に**年の合計**を置く。行を押すとその月に移る。
   「過去の月」にしか無かった川口さん・水野さんの支払額もこの表に入れたので、
   **古い表（acctMonths ごと）はまるごと外した**。同じものが2つ並ばないように。 */

/* 何かしら記録のある月。ここに無い月は**まっさら**とみなして計算しない。
   ★ closing() は中で cell() を呼び、**無い月・無い品の記録を作ってしまう**。
     12か月ぶんをまとめて読むこの表でまっさらな月まで渡すと、
     年をめくるたびに db.stock（正本の db.json）が太っていく */
function acctLiveMonths(){
  const set=new Set();
  const add=o=>Object.keys(o||{}).forEach(k=>set.add(k));
  add(db.sqsales); add(db.hpb); add((db.pay||{}).months); add(db.stock); add(db.actual);
  (db.charts||[]).forEach(k=>set.add(String(k.date||"").slice(0,7)));
  (db.buys||[]).forEach(b=>{ if(b&&b.month) set.add(b.month); });
  set.delete("");
  return set;
}
/* 年をめくれる範囲。記録のある年から、今年（または見ている年）まで */
function acctYears(){
  const now=+today().slice(0,4), seen=+stMonth.slice(0,4);
  const ys=[...acctLiveMonths()].filter(x=>typeof x==="string"&&x.length===7&&x.charAt(4)==="-")
    .map(x=>+x.slice(0,4)).filter(x=>x>2000).concat([now,seen]);
  return {min:Math.min.apply(null,ys), max:Math.max(now,seen)};
}
/* この月にスタッフが買ったぶんの原価合計 */
const staffYen=m=>sumYen(staffRows(m));
/* 年間一覧で金額を押したときに開く内訳（品名・個数・単価・原価）。
   利用者の指示（v178）：**「会計の下の年間一覧の例えば8月の253円をクリックしたら
   内訳が表記されるほうが良い」**、（v180）：**「商品原価、材料原価もスタッフ購入のように
   内訳を表記できるようにして」**

   ★ どれも **db.stock を直接読む**（cell() は無い月・無い品の記録を作るため）。
     合計は年間一覧の欄の数字とぴったり同じになるようにそろえてある：
       商品原価 … 売れたぶん（sold×原価）＋ プレゼント ＋ キャンペーン ＝ cGoods+cGift+cCamp
       材料原価 … カルテで選んだ材料 ＋ 店内で使ったぶん（use）      ＝ cMat
       スタッフ購入 … 在庫の「スタッフ」欄                            ＝ staffYen */
const ACBRK={uri:"売上",goods:"物販原価",mat:"材料原価",staff:"スタッフ購入"};
/* 内訳の行に押すスタンプ（v182）。利用者の指示：**「明細にプレゼントなのか
   キャンペーンなのかイラスト（スタンプ）でもわかるようにしたい」** */
const ACSTAMP={"プレゼント":"🎁","キャンペーン":"🎉","店内で使った":"🏠"};
function acctBreak(m,key){
  const st=(db.stock||{})[m]||{};
  const num=(id,f)=>Math.round(+(st[id]||{})[f]||0);
  /* 売上（純売上）の作りかた。v186で分析タブの「月の清算」からここへ移した。
     ★ 足すと必ず closing(m).netAdj になる行だけを並べる。
       請求書がまだの月は bgrant/bpt が0なので、明細CSVのポイント（pt/gift）は**足さない**
       （小計の計算に入っていないため。並べると合計が合わなくなる） */
  if(key==="uri"){
    const c=closing(m), h=c.hp, f=c.fee, out=[];
    out.push({n:"Squareの"+(c.parts?"純売上高":"売上"), yen:c.sqOnly});
    if(h.hasBill){
      out.push({n:"HPポイント利用（回収される）", yen:h.bpt});
      out.push({n:"HPポイント付加分（請求される）", yen:-h.bgrant});
    }
    if(h.smart) out.push({n:"スマート支払い", yen:h.smart});
    (h.adj||[]).forEach(x=>out.push({n:x.n||"（名前なし）", yen:+x.v||0}));
    if(f.have) out.push({n:"Square決済手数料（自動・"+f.n+"件）", yen:-f.yen});
    if(c.mimi.have&&c.mimi.pay)
      out.push({n:"耳つぼジュエリー　水野さんへ（"+c.mimi.qty+"件）", yen:-c.mimi.pay});
    return out;
  }
  if(key==="staff")
    return staffRows(m).map(r=>({n:r.p.n,qty:r.q,cost:r.cost,yen:r.yen}));
  const c=closing(m);
  if(key==="goods"){
    const rows=db.products.filter(p=>p.kind==="物販")
      .map(p=>({n:p.n,qty:num(p.id,"sold"),cost:+p.cost||0}))
      .filter(r=>r.qty).map(r=>Object.assign(r,{yen:r.qty*r.cost}))
      .sort((a,b)=>b.yen-a.yen);
    c.gch.rows.forEach(r=>rows.push({n:r.n,qty:r.qty,cost:r.cost,yen:r.yen,tag:"プレゼント"}));
    c.cch.rows.forEach(r=>rows.push({n:r.n,qty:r.qty,cost:r.cost,yen:r.yen,tag:"キャンペーン"}));
    return rows;
  }
  // 材料原価。カルテで選んだぶんは品名でまとめる（1件ずつは在庫タブの一覧で見る）
  const t={};
  matUses(m).forEach(u=>{
    if(!t[u.n]) t[u.n]={n:u.n,qty:0,cost:u.cost,yen:0};
    t[u.n].qty+=u.qty; t[u.n].yen+=u.yen;
  });
  const rows=Object.values(t).sort((a,b)=>b.yen-a.yen);
  db.products.filter(p=>p.kind==="物販"||p.kind==="材料").forEach(p=>{
    const q=num(p.id,"use"); if(!q) return;
    rows.push({n:p.n,qty:q,cost:+p.cost||0,yen:q*(+p.cost||0),tag:"店内で使った"});
  });
  return rows;
}
function acctBreakHtml(r,key){
  const rows=acctBreak(r.m,key);

  const uri=key==="uri";                       // 売上は「項目と金額」の2列。原価は4列
  const box=t=>`<tr class="sbrow"><td colspan="8" style="padding:10px 12px;text-align:left;

/* 1月〜12月の12行と、年の合計。
   ★ 商品原価は**支払明細の「物販原価」と同じ出しかた**にしてある。
     Squareで売れたぶん ＋ カルテのプレゼント ＋ キャンペーンで渡したぶん。
     月の締めでは3行に分けているが、年で見るときは1つにまとめたほうが読める */
function acctYearRows(y){
  const cur=today().slice(0,7), live=acctLiveMonths();
  const t={uri:0,goods:0,mat:0,zan:0,staff:0,kawa:0,mizu:0}, rows=[];
  for(let i=1;i<=12;i++){
    const m=y+"-"+String(i).padStart(2,"0");
    // old ＝ サロンボードの「未取込」を出さなくてよい月。取り込めない古い月か、
    //       まだ一度も取り込んでいない（どの月が古いのか決められない）とき
    const r={m, i, uri:0, goods:0, mat:0, zan:0, staff:0, kawa:0, mizu:0,
             hpb:false, old:hpbPast(m)||!hpbFirstMonth(), now:m===cur, ahead:m>cur};
    if(live.has(m)){
      const c=closing(m);
      r.uri=c.netAdj; r.goods=c.cGoods+c.cGift+c.cCamp; r.mat=c.cMat;
      r.staff=staffYen(m); r.kawa=payKawa(m).total; r.mizu=payMizu(m).total;
      r.zan=r.uri-r.goods-r.mat;          // 差引＝売上 − 物販原価 − 材料原価
      r.hpb=hpbSales(m).have;
    }
    r.has=!!(r.uri||r.goods||r.mat||r.staff||r.kawa||r.mizu);
    if(!r.has) r.zan=0;
    Object.keys(t).forEach(k=>t[k]+=r[k]);
    rows.push(r);
  }
  return {rows, t};
}

/* 支払明細を出す前に、材料がそろっているかを見る（v118）。
   7月の検証で分かったのは「計算は合うが、入力が足りていない」という詰まり方ばかりだった。
   だから**足りないものを名指しで先に出す**。ここが緑になってから明細を作る */
function payReady(m){
  const ms=monthSales(m), hp=hpbSales(m), f=sqFee(m), k=payKawa(m), z=payMizu(m);
  /* v186：**在庫の締めの行は外した。** 棚卸しの数は純売上にも原価にも支払額にも入らないので、
     「明細を作る材料」ではない（在庫の手入れは別の仕事） */
  const adv=advBuy(m);
  /* `go` は足りないものを押したときの行き先（v190）。
     赤が出ているのに「どこへ行けばいいか」を人が読んで探すのをやめる */
  const rows=[
    {ok:!(k.tateSrc==="buy"&&!k.handTate)||adv.n>0, n:"川口さんの立替（仕入れの入力）",
     hint:"会計の② 仕入れ。伝票を「川口さんの立替」にする", go:"buy",
     bad:"この月の仕入れが0枚です。立替が差分だけで計算されます"},
    {ok:ms.src==="square", n:"Squareの取り込み",
     hint:"売上タブ →「アプリを最新にする」", go:"visit",
     bad:ms.src==="hand"?"いまはソースに手打ちした控えを使っています":"まだ取り込んでいません"},
    {ok:hp.have, n:"サロンボードの明細（CSV2本）",
     hint:"会計の① サロンボードの取り込み →「CSVを選ぶ」", go:"hpb",
     bad:hpbPast(m)?"この月は取り込めない古い月です（そのままで構いません）":"ポイントとスマート払いが抜けます",
     skip:hpbPast(m)},
    {ok:hp.hasBill, n:"請求書の転記（ポイント付加分・利用分）",
     hint:"同じ画面の「請求書から転記する」", go:"hpb",
     bad:"請求書にしかない数字です。手で入れてください", skip:hpbPast(m)},
    {ok:f.have||(hp.adj||[]).length>0, n:"Square決済手数料",
     hint:"取り込み直せば自動。古い月は「そのほかの調整」に手入力", go:"hpb",
     bad:"手数料が引かれていません"},
    {ok:z.rows.filter(r=>!r.auto).length>0, n:"水野さんの明細",
     hint:"会計の③ 水野さんの支払明細（ホームのタイルからも行けます）", go:"mizu",
     bad:"空のままだと、川口さんのパート負担分が0で計算されます"},
    {ok:!k.handCost||Math.abs(k.cost-k.autoCost)<1, n:"川口さんの物販原価",
     hint:"空にすると在庫表とカルテから自動で出ます", go:"kawa",
     bad:k.handCost?`手入力 ${yen(k.cost)} と自動 ${yen(k.autoCost)} が ${yen(Math.abs(k.cost-k.autoCost))} 違います`:"",
     warn:true}
  ].filter(r=>!(r.skip&&r.ok===false&&r.n.indexOf("請求書")<0)||true);
  const live=rows.filter(r=>!r.skip||r.ok);
  return {rows, n:live.length, ng:live.filter(r=>!r.ok).length};
}
function payReadyHtml(m){
  const v=payReady(m);
  return `<div class="sheet" style="margin-top:16px">
    <label class="f">${m.replace("-","年")}月の支払明細、材料はそろっているか</label>
    ${v.ng===0?`<p class="note" style="color:var(--accent);margin:0 0 10px">
      <b>そろっています。</b>明細を作れます。</p>`
     :`<p class="note" style="color:var(--alert);margin:0 0 10px">
      <b>${v.ng}件たりません。</b>このまま明細を作ると、その分だけ金額がずれます。</p>`}
    <table class="chk an"><tbody>
      ${v.rows.map(r=>`<tr>
        <th>${r.ok?"✓":(r.skip?"—":(r.warn?"！":"×"))}　${esc(r.n)}</th>
        <td class="${r.ok?"ok":(r.skip?"how":"ng")}">${r.ok?"入っています":esc(r.bad||"未入力")}</td>
        <td class="how">${r.ok?""
          :r.go?`<button class="nav" data-apgo="${r.go}">${esc(r.hint)} →</button>`
               :esc(r.hint)}</td></tr>`).join("")}
    </tbody></table>
  </div>`;
}

function acctMenuHtml(){
  const m=stMonth, c=closing(m), k=payKawa(m), z=payMizu(m);
  /* v190：**終わった作業は札を✓に変える。** 上から4つ押すだけの画面なので、
     「どこまで済んだか」がひと目で分かることが視認性のいちばん大事なところ */
  const card=(p,icon,title,sub,val,vsub,warn,done)=>`
    <button class="navcard${done?" done":""}" data-ap="${p}">
      <span class="nc-i">${done?"✓":icon}</span>
      <span class="nc-t"><b>${title}</b><span>${sub}</span></span>
      <span class="nc-v"><span class="${warn?"warn":""}">${val}</span>${vsub?`<em>${vsub}</em>`:""}</span>
      <span class="nc-a">›</span>
    </button>`;
  /* ---------- 会計の入口（v186） ----------
     利用者の指示：**「①④⑦の意味をもう一度検証して、他で賄える論点だったら
     集約してシンプルにしたい」「とにかくシンプルで操作性と視認性、動線が散らばらないように」**

     調べて分かったこと：
       ① 在庫の締め … 棚卸しの数（cnt／差）は **純売上にも原価にも支払額にも1円も入っていない**。
          物販原価はSquareの取り込みが書く「販売」欄から出ている。動くのは在庫の数量と在庫金額だけ。
          それなのに「在庫が締まってから支払明細に進みます」と書いてあり、
          「材料はそろっているか」の1行目に赤で出ていた。**前提が事実と違った。**
          → 締めの番号から外し、**在庫の手入れ**として番号なしで下に置く
       ④ 月の締め … 純売上の作りかたは年間一覧の「売上」を押せば出るようにした。
          物販原価・材料原価とその内訳も年間一覧にある。→ 会計の入口からは外す
          （**分析タブには残っている**ので画面が消えたわけではない）
       ⑦ 検証 … 固有の数字がゼロだったのでやめた（上のおぼえがき）

     残った締めは4つ。①②は入れるところ、③④は出すところ。 */
  const inv=stCountSum(m,["物販"]), inv2=stCountSum(m,["材料"]);
  const todo=inv.todo+inv2.todo, move=inv.move+inv2.move;
  const adv=advBuy(m), hpv=hpbSales(m);
  /* 済みの見分け（v190）。①は「取り込めない古い月」なら対象外なので済み扱いにする */
  const done1=hpbPast(m)||(hpv.have&&hpv.hasBill), done2=adv.n>0,
        done3=z.rows.length>0, done4=!!(payMonth(m).kawa);
  const left=[done1,done2,done3,done4].filter(x=>!x).length;
  return `<div class="schbar" style="margin-bottom:14px">
      <button class="nav" id="ac-pm">前月</button>
      <button class="nav" id="ac-nm">次月</button>
      <span class="title">会計　${m.replace("-","年")}月</span>
    </div>
    <p class="note" style="margin:0 0 10px"><b>月末の締めは、この4つを上から順に。</b>
      ${left===0?`<b style="color:var(--accent)">この月は4つとも終わっています。</b>`
                :`のこり <b>${left}つ</b>です。`}
      <b>途中で別のタブに飛びません。</b>どの画面からも会計にもどれます。</p>
    <div class="navlist">
      ${card("hpb","サ","① サロンボードの取り込み",
        "ポイント付与・ポイント利用・スマート払い（CSV2本）と、請求書からの転記",
        hpv.have?(hpv.hasBill?"請求書まで":"明細だけ"):(hpbPast(m)?"取り込み前":"未取込"),
        hpv.have?yen(hpv.off):"",!hpv.have&&!hpbPast(m),done1)}
      ${card("buy","仕","② 仕入れ（川口さんの立替）",
        "商品・材料・消耗品に分けて入れます。立替にした伝票の合計が支払明細に入ります",
        adv.n?yen(adv.total):"—",adv.n?`伝票${adv.n}枚`:"まだ0枚",!adv.n,done2)}
      ${card("mizu","水","③ 水野さんの支払明細",
        "行ごとの時給・単価＋耳つぼジュエリー。川口さんより先に入れてください",
        z.total?yen(z.total):"—",`${z.rows.length}行`,!z.rows.length,done3)}
      ${card("kawa","川","④ 川口さんの支払明細",
        "4割＋立替−パート負担",k.total?yen(k.total):"—",
        k.tate||k.part?"":"立替・パート負担が未入力",!(k.tate||k.part),done4)}
    </div>
    <p class="note" style="margin:14px 0 8px">締めとは別に、ときどき見るところ</p>
    <div class="navlist">
      ${card("stock","棚","棚卸し（在庫の手入れ）",
        "棚に何がいくつあるかを合わせます。支払明細の金額には影響しません",
        move===0?"動きなし":(todo?`のこり ${todo}件`:"数え終わり"),
        move?`数えるもの ${move}件`:"")}
      ${card("cash","現","現金出納帳","日々の入金・出金と、今の残高",
        yen(cashClosing(m)),"今の残高")}
    </div>
    <p class="note"><b>③水野さんが④川口さんより先</b>なのは、
      パート負担分の計算に水野さんの明細を使うからです（④を先に作ると0で計算されます）。
      <b>水野さんの明細は川口さんが入れられます</b>（ホームの「水野さんの明細」からも直行できます）。<br>
      <b>棚卸しは支払明細の金額に関係しません。</b>棚に何がいくつあるかを合わせ、
      翌月の月初を正しくするためのものです。<br>
      <b>①②と現金出納帳は、v190から会計タブの中で開きます</b>（連携タブからは無くなりました）。
      棚卸しだけは「商品・材料」タブの画面ですが、ここから入ると
      <b>「← 会計にもどる」</b>が出ます。月の締めは「分析」タブにもあります。</p>

    ${payReadyHtml(m)}

    ${acctCostHtml(m)}

    ${acctYearHtml()}`;
}

function acctKawaHtml(){
  const m=stMonth, k=payKawa(m), c=closing(m), s=payMonth(m).kawa||{};
  const line=(l,v,cls)=>`<tr class="${cls||""}"><th>${l}</th><td>${yen(v)}</td></tr>`;
  return `<table class="chk an"><tbody>
      ${line("小計（純売上・サロンボードぶん計算ずみ）",k.sub,"bdtot")}
      ${line(`物販原価${k.handCost
        ?`<br><small style="color:var(--alert)">手入力。自動なら ${yen(k.autoCost)}（差 ${yen(k.cost-k.autoCost)}）</small>`
        :`<br><small style="color:var(--ink3)">自動：商品 ${yen(k.costGoods)} ＋ プレゼント ${yen(k.costGift)} ＋ キャンペーン ${yen(k.costCamp)}</small>`}`,-k.cost)}
      ${line("報酬の対象額",k.base,"bdtot")}
      ${line(`${Math.round(k.rate*100)/10}割加味金額（切り捨て）`,k.share)}
      ${line(`立替（川口さんが立て替えた仕入代）${k.handTate
        ?`<br><small style="color:var(--alert)">手入力。自動なら ${yen(k.autoTate)}</small>`
        :k.tateSrc==="buy"
        ?`<br><small style="color:var(--ink3)">仕入れの合計 ${yen(k.adv.total)}（伝票${k.adv.n}枚／商品 ${yen(k.adv.goods)}・材料 ${yen(k.adv.mat)}・消耗品 ${yen(k.adv.supply)}）＋ 差分 ${yen(k.tateAdd)}</small>`
        :`<br><small style="color:var(--ink3)">物販原価 ${yen(k.cost)} ＋ 差分 ${yen(k.tateAdd)}</small>`}`,k.tate)}
      ${line(`パート負担分${k.handPart
        ?`<br><small style="color:var(--alert)">手入力。自動なら ${yen(k.autoPart)}</small>`
        :`<br><small style="color:var(--ink3)">（水野さん ${yen(k.mzTotal)} − 耳つぼ ${yen(k.mzMimi)}）× ${Math.round(k.partRate*100)}％</small>`}`,-k.part)}
      ${line("合計",k.total,"bdtot")}
    </tbody></table>
    ${(()=>{const w=[];
      if(k.handCost&&Math.abs(k.cost-k.autoCost)>=10000)
        w.push(`<b>物販原価が自動の計算と ${yen(Math.abs(k.cost-k.autoCost))} 違います。</b>
          自動は ${yen(k.autoCost)}（商品 ${yen(k.costGoods)}／プレゼント ${yen(k.costGift)}／キャンペーン ${yen(k.costCamp)}）。
          カルテにプレゼント・キャンペーンを入れていない月は自動が少なく出ます。`);
      if(!k.mzHand)
        w.push(`<b>水野さんの明細が空です。</b>パート負担分が0で計算されています。
          先に「水野さんの支払明細」を入れてください。`);
      if(k.handTate&&Math.abs(k.tate-k.autoTate)>=1)
        w.push(`<b>立替を手で入れています。</b>ふだんは空でよく、自動で出ます。`);
      if(!k.handTate&&k.tateSrc==="buy"&&k.adv.n===0)
        w.push(`<b>この月の仕入れが1枚も入っていません。</b>立替が ${yen(k.tateAdd)} で計算されています。
          先に「会計の② 仕入れ」で伝票を入れ、<b>「この代金を払ったのは 川口さんの立替」</b>にしてください。`);
      /* v186：月の締め（分析タブ）にしか出ていなかった2つを、ここにも出す。
         どちらも**物販原価が二重／不足になる**知らせなので、明細を作る手前で見えたほうがよい */
      if(c.giftStock&&Math.abs(c.giftStock-c.cGift)>=1)
        w.push(`<b>在庫表のプレゼント欄（${yen(c.giftStock)}）とカルテのぶん（${yen(c.cGift)}）が違います。</b>
          原価はカルテのぶんだけを数えています（二重にしないため）。`);
      const dup=dupCharts(m);
      if(dup.length)
        w.push(`<b>同じ来店にカルテが2件ある組が ${dup.length}件あります。</b>
          材料とプレゼントの原価が二重に乗っているおそれがあります
          （重なっているぶん およそ ${yen(dup.reduce((a,x)=>a+x.dupCost,0))}）。`);
      return w.length?`<p class="note" style="color:var(--alert)">${w.join("<br>")}</p>`:"";})()}
    ${k.tateSrc==="buy"&&k.adv.n?`<details style="margin-top:12px"><summary class="note" style="cursor:pointer;margin:0">
      立替の中身（伝票${k.adv.n}枚）</summary>
      <table class="chk an" style="margin-top:8px"><thead><tr>
        <th>仕入日</th><th>仕入先</th><th>品目</th><th>金額</th></tr></thead><tbody>
      ${k.adv.rows.map(r=>`<tr><th>${esc(String(r.date).replace(/-/g,"/"))}</th>
        <td>${esc(r.src)}${r.no?`<br><small style="color:var(--ink3)">${esc(r.no)}</small>`:""}</td>
        <td class="hi">${r.n}</td><td>${yen(r.total)}</td></tr>`).join("")}
      <tr class="bdtot"><th>合計</th><td>商品 ${yen(k.adv.goods)}／材料 ${yen(k.adv.mat)}／消耗品 ${yen(k.adv.supply)}</td>
        <td></td><td>${yen(k.adv.total)}</td></tr>
      </tbody></table></details>`:""}
    <div class="sheet" style="margin-top:14px">
      <label class="f">入力するところ（空にすると自動）</label>
      <div class="grid">
        <div><label class="f" for="pk-cost">物販原価</label>
          <input class="f-in" id="pk-cost" type="number" value="${k.handCost?k.cost:""}"
            placeholder="自動 ${k.autoCost}">
          <span class="note">自動 ${yen(k.autoCost)}＝ Squareで売れたぶん ${yen(k.costGoods)}
            ＋ プレゼント ${yen(k.costGift)} ＋ キャンペーン ${yen(k.costCamp)}<br>
            <b>「Squareで売れたぶん」は取り込みのたびに自動で入ります（v131）。</b>
            ふだんはこの欄を空のままにしてください。</span></div>
        <div style="grid-column:1/-1"><label class="f">立替の出しかた</label>
          <div class="segk" style="margin:0">
            <button type="button" id="pk-tsrc-buy"${k.tateSrc==="buy"?' class="on"':""}>仕入れの合計</button>
            <button type="button" id="pk-tsrc-cost"${k.tateSrc==="buy"?"":' class="on"'}>物販原価＋差分</button>
          </div>
          <span class="note">${k.tateSrc==="buy"
            ?`仕入れで<b>「川口さんの立替」にした伝票</b>の合計です。伝票${k.adv.n}枚・
              商品 ${yen(k.adv.goods)}／材料 ${yen(k.adv.mat)}／消耗品 ${yen(k.adv.supply)}
              ＝ <b>${yen(k.adv.total)}</b>。（物販原価＋差分なら ${yen(k.autoTateCost)}）`
            :`売れた商品の原価をそのまま返す、v110からの出しかたです。
              （仕入れの合計なら ${yen(k.autoTateBuy)}）`}</span></div>
        <div><label class="f" for="pk-tadd">立替に上乗せする差分</label>
          <input class="f-in" id="pk-tadd" type="number" value="${s.tateAdd||0}">
          <span class="note">立替 ＝ ${k.tateSrc==="buy"?`仕入れの合計 ${yen(k.adv.total)}`:`物販原価 ${yen(k.cost)}`} ＋ 差分 ＝ ${yen(k.autoTate)}</span></div>
        <div><label class="f" for="pk-tate">立替（自動と違うときだけ）</label>
          <input class="f-in" id="pk-tate" type="number" value="${k.handTate?k.tate:""}"
            placeholder="自動 ${k.autoTate}"></div>
        <div><label class="f" for="pk-part">パート負担分（自動と違うときだけ）</label>
          <input class="f-in" id="pk-part" type="number" value="${k.handPart?k.part:""}"
            placeholder="自動 ${k.autoPart}">
          <span class="note">（水野さん ${yen(k.mzTotal)} − 耳つぼ ${yen(k.mzMimi)}）× ${Math.round(k.partRate*100)}％</span></div>
        <div><label class="f" for="pk-rate">川口さんの歩合（％）</label>
          <input class="f-in" id="pk-rate" type="number" value="${Math.round(k.rate*100)}"></div>
        <div><label class="f" for="pk-prate">パート負担の割合（％）</label>
          <input class="f-in" id="pk-prate" type="number" value="${Math.round(k.partRate*100)}"></div>
      </div>
      <label class="f" for="pk-note" style="margin-top:10px">備考</label>
      <input class="f-in" id="pk-note" value="${esc(k.note)}">
      <div class="actions">
        <button class="btn" id="pk-save">保存</button>
        <button class="btn quiet" id="pk-print">明細を出す（印刷）</button>
      </div>
    </div>
    <p class="note">
      <b>物販原価</b>は<b>渡した商品の原価</b>です（仕入れた額ではありません）。
      Squareで売れたぶん ${yen(k.costGoods)}（在庫表の 販売数×原価）に、
      <b>Squareを通らないぶん</b>——カルテのプレゼント ${yen(k.costGift)} と
      キャンペーンで渡した商品 ${yen(k.costCamp)} ——を足して <b>${yen(k.autoCost)}</b> です。
      ${(k.costGift+k.costCamp)===0?`<b style="color:var(--alert)">いまカルテのプレゼント・キャンペーンが0円です。</b>
        渡した商品をカルテで選んでいないと、そのぶん原価が少なく出ます。`:""}<br>
      <b>立替</b>は川口さんが商品を立て替えて仕入れているぶんなので、
      <b>物販原価と同じ額が基本</b>です。過去のぶんを乗せる月だけ「差分」に入れてください
      （2026年7月は差分18,902を乗せて89,460でした）。<br>
      <b>パート負担分</b>は<b>（水野さんの支払額 − 耳つぼぶん）× ${Math.round(k.partRate*100)}％</b>で自動です。
      耳つぼの ${yen(k.mzMimi)} は水野さん自身の技術料なので外し、残り ${yen(k.mzHand)} を
      川口さんと6:4で負担しています。<b>水野さんの明細を先に入れてください。</b>
      ${!k.mzHand?`<b style="color:var(--alert)">いま水野さんの明細が空なのでパート負担が0です。</b>`:""}<br>
      ${c.hp.hasBill?""
        :hpbPast(m)?`この月は<b>サロンボードのポイント・スマート払いを取り込めない古い月</b>です。
          Squareの数字だけで計算しています。`
        :`<b style="color:var(--alert)">ホットペッパーの請求書がまだ転記されていません。</b>
          小計が変わるので、先に「会計」タブ →「① サロンボードの取り込み」で入れてください。`}</p>`;
}

function acctMizuHtml(){

  return `<div class="xscroll"><table class="chk an"><thead><tr>
      <th>備考</th><th>時間・件数</th><th>時給・単価</th><th>金額</th><th></th></tr></thead><tbody>
      ${rows.map((r,i)=>`<tr>
        <th><input class="f-in" data-mn="${i}" value="${esc(r.n||"")}" placeholder="全身60分 2人"></th>
        <td><input class="f-in" data-mq="${i}" type="number" step="0.5" value="${r.q||0}" style="width:80px"></td>
        <td><input class="f-in" data-mu="${i}" type="number" value="${r.unit||0}" style="width:90px"></td>
        <td>${yen(Math.round((+r.q||0)*(+r.unit||0)))}</td>
        <td><button class="btn quiet" data-md="${i}">消す</button></td></tr>`).join("")}
      ${z.mimi?`<tr style="background:#f3f8f5">
        <th>${esc((db.mimi||{}).cat||"耳ツボジュエリー")}<small style="color:var(--ink3)">　自動</small></th>
        <td>${z.mimiQty}</td><td>${yen(z.mimiQty?Math.round(z.mimi/z.mimiQty):0)}</td>
        <td>${yen(z.mimi)}</td><td></td></tr>`:""}
      <tr class="bdtot"><th>合計</th><td></td><td></td><td>${yen(z.total)}</td><td></td></tr>
    </tbody></table></div>
    <div class="actions">
      <button class="btn quiet" id="pz-add">行を足す</button>
      <button class="btn" id="pz-save">保存</button>
      <button class="btn quiet" id="pz-print">明細を出す（印刷）</button>
    </div>
    <div class="sheet" style="margin-top:12px">
      <label class="f" for="pz-note">備考</label>
      <input class="f-in" id="pz-note" value="${esc(z.note)}">
      <label class="f" for="pz-wage" style="margin-top:10px">行を足すときの既定の時給</label>
      <input class="f-in" id="pz-wage" type="number" value="${+db.pay.mizuWage||1200}" style="max-width:140px">
    </div>
    <p class="note">時給の仕事（全身60分・キャンペーン準備）と件数の仕事（Sパーツ10分・顔脱毛）が
      混ざるので、<b>行ごとに単価を入れる</b>形にしてあります。<br>
      <b>耳つぼジュエリーの行は自動です。</b>この月は ${z.mimiQty}件・売上 ${yen(z.mimiYen)} で、
      場所代 ${yen((db.mimi||{}).unit||0)}/件をサロンに残した ${yen(z.mimi)} が水野さんへのぶんです。
      手で足す必要はありません。</p>`;
}

function payPrint(who){
  const m=stMonth;
  const k=who==="kawa"?payKawa(m):null, z=who==="mizu"?payMizu(m):null;
  const nm=who==="kawa"?"川口　香子":"水野　奈津子";
  const tot=who==="kawa"?k.total:z.total;
  const body=who==="kawa"

    document.getElementById("ac-py").onclick=()=>{stMonth=shiftMonth(stMonth,-12);renderAcct()};
    document.getElementById("ac-ny").onclick=()=>{stMonth=shiftMonth(stMonth,12);renderAcct()};

  const m=stMonth;

      :acctPage==="hpb"?`<div id="hpbhost"></div>`
      :acctPage==="buy"?`<div id="buyhost"></div>`
      :`<div id="cashhost"></div>`)
    +acctStepHtml()+`</div>`;
  document.getElementById("ac-back").onclick=()=>setAcctPage("menu");
  if(mbtn){
    document.getElementById("ac-pm2").onclick=()=>{stMonth=shiftMonth(stMonth,-1);renderAcct()};
    document.getElementById("ac-nm2").onclick=()=>{stMonth=shiftMonth(stMonth,1);renderAcct()};
  }
  el.querySelectorAll("[data-acgo]").forEach(b=>b.onclick=()=>setAcctPage(b.dataset.acgo));

  // v190：①②と現金出納帳は、それぞれの画面をこの中に描く（連携タブには置かない）
  if(acctPage==="hpb"){ renderHpb(); return; }
  if(acctPage==="buy"){ renderBuy(); return; }
  if(acctPage==="cash"){ renderCashbook(); return; }

  const put=(o)=>{
    if(!db.pay.months[m]) db.pay.months[m]={};
    Object.assign(db.pay.months[m],o);
  };
  if(acctPage==="kawa"){
    document.getElementById("pk-save").onclick=async()=>{
      const v=id=>document.getElementById(id).value;
      const num=id=>v(id)===""?null:(+v(id)||0);
      put({kawa:{cost:num("pk-cost"), tate:num("pk-tate"), part:num("pk-part"),
                 tateAdd:+v("pk-tadd")||0, tateSrc:payKawa(m).tateSrc,
                 note:v("pk-note").trim()}});
      db.pay.rate=(+v("pk-rate")||0)/100;
      db.pay.partRate=(+v("pk-prate")||0)/100;
      await save(); renderAcct(); toast("保存しました");
    };
    document.getElementById("pk-print").onclick=()=>payPrint("kawa");
    // 立替の出しかたを切り替える（v129）。選んだだけで保存する
    const tsrc=async(v)=>{
      const s=Object.assign({},payMonth(m).kawa||{},{tateSrc:v});
      put({kawa:s}); await save(); renderAcct();
      toast(v==="buy"?"立替を仕入れの合計で出します":"立替を物販原価＋差分で出します");
    };
    document.getElementById("pk-tsrc-buy").onclick=()=>tsrc("buy");
    document.getElementById("pk-tsrc-cost").onclick=()=>tsrc("cost");
    return;
  }
  /* ---- 画面に打ってあるものを、そのまま読む（v190） ----
     もとは「行を足す」「消す」が **db に入っている行**を読み直していた。
     打っただけでまだ保存していない行は、行を足した瞬間に消えていた。
     ★ 読むのは data-mn の行だけ。耳つぼの自動行には入力欄が無いので混ざらない */
  const readRows=()=>{
    const rs=[];
    el.querySelectorAll("[data-mn]").forEach(i=>{
      const k=+i.dataset.mn;
      rs[k]={n:i.value,
             q:+el.querySelector(`[data-mq="${k}"]`).value||0,
             unit:+el.querySelector(`[data-mu="${k}"]`).value||0};
    });
    return rs.filter(Boolean);
  };
  const saveRows=async(rs)=>{
    const s=payMonth(m).mizu||{};
    const nt=document.getElementById("pz-note");
    put({mizu:{rows:rs,note:nt?nt.value.trim():(s.note||"")}});
    const wg=document.getElementById("pz-wage");
    if(wg) db.pay.mizuWage=+wg.value||1200;
    await save(); renderAcct();
  };
  el.querySelectorAll("[data-md]").forEach(b=>b.onclick=async()=>{
    const rs=readRows(); rs.splice(+b.dataset.md,1); await saveRows(rs);
  });
  document.getElementById("pz-add").onclick=async()=>{
    const rs=readRows(); rs.push({n:"",q:0,unit:+db.pay.mizuWage||1200}); await saveRows(rs);
  };
  document.getElementById("pz-save").onclick=async()=>{
    await saveRows(readRows()); toast("保存しました");
  };
  /* ④へ送る前に**必ず保存する**（v190）。
     ここだけ自動保存ではないので、保存せずに④へ進むと行が消えたうえに
     パート負担分が0で計算される。締めのいちばん危ない段差なので、次へで保存してから送る */
  el.querySelectorAll("[data-acgo]").forEach(b=>b.onclick=async()=>{
    const to=b.dataset.acgo;
    await saveRows(readRows());
    setAcctPage(to); toast("水野さんの明細を保存しました");
  });
  document.getElementById("pz-print").onclick=()=>payPrint("mizu");
}

async function applyCustSync(){
  if(!custSync) return;
  const addCust=x=>db.customers.push({id:uid(),sqid:x.sqid,name:x.name,kana:"",tel:x.tel||"",
    birth:x.birth||"",first:"",tags:"",addr:x.addr||"",caution:"",memo:x.note||""});
  const fillFrom=(c,x)=>{ let f=0;
    if(!c.tel&&x.tel){ c.tel=x.tel; f++; }
    if(!c.birth&&x.birth){ c.birth=x.birth; f++; }
    if(!c.addr&&x.addr){ c.addr=x.addr; f++; }
    return f?1:0; };
  let link=0, fill=0, add=0, skip=0;
  custSync.hit.forEach(({x,c})=>{ if(!c.sqid){ c.sqid=x.sqid; link++; } fill+=fillFrom(c,x); });
  custSync.near.forEach(({x,c})=>{
    const p=custPick[x.sqid];
    if(p==="same"){ if(!c.sqid){ c.sqid=x.sqid; link++; } fill+=fillFrom(c,x); }
    else if(p==="new"){ addCust(x); add++; }
    else skip++;
  });
  custSync.sqOnly.forEach(x=>{ addCust(x); add++; });
  await save(); renderList(); renderDetail();
  custSync=null; custPick={}; renderCustSync();
  toast(`結びつけ${link}名・欄を埋めた${fill}名・追加${add}名${skip?`・保留${skip}名`:""}`);
}

    <div class="actions">
      <label class="btn phbtn">写真を撮る
        <input type="file" accept="image/*" capture="environment" id="hb-shot"></label>
      <label class="btn quiet phbtn">画像を選ぶ
        <input type="file" accept="image/*" id="hb-pick"></label>
      ${h.img?`<button class="btn quiet" id="hb-imgdel">写しを消す</button>`:""}
    </div>
    ${h.img?`<div style="margin-top:10px">
        <img src="${h.img}" alt="請求書の写し" style="max-width:100%;border-radius:8px;border:1px solid var(--line,#ddd)">
        <p class="note">${esc(h.imgAt||"")}に添付。タップで拡大はできません（大きく見たいときは元の画像を開いてください）。</p>
      </div>`:`<p class="note">まだ入っていません。</p>`}
    <p class="note">いま保存しているデータぜんたいは ${Math.round(dataSize()/1024)}KB です。
      ${dataSize()>3500000?`<b style="color:var(--alert)">大きくなってきました。</b>
        古い月の写しを消すか、JSONに書き出して外に置いてください。`:""}</p>
  </div>`;
}
function bindHpbBill(m){
  const msg=(t,ok)=>{const e=document.getElementById("hb-msg"); if(!e) return;
    e.textContent=t; e.style.color=ok?"var(--accent)":"var(--alert)";};
  const need=()=>{
    if(!db.hpb) db.hpb={};
    if(!db.hpb[m]) db.hpb[m]={at:today(),rows:[],smart:{}};
    return db.hpb[m];
  };
  document.querySelectorAll("[data-adjn]").forEach(i=>i.oninput=()=>{
    hpbAdj[+i.dataset.adjn].n=i.value; });
  document.querySelectorAll("[data-adjv]").forEach(i=>i.oninput=()=>{
    hpbAdj[+i.dataset.adjv].v=+i.value||0; });
  document.querySelectorAll("[data-adjdel]").forEach(b=>b.onclick=()=>{
    hpbAdj.splice(+b.dataset.adjdel,1); renderHpb(); });
  document.getElementById("hb-addadj").onclick=()=>{ hpbAdj.push({n:"",v:0}); renderHpb(); };
  document.getElementById("hb-save").onclick=async()=>{
    const r=need();
    r.bill={grant:+document.getElementById("hb-grant").value||0,
            pt:+document.getElementById("hb-pt").value||0,
            adj:hpbAdj.filter(x=>x.n||x.v).map(x=>({n:x.n,v:+x.v||0})),
            note:document.getElementById("hb-note").value.trim(),
            at:today()};
    await save(); hpbAdjLoad(m,true); renderHpb(); renderVisit(); toast("請求書の数字を保存しました");
  };
  const del=document.getElementById("hb-del");
  if(del) del.onclick=async()=>{
    if(!confirm("請求書から転記した数字を消します。よろしいですか？"))return;
    delete db.hpb[m].bill; hpbAdj=[]; await save(); hpbAdjLoad(m,true); renderHpb(); renderVisit();
    toast("消しました");
  };
  const shot=async e=>{
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    msg("読み込み中…",true);
    try{
      const d=await shrinkImage(f,1400,0.7);
      const r=need(); r.img=d; r.imgAt=today();
      await save(); renderHpb(); toast(`請求書の写しを入れました（約${Math.round(d.length/1024)}KB）`);
    }catch(err){ msg("入れられませんでした："+err.message,false); }
  };
  document.getElementById("hb-shot").onchange=shot;
  document.getElementById("hb-pick").onchange=shot;
  const idel=document.getElementById("hb-imgdel");
  if(idel) idel.onclick=async()=>{
    if(!confirm("請求書の写しを消します。よろしいですか？"))return;
    delete db.hpb[m].img; delete db.hpb[m].imgAt; await save(); renderHpb(); toast("消しました");
  };
}

function hpbDraftMonth(){
  const all=[...((hpbDraft.bill||{}).rows||[]),...((hpbDraft.smart||{}).rows||[])];
  const t={};
  all.forEach(x=>{ const m=(x.date||"").slice(0,7); if(m) t[m]=(t[m]||0)+1; });
  const ks=Object.keys(t).sort((a,b)=>t[b]-t[a]);
  return {m:ks[0]||stMonth, all:ks};
}
function renderHpb(){
  const el=document.getElementById("hpbhost"); if(!el) return;
  const cur=hpbSales(stMonth);
  const d=hpbDraft, dm=hpbDraftMonth();
  const smMap={};
  ((d.smart||{}).rows||[]).forEach(x=>{ smMap[x.no]=(smMap[x.no]||0)+x.amt; });

  // 下書きの集計（反映前でも数字を見せる）
  let pay=0,pt=0,gift=0,grant=0;
  ((d.bill||{}).rows||[]).forEach(x=>{ pay+=x.pay; pt+=x.pt; gift+=x.gift; grant+=x.grant; });
  const smart=Object.values(smMap).reduce((a,b)=>a+b,0);
  const off=pt+gift+smart, gross=pay+pt+gift;
  const orphan=Object.keys(smMap).filter(no=>!((d.bill||{}).rows||[]).some(x=>x.no===no));
  const bad=hpbGrantCheck((d.bill||{}).rows);

  const line=(l,v,cls)=>`<tr class="${cls||""}"><th>${l}</th><td>${yen(v)}</td></tr>`;

  el.innerHTML=`
    <div class="sheet">
      <p class="note" style="margin:0 0 12px">サロンボードの
        <b>「振込・請求明細」</b>と<b>「スマート支払い振込・明細」</b>のCSVを入れてください。
        2つとも入れると、その月のうち<b>Squareを通らないぶん</b>（利用ポイント・利用ギフト券・
        スマート支払い）が分かるので、売上に足して月の締めを合わせられます。
        <b>ファイルの中身だけを見て、どちらの明細かを判断します</b>（名前は変えても大丈夫です）。</p>
      <div class="actions">
        <label class="btn phbtn">CSVを選ぶ（2つ同時でも可）
          <input type="file" id="hp-file" accept=".csv,text/csv,text/plain" multiple></label>
        ${(d.bill||d.smart)?`<button class="btn quiet" id="hp-clear">読み込みをやめる</button>`:""}
      </div>
      <p class="note" id="hp-msg" ${d.err?'style="color:var(--alert)"':""}>${esc(d.err||"")}</p>
      <p class="note">読めるのは <b>.csv</b> だけです。Shift_JIS のままで大丈夫です。</p>
    </div>

    ${(d.bill||d.smart)?`
    <div class="sheet">
      <div class="schbar" style="margin:0 0 10px">
        <span class="title">読み取った内容</span>
        <select class="f-in" id="hp-month" style="width:auto">
          ${(dm.all.length?dm.all:[dm.m]).map(x=>
            `<option value="${x}"${x===dm.m?" selected":""}>${x.replace("-","年")}月ぶんとして入れる</option>`).join("")}
        </select>
      </div>
      <table class="chk an"><tbody>
        <tr><th>振込・請求明細</th><td>${d.bill?`${d.bill.rows.length}件`:'<b style="color:var(--alert)">まだ</b>'}</td></tr>
        <tr><th>スマート支払い明細</th><td>${d.smart?`${d.smart.rows.length}件`:'<b style="color:var(--alert)">まだ</b>'}</td></tr>
        ${line("施術総額（税込）",gross,"bdtot")}
        ${line("　来店処理金額",pay)}
        ${line("　利用ポイント",pt)}
        ${line("　利用ギフト券",gift)}
        ${line("うちスマート支払い（事前決済）",smart)}
        ${line("Squareに載らない＝売上に足すぶん",off,"bdtot")}
        ${line("店頭で受け取る＝Squareに入っているはず",pay-smart)}
        <tr><th>付与ポイント（原価に足す）</th><td>${grant}pt ＝ ${yen(grant)}</td></tr>
      </tbody></table>
      <div class="actions">
        <button class="btn" id="hp-apply"${d.bill?"":" disabled"}>この月に反映する</button>
      </div>
      <p class="note">
        ${d.bill?"":`<b style="color:var(--alert)">振込・請求明細が入っていないので反映できません。</b>`}
        ${orphan.length?`<br><b style="color:var(--alert)">スマート支払いのうち ${orphan.length}件が、請求明細に同じ予約番号で見つかりません。</b>
          月がまたがっているかもしれません（${esc(orphan.slice(0,3).join("・"))}）。`:""}
        ${bad.length?`<br><b style="color:var(--alert)">付与ポイントが検算（税抜の1%）と合わない行が ${bad.length}件あります。</b>
          ${esc(bad.slice(0,3).map(x=>x.name).join("・"))} など。`:""}
        ${((d.bill||{}).rows||[]).some(x=>x.fix)?`<br>訂正のある行があります。<b>差引後の数字</b>で計算しています。`:""}
      </p>
    </div>`:""}

    <div class="sheet" style="margin-top:14px">
      <label class="f">${stMonth.replace("-","年")}月に入っているぶん</label>
      ${cur.have?`<table class="chk an"><tbody>

          ${line("　利用ポイント",cur.pt)}
          ${line("　利用ギフト券",cur.gift)}
          ${line("　スマート支払い",cur.smart)}
          ${line("店頭ぶん（Squareの中）",cur.store)}

        </tbody></table>
        <p class="note">${cur.n}件・${esc(cur.at||"")}に取り込み。
          入れ直すときは、もう一度CSVを読ませて反映すれば置きかわります。</p>
        <div class="actions"><button class="btn quiet" id="hp-undo">この月のぶんを取り消す</button></div>`
      :`<p class="note">この月はまだ取り込んでいません。</p>`}

      ここで足すと二重になります。だから足していません。<br>
      付与ポイントは店が負担する原資なので、1pt＝1円として月締めの原価に入れています。
      実際の請求書と数字が違うときは、手数料や税のぶんかもしれません。見比べてください。</p>`;

  const msg=(t,ok)=>{const e=document.getElementById("hp-msg"); if(!e) return;
    e.textContent=t; e.style.color=ok?"var(--accent)":"var(--alert)";};

  document.getElementById("hp-file").onchange=async e=>{
    const files=[...e.target.files]; if(!files.length) return;
    hpbDraft.err="";
    for(const f of files){
      try{
        const txt=await readTextFile(f);
        const p=parseHpb(txt);
        if(p.kind==="smart") hpbDraft.smart=p; else hpbDraft.bill=p;
        hpbDraft.files.push(f.name);

    renderHpb();
    if(!hpbDraft.err) msg(`読みました（${hpbDraft.bill?"請求明細":""}${hpbDraft.bill&&hpbDraft.smart?"・":""}${hpbDraft.smart?"スマート支払い":""}）`,true);

    delete db.hpb[stMonth]; await save(); renderHpb(); renderVisit(); toast("取り消しました");
  };
}

   カルテッツにある5つを、うちの作りに合わせて次のように置きかえている。

   | カルテッツ            | うち                                                     |

const TONES={
  beauty :{n:"ビューティー",   foot:"スタッフ一同、ご来店お待ちしております。", emo:"🌸"},
  luxury :{n:"ラグジュアリー", foot:"心よりお待ち申し上げております。",         emo:"✦"},

const SEGS={
  all   :{n:"LINE連携ずみの全員",     f:()=>true},

  risk  :{n:"失客まえの方",           f:c=>{const p=pace(c); return !!p&&(p.lv==="risk"||p.lv==="soon");}}

};
function ensureLine(){
  const s=Object.assign({},LINE0,db.line||{});
  if(!Array.isArray(s.reminds)) s.reminds=LINE0.reminds.map(x=>Object.assign({},x));
  if(!Array.isArray(s.follows)) s.follows=LINE0.follows.map(x=>Object.assign({},x));
  if(!TONES[s.tone]) s.tone="beauty";
  if(!["normal","hide","guide"].includes(s.nextMode)) s.nextMode="guide";
  db.line=s;
  if(!db.linesent||typeof db.linesent!=="object") db.linesent={};
  return s;
}
let lineTab="link", lineSel=new Set(), lineText="", linePage="menu", lineEdit=null;

function lineCode(c){
  if(!c.linkcode){
    const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    c.linkcode=Array.from({length:6},()=>A[Math.floor(Math.random()*A.length)]).join("");

/* QRに入れるURL＝トークが開いて「登録 A1B2C3」が入力済みになる */
function lineUrl(c){
  const oa=(db.line&&db.line.oaId||"").replace(/^@?/,"@");
  return `https://line.me/R/oaMessage/${encodeURIComponent(oa)}/?${encodeURIComponent("登録 "+lineCode(c))}`;

function fill(t,c,a){
  const p=pace(c);
  let r=t.replace(/{name}/g,c.name).replace(/{since}/g,p?p.since:"—")
         .replace(/{last}/g,p?p.last.replace(/-/g,"/"):"—");
  if(a) r=r.replace(/{date}/g,a.date.slice(5).replace("-","/"))
           .replace(/{dow}/g,DOW[D(a.date).getDay()])
           .replace(/{time}/g,a.start||"")
           .replace(/{menu}/g,a.menu||"")
           .replace(/{staff}/g,a.staff||"");
  return r;
}
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }
  catch(e){
    const ta=document.createElement("textarea");
    ta.value=t; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    let ok=false; try{ ok=document.execCommand("copy"); }catch(_){}
    ta.remove(); return ok;
  }
}
/* リマインドの対象＝指定日の予約（取消をのぞく） */
function remindList(offset){
  const d=shiftDay(today(),offset);
  return db.appts.filter(a=>isBooking(a)&&a.date===d)
    .sort((a,b)=>(a.start||"").localeCompare(b.start||""));
}
function birthdayThisMonth(m){
  const mm=m.slice(5,7);
  return db.customers.filter(c=>c.birth&&c.birth.slice(5,7)===mm)
    .sort((a,b)=>a.birth.slice(8).localeCompare(b.birth.slice(8)));
}
/* 未連携の方からの返信を取ってきて、名簿の候補と突き合わせる */
async function pullInbox(){
  const j=await relayGet("inbox");
  return (j.inbox||[]).map(x=>{
    const tel=(x.text.match(/0\d[\d\-()\s]{8}/)||[""])[0].replace(/[^0-9]/g,"");
    const txt=x.text.replace(/\s+/g,"");
    let hit=null;
    if(tel) hit=db.customers.find(c=>tel10(c.tel)&&tel10(c.tel)===tel)||null;
    if(!hit){
      const cands=db.customers.filter(c=>c.name&&txt.includes(c.name.replace(/\s+/g,"")));
      if(cands.length===1) hit=cands[0];
    }
    if(!hit&&x.disp){
      const cands=db.customers.filter(c=>c.name&&x.disp.replace(/\s+/g,"").includes(c.name.replace(/\s+/g,"")));
      if(cands.length===1) hit=cands[0];
    }
    return {...x, tel, cid:hit?hit.id:null, cname:hit?hit.name:""};
  }).filter(x=>!db.customers.some(c=>c.lineId===x.userId));
}
async function bindLine(cid,userId){
  const c=db.customers.find(x=>x.id===cid);
  await relayGet("bind",`&c=${cid}&u=${encodeURIComponent(userId)}&name=${encodeURIComponent(c.name)}`);
  c.lineId=userId; await save();
}
async function pullLinks(){
  const j=await relayGet("links");
  let n=0, b=0;
  (j.links||[]).forEach(l=>{
    const c=db.customers.find(x=>x.id===l.cid); if(!c) return;
    if(l.userId&&c.lineId!==l.userId){ c.lineId=l.userId; n++; }
    if(l.birth&&(!c.birth||c.birth.startsWith("0000"))){ c.birth=l.birth; b++; }
    c.lineBlocked=!!l.blocked;
  });
  return {n,b};
}

/* ---------- 設定にしたがって文面を組み立てる（v105） ---------- */
function toneOf(){ const s=db.line||{}; return TONES[s.tone]||TONES.beauty; }
/* 文末の署名。「店名＋そのトーンの絵文字」。切っていれば空 */
function signLine(){
  const s=db.line||{};
  if(s.signOn===false) return "";
  const t=toneOf();
  return ((s.sign||"")+(t.emo?" "+t.emo:"")).trim();
}
function jpYmd(d){
  const [y,m,dd]=d.split("-");
  return `${y}年${m}月${dd}日（${DOW[D(d).getDay()]}）`;
}
/* カルテッツの「ご予約日時」にあたる、決まった形の本体 */
function apptBlock(a){
  const l=[`ご予約日時\n${jpYmd(a.date)} ${a.start||""}より`];
  if(a.menu)  l.push(`メニュー：${a.menu}`);
  if(a.staff) l.push(`担当：${a.staff}`);
  return l.join("\n");
}
/* この予約より先に、その方の予約が入っているか */
function nextApptOf(cid,after){
  if(!cid) return null;
  return db.appts.filter(a=>isBooking(a)&&a.cid===cid&&a.date>(after||today()))
    .sort((x,y)=>(x.date+x.start).localeCompare(y.date+y.start))[0]||null;
}
/* 次回予約表示（カルテッツと同じ3択）。文末に足す1ブロックを返す */
function nextBlock(cid,after){
  const s=db.line||{};
  if(s.nextMode==="hide") return "";
  const nx=nextApptOf(cid,after);
  if(nx) return `次回のご予約\n${jpYmd(nx.date)} ${nx.start||""}より`;
  return s.nextMode==="guide"?(s.nextText||""):"";
}
/* 予約リマインドの1通ぶん。上の文＋ご予約日時＋下の文＋次回のご案内＋署名 */
function remindText(r,c,a){
  const nm=(c&&c.name)||a.name||"";
  const p=[];
  if(nm) p.push(`${nm}様`);
  if(r.top) p.push(fill(r.top,c||{name:nm},a));
  p.push(apptBlock(a));
  if(r.bot) p.push(fill(r.bot,c||{name:nm},a));
  const nx=nextBlock(a.cid,a.date); if(nx) p.push(nx);
  const sg=signLine(); if(sg) p.push(sg);
  return p.filter(Boolean).join("\n\n");
}
/* そのルールが今日送るぶん＝「N日後にご来店」の予約 */
function remindTargets(r){
  return remindList(+r.days||0);
}
/* フォローUPの1通ぶん */
function followText(f,c){
  const p=[fill(f.text||"",c)];
  const nx=nextBlock(c.id,today()); if(nx) p.push(nx);
  const sg=signLine(); if(sg) p.push(sg);
  return p.filter(Boolean).join("\n\n");
}
/* そのルールが今日送るぶん＝最終来店からちょうどN日たった、区分に当てはまる方。
   「N日以上」にすると押した日に何十通も飛ぶので、ちょうどN日にしてある */
function followTargets(f){
  const seg=SEGS[f.seg]||SEGS.all;
  return db.customers.filter(c=>{
    if(!c.lineId||c.lineBlocked) return false;
    const p=pace(c);
    if(!p||p.since!==(+f.days||0)) return false;
    return seg.f(c);
  });
}
/* 二重送信よけ。同じルール×同じ相手×同じきっかけは1回だけ */
function lineSentKey(rid,cid,tag){ return `${rid}|${cid}|${tag}`; }
function lineSentAt(k){ return (db.linesent||{})[k]||""; }
async function markLineSent(k){
  if(!db.linesent) db.linesent={};
  db.linesent[k]=today();
  const ks=Object.keys(db.linesent);
  if(ks.length>3000) ks.slice(0,ks.length-3000).forEach(x=>delete db.linesent[x]);
  await save();
}

async function lineSend(cids,text){
  if(cids.length===1) { await relayGet("push",`&c=${cids[0]}&text=${encodeURIComponent(text)}`); return 1; }
  const j=await relayGet("multicast",`&c=${cids.join(",")}&text=${encodeURIComponent(text)}`);
  return j.sent||cids.length;
}
