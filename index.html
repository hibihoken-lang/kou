<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="kou karte">
<title>salon de kou ｜ カルテ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@400;600&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#1B1E24;
    --ink2:#4A505A;
    --ink3:#818995;
    --paper:#EBEEE8;
    --card:#FFFFFF;
    --line:#D5DACF;
    --accent:#3F6B58;
    --accent-soft:#E1EBE4;
    --alert:#A8452E;
    --alert-soft:#F6E7E2;
    --r:10px;
    --jp:"Zen Kaku Gothic New",-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    --min:"Zen Old Mincho","Hiragino Mincho ProN",serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  #app{
    font-family:var(--jp); color:var(--ink); background:var(--paper);
    font-size:15px; line-height:1.65; -webkit-font-smoothing:antialiased;
    border-radius:14px; overflow:hidden; border:1px solid var(--line);
  }
  button,input,select,textarea{font:inherit;color:inherit}
  h1,h2,h3{margin:0;font-weight:500}

  /* ---- header ---- */
  .top{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding:14px 18px;background:var(--card);border-bottom:1px solid var(--line);
  }
  .brand{font-family:var(--min);font-size:19px;letter-spacing:.06em;white-space:nowrap;
         border:0;background:none;padding:0;text-align:left;cursor:pointer;color:inherit}
  .brand small{display:block;font-family:var(--jp);font-size:10px;letter-spacing:.22em;color:var(--ink3);margin-top:-2px}
  .search{flex:1;min-width:150px;position:relative}
  .search input{
    width:100%;padding:9px 12px 9px 32px;border:1px solid var(--line);
    border-radius:var(--r);background:var(--paper);outline:none;
  }
  .search input:focus{border-color:var(--accent);background:#fff}
  .search svg{position:absolute;left:10px;top:11px;opacity:.45}
  .btn{
    border:1px solid var(--accent);background:var(--accent);color:#fff;
    padding:9px 15px;border-radius:var(--r);cursor:pointer;white-space:nowrap;
  }
  .btn:hover{filter:brightness(1.08)}
  .btn.ghost{background:transparent;color:var(--accent)}
  .btn.quiet{background:transparent;border-color:var(--line);color:var(--ink2)}
  .btn.danger{background:transparent;border-color:var(--alert);color:var(--alert)}
  .btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,
  .row:focus-visible,.part:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* ---- layout ---- */
  .cols{display:block;min-height:560px}
  .list{background:var(--card)}
  .detail{padding:22px}
  #app[data-view="detail"] .list{display:none}
  #app[data-view="list"] .detail{display:none}
  #app[data-tab="list"] .back{display:inline-block}

  .row{
    display:block;width:100%;text-align:left;padding:12px 16px;
    border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer;
  }
  .row:hover{background:var(--paper)}
  .row[aria-current="true"]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
  .row b{font-weight:500}
  .row .kana{font-size:11px;color:var(--ink3);letter-spacing:.04em}
  .row .meta{font-size:11px;color:var(--ink3);font-family:var(--mono);margin-top:3px}
  .row .flag{color:var(--alert);font-size:11px}

  .lbar{display:flex;gap:6px;padding:9px 12px;border-bottom:1px solid var(--line);
        position:sticky;top:0;background:var(--card);z-index:2}
  .lbar .chip{padding:4px 11px;font-size:11.5px}
  .row .ago{font-family:var(--mono);padding:1px 7px;border-radius:999px;
            background:#EFEFEC;color:var(--ink2);font-weight:500}
  .row .ago.bad{background:var(--alert-soft);color:var(--alert)}
  .row .ago.low{background:#F7EBD2;color:#7A5309}
  .row .cyc{margin-left:8px;font-family:var(--mono)}
  .row .cnt{margin-left:8px}
  .row .lab{display:block;margin-top:3px;font-family:var(--jp);font-size:10px}
  .row .lab.bad{color:var(--alert)}
  .row .lab.low{color:#7A5309}

  .row.upcoming b{color:var(--accent)}
  .row.today b{color:#8A5A2B}
  .row.upcoming{background:linear-gradient(90deg,rgba(225,235,229,.55),transparent 60%)}
  .row.today{background:linear-gradient(90deg,rgba(247,235,210,.75),transparent 60%)}
  .meta.up{color:var(--accent);font-weight:500;margin-top:3px}
  .row.today .meta.up{color:#8A5A2B}
  .bk{display:inline-block;font-size:10px;padding:0 6px;border-radius:999px;
      background:var(--accent);color:#fff;margin-right:5px;font-weight:400}
  .bk.today{background:#8A5A2B}

  /* ---- 名簿の行（カルテッツ風） ---- */
  .lcount{margin-left:auto;font-size:11px;color:var(--ink3);font-family:var(--mono);align-self:center}
  .qrow{display:flex;align-items:center;gap:16px;padding:13px 18px;
        border-bottom:1px solid var(--line);cursor:pointer;background:var(--card)}
  .qrow:hover{background:var(--paper)}
  .qrow.sel{background:var(--accent-soft)}
  .qrow.upcoming{box-shadow:inset 3px 0 0 var(--accent)}
  .qrow.today{box-shadow:inset 3px 0 0 #8A5A2B;background:#FDFAF3}
  .qmain{flex:1;min-width:0}
  .qtop{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:3px}
  .lbadge{font-size:10px;padding:1px 7px;border-radius:3px;color:#fff;letter-spacing:.02em}
  .lbadge.ok{background:#4CAF3F}
  .lbadge.blk{background:#8A8F98}
  .lbadge.no{background:#fff;color:var(--ink3);border:1px solid var(--line)}
  .qtag{font-size:10px;padding:1px 7px;border-radius:3px;background:#F0EDE6;color:var(--ink2)}
  .qtag.warn{background:var(--alert);color:#fff}
  .qno{font-family:var(--mono);font-size:11px;color:var(--ink3)}
  .qname{font-size:15px;line-height:1.4}
  .qname b{font-weight:500}
  .qname span{font-size:11px;color:var(--ink3);margin-left:4px}
  .qname em{font-style:normal;font-family:var(--mono);font-size:12.5px;color:var(--ink2);margin-left:12px}
  .qrow .meta{font-size:11.5px;color:var(--ink3);margin-top:3px}
  .qrow .lab{display:inline;margin-left:8px}
  .qacts{display:flex;gap:6px;flex:none;flex-wrap:nowrap;justify-content:flex-end}
  .qacts button{border:1px solid var(--accent);background:#fff;color:var(--accent);
                border-radius:5px;padding:6px 10px;font-size:12px;cursor:pointer;
                white-space:nowrap;flex:none}
  .qacts button:hover{background:var(--accent);color:#fff}
  @media (max-width:880px){
    .qrow{flex-wrap:wrap}
    .qacts{width:100%;justify-content:flex-start}
    .qacts button{flex:1;min-width:0;padding:8px 4px;font-size:11.5px}
  }

  .empty{padding:48px 24px;text-align:center;color:var(--ink3);font-size:13px}
  .empty b{display:block;font-family:var(--min);font-size:16px;color:var(--ink2);margin-bottom:6px;font-weight:400}

  /* ---- detail ---- */
  .name{font-family:var(--min);font-size:26px;letter-spacing:.04em}
  .kana-lg{font-size:11px;color:var(--ink3);letter-spacing:.14em;margin-bottom:2px}
  .facts{display:flex;gap:20px;flex-wrap:wrap;margin:12px 0 0;font-size:13px;color:var(--ink2)}
  .facts span b{font-family:var(--mono);font-weight:400;color:var(--ink)}
  .caution{
    margin:14px 0 0;padding:10px 14px;background:var(--alert-soft);
    border-left:3px solid var(--alert);border-radius:0 6px 6px 0;font-size:13px;color:#6E2E1E;
  }
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .tag{font-size:11px;padding:2px 9px;border:1px solid var(--line);border-radius:999px;color:var(--ink2)}

  .divider{display:flex;align-items:center;gap:12px;margin:26px 0 14px}
  .divider h2{font-family:var(--min);font-size:15px;letter-spacing:.1em;white-space:nowrap}
  .divider::after{content:"";flex:1;height:1px;background:var(--line)}

  /* カルテ = ruled index card */
  .chart{
    background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:14px 16px 14px 20px;margin-bottom:10px;position:relative;
  }
  .chart::before{content:"";position:absolute;left:9px;top:12px;bottom:12px;width:1px;background:var(--accent);opacity:.35}
  .chart .date{font-family:var(--mono);font-size:13px;letter-spacing:.02em}
  .chart .staff{font-size:11px;color:var(--ink3);margin-left:8px}
  .chart .menu{font-size:14px;margin-top:2px}
  .chart dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:8px 0 0;font-size:12.5px}
  .chart dt{color:var(--ink3)}
  .chart dd{margin:0;color:var(--ink2);white-space:pre-wrap}
  .chart .del{position:absolute;right:8px;top:8px;border:0;background:none;color:var(--ink3);cursor:pointer;font-size:12px}
  .chart .del:hover{color:var(--alert)}

  /* ---- forms ---- */
  .sheet{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
  label.f{display:block;font-size:11px;letter-spacing:.1em;color:var(--ink3);margin-bottom:4px}
  .f-in{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);outline:none}
  .f-in:focus{border-color:var(--accent);background:#fff}
  textarea.f-in{min-height:64px;resize:vertical}
  .actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}

  /* ---- body map (signature) ---- */
  .map{display:flex;gap:22px;justify-content:center;padding:6px 0 2px}
  .map figure{margin:0;text-align:center}
  .map figcaption{font-size:10px;letter-spacing:.2em;color:var(--ink3);margin-top:4px}
  .part{fill:#fff;stroke:var(--line);stroke-width:1;cursor:pointer;transition:fill .12s}
  .part:hover{fill:var(--accent-soft)}
  .part[data-on="1"]{fill:var(--accent);stroke:var(--accent)}
  .maplabel{font-size:7px;fill:var(--ink3);pointer-events:none;font-family:var(--jp)}
  .picked{font-size:12px;color:var(--ink2);text-align:center;min-height:20px;margin-top:6px}
  .picked em{font-style:normal;color:var(--ink3)}

  /* ---- tabs ---- */
  .tabs{display:flex;flex-wrap:wrap;gap:2px;background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:2px}
  .tab{border:0;background:none;padding:6px 13px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--ink2);white-space:nowrap}
  .tab[aria-selected="true"]{background:var(--card);color:var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.06)}

  /* ---- ホーム（v97：入口のタイル。押すとその画面へ移る） ---- */
  .home{display:none;padding:22px 18px 28px}
  #app[data-tab="home"] .home{display:block}
  #app[data-tab="home"] .cols{display:none}
  #app[data-tab="home"] .search{display:none}
  .hometiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:14px}
  .htile{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    aspect-ratio:1/1;min-height:132px;padding:14px 10px;text-align:center;
    border:0;border-radius:8px;cursor:pointer;color:#fff;background:#7FAE99;
    transition:background .15s,box-shadow .15s,transform .1s;
  }
  .htile:hover{background:var(--accent);box-shadow:0 6px 18px rgba(63,107,88,.20)}
  .htile:active{transform:translateY(1px)}
  .htile svg{width:50px;height:50px;stroke:currentColor;fill:none;stroke-width:1.5;
             stroke-linecap:round;stroke-linejoin:round;opacity:.92}
  .htile .ht-t{display:block;font-family:var(--min);font-size:15px;font-weight:600;letter-spacing:.04em;line-height:1.35}
  .htile .ht-e{display:block;margin-top:4px;font-family:var(--jp);font-size:10px;
               letter-spacing:.05em;color:rgba(255,255,255,.72)}
  @media (max-width:520px){
    .hometiles{grid-template-columns:repeat(2,1fr);gap:10px}
    .htile{min-height:118px;gap:12px}
    .htile svg{width:40px;height:40px}
  }

  /* ---- schedule ---- */
  .sched{padding:18px;display:none}
  #app[data-tab="sched"] .sched{display:block}
  #app[data-tab="sched"] .cols{display:none}
  #app[data-tab="sched"] .search{display:none}
  .schbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .schbar .title{font-family:var(--min);font-size:21px;letter-spacing:.03em;text-align:center;flex:1;min-width:170px}
  .nav{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 11px;cursor:pointer;color:var(--ink2)}
  .nav:hover{border-color:var(--accent);color:var(--accent)}
  .grp{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .grp button{border:0;background:var(--card);padding:7px 13px;cursor:pointer;color:var(--ink2);
              border-right:1px solid var(--line);font-size:13px}
  .grp button:last-child{border-right:0}
  .grp button[aria-pressed="true"]{background:var(--ink);color:#fff}
  .grp button:hover:not([aria-pressed="true"]){background:var(--accent-soft)}

  .cw{border:1px solid var(--line);border-radius:10px;background:var(--card);overflow:hidden}
  .crow{display:flex}
  .cax{width:50px;flex:none;font-family:var(--mono);font-size:10px;color:var(--ink3)}
  .cday{flex:1;min-width:0;border-left:1px solid var(--line);position:relative}
  .chead{padding:7px 2px;text-align:center;font-size:12px;border-bottom:1px solid var(--line)}
  .chead.sun{color:#A8453A}
  .chead.sat{color:#33608F}
  .cday.now,.chead.now{background:#FCF8E9}
  .allday{display:flex;border-bottom:1px solid var(--line);min-height:32px}
  .allday .cax{display:flex;align-items:center;justify-content:flex-end;padding-right:8px;
               font-family:var(--jp);font-size:11px}
  .cax{position:relative}
  .nowline{position:absolute;left:0;right:0;height:2px;background:#C0392B;z-index:5;pointer-events:none}
  .nowline::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;
                   border-radius:50%;background:#C0392B}
  .nowtime{position:absolute;right:4px;transform:translateY(-50%);background:#C0392B;color:#fff;
           font-family:var(--mono);font-size:9px;padding:1px 5px;border-radius:3px;z-index:6}

  .cbody{display:flex;max-height:440px;overflow-y:auto}
  /* v196：iOS Safari は cursor:pointer が無い普通の div に click を配らない。
     月表示のマス（.mc）には付いていて iPad で押せたのに、週・日表示の時間帯には
     付いていなかった。これが「iPadで時間帯をタップしても入力欄が出ない」の正体 */
  .cbody .cday,.allday .cday{cursor:pointer;-webkit-tap-highlight-color:rgba(0,0,0,.06)}
  .hr{height:44px;border-top:1px solid var(--line);position:relative}
  .hr::after{content:"";position:absolute;left:0;right:0;top:21px;border-top:1px dotted var(--line);opacity:.65}
  .cax .hr{border-top:1px solid transparent;display:flex;align-items:center;
           justify-content:flex-end;padding-right:7px}
  .cax .hr::after{display:none}
  .ev{position:absolute;border-radius:4px;padding:2px 5px;font-size:11px;line-height:1.28;
      cursor:pointer;overflow:hidden;color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.75) inset}
  .ev .t{font-size:10px;opacity:.92;display:block}
  .ev .n{display:block;font-weight:500}
  .ev.cx{text-decoration:line-through;opacity:.8}

  .off{background:#F2A2C6;color:#54203D;border-radius:4px;padding:3px 7px;font-size:11px;
       margin:4px 3px;cursor:pointer;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--ink3)}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:3px;vertical-align:-1px}
  .legend i+i{margin-right:5px}
  .next{margin-top:10px;font-size:13px;color:var(--accent);font-weight:500}

  .mo{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);
      border-radius:10px;overflow:hidden;background:var(--card)}
  .mh{padding:6px;text-align:center;font-size:11px;color:var(--ink3);background:var(--paper);
      border-bottom:1px solid var(--line)}
  .mc{min-height:82px;border-top:1px solid var(--line);border-left:1px solid var(--line);
      padding:4px 4px 6px;cursor:pointer}
  .mc:nth-child(7n+1){border-left:0}
  .mc .d{font-family:var(--mono);font-size:11px;color:var(--ink3)}
  .mc.now{background:#FCF8E9}
  .mc.out{opacity:.35}
  .mc:hover{background:var(--accent-soft)}
  .mi{display:block;border-radius:3px;padding:1px 5px;margin-top:2px;color:#fff;font-size:10px;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ---- 在庫 ---- */
  .stock{padding:18px;display:none}
  #app[data-tab="stock"] .stock{display:block}
  #app[data-tab="stock"] .cols{display:none}
  #app[data-tab="stock"] .search{display:none}

  .sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
  .sum div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 14px}
  .sum span{display:block;font-size:11px;letter-spacing:.08em;color:var(--ink3);margin-bottom:3px}
  .sum b{font-family:var(--mono);font-size:18px;font-weight:500}
  .sum .adv{border-color:var(--accent);background:var(--accent-soft)}
  .sum .adv b{color:var(--accent)}

  .sum .tile{cursor:pointer;transition:border-color .12s}
  .sum .tile:hover{border-color:var(--accent)}
  .sum .tile.open{border-color:var(--accent);background:var(--accent-soft)}
  .sum .tile.open b{color:var(--accent)}
  .bd{margin-top:12px}
  .bdhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .bdhead b{font-family:var(--min);font-size:15px;letter-spacing:.04em}
  .bd .chk.an tbody th{font-weight:400;line-height:1.35}
  /* 出どころの色分け（v95）。手入力のカルテはSquareの売上レポートに載っていない */
  .bd tr.src-hand th,.bd tr.src-hand td{background:#FBF2DC}
  .bd tr.src-hand td:last-child{color:#7A5309}
  .srclg{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin:0 0 8px 2px}
  .srclg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
  .bd .bdtot th,.bd .bdtot td{border-top:2px solid var(--line);font-weight:500;background:var(--paper)}

  .filt{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:14px 0 12px}
  .chip{border:1px solid var(--line);background:var(--card);border-radius:999px;
        padding:5px 12px;font-size:12px;cursor:pointer;color:var(--ink2)}
  .chip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip:hover:not(.on){border-color:var(--accent);color:var(--accent)}

  .pe .pdel{border:1px solid var(--alert);background:none;color:var(--alert);
            border-radius:7px;padding:6px 12px;font-size:12px;cursor:pointer}
  .pe .pdel:hover{background:var(--alert);color:#fff}

  .photorow{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .pth{width:56px;height:56px;border-radius:9px;object-fit:cover;flex:none;
       border:1px solid var(--line);background:var(--paper)}
  .pth.ph{display:flex;align-items:center;justify-content:center;color:#fff;
          font-family:var(--min);font-size:20px;border:0}
  .phbtn{position:relative;overflow:hidden;cursor:pointer;font-size:12px;padding:7px 13px}
  .phbtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}

  .matrow{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .matrow .mat-p{flex:1;min-width:0}
  .matrow .mat-q{width:70px;text-align:right;font-family:var(--mono)}
  .matrow span{font-size:12px;color:var(--ink3)}
  .matrow .mat-x{border:0;background:none;color:var(--ink3);font-size:17px;cursor:pointer;padding:0 4px}
  .matrow .mat-x:hover{color:var(--alert)}
  .kb{display:inline-block;font-size:9px;color:#fff;padding:1px 6px;border-radius:3px;margin-right:6px}

  .plist{display:grid;gap:8px}
  .pc{background:var(--card);border:1px solid var(--line);border-radius:11px;overflow:hidden}
  .pc.open{border-color:var(--accent);box-shadow:0 2px 10px rgba(63,107,88,.10)}
  .ph-row{display:flex;align-items:center;gap:13px;padding:10px 14px;cursor:pointer}
  .ph-row:hover{background:var(--paper)}
  .pi{width:50px;height:50px;flex:none;border-radius:9px;object-fit:cover;
      background:var(--paper);border:1px solid var(--line)}
  .pi.ph{display:flex;align-items:center;justify-content:center;color:#fff;
         font-family:var(--min);font-size:19px;border:0}
  .pn{flex:1;min-width:0}
  .pn b{display:block;font-weight:500;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pn .sub{display:block;font-size:11px;color:var(--ink3);margin-top:2px}
  .pn .sub i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}
  .pq{text-align:right;flex:none;min-width:82px}
  .pq b{display:block;font-family:var(--mono);font-size:23px;font-weight:500;line-height:1.1}
  .pq span{display:block;font-family:var(--mono);font-size:11px;color:var(--ink3)}
  .pq em{display:inline-block;font-style:normal;font-size:10px;padding:1px 7px;border-radius:999px;margin-top:3px}
  .pq.zero b{color:var(--ink3)}
  .pq.zero em{background:#EFEFEC;color:var(--ink2)}
  .pq.low b{color:#9A6B10}
  .pq.low em{background:#F7EBD2;color:#7A5309}
  .pq.bad b{color:var(--alert)}
  .pq.bad em{background:var(--alert-soft);color:var(--alert)}

  /* ---- 月末の棚卸し（v128）----
     「今月動いたものだけ数える」ための色分け。左の帯の色で見分ける。
     琥珀＝数える／緑＝数えて合った／赤＝数えて差が出た／薄い灰＝先月から動いていない（数えなくてよい） */
  .pc{border-left:4px solid transparent}
  .pc.mv-todo{border-left-color:#D8A22B;background:#FFFDF6}
  .pc.mv-ok{border-left-color:var(--accent)}
  .pc.mv-ng{border-left-color:var(--alert);background:#FFF7F6}
  .pc.mv-none{opacity:.62}
  .mvtag{display:inline-block;font-size:9px;padding:1px 7px;border-radius:999px;margin-right:6px;
         font-family:var(--jp);letter-spacing:.02em}
  .mvtag.todo{background:#F7EBD2;color:#7A5309}
  .mvtag.ok{background:var(--accent-soft);color:var(--accent)}
  .mvtag.ng{background:var(--alert-soft);color:var(--alert)}
  .mvtag.none{background:#EFEFEC;color:var(--ink3)}
  /* v166／v170：棚卸しの一覧。動いたものと、動いていないものを色で分ける */
  .chk.an tr.ct-none th,.chk.an tr.ct-none td{color:var(--ink3);background:var(--paper)}
  .chk.an tr.ct-none .kb{opacity:.45}
  .chk.an tr.ct-sep th{background:var(--card);border-top:2px solid var(--line);
    color:var(--ink3);font-weight:400;font-size:12px;letter-spacing:.04em;padding:9px 12px}
  .chk.an tr.ct-done th,.chk.an tr.ct-done td{background:#F3F8F4}
  .invbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:0 0 12px;
          background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 14px}
  .invbar b{font-family:var(--mono);font-size:19px;font-weight:500}
  .invbar .iv{display:flex;flex-direction:column;line-height:1.25}
  .invbar .iv span{font-size:10px;letter-spacing:.06em;color:var(--ink3)}
  .invbar .sp{flex:1}
  .cntrow{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:flex-end;gap:9px;
          border-top:1px dashed var(--line);padding-top:10px;margin-top:2px}
  .cntrow .cbox{display:flex;flex-direction:column}
  .cntrow .cbox span{font-size:10px;letter-spacing:.06em;color:var(--ink3);margin-bottom:3px}
  .cntrow input{width:96px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;
                background:var(--paper);text-align:right;font-family:var(--mono);font-size:15px}
  .cntrow .cdiff{font-family:var(--mono);font-size:15px;padding:7px 9px}

  .pe{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:9px;
      padding:4px 14px 15px;border-top:1px solid var(--line)}
  .pe label span{display:block;font-size:10px;letter-spacing:.06em;color:var(--ink3);margin-bottom:3px}
  .pe input{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;
            background:var(--paper);text-align:right;font-family:var(--mono);font-size:15px}
  .pe input:focus{border-color:var(--accent);background:#fff;outline:none}
  .pe .calc b{display:block;padding:7px 9px;font-family:var(--mono);font-size:15px;text-align:right;
              font-weight:500;background:var(--accent-soft);border-radius:8px;color:var(--accent)}
  .pe .wide{grid-column:1/-1}
  .note{font-size:12px;color:var(--ink3);margin:14px 0 0;line-height:1.6}

  /* ---- 材料（レシピ）。v128で在庫タブの中に入れたので、専用のタブはもう無い ---- */
  .rcols{display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:start}
  .rlist{background:var(--card);border:1px solid var(--line);border-radius:11px;
         padding:10px;max-height:66vh;overflow-y:auto;display:grid;gap:3px}
  .rlist .f-in{margin-bottom:5px}
  .rmenu{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;
         text-align:left;border:0;background:none;border-radius:7px;padding:7px 9px;
         cursor:pointer;font-size:13px;color:var(--ink)}
  .rmenu:hover{background:var(--paper)}
  .rmenu.on{background:var(--accent-soft);color:var(--accent);font-weight:500}
  .rmenu span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rmenu em{font-style:normal;font-size:10px;color:var(--ink3);white-space:nowrap;flex:none}
  .rmenu.on em{color:var(--accent)}
  .rrow{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:8px 0;
        border-bottom:1px solid var(--line)}
  .rrow b{flex:1;min-width:140px;font-weight:400;font-size:13.5px}
  .rrow input[type=number]{width:78px;padding:6px 9px;border:1px solid var(--line);border-radius:7px;
        background:var(--paper);text-align:right;font-family:var(--mono)}
  .rrow select{padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:var(--paper)}
  .rrow .hint{font-size:11px;color:var(--ink3);white-space:nowrap}
  .rrow .rdel{border:0;background:none;color:var(--ink3);font-size:11px;cursor:pointer}
  .rrow .rdel:hover{color:var(--alert)}
  .rrow.add{border-bottom:0;padding-top:14px}
  .rrow.add select:first-child{flex:1;min-width:170px}
  table.chk{width:100%;border-collapse:collapse;font-size:13px}
  .chk th,.chk td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right}
  .chk thead th{font-size:11px;color:var(--ink3);font-weight:500;letter-spacing:.05em}
  .chk tbody th{text-align:left;font-weight:400}
  .chk td{font-family:var(--mono)}
  .chk td.ok{color:var(--accent)}
  .chk td.ng{color:var(--alert)}
  @media (max-width:720px){ .rcols{grid-template-columns:1fr} .rlist{max-height:230px} }

  /* ---- 売上 ---- */
  .visit{padding:18px;display:none}
  #app[data-tab="visit"] .visit{display:block}
  #app[data-tab="visit"] .cols{display:none}
  #app[data-tab="visit"] .search{display:none}
  .chip em{font-style:normal;margin-left:6px;font-family:var(--mono);opacity:.7}
  .pace{margin-top:9px;font-size:12.5px;color:var(--ink2);padding:7px 11px;border-radius:8px;
        background:var(--paper);display:inline-block}
  .pace em{font-style:normal;padding:1px 8px;border-radius:999px;font-size:11px}
  .pace.bad{background:var(--alert-soft);color:#6E2E1E}
  .pace.bad em{background:var(--alert);color:#fff}
  .pace.low{background:#F7EBD2;color:#7A5309}
  .pace.low em{background:#9A6B10;color:#fff}

  .sync{padding:18px;display:none;max-width:720px}
  .sync.wide{max-width:1180px}      /* 仕入れの仕分けだけ、根拠を右に置くので広く使う（v93） */
  #app[data-tab="sync"] .sync{display:block}
  #app[data-tab="sync"] .cols{display:none}
  #app[data-tab="sync"] .search{display:none}

  /* ---- 連携タブの入口（カードを押すと作業ページに移る。v82） ---- */
  .navlist{display:grid;gap:10px}
  .navcard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;
           background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 16px;
           font:inherit;color:inherit;transition:border-color .12s,box-shadow .12s}
  .navcard:hover{border-color:var(--accent);box-shadow:0 2px 10px rgba(63,107,88,.10)}
  .navcard .nc-i{flex:none;width:38px;height:38px;border-radius:10px;display:flex;
                 align-items:center;justify-content:center;font-size:19px;
                 background:var(--accent-soft);color:var(--accent)}
  .navcard .nc-t{flex:1;min-width:0}
  .navcard .nc-t b{display:block;font-family:var(--min);font-size:15px;font-weight:500;letter-spacing:.03em}
  .navcard .nc-t span{display:block;font-size:11.5px;color:var(--ink3);margin-top:3px;line-height:1.5}
  .navcard .nc-v{flex:none;text-align:right;font-family:var(--mono);font-size:14px;color:var(--ink2)}
  .navcard .nc-v em{display:block;font-style:normal;font-size:10px;color:var(--ink3);font-family:var(--jp)}
  .navcard .nc-v .warn{color:var(--alert)}
  .navcard .nc-a{flex:none;color:var(--ink3);font-size:17px}

  /* ---- お客様の照合（v99） ---- */
  .cslist{max-height:430px;overflow:auto;border:1px solid var(--line);
          border-radius:10px;background:var(--card);margin-top:12px}
  table.cs{width:100%;border-collapse:collapse;font-size:13px}
  .cs th,.cs td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
  .cs tbody th{font-weight:400}
  .cs thead th{position:sticky;top:0;z-index:1;background:var(--card);
               font-size:11px;color:var(--ink3);font-weight:500;letter-spacing:.05em}
  .cs td.num{font-family:var(--mono);text-align:right;white-space:nowrap}
  .cs tr:last-child td,.cs tr:last-child th{border-bottom:0}
  .cs .how{font-size:11px;color:var(--ink3)}
  .cs select{padding:4px 7px;border:1px solid var(--line);border-radius:7px;background:var(--card)}
  /* v190：せまい画面では見出しを次の行に落とす。
     375pxで「③ 水野さんの支払明細 2026年08月」が1文字ずつ縦に折れていた */
  .backbar{display:flex;align-items:center;gap:10px;margin:0 0 14px;flex-wrap:wrap}
  .backbar .title{font-family:var(--min);font-size:19px;letter-spacing:.03em}

  /* ---- 仕入れの品目カード（横に長い表をやめて縦に積む。v82） ---- */
  .bitem{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px 13px;margin-bottom:9px}
  .bitem.need{border-color:var(--alert);background:var(--alert-soft)}
  .bitem.off{opacity:.55}
  .bi-h{display:flex;align-items:center;gap:10px;margin-bottom:9px}
  .bi-on{flex:none;display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink3);cursor:pointer}
  .bi-on input{width:17px;height:17px;flex:none;margin:0}
  .bi-h .f-in{flex:1;min-width:0;font-size:13px;padding:6px 9px}
  .bi-g{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .bi-g label span,.bi-m label span{display:block;font-size:10px;letter-spacing:.06em;color:var(--ink3);margin-bottom:3px}
  .bi-g input{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:8px;
              background:var(--paper);text-align:right;font-family:var(--mono);font-size:14px}
  .bi-g input:focus{border-color:var(--accent);background:#fff;outline:none}
  .bi-g .amt b{display:block;padding:6px 8px;font-family:var(--mono);font-size:14px;text-align:right;
                font-weight:500;background:var(--accent-soft);border-radius:8px;color:var(--accent)}
  .bi-m{margin-top:8px}
  .bi-m select{width:100%;font-size:12.5px;padding:6px 8px}
  .segk{display:flex;align-items:center;gap:6px;margin-top:9px;flex-wrap:wrap}
  .segk>span{font-size:10px;letter-spacing:.06em;color:var(--ink3);margin-right:2px}
  .segk button{flex:1;min-width:66px;cursor:pointer;font:inherit;font-size:12.5px;padding:7px 4px;
               border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink2)}
  .segk button:hover{border-color:var(--accent)}
  .segk button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .bi-f{font-size:11px;color:var(--ink3);margin:8px 0 0;line-height:1.5}
  .bi-f .alert{color:var(--alert)}
  .bi-cost{margin-top:8px;padding:7px 9px;border-radius:8px;background:var(--paper);
           border:1px solid var(--line);font-size:11.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .bi-cost label{display:flex;align-items:center;gap:5px;cursor:pointer}
  /* ---- 仕分けは左、根拠（メール本文・PDF・写真）は右（v93） ----
     画面が狭いときは縦に積む。広いときだけ2列にして、根拠は貼りついたまま残す */
  .bwork{display:grid;grid-template-columns:1fr;gap:14px;align-items:start}
  @media(min-width:980px){
    .bwork{grid-template-columns:minmax(0,1fr) 400px}
    .bwork .bsrc{position:sticky;top:12px;max-height:calc(100vh - 30px);display:flex;flex-direction:column}
  }
  .bsrc{background:var(--card);border:1px solid var(--line);border-radius:11px;overflow:hidden}
  .bsrc-h{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);
          background:var(--paper);flex-wrap:wrap}
  .bsrc-h b{font-family:var(--min);font-size:12.5px;font-weight:500;flex:1;min-width:80px}
  .bsrc-h .cbmini{flex:none}
  .bsrc-b{padding:10px 12px;overflow:auto;flex:1;min-height:120px;max-height:56vh}
  @media(min-width:980px){ .bsrc-b{max-height:none} }
  .bsrc-b pre{white-space:pre-wrap;font-family:var(--mono);font-size:11px;line-height:1.6;margin:0;
              color:var(--ink2);word-break:break-all}
  .bsrc-b img{width:100%;border-radius:8px;display:block}
  .bsrc-b embed,.bsrc-b iframe{width:100%;height:min(70vh,620px);border:0;border-radius:8px;background:#fff}
  .bsrc-b mark{background:#FCF0B8;color:inherit;border-radius:2px;padding:0 1px}
  .bsrc .empty{padding:18px 12px;text-align:center;color:var(--ink3);font-size:12px;line-height:1.7}

  /* ---- 仕分けは1品目ずつ。何分の何かを出して「次へ」で進む（v91） ---- */
  .bpager{display:flex;align-items:center;gap:8px;margin:0 0 10px;flex-wrap:wrap}
  .bpager .now{font-family:var(--mono);font-size:15px;min-width:72px;text-align:center;color:var(--ink2)}
  .bpager .now b{font-size:19px;color:var(--accent);font-weight:500}
  .bpager .nav{padding:7px 13px}
  .nav[disabled]{opacity:.35;cursor:default}
  .bpager .num{display:flex;gap:4px;flex-wrap:wrap;width:100%;margin-top:2px}
  .bpager .num button{width:30px;height:30px;border-radius:7px;border:1px solid var(--line);
    background:var(--paper);font:inherit;font-size:11px;cursor:pointer;color:var(--ink2);padding:0}
  .bpager .num button:hover{border-color:var(--accent)}
  .bpager .num button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .bpager .num button.need{border-color:var(--alert);color:var(--alert);font-weight:600}
  .bpager .num button.on.need{background:var(--alert);border-color:var(--alert);color:#fff}
  .bpager .num button.off{opacity:.4}

  .bmatch{border-radius:9px;padding:9px 12px;margin:10px 0;font-size:12.5px;line-height:1.6}
  .bmatch.ok{background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent)}
  .bmatch.ng{background:var(--alert-soft);color:var(--alert);border:1px solid var(--alert)}
  .bmatch.na{background:var(--paper);color:var(--ink3);border:1px solid var(--line)}

  .acct{padding:18px;display:none}
  /* ---- 締めの作業ページ（v190） ----
     会計の入口と年間一覧は幅いっぱいのまま。作業ページだけ読みやすい幅に置く。
     仕入れの仕分けだけは、右にもとの伝票を並べるので広く使う（もと `.sync.wide`） */
  .acct .acwrap{max-width:720px}
  .acct .acwrap.wide{max-width:1180px}
  /* 横に長い表は、その中だけで横に動かす（v190）。
     `#app` が overflow-x:hidden なので、はみ出した列は**画面の外に消えて押せない**。
     375pxのiPhoneで、水野さんの明細の「消す」が右にはみ出して押せなかった（実測 393px） */
  .xscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  /* せまい画面で列がつぶれないように下限を決める（横に動かして使う） */
  .xscroll table{min-width:480px}
  .stepbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
           margin-top:20px;padding-top:14px;border-top:1px solid var(--line)}
  .stepbar .sp{flex:1}
  .navcard.done .nc-i{background:var(--accent);color:#fff}
  #app[data-tab="acct"] .acct{display:block}
  #app[data-tab="acct"] .cols{display:none}
  #app[data-tab="acct"] .search{display:none}
  .line{padding:18px;display:none}
  #app[data-tab="line"] .line{display:block}
  #app[data-tab="line"] .cols{display:none}
  #app[data-tab="line"] .search{display:none}
  .homesync{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 22px}
  .homenum{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 22px}
  .hnum{display:block;text-align:left;padding:16px 18px;border:1px solid var(--line);
        border-radius:12px;background:var(--paper);cursor:pointer;font:inherit}
  .hnum span{display:block;font-size:12px;color:var(--ink3);letter-spacing:.04em}
  .hnum b{display:block;font-family:var(--mono);font-size:26px;margin:4px 0 2px}
  .hnum em{display:block;font-style:normal;font-size:11px;color:var(--ink3)}
  .guidesec{margin:0 0 26px}
  .guidesec h3{font-family:var(--min);font-size:14px;letter-spacing:.08em;color:var(--ink3);margin:0 0 10px;font-weight:400}
  .guides{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
  .gcard{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);
         border-radius:12px;background:var(--paper);cursor:pointer;text-align:left;font:inherit}
  .gcard .gi{flex:none;width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;
             display:grid;place-items:center;font-family:var(--min);font-size:15px}
  .gcard .gt{flex:1;min-width:0}
  .gcard .gt b{display:block;font-size:14px}
  .gcard .gt span{display:block;font-size:11px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gcard .gw{flex:none;font-size:10px;color:var(--ink3);border:1px solid var(--line);
             border-radius:999px;padding:2px 8px}
  .gsteps{margin:0;padding:0 0 0 22px}
  .gsteps li{margin:0 0 12px;display:flex;align-items:flex-start;gap:10px;font-size:13.5px;line-height:1.7}
  .gsteps li>span{flex:1}
  .homesec{margin:0 0 22px}
  .homesec h3{font-family:var(--min);font-size:14px;letter-spacing:.08em;color:var(--ink3);
              margin:0 0 10px;font-weight:400}
  @media(max-width:560px){ .homenum{grid-template-columns:1fr} }
  /* v118：移行用の道具を全画面に出しっぱなしにしない。
     「全データを消す」が常に見えているのが危ないので、連携タブの奥のページでだけ出す。
     ★ **要素は動かさない。** 中に #count があり、renderList が毎回書き込んでいるので、
       別の場所へ appendChild すると、そこが innerHTML で消えたときに道連れになる（v118で踏んだ）。

<script>
/* このファイルの版。ファイル名の番号（salon-de-kou-karte_NN.html）と必ずそろえること。
   仕分け待ちの下書きを捨てるかどうかの判定（BUYVER）にも使うので、
   ここを上げ忘れると、古い読み取りで作られた下書きが生き残る（v87でやらかした） */
const APPVER=198;
const KEY="sdk:data";
/* ★ v133：QC／SEED／PROD／MENU／QK／CHARTS0／STOCK0／ACTUAL／VISITS は
   **わざと空にしてあります。書き戻さないこと。**

   このファイルは公開の置き場所に置き、6台の端末から同じURLで開くためのものです。
   焼き込みのままだと、お客様およそ250名の氏名・カナ・電話・住所と、
   来店日・施術内容・お支払い額、それに商品の原価と月別売上が
   **インターネットに出てしまいます**（v132まではファイルの中にありました）。

   中身はすべて正本（日比さんのGoogleドライブの db.json）から入ります。
   v132 を1回動かした時点で、ACTUAL と VISITS も db の中（db.actual／db.visits）に
   移してあるので、過去の売上も来店ペースも消えません。 */
/* Claudeの中で開いたときは window.storage、ファイル単体で開いたときは端末内に保存 */
const STORE = (typeof window!=="undefined" && window.storage) ? window.storage : {
  get:async k=>{ const v=localStorage.getItem(k); if(v===null) throw new Error("not found"); return {key:k,value:v}; },
  set:async (k,v)=>{ localStorage.setItem(k,v); return {key:k,value:v}; }
};
/* ══════════════ ほかの端末と同じデータを見る（v132） ══════════════
   利用者の指示：「私と川口の iPad・携帯・パソコンで、それぞれ見て入力もしたい」。

   考え方はひとつだけ。**正本はドライブに1つ、端末は写しを持つだけ。**

   - 開いたら正本を取りに行く（dbget）
   - 保存したら、2秒半まとめてから送る（dbput）。1文字打つたびには送らない
   - 送るときに「自分が持っている版の番号（rev）」を渡す。正本が進んでいたら
     中継役が断る（conflict）。**ここで止めないと、あとから保存した人が
     相手の入力を丸ごと消す。** 断られたぶんは控えに残してから取り込み直す
   - 入力中は札を立てる（dblock）。3分さわらなければ自動的に外れる
   - 写真は本体に入れず、1枚ずつ別に置く（photoput／photoget）。
     本体に入れると、保存のたびに写真ごと送り直すことになって通信が持たない

   ★ 中継役のURLと合言葉は **正本の中に入れない。**
     まっさらな端末には正本がまだ無いので、その中を見ても設定が分からないため。
     端末ごとに `sdk:conf` に持つ（この端末を誰が使っているか＝who も同じ場所）。
*/
const CONF_KEY="sdk:conf";
const SYNC_WAIT=2500;    // 保存してから送るまで（まとめて送る）
const SYNC_POLL=30000;   // ほかの端末の様子を見に行く間隔
const LOCK_TOUCH=60000;  // 入力中の札を立て直す間隔
const WHOLIST=["日比","川口","水野"];

let conf={url:"",key:"",who:"",rev:0};
let sync={on:false,busy:false,dirty:false,err:"",at:"",by:"",lock:null,mine:false,other:null};
let syncTimer=null, syncPoll=null, lockAt=0;

async function loadConf(){
  try{ const r=await STORE.get(CONF_KEY); if(r&&r.value) conf=Object.assign(conf,JSON.parse(r.value)); }catch(e){}
  /* v131まで、中継役の設定はデータの中（db.relay）にあった。1回だけ引き継ぐ */
  if(!conf.url&&db.relay&&db.relay.url){ conf.url=db.relay.url; conf.key=db.relay.key||""; await saveConf(); }
  return conf;
}
async function saveConf(){ try{ await STORE.set(CONF_KEY,JSON.stringify(conf)); }catch(e){} }
function cloudOn(){ return !!(conf.url&&conf.key); }

/* 設定を別の端末へ渡すための合い言葉つきリンク（QRにする） */
function setupLink(){
  const p=btoa(unescape(encodeURIComponent(JSON.stringify({u:conf.url,k:conf.key}))))
    .replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  return location.origin+location.pathname+"#setup="+p;
}
function applySetupHash(){
  const m=(location.hash||"").match(/setup=([A-Za-z0-9_\-]+)/);
  if(!m) return false;
  try{
    const b=m[1].replace(/-/g,"+").replace(/_/g,"/");
    const o=JSON.parse(decodeURIComponent(escape(atob(b))));
    if(o&&o.u&&o.k){ conf.url=o.u; conf.key=o.k; saveConf(); }
  }catch(e){}
  try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){}
  return true;
}

function cloudUrl(action,extra){
  return conf.url+(conf.url.includes("?")?"&":"?")+"key="+encodeURIComponent(conf.key)
    +"&action="+action+(extra||"");
}
async function cloudGet(action,extra){
  const r=await fetch(cloudUrl(action,extra));
  const j=await r.json(); if(j.error) throw new Error(j.error); return j;
}
/* ★ ヘッダーを付けないこと。Content-Type を付けると、ブラウザが先に OPTIONS を
     聞きに行ってしまい、Apps Script はそれに答えられないので通らなくなる */
async function cloudPost(action,body){
  const r=await fetch(cloudUrl(action),{method:"POST",body:JSON.stringify(body)});
  const j=await r.json(); if(j.error) throw new Error(j.error); return j;
}

/* ---- 開いたときに正本を取りに行く ---- */
async function bootCloud(){
  await loadConf();
  applySetupHash();
  if(!cloudOn()){ paintSync(); return; }
  sync.on=true;
  try{
    const j=await cloudGet("dbget");
    if(j.data){
      if((j.rev||0)>=(conf.rev||0)){
        db=j.data; normalizeDb();
        conf.rev=j.rev||0; await saveConf();
        try{ await STORE.set(KEY,JSON.stringify(db)); }catch(e){}
        sync.at=j.at||""; sync.by=j.by||"";
      }else{
        /* 端末の写しのほうが新しい＝前に送れないまま閉じた。あとで送る */
        sync.dirty=true; pushSoon();
      }
    }else if(db.customers.length||db.charts.length){
      /* 正本がまだ空。この端末のデータを最初の正本にする */
      conf.rev=0; await pushCloud();
    }
  }catch(e){ sync.err=e.message||"通信できません"; }
  paintSync();
}

/* ---- 保存したら、少しまとめてから送る ---- */
function pushSoon(){
  if(!cloudOn()) return;
  sync.dirty=true; paintSync();
  clearTimeout(syncTimer);
  syncTimer=setTimeout(()=>{ pushCloud(); },SYNC_WAIT);
}
async function pushCloud(){
  if(!cloudOn()||sync.busy) return;
  if(sync.other) return;                 // 断られたまま。人が決めるまで送らない
  sync.busy=true; sync.err=""; paintSync();
  try{
    await externalizePhotos();
    const j=await cloudPost("dbput",{rev:conf.rev||0, by:conf.who||"", data:db});
    if(j.conflict){
      sync.other={rev:j.rev,at:j.at||"",by:j.by||""};
      await rescueCopy();
    }else{
      conf.rev=j.rev; await saveConf();
      sync.at=j.at||""; sync.by=conf.who||""; sync.dirty=false; sync.other=null;
    }
  }catch(e){ sync.err=e.message||"通信できません"; }
  sync.busy=false; paintSync();
}
/* 断られたときの控え。取り込み直す前に、この端末のぶんを必ず残す */
async function rescueCopy(){
  try{ await STORE.set("sdk:rescue",JSON.stringify({at:nowStamp(),db:db})); }catch(e){}
}
/* 相手のぶんを取り込む（この端末の未送信は上の控えに残っている） */
async function takeTheirs(){
  try{
    const j=await cloudGet("dbget");
    if(!j.data) throw new Error("正本が空です");
    db=j.data; normalizeDb();
    conf.rev=j.rev||0; await saveConf();
    try{ await STORE.set(KEY,JSON.stringify(db)); }catch(e){}
    sync.at=j.at||""; sync.by=j.by||""; sync.dirty=false; sync.other=null; sync.err="";
    repaintAfterSync(); paintSync();
    toast("ほかの端末のぶんを取り込みました");
  }catch(e){ sync.err=e.message||"取り込めませんでした"; paintSync(); }
}

/* ---- ほかの端末の様子を見に行く ---- */
function startSyncPoll(){
  if(syncPoll) clearInterval(syncPoll);
  if(!cloudOn()) return;
  syncPoll=setInterval(()=>{ if(document.visibilityState==="visible") pollCloud(); },SYNC_POLL);
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") pollCloud(); });
  /* 入力しはじめたら札を立てる（3分さわらなければ勝手に外れる） */
  document.addEventListener("input",()=>{ touchLock(); },true);
  window.addEventListener("beforeunload",()=>{
    if(!cloudOn()||!sync.mine) return;
    try{ navigator.sendBeacon(cloudUrl("dblock"),
      new Blob([JSON.stringify({who:conf.who||"",release:true})],{type:"text/plain"})); }catch(e){}
  });
}
async function pollCloud(){
  if(!cloudOn()||sync.busy) return;
  try{
    const j=await cloudGet("dbinfo");
    sync.lock=j.lock||null;
    sync.mine=!!(j.lock&&conf.who&&j.lock.who===conf.who);
    if((j.rev||0)>(conf.rev||0)&&!sync.dirty&&!sync.other){
      await takeTheirs();               // こちらに未送信が無いなら、黙って最新にする
      return;
    }
  }catch(e){ /* 電波が悪いだけのことが多いので、画面には出さない */ }
  paintSync();
}
function touchLock(){
  if(!cloudOn()||!conf.who) return;
  const now=Date.now();
  if(now-lockAt<LOCK_TOUCH) return;
  lockAt=now;
  cloudPost("dblock",{who:conf.who}).then(j=>{
    if(j.busy){ sync.lock={who:j.who,at:j.at}; sync.mine=false; }
    else { sync.lock={who:conf.who,at:new Date().toISOString()}; sync.mine=true; }
    paintSync();
  }).catch(()=>{});
}
async function takeLock(){
  if(!cloudOn()||!conf.who) return;
  try{
    await cloudPost("dblock",{who:conf.who,take:true});
    sync.lock={who:conf.who,at:new Date().toISOString()}; sync.mine=true; lockAt=Date.now();
  }catch(e){}
  paintSync();
}

/* ---- 写真は1枚ずつ別に置く ---- */
const photoCache={};
function phSrc(v){
  if(!v) return "";
  return String(v).slice(0,5)==="data:" ? String(v) : (photoCache[v]||"");
}
/* 番号だけのものは、あとから取ってきて差し込む（data-ph） */
function phTag(v,alt,extra){
  const src=phSrc(v);
  return `<img ${src?`src="${esc(src)}"`:`data-ph="${esc(v)}"`} alt="${esc(alt)}"${extra||""}>`;
}
let phFilling=false;
async function fillPhotos(){
  if(phFilling||!cloudOn()) return;
  const els=[...document.querySelectorAll("img[data-ph]")];
  if(!els.length) return;
  phFilling=true;
  for(const el of els){
    const id=el.dataset.ph; if(!id) continue;
    if(photoCache[id]){ el.src=photoCache[id]; el.removeAttribute("data-ph"); continue; }
    try{
      const j=await cloudGet("photoget","&id="+encodeURIComponent(id));
      if(j.data){ photoCache[id]=j.data; el.src=j.data; el.removeAttribute("data-ph"); }
    }catch(e){ break; }
  }
  phFilling=false;
}
/* 送る前に、カルテの中の写真をドライブへ移して番号に置きかえる */
async function externalizePhotos(){
  if(!cloudOn()) return 0;
  let n=0;
  for(const k of (db.charts||[])){
    if(!Array.isArray(k.photos)||!k.photos.length) continue;
    for(let i=0;i<k.photos.length;i++){
      const v=k.photos[i];
      if(typeof v!=="string"||v.slice(0,5)!=="data:") continue;
      const id="ph"+uid()+uid();
      try{ await cloudPost("photoput",{id:id,data:v}); photoCache[id]=v; k.photos[i]=id; n++; }
      catch(e){ return n; }   // 通信が切れたら、残りは次の機会に
    }
  }
  if(n){ try{ await STORE.set(KEY,JSON.stringify(db)); }catch(e){} }
  return n;
}

/* ---- 画面のいちばん上に、いまの状態を出す ---- */
function paintSync(){
  const el=document.getElementById("syncbar"); if(!el) return;
  const who=conf.who||"";
  if(!cloudOn()){
    el.className="syncbar warn";
    el.innerHTML=`<b>この端末は、ほかの端末とつながっていません。</b>
      入れた内容はこの端末の中だけに残ります。
      <button class="sybtn" data-sy="setup">つなげる</button>`;
    bindSync(el); return;
  }
  if(sync.other){
    el.className="syncbar bad";
    el.innerHTML=`<b>ほかの端末が先に保存しました${sync.other.by?`（${esc(sync.other.by)}さん）`:""}。</b>
      このままでは、この端末の入力は送れません。
      未送信のぶんは控えに残してあります。
      <button class="sybtn" data-sy="take">相手のぶんを取り込む</button>
      <button class="sybtn" data-sy="backup">先に控えを書き出す</button>`;
    bindSync(el); return;
  }
  const other=sync.lock&&(!who||sync.lock.who!==who)?sync.lock.who:"";
  if(other){
    el.className="syncbar warn";
    el.innerHTML=`<b>いま ${esc(other)}さんが入力中です。</b>
      ここで入力すると、あとで保存できないことがあります。
      <button class="sybtn" data-sy="grab">入力を引き取る</button>`;
    bindSync(el); return;
  }
  el.className="syncbar ok";
  const state=sync.busy?"送っています…"
    :sync.err?`送れていません（${esc(sync.err)}）`
    :sync.dirty?"送るのを待っています…"
    :sync.at?`同期しました ${esc(sync.at.slice(5,16).replace("T"," "))}${sync.by?`／${esc(sync.by)}さん`:""}`
    :"つながっています";
  el.innerHTML=`<span>${state}</span>${who?`<em>この端末：${esc(who)}さん</em>`:
    `<button class="sybtn" data-sy="setup">この端末は誰が使いますか</button>`}
    ${sync.err||sync.dirty?`<button class="sybtn" data-sy="push">いま送る</button>`:""}`;
  bindSync(el);
}
function bindSync(el){
  el.querySelectorAll("[data-sy]").forEach(b=>b.onclick=()=>{
    const a=b.dataset.sy;
    if(a==="setup"){ setTab("sync"); syncPage="setup"; renderSync(); }
    if(a==="take") takeTheirs();
    if(a==="backup"){ const t=document.getElementById("bkOut"); if(t) t.click(); }
    if(a==="grab") takeLock();
    if(a==="push"){ sync.other=null; pushCloud(); }
  });
}

/* v132：クラウドから受け取ったデータにも同じ手当てが要るので、load から切り出した */
function normalizeDb(){
  if(!db.customers) db.customers=[];
  if(!db.charts) db.charts=[];
  if(!db.appts) db.appts=[];
  /* v132：クラウドから受け取ったデータに欠けている欄があっても落ちないようにする。
     ここが空だと、下の db.products.forEach で止まっていた */
  if(!Array.isArray(db.products)) db.products=[];
  /* v132：ソースに焼き込んでいた「手で控えた月次売上」を、1回だけデータへ移す。
     こうしておくと、本体から ACTUAL を外しても過去の月の売上が消えない */
  if(!db.actual) db.actual=Object.assign({}, (typeof ACTUAL!=="undefined"?ACTUAL:{}));
  /* 来店日の一覧も同じ理由でデータへ移す（画面から毎回読んでいるため、
     本体から外すと来店ペースが出なくなる） */
  if(!db.visits) db.visits=Object.assign({}, (typeof VISITS!=="undefined"?VISITS:{}));
  if(!db.stock) db.stock={};
  if(!db.relay) db.relay={url:"",key:""};
  ensureLine();
  if(!db.hpb) db.hpb={};
  if(!db.cashbook) db.cashbook={opening:{},entries:[]};
  if(!db.cashbook.actual) db.cashbook.actual={};
  if(!db.cashbook.sq){                       // Squareの現金決済（決済ID→日付・金額・お客様）
    db.cashbook.sq={};
    db.charts.forEach(k=>{ if(k.sqid&&k.cash)
      db.cashbook.sq[k.sqid]={date:k.date,amt:k.cash,cid:k.cid||null}; });
  }
  if(!db.sqsales) db.sqsales={};             // Squareの売上（月→{yen,n,days,items,at}）v78〜／items は v94〜
  if(!db.sqcat) db.sqcat={at:"",map:{}};     // Squareのカタログの控え（品名→カテゴリ・物販かどうか）v94〜
  if(!db.sqsold) db.sqsold={};               // Squareで売れた数の控え（月→{商品ID:個数}）v134〜
  if(!db.sqinv) db.sqinv={at:"",n:0,map:{},miss:[],tracked:0};  // Squareの在庫数の控え（v196〜）
  if(!db.pay) db.pay={rate:0.4, partRate:0.4, mizuWage:1200, months:{}};  // 支払明細の設定（v110〜／partRateはv111〜）
  if(!db.mimi) db.mimi={cat:"耳ツボジュエリー",unit:1000,on:true};  // 場所代方式（v109〜）
  if(!db.sqskip) db.sqskip={};               // 「Squareのこれとアプリのこれは別物」と決めた組（v108〜）
  if(!db.buys) db.buys=[];                   // 仕入れの取り込み履歴 v79〜
  if(!("buydraft" in db)) db.buydraft=null;  // 区分を選んでいる途中の下書き v79〜
  // v82：下書きを何枚でも溜めておけるようにした（メールのNBSと伝票のミラビスを
  // 同じ一覧に集めて、まとめて仕分けするため）。1枚だけの古い下書きはここで移す
  if(!Array.isArray(db.buydrafts)) db.buydrafts=[];
  if(db.buydraft){ db.buydrafts.push(db.buydraft); db.buydraft=null; }
  db.buydrafts.forEach(d=>{ if(!d.id) d.id=uid(); if(!d.tax) d.tax="in"; });
  // v85までの読み取りには、あいさつ文を商品にしたり（v83で修正）、
  // 商品コードを単価にしたり（v85で修正）する不具合があった。
  // 下書きはブラウザに残るので、直した版に上げても壊れたままの下書きが出つづける。
  // 古い版で読み取った仕分け待ちはここで捨てる。
  // 取り込みずみの履歴（db.buys）・在庫・出納帳には手をつけない
  const stale=db.buydrafts.filter(d=>!(d.ver>=BUYVER)).length;
  if(stale){
    db.buydrafts=db.buydrafts.filter(d=>d.ver>=BUYVER);
    db.buypurge=stale;                       // 画面で1回だけ知らせるための控え
  }
  if(!db.buymail) db.buymail={};             // 仕入先ごとのメールの探し方（差出人・期間）v85〜
  if(!db.buytax) db.buytax={};               // 仕入先ごとの税区分の覚え（v90〜）
  /* v168：ミラビスの請求明細書は税抜で書かれているのに、v167まで「税込」を既定に
     していたので、その覚えが残っている。**一度だけ**税抜に直す。
     このあと画面で切り替えたぶんは、今までどおりその選択が残る */
  if(db.buytaxmig!=="v168"){

  if(db.chartsimp!=="v1"){ importCharts(); db.chartsimp="v1"; }
  if(db.qver!==QVER){ importQuartets(); db.qver=QVER; db.charts.forEach(k=>delete k.no); db.customers.forEach(c=>delete c.no); }
  if(!db.charts.some(k=>k.no)){
    let kn=0; db.charts.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(k=>k.no=++kn);
  }
  if(!db.customers.some(c=>c.no)){                   // 初回だけ通し番号を振る
    let n=0; db.customers.forEach(c=>c.no=++n);
  }
  db.products.forEach(p=>{ if(!p.kind) p.kind=KINDOF(p.n); });
  if(db.kindmig!=="v2"){                     // 消耗品区分を廃止して材料に寄せ、立替は仕入に合算する
    db.products.forEach(p=>{ if(p.kind==="消耗品") p.kind="材料"; });
    Object.values(db.stock).forEach(mo=>Object.values(mo).forEach(c=>{
      if(c.adv){ c.in=(c.in||0)+c.adv; c.adv=0; }
    }));
    db.kindmig="v2";
  }
  if(db.prodmig!=="v1"){                                  // 不要になった商品を整理
    ["メンテナンス水"].forEach(n=>{
      const t=db.products.filter(p=>p.n===n);
      db.products=db.products.filter(p=>p.n!==n);
      Object.values(db.stock).forEach(mo=>t.forEach(p=>delete mo[p.id]));
    });
    db.prodmig="v1";
  }
  if(db.seedver!==SEEDVER){
    db.products=PROD.map(x=>({...x}));
    Object.entries(STOCK0).forEach(([m,v])=>{ db.stock[m]=Object.assign({},v,db.stock[m]||{}); });
    db.seedver=SEEDVER;
  }
}

    el.innerHTML=`<div class="empty"><b>${q?"見つかりませんでした":"まだ登録がありません"}</b>${q?"別のことばで探してみてください":"「お客様を追加」から1人目を登録します"}</div>`;
    return;
  }
  const now=new Date();
  const withPace=rows.map(c=>{
    const p=pace(c);
    const mine=db.appts.filter(a=>isBooking(a)&&a.cid===c.id);
    const up=mine.filter(a=>apptAt(a)>=now).sort((x,y)=>apptAt(x)-apptAt(y))[0]||null;
    let t=p?new Date(p.last+"T12:00:00"):null;
    mine.forEach(a=>{const d=apptAt(a); if(d<now&&(!t||d>t)) t=d;});
    return {c,p,up,t};
  });
  if(listSort==="since")
    withPace.sort((a,b)=>(b.p?b.p.since:-1)-(a.p?a.p.since:-1));
  if(listSort==="recent")
    withPace.sort((a,b)=>{
      if(a.up&&b.up) return apptAt(a.up)-apptAt(b.up);
      if(a.up) return -1;
      if(b.up) return 1;
      return (b.t?b.t.getTime():-1)-(a.t?a.t.getTime():-1);
    });

  el.innerHTML=`<div class="lbar">
      <button class="chip${listSort==="recent"?" on":""}" data-s="recent">最新順</button>
      <button class="chip${listSort==="kana"?" on":""}" data-s="kana">かな順</button>
      <button class="chip${listSort==="since"?" on":""}" data-s="since">ごぶさた順</button>
      <span class="lcount">${withPace.length}名</span>
    </div>`+withPace.map(({c,p,up,t})=>{
    const cls=p?LV[p.lv][1]:"";
    const lab=p&&p.lv!=="ok"&&p.lv!=="booked"?LV[p.lv][0]:"";
    const todays=up&&up.date===today();
    const line=c.lineId?(c.lineBlocked?["被ブロック","blk"]:["LINE送信OK","ok"]):["LINE未連携","no"];
    const tags=(c.tags||"").split(/[,、\s]+/).filter(Boolean);
    return `<div class="qrow${up?(todays?" today":" upcoming"):""}${sel===c.id?" sel":""}" data-id="${c.id}">
      <div class="qmain">
        <div class="qtop">
          <span class="lbadge ${line[1]}">${line[0]}</span>
          ${tags.map(t=>`<span class="qtag">${esc(t)}</span>`).join("")}
          ${c.caution?'<span class="qtag warn">注意事項あり</span>':""}
          <span class="qno">${custNo(c)}</span>
        </div>
        <div class="qname"><b>${esc(c.name)}</b>
          ${c.kana?`<span>（${esc(c.kana)}）</span>`:""}
          ${c.tel?`<em>${telFmt(c.tel)}</em>`:""}</div>
        <div class="meta">
          ${up?`${todays?'<span class="bk today">本日</span>':'<span class="bk">予約</span>'}
            ${up.date.slice(5).replace("-","/")} ${up.start}　`:""}
          ${p?`<span class="ago ${cls}">前回から ${p.since}日</span>
            <span class="cyc">${p.avg?`平均 ${p.avg}日サイクル`:"サイクル不明"}</span>
            <span class="cnt">来店 ${p.n}回</span>${lab&&!up?`<span class="lab ${cls}">${lab}</span>`:""}`
            :"来店記録なし"}
        </div>
      </div>
      <div class="qacts">
        <button data-act="info" data-id="${c.id}">お客様対応</button>
        <button data-act="book" data-id="${c.id}">次回予約登録</button>
        <button data-act="karte" data-id="${c.id}">カルテ表示</button>
        <button data-act="new" data-id="${c.id}">カルテ作成</button>
      </div>
    </div>`;
  }).join("");

  const open=(id,mode)=>{
    sel=id; editing=(mode==="info"); karteOpen=(mode==="new"); kNewForce=false;
    document.getElementById("app").dataset.view="detail";
    renderList(); renderDetail();
    if(mode==="new") scrollToKform();
  };
  el.querySelectorAll(".qacts button").forEach(b=>b.onclick=async e=>{
    e.stopPropagation();
    const c=db.customers.find(x=>x.id===b.dataset.id);
    if(b.dataset.act==="book"){
      setTab("sched");
      openAp({cid:c.id,name:c.name,date:today(),kind:chartsOf(c.id).length?"再来":"新規"});
      return;
    }
    open(b.dataset.id,b.dataset.act);
  });
  el.querySelectorAll(".qrow").forEach(r=>r.onclick=()=>open(r.dataset.id,"karte"));
  el.querySelectorAll(".lbar .chip").forEach(b=>b.onclick=e=>{
    e.stopPropagation(); listSort=b.dataset.s; renderList();
  });
  el.querySelectorAll(".row").forEach(b=>b.onclick=()=>{
    sel=b.dataset.id; editing=false; draftParts=[]; kNewForce=false; karteOpen=false;
    document.getElementById("app").dataset.view="detail";
    renderList(); renderDetail();
  });
}

/* ---------- body map ---------- */
function bodySvg(side,label){
  const ps=PARTS.filter(p=>p.s===side).map(p=>`
    <rect class="part" data-part="${p.id}" data-on="${draftParts.includes(p.label)?1:0}"
      x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="${p.rx||4}">
      <title>${p.label}</title></rect>`).join("");
  return `<figure>
    <svg viewBox="0 0 112 190" width="126" height="214" role="group" aria-label="${label}の部位">${ps}</svg>
    <figcaption>${label}</figcaption></figure>`;
}
function pickedText(){
  return draftParts.length?esc(draftParts.join("・")):'<em>図をタップして部位を選びます</em>';
}
function bindMap(root){
  root.querySelectorAll(".part").forEach(r=>{
    r.onclick=()=>{
      const p=PARTS.find(x=>x.id===r.dataset.part);
      const i=draftParts.indexOf(p.label);
      if(i<0) draftParts.push(p.label); else draftParts.splice(i,1);
      r.dataset.on=i<0?1:0;
      root.querySelector(".picked").innerHTML=pickedText();
    };
  });
}

/* ---------- カルテの画面からSquareを取り込む（v148） ----------
   利用者の問い：**「カルテにもスクエアと連携するボタンがあると、連携できるところは
   一気に連携できるよね。金額も、今日支払ったかも連携できるよね？」**

   はい。押すと1回で次が入る（`doSquareSync` は前からこの中身で、
   ホーム・売上・連携・出納帳の4か所から同じ道を通っていた。**ここに5か所目を足しただけ**）。

   ① お会計の金額（割引・返金を差し引いた**実際に払った額**）
   ② 現金で払ったか、カードで払ったか（`cash`）
   ③ 返金（`ret`）
   ④ 買った商品（カルテの物販の欄に、印つきで入る）
   ⑤ 在庫の「販売」欄
   ⑥ 月の売上と、Squareの決済手数料

   ★ 取り込むのは「今日」ではなく **今月ぶん**。日付で切ると、その月の売上の控え
     （`db.sqsales[月]`）が**その日だけの数字に置きかわってしまう**。
     何度押しても二重にならない（売上は差し替え／カルテは決済ID／現金も決済ID）。 */
const sqBtnHtml=(id,label)=>
  `<button class="btn quiet" id="${id}" type="button">${label||"Squareの会計を取り込む"}</button>`;
function sqLastText(){
  if(!relayUrl("ping")) return `<b style="color:var(--alert)">連携タブの設定がまだです。</b>`;
  const rec=(db.sqsales||{})[today().slice(0,7)];
  return rec&&rec.at?`（${esc(String(rec.at).replace(/-/g,"/"))} に取り込みずみ）`
                    :`（この月はまだ取り込んでいません）`;
}
/* ---------- 取り込んでも「何も変わらない」ときの見分け（v150） ----------
   利用者から：**「連携を試したけど何も変わらないぞ。石神さんで試してみた」**

   取り込みそのものは動いていても、**カルテができない道が2つある**。
   どちらも今までは画面に出ていなかったので、押した人には「何も起きない」としか見えなかった。

   ① **お客様がSquareの名簿と結びついていない**（`c.sqid` が無い）。
      `syncOrders` は `bySq[o.cust]` でしか人を当てないので、結びつくまでカルテは作られない。
      直すのは 連携タブ →「お客様の照合」（人が見て決める作り）
   ② **決済のほうにお客様が付いていない**（Squareのレジでお客様を選ばずに会計した）。
      これは `nolink` として月ごとに控えてある（v102）。**お店側の操作の問題**なので、
      アプリでは直せない。Squareで会計にお客様を結びつけ直してもらう

   ★ さらに、取り込みが**失敗している**ときも黙っていた（toast は消えてしまう）ので、
     最後のエラーもここに残す。 */
function sqWhyHtml(c){
  const m=today().slice(0,7);
  const rec=(db.sqsales||{})[m];
  const mine=chartsOf(c.id).filter(k=>k.src==="square"&&String(k.date||"").slice(0,7)===m).length;
  const nol=(rec&&Array.isArray(rec.nolink))?rec.nolink.length:0;
  const out=[];
  if(!c.sqid) out.push(`<b>このお客様は、Squareの名簿とまだ結びついていません。</b>
    結びつくまで、何回取り込んでも<b>この方のカルテはできません</b>。
    「連携」タブ →「お客様の照合」で結びつけてください。
    <button class="btn quiet" type="button" id="k-cust-link"
      style="margin-left:8px">お客様の照合をひらく</button>`);
  else out.push(`Squareの名簿と結びつきずみ。
    <b>今月このお客様のSquareのカルテ：${mine}件</b>${mine?"":"（まだ1件もありません）"}`);
  if(nol) out.push(`<b>今月、名簿と結びつかない決済が ${nol}件あります。</b>
    Squareのレジで<b>お客様を選ばずに会計した</b>ぶんです。
    Squareのほうでその会計にお客様を結びつけてから、もう一度取り込んでください
    （中身は「売上」タブで見られます）。`);
  if(sqAuto.err) out.push(`<b>前回の取り込みは失敗しています：${esc(sqAuto.err)}</b>`);
  if(!out.length) return "";
  const bad=(!c.sqid)||nol||sqAuto.err;
  return `<p class="note" style="margin:-6px 0 12px${bad?";color:var(--alert)":""}">${out.join("<br>")}</p>`;
}
function bindSqBtn(id,after){
  const b=document.getElementById(id); if(!b) return;
  b.onclick=async()=>{
    if(!relayUrl("ping")){ toast("「連携」タブの連携設定を先に入れてください"); return; }
    if(sqAuto.busy) return;
    const t=b.textContent;
    b.disabled=true; b.textContent="取り込んでいます…";
    await doSquareSync(today().slice(0,7));
    b.disabled=false; b.textContent=t;
    if(after) after();
  };
}

/* カルテの見出し（v131）。
   利用者の指摘：**施術をせず商品だけ買った来店も、何月何日に何を買ったか分かるようにしたい。**
   単品購入のカルテは `menu` が空で商品名が `goods` に入るので、
   それまで見出しが「（メニュー未記入）」になり、何を買ったのか一覧から読めなかった。
   メニューが無いときは商品名を見出しに出し、「物販」の札を付ける。 */
const karteIsGoodsOnly=k=>!String(k.menu||"").trim()&&!!String(k.goods||"").trim();
/* v134：メニュー3つ・オプション5つに分けたので、見出しは**メニューだけ**にする。
   オプションは別の行に出す（見出しが長くなって一覧が読めなくなるため）。
   内訳を持っていない古いカルテは、今までどおり k.menu をそのまま出す */
function karteTitle(k){
  const ms=Array.isArray(k.menus)&&k.menus.length?k.menus.join("／"):String(k.menu||"").trim();
  const os=Array.isArray(k.opts)&&k.opts.length?k.opts.join("／"):"";
  const goods=String(k.goods||"").trim();
  if(ms) return ms;
  if(os) return os;
  if(goods) return goods;
  return "（メニュー未記入）";
}
/* 割引の中身を1本の文字列にする（v160）。
   中継役 v18 から `k.discs`（[{name,amount}]）が入る。古い中継役では金額（`k.disc`）だけ */
function discText(k){
  const ds=Array.isArray(k.discs)?k.discs.filter(d=>d&&(d.name||d.amount)):[];
  if(ds.length) return ds.map(d=>`${d.name||"割引"}${d.amount?" "+yen(d.amount):""}`).join("／");
  return "";
}
/* お客様がいくら払ったか（v146）。
   Squareから取り込んだカルテは、**実際のお支払い額**が `price` に入っている
   （割引・返金を差し引いたあとの金額。v104でSquareの返金にも追随するようにした）。
   `cash` は現金で受けたぶん（中継役が決済APIから拾う）。残りはカードなど。
   `ret` は返金された額。手書きのカルテは `price` だけ入る */
/* ---------- 割引が見えるお支払い（v160） ----------
   利用者の指示：**「カルテの『お支払い』の欄は最終金額が表記されてるが、
   ディスカウントされてるかどうかがわからない。Squareの『サービスと商品』の中の
   『ディスカウント』と連携して、最初はいくらで、そこからいくらディスカウント
   されてるかもわかるように修正して」**

   `k.price` は**割引を引いたあとの、実際に払った額**（Squareの net_amounts）。
   引かれた額は `k.disc`（中継役が前から返していた `discount`）。
   **元の金額 ＝ price ＋ disc** なので、3つ並べれば「いくらから、いくら引かれたか」が読める。

   ★ 割引の**名前**（初回クーポン・スタッフ割引など）は `k.discs` に入る。
     これは**中継役 v18 から**。古い中継役のままでも金額だけは出る（黙って隠さない）。 */
function payText(k){
  const p=+k.price||0, cash=+k.cash||0, ret=+k.ret||0, disc=+k.disc||0;
  if(!p&&!cash&&!ret&&!disc) return "";
  const bits=[];
  if(cash) bits.push(`現金 ${yen(cash)}`);
  if(p>cash&&cash) bits.push(`カードなど ${yen(p-cash)}`);
  if(ret) bits.push(`返金 ${yen(ret)}`);
  const paid=yen(p)+(bits.length?`（${bits.join("／")}）`:"");
  if(!disc) return paid;
  const nm=discText(k);
  return `元 ${yen(p+disc)} − 割引 ${yen(disc)}${nm?`（${nm}）`:""} ＝ お支払い ${paid}`;
}

  return `<div class="chart" data-open="${k.id}" style="cursor:pointer" title="クリックすると、このカルテを開きます">
    <button class="del" data-k="${k.id}" aria-label="削除">削除</button>
    <span class="date">${esc(k.date)}</span><span class="staff">${esc(k.staff||"")}</span>
    <div class="menu">${k.date===today()?`<span class="kb" style="background:var(--alert)">今日</span>`:""}${karteIsGoodsOnly(k)?`<span class="kb" style="background:${KCOL["物販"]}">物販</span>`:""}${esc(karteTitle(k))}${k.price?` <span style="font-family:var(--mono);font-size:12px;color:var(--ink3)">¥${k.price.toLocaleString()}</span>`:""}</div>
    <dl>
      ${row("オプション",(k.opts||[]).join("／"))}

      ${row("ご要望",k.wish)}

        return (p?p.n:"?")+(x.qty>1?"×"+x.qty:"");}).join("／")):""}
      ${k.camps&&k.camps.length?row("キャンペーン",k.camps.map(x=>{
        const p=db.products.find(y=>y.id===x.pid);
        return (p?p.n:"?")+(x.qty>1?"×"+x.qty:"");}).join("／")):""}
      ${row("次回提案",k.next)}

      ${k.photos.map((d,i)=>`<figure>${phTag(d,"写真"+(i+1))}</figure>`).join("")}
    </div>`:""}</div>`;
}

/* ---------- メニューとオプションの欄（v144） ----------
   利用者の指示：**最初から3つと5つ出すのではなく、追加で増やすパターンにしてほしい。**
   ふだんはメニュー1つ・オプション1つで足りるので、**空の欄が並ぶと入力しにくい**。
   1つから始めて、要るときだけボタンで増やす（上限は今までどおり3つ・5つ）。 */
const KMENU_MAX=3, KOPT_MAX=5;
/* メニューの1行。id は画面にひとつしか無い側（新規カルテ）だけ付ける。
   直す画面（モーダル）にも同じ欄を出すので、**id がぶつからないように** */
/* ---------- メニューはプルダウン（v198） ----------
   利用者の指示：**「カルテのメニューの中のプルダウンがなくなってる。
   オプションはプルダウンがあって選べるからメニューも同じようにしてほしい。
   メニューはスクエアにある」**

   v144 まではメニューだけ `<datalist>` つきの打ち込み欄だった。
   パソコンなら打ち始めると候補が出るが、**iPad の Safari は datalist の候補を
   キーボードの上に小さく出すだけ**で、指で操作していると気づけない。
   ＝「プルダウンが無くなった」ように見えていた。オプション（`optSelect`）は
   ちゃんと `<select>` なので選べていた。**メニューも同じ `<select>` にそろえる。**

   ★ いまカルテに入っている名前が一覧に無いときは、**末尾に足して選択済みにする**
     （optSelect と同じ作り）。開いて保存しただけで消えることが無いように。 */
function menuSelect(v,i,id){
  const ms=TREATMENTS(), val=String(v||"").trim();
  const extra=val&&!ms.some(m=>MNORM(m.n)===MNORM(val));
  const cats=[...new Set(ms.map(m=>m.cat||"その他"))];
  return `<select class="f-in kmenu" data-km="${i}"${id?` id="${id}"`:""}${i?' style="margin-top:6px"':""}>
    <option value="">（選んでください）</option>
    ${cats.map(c=>`<optgroup label="${esc(c)}">${
      ms.filter(m=>(m.cat||"その他")===c).map(m=>
        `<option value="${esc(m.n)}"${MNORM(m.n)===MNORM(val)?" selected":""}>${esc(m.n)}${
          m.p?`　¥${m.p.toLocaleString()}`:""}</option>`).join("")}</optgroup>`).join("")}
    ${extra?`<option value="${esc(val)}" selected>${esc(val)}</option>`:""}
  </select>`;
}
/* オプションの1つぶん（v134）。Squareの「オプション」カテゴリから選ぶ。
   いまカルテに入っている名前がSquareの一覧に無いときは、消えないよう末尾に足しておく */
function optSelect(i,val){
  const os=OPTIONS(), v=String(val||"").trim();
  const extra=v&&!os.some(o=>MNORM(o.n)===MNORM(v));
  return `<select class="f-in kopt" id="k-opt${i}" data-opt="${i}"${i>1?' style="margin-top:6px"':""}>
    <option value="">（なし）</option>
    ${os.map(o=>`<option value="${esc(o.n)}"${MNORM(o.n)===MNORM(v)?" selected":""}>${esc(o.n)}${o.p?`　¥${o.p.toLocaleString()}`:""}</option>`).join("")}
    ${extra?`<option value="${esc(v)}" selected>${esc(v)}</option>`:""}
  </select>`;
}
/* 販売した商品（物販）の1行（v134）。
   Squareから来た行には data-sq="1" を付けておく。**在庫の販売数はSquareを元にしているので、
   ここで二重に数えないため**。品物を選び直したらSquareの行ではなくなるので札を外す */
function saleRow(pid,qty,sq){
  const gs=db.products.filter(p=>p.kind==="物販");
  return `<div class="matrow salerow" data-sq="${sq?1:0}">
    <select class="f-in sale-p">
      <option value="">なし</option>
      ${gs.map(p=>`<option value="${p.id}"${p.id===pid?" selected":""}>${esc(p.n)}</option>`).join("")}
    </select>
    <input class="f-in sale-q" type="number" min="1" step="1" value="${qty||1}">
    <span>個</span>
    <button class="sale-x" type="button" aria-label="削除">×</button>
  </div>`;
}
function readSales(){
  return [...document.querySelectorAll("#k-sales .salerow")].map(r=>{
    const o={pid:r.querySelector(".sale-p").value, qty:+r.querySelector(".sale-q").value||1};
    if(r.dataset.sq==="1") o.sq=true;
    return o;
  }).filter(x=>x.pid);
}
function drawSales(list){
  const box=document.getElementById("k-sales"); if(!box) return;
  box.innerHTML=(list&&list.length?list:[{pid:"",qty:1}]).map(x=>saleRow(x.pid,x.qty,x.sq)).join("");
  box.querySelectorAll(".sale-x").forEach(b=>b.onclick=()=>{
    const rows=box.querySelectorAll(".salerow");
    if(rows.length<=1) drawSales([]); else { b.closest(".salerow").remove(); }
  });
  box.querySelectorAll(".sale-p").forEach(s=>s.onchange=()=>{
    const r=s.closest(".salerow"); if(r) r.dataset.sq="0";
  });
}
/* 使用材料の1行（一番上は「なし」、その下に材料＝黄のものだけ） */

/* キャンペーンで渡した商品の1行（v114。物販商品から選ぶ）。

/* カルテの写真（v117）。長辺640pxのJPEGに縮めて4枚まで。
   お客様1人あたり何十枚も溜まる場所なので、商品写真（320px）と請求書（1400px）の中間にした。
   画面を開いているあいだだけ持ち、保存時にカルテへ入る */
let kPhotos=[];
/* ---------- 担当（v198） ----------
   利用者の指示：**「カルテの中の担当がデフォでその他になってるけど
   川口、水野、その他でプルダウンで選択。デフォは川口で川口以外は選びなおすがよい。
   川口以外はほとんど施術しないから」**

   直したのは2か所。
     1. **編集画面の担当が打ち込み欄だった**（新規カルテだけプルダウンだった）。
        Squareから来たカルテはこの画面しか通らないので、
        「その他」と書かれた文字を手で消して打ち直すしかなかった
     2. **Squareの取り込みが「その他」を入れていた。**
        `o.staff` は Square の `created_by_team_member_id`＝**会計を打った人**であって、
        施術した人ではない。だれが打っても team member が付くので、
        ほぼ全部が「その他」になっていた。**既定を川口さんに変える**

   ★ すでに取り込みずみのカルテの「その他」は書き換えていない
     （本当に川口さん以外だったぶんまで塗り替えてしまうため）。この画面で選び直せる。 */
function staffSelect(cur,attr,forId){
  const v=String(cur||"").trim(), known=STAFF.includes(v);
  return `<div><label class="f"${forId?` for="${forId}"`:""}>担当</label>
    <select class="f-in" ${attr||""}>
      ${STAFF.map(x=>`<option${x===(known?v:STAFF[0])?" selected":""}>${x}</option>`).join("")}
      ${(!known&&v)?`<option selected>${esc(v)}</option>`:""}
    </select></div>`;
}

/* ---------- カルテを直すときの 材料／プレゼント／キャンペーン（v129） ----------
   利用者の指摘：**同じメニューでも使う材料が違うことがある。
   だからメニューにレシピを結ぶより、カルテで材料を選んで原価を出すほうがよい。**

   新規カルテのフォームには前から材料の窓があったが、
   **Squareの決済から自動でできたカルテには入口が無かった**（「この内容を直す」は文字の欄だけ）。
   お客様が会計するとカルテはSquareから自動でできるので、実際にはこちらが本番。ここに窓を足した。

   作りは新規フォームと同じだが、モーダルの中なので **id を使わず data-ke で引く**。
   同じ id が文書に2つあると querySelector が拾い違えるため。 */
const KEROW={mats :[matRow ,"matrow" ,"mat-p" ,"mat-q" ,"mat-x" ,"材料"      ,"材料"],
             gifts:[giftRow,"giftrow","gift-p","gift-q","gift-x","プレゼント","物販"],
             camps:[campRow,"camprow","camp-p","camp-q","camp-x","キャンペーン","物販"],
             /* v134：Squareのカルテにも物販の欄を出す。
                Squareから来た行は data-sq="1" のまま残し、在庫で二重に数えない */
             sales:[saleRow,"salerow","sale-p","sale-q","sale-x","物販"      ,"物販"]};
function keDraw(box,kind,list){
  if(!box) return;
  const [row,cls,ps,,xs]=KEROW[kind];
  box.innerHTML=(list&&list.length?list:[{pid:"",qty:1}]).map(x=>row(x.pid,x.qty,x.sq)).join("");
  box.querySelectorAll("."+xs).forEach(b=>b.onclick=()=>{
    if(box.querySelectorAll("."+cls).length<=1) keDraw(box,kind,[]);
    else b.closest("."+cls).remove();
    keCost(box.closest("[data-kebox]"));
  });
  box.querySelectorAll("select,input").forEach(i=>i.onchange=()=>{
    // 品物を選び直したら、それはもうSquareから来た行ではない（在庫で数え直す側に回す）
    const r=i.closest("."+cls);
    if(r&&r.dataset.sq==="1"&&i.classList.contains(ps)) r.dataset.sq="0";
    keCost(box.closest("[data-kebox]"));
  });
}
/* 直す画面（モーダル）のメニュー欄・オプション欄（v144）。
   新規カルテと同じく **1つから始めて、ボタンで増やす**。
   id を使わず data- で引くのは、新規カルテの欄と同じ文書に並ぶことがあるため */
const keMenuRead=root=>[...root.querySelectorAll("[data-kmbox] .kmenu")].map(e=>e.value.trim());
const keOptRead =root=>[...root.querySelectorAll("[data-kobox] .kopt")].map(e=>e.value.trim());

function keRead(box,kind){

/* いま選んでいるぶんの原価を、直しながら見えるように出す */
function keCost(root){

  const out=root.querySelector("[data-kecost]"); if(!out) return;

/* 重なった予約を横に並べるためのレーン計算 */
function lanes(list){
  const it=list.map(a=>({a,st:toMin(a.start),en:toMin(a.start)+(a.dur||60)}))
               .sort((x,y)=>x.st-y.st||y.en-x.en);
  const groups=[]; let g=[], end=-1;
  it.forEach(x=>{ if(g.length&&x.st>=end){groups.push(g);g=[];end=-1;} g.push(x); end=Math.max(end,x.en); });
  if(g.length) groups.push(g);
  groups.forEach(gr=>{
    const tail=[];
    gr.forEach(x=>{ let i=0; while(tail[i]!==undefined&&tail[i]>x.st) i++; tail[i]=x.en; x.lane=i; });
    gr.forEach(x=>x.n=tail.length);
  });
  return it;
}

    <span>${hint}</span></div>`;
}

function evHtml(x){
  const a=x.a, w=100/x.n, L=x.lane*w;
  const off=a.status==="cancel";
  const top=(x.st-OPEN*60)/60*PXH, h=Math.max(20,(x.en-x.st)/60*PXH-2);
  const who=a.staff&&a.staff!=="その他"?`（${esc(a.staff)}）`:"";
  return `<div class="ev${off?" cx":""}" data-id="${a.id}"
    style="top:${top}px;height:${h}px;left:${L}%;width:calc(${w}% - 3px);background:${off?"#B9BDB6":colOf(a)}">
    <span class="t">${a.start} - ${toHM(x.en)}</span>
    <span class="n">${off?"取消 ":""}${isNew(a)&&!off?"新":""}${esc(a.name)}${who}</span></div>`;
}

function dayCols(days){
  return days.map(d=>{
    const now=d===today()?" now":"";
    const timed=apptsOf(d).filter(a=>!a.allday);
    const grid=Array.from({length:CLOSE-OPEN},()=>`<div class="hr"></div>`).join("");
    return `<div class="cday${now}" data-d="${d}">${grid}${lanes(timed).map(evHtml).join("")}</div>`;
  }).join("");
}

function renderSched(){
  const el=document.getElementById("sched");
  const bar=(title)=>`<div class="schbar">
      <button class="nav" id="prev">前へ</button>
      <button class="nav" id="next">次へ</button>
      <button class="nav" id="tdy">今日</button>
      <button class="btn" id="ap-new">予約を追加</button>
      <span class="title">${title}</span>
      <span class="grp">
        <button data-v="month" aria-pressed="${schView==="month"}">月</button>
        <button data-v="week"  aria-pressed="${schView==="week"}">週</button>
        <button data-v="day"   aria-pressed="${schView==="day"}">日</button>
      </span></div>`;

  if(schView==="month"){
    const d=D(schDate), first=new Date(d.getFullYear(),d.getMonth(),1);
    const start=shiftDay(iso(first),-first.getDay());
    let cells="";
    for(let i=0;i<42;i++){
      const day=shiftDay(start,i), dd=D(day);
      const out=dd.getMonth()!==d.getMonth()?" out":"", now=day===today()?" now":"";
      const items=apptsOf(day).slice(0,4).map(a=>
        `<span class="mi" style="background:${a.allday?"#F2A2C6":colOf(a)};${a.allday?"color:#54203D":""}"
          >${a.allday?"":a.start+" "}${esc(a.name)}</span>`).join("");
      cells+=`<div class="mc${out}${now}" data-d="${day}"><span class="d">${dd.getDate()}</span>${items}
        ${apptsOf(day).length>4?`<span class="d">ほか${apptsOf(day).length-4}件</span>`:""}</div>`;
    }
    el.innerHTML=bar(`${d.getFullYear()}年${d.getMonth()+1}月`)+
      `<div class="mo">${[...DOW].map(w=>`<div class="mh">${w}</div>`).join("")}${cells}</div>`+
      legendHtml("日付をタップすると予定を追加できます")+`<div id="apf"></div>`;
    el.querySelectorAll(".mc").forEach(c=>c.onclick=()=>{schDate=c.dataset.d;schView="day";apEdit=null;renderSched()});
  }else{
    const days = schView==="week"
      ? Array.from({length:7},(_,i)=>shiftDay(weekStart(schDate),i))
      : [schDate];
    const t0=D(days[0]), t1=D(days[days.length-1]);
    const title = schView==="week"
      ? `${t0.getFullYear()}年${t0.getMonth()+1}月${t0.getDate()}日 – ${t1.getMonth()+1}月${t1.getDate()}日`
      : `${t0.getFullYear()}年${t0.getMonth()+1}月${t0.getDate()}日（${DOW[t0.getDay()]}）`;

    const heads=days.map(d=>{
      const w=D(d).getDay();
      return `<div class="cday chead${w===0?" sun":w===6?" sat":""}${d===today()?" now":""}">${md(d)}(${DOW[w]})</div>`;
    }).join("");
    const allday=days.map(d=>{
      const off=apptsOf(d).filter(a=>a.allday)
        .map(a=>`<div class="off" data-id="${a.id}">${esc(a.name)}</div>`).join("");
      return `<div class="cday${d===today()?" now":""}" data-d="${d}" data-all="1">${off}</div>`;
    }).join("");
    const hours=Array.from({length:CLOSE-OPEN},(_,i)=>`<div class="hr"><span>${OPEN+i}時</span></div>`).join("");

    el.innerHTML=bar(title)+`
      <div class="cw">
        <div class="crow"><div class="cax"></div>${heads}</div>
        <div class="allday"><div class="cax">終日</div>${allday}</div>
        <div class="cbody"><div class="cax">${hours}</div>${dayCols(days)}</div>
      </div>
      ${legendHtml("空いているところをタップすると予定を追加できます")}
      <div id="apf"></div>`;

    const body=el.querySelector(".cbody");

    /* いまの時刻を赤いバーで示す（30秒ごとに動かす） */
    const drawNow=()=>{
      const host=document.getElementById("sched");
      if(!host||!host.querySelector(".cbody")) return false;
      host.querySelectorAll(".nowline,.nowtime").forEach(x=>x.remove());
      const n=new Date(), min=n.getHours()*60+n.getMinutes();
      if(min<OPEN*60||min>CLOSE*60) return true;
      const top=(min-OPEN*60)/60*PXH;
      const col=host.querySelector(".cbody .cday.now");
      if(col){ const d=document.createElement("div"); d.className="nowline";
        d.style.top=top+"px"; col.appendChild(d); }
      const ax=host.querySelector(".cbody .cax");
      if(ax){ const t=document.createElement("div"); t.className="nowtime";
        t.style.top=top+"px"; t.textContent=toHM(min); ax.appendChild(t); }
      return true;
    };
    drawNow();
    clearInterval(window.__nowTimer);
    window.__nowTimer=setInterval(()=>{ if(!drawNow()) clearInterval(window.__nowTimer); },30000);

    /* 今日が見えている週は、いまの時刻あたりまでスクロールしておく */
    if(days.includes(today())){
      const n=new Date(), min=n.getHours()*60+n.getMinutes();
      body.scrollTop=Math.max(0,(min-OPEN*60)/60*PXH-120);
    }

    const sb=body.offsetWidth-body.clientWidth;
    if(sb>0){
      el.querySelector(".crow").style.paddingRight=sb+"px";
      el.querySelector(".allday").style.paddingRight=sb+"px";
    }

    /* v196：click ではなく tapOn（pointerup）。iPad でも反応させるため。
       予約の札（.ev）の上は enableDrag が受け持つので、ここでは何もしない */
    el.querySelectorAll(".cbody .cday").forEach(col=>tapOn(col,e=>{
      if(e.target.closest(".ev")) return;
      const y=e.clientY-col.getBoundingClientRect().top;
      const min=Math.round((OPEN*60+y/PXH*60)/15)*15;
      openAp({date:col.dataset.d,start:toHM(Math.min(min,CLOSE*60-60))});
    }));
    el.querySelectorAll(".allday .cday").forEach(col=>tapOn(col,e=>{
      if(e.target.closest(".off")) return;
      openAp({date:col.dataset.d,allday:true,off:"day",name:OFFLBL("day"),kind:"再来"});
    }));
  }

  el.querySelectorAll(".off,.mi").forEach(b=>b.onclick=ev=>{
    ev.stopPropagation();
    const a=db.appts.find(x=>x.id===b.dataset.id); if(a) openAp(a);
  });
  if(schView!=="month") enableDrag(el,
    schView==="week"?Array.from({length:7},(_,i)=>shiftDay(weekStart(schDate),i)):[schDate]);
  const step=schView==="month"?"m":schView==="week"?7:1;
  const move=n=>{
    if(step==="m"){const d=D(schDate);d.setMonth(d.getMonth()+n);schDate=iso(d);}
    else schDate=shiftDay(schDate,step*n);
    apEdit=null; renderSched();
  };
  document.getElementById("prev").onclick=()=>move(-1);
  document.getElementById("next").onclick=()=>move(1);
  document.getElementById("tdy").onclick=()=>{schDate=today();apEdit=null;renderSched()};
  document.getElementById("ap-new").onclick=()=>{
    openApModal({id:null,cid:null,name:"",date:schDate,start:"10:00",dur:60,
      staff:STAFF[0],menu:"",src:"直接",kind:"再来",allday:false,note:"",off:""});
    apEditMode=true;
    document.getElementById("mo-form").innerHTML='<div id="apf"></div>';
    drawApForm();
  };
  el.querySelectorAll(".grp button").forEach(b=>b.onclick=()=>{schView=b.dataset.v;apEdit=null;renderSched()});
  if(apEdit) drawApForm();
}

function openAp(a){
  apEdit=Object.assign({id:null,cid:null,name:"",date:schDate,start:"10:00",dur:60,
    staff:STAFF[0],menu:"",src:"HPB",kind:"再来",allday:false,note:"",off:""},a||{});
  drawApForm();
  /* v196：入力欄はカレンダーの**下**に出る。iPad は画面が狭くて表の下まで見えないので、
     タップしたのに何も起きていないように見えていた。開いたら見えるところまで送る */
  const box=document.getElementById("apf");
  if(box&&typeof box.scrollIntoView==="function")
    requestAnimationFrame(()=>box.scrollIntoView({behavior:"smooth",block:"center"}));
}

/* ---------- 予定の種類（v122） ----------
   お客様の予約のほかに、休みや自分の用事を入れられるようにした。
   `a.off` が空でないものは **予約として数えない**（件数・見込み・リマインド・来店ペース）。

   ★ 「午後休み」は終日ではないので、`allday` だけで弾いていた今までの作りだと
     予約として数えられてしまう。だから `isBooking()` を1か所にまとめて、そこを通す。 */
const OFFKINDS=[["","お客様の予約"],["day","一日休み"],["am","午前休み"],
                ["pm","午後休み"],["private","予定あり（プライベート）"]];
const OFFLBL=k=>(OFFKINDS.find(x=>x[0]===k)||["",""])[1];
/* その予定の既定の時間帯 */
const OFFTIME={am:{start:"09:00",dur:240},pm:{start:"13:00",dur:360},private:{start:"12:00",dur:60}};
/* お客様の予約として数えるか。**集計はすべてこれを通すこと** */
const isBooking=a=>!!a&&!a.allday&&!a.off&&a.status!=="cancel";

function drawApForm(){
  const a=apEdit, box=document.getElementById("apf");
  if(!box) return;
  box.innerHTML=`<div class="sheet" style="margin-top:16px">
    <div class="divider" style="margin-top:0"><h2>${a.id?"予定を編集":"予定を追加"}</h2></div>
