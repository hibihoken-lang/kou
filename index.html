/* ---------- 現金出納帳の月次まとめ（別ページ・印刷できる） ----------
   左に入ってきたお金、右に出ていったお金を並べた貸借対照表ふうの表と、
   1日から末日までの残高の動きを1枚で見られるようにしたもの（v76） */
function openCashSheet(m){
  document.getElementById("cbsheet")?.remove();
  const rows=cashDayRows(m);
  const open=cashOpening(m), close=cashClosing(m);
  const inTotal=rows.filter(r=>r.amt>0).reduce((a,r)=>a+r.amt,0);
  const outTotal=rows.filter(r=>r.amt<0).reduce((a,r)=>a-r.amt,0);
  const actual=db.cashbook.actual[m], diff=actual!=null?actual-close:null;
  const cur=m===today().slice(0,7);

  /* 内容ごとにまとめる。Squareの取込ぶんは1本にまとめたほうが見やすい */
  const group=f=>{
    const g={};
    rows.filter(f).forEach(r=>{
      const k=r.auto?"Square現金売上":(r.note||"その他");
      if(!g[k]) g[k]={sum:0,n:0};
      g[k].sum+=Math.abs(r.amt); g[k].n++;
    });
    return Object.entries(g).sort((a,b)=>b[1].sum-a[1].sum);
  };
  const side=(list,head,tail)=>`<table class="chk"><tbody>
    ${head}
    ${list.map(([k,v])=>`<tr><th>${esc(k)}<small style="color:var(--ink3)"> ${v.n}件</small></th>
      <td>${yen(v.sum)}</td></tr>`).join("")||`<tr><th style="color:var(--ink3)">（なし）</th><td>${yen(0)}</td></tr>`}
    ${tail}</tbody></table>`;

  const y=+m.slice(0,4), mo=+m.slice(5,7);
  const last=new Date(y,mo,0).getDate();
  const WD=["日","月","火","水","木","金","土"];
  let bal=open, calRows="";
  for(let d=1;d<=last;d++){
    const ds=`${m}-${String(d).padStart(2,"0")}`;
    const rs=rows.filter(r=>r.date===ds);
    const i=rs.filter(r=>r.amt>0).reduce((a,r)=>a+r.amt,0);
    const o=rs.filter(r=>r.amt<0).reduce((a,r)=>a-r.amt,0);
    bal+=i-o;
    const w=new Date(y,mo-1,d).getDay();
    const cls=w===0?"sun":w===6?"sat":"";
    const names=[...new Set(rs.map(r=>r.who||r.note||"").filter(Boolean))];
    const memo=names.slice(0,3).join("、")+(names.length>3?` ほか${names.length-3}件`:"");
    calRows+=`<tr class="${rs.length?"":"zero"}${ds===today()?" cbedit":""}">
      <th class="${cls}">${d}<small> (${WD[w]})</small></th>
      <td>${i?yen(i):"—"}</td><td>${o?"△"+yen(o):"—"}</td>
      <td>${yen(bal)}</td>
      <td style="text-align:left">${esc(memo)}</td></tr>`;
  }

  const ov=document.createElement("div");
  ov.id="cbsheet"; ov.className="mo-ov";
  ov.innerHTML=`<div class="mo-box" style="max-width:900px">
    <div class="mo-hd"><span>${m.replace("-","年")}月　現金出納帳 まとめ</span><button id="cs-x">×</button></div>
    <div class="mo-bd" style="display:block">
      <div class="sum" style="margin-bottom:16px">
        <div><span>月初残高</span><b>${yen(open)}</b></div>
        <div><span>入金合計</span><b>${yen(inTotal)}</b></div>
        <div><span>出金合計</span><b>${yen(outTotal)}</b></div>
        <div class="adv"><span>${cur?"今の残高（帳簿）":"月末残高（帳簿）"}</span><b>${yen(close)}</b></div>
      </div>

      <div class="bs">
        <div><h3>入ってきたお金</h3>
          ${side(group(r=>r.amt>0),
            `<tr><th>月初残高（繰越）</th><td>${yen(open)}</td></tr>`,
            `<tr class="bdtot"><th>合計</th><td>${yen(open+inTotal)}</td></tr>`)}</div>
        <div><h3>出ていったお金</h3>
          ${side(group(r=>r.amt<0),"",
            `<tr><th>${cur?"今の残高":"月末残高"}（手もとに残っているはず）</th><td>${yen(close)}</td></tr>
             <tr class="bdtot"><th>合計</th><td>${yen(outTotal+close)}</td></tr>`)}</div>
      </div>
      <p class="note">左右の合計は必ず同じ金額になります（月初にあったお金＋入ってきたお金 ＝ 出ていったお金＋いま残っているお金）。
        ${actual!=null?`実際に数えた現金は ${yen(actual)}、帳簿との差額は <b style="${diff!==0?"color:var(--alert)":""}">${diff>0?"+":""}${yen(diff)}</b>${diff===0?"（一致しています）":"（合わないぶんは記録もれか数え間違いです）"}`
          :`実際に数えた現金を出納帳の画面で入れておくと、帳簿との差額もここに出ます。`}</p>

      <div class="divider"><h2>日ごとの動き</h2></div>
      <table class="chk cal"><thead><tr><th>日</th><th>入金</th><th>出金</th><th>残高</th><th style="text-align:left">摘要</th></tr></thead>
        <tbody>${calRows}</tbody></table>
      <p class="note">「△」は出ていったお金です。動きの無かった日は薄く出しています。
        ${cur?"色のついた行が本日です。":""}</p>
    </div>
    <div class="mo-ft">
      <button class="btn" id="cs-print">印刷する</button>
      <span class="sp"></span>
      <button class="btn quiet" id="cs-close">閉じる</button>
    </div></div>`;
  document.body.appendChild(ov);
  const close2=()=>ov.remove();
  ov.onclick=e=>{ if(e.target===ov) close2(); };
  document.getElementById("cs-x").onclick=close2;
  document.getElementById("cs-close").onclick=close2;
  document.getElementById("cs-print").onclick=()=>window.print();
}

/* ================= 仕入れの取り込み（v79／v82で作り直し） =================
   入り口は3つ：GmailのNBS注文確認メール、伝票PDF（ミラビスの請求明細書）の添付、貼り付け。
   どこから入っても行き先はひとつで、db.buydrafts という同じ一覧に集まる。
   そこで1品目ずつ 商品（物販）／材料／消耗品 に手で分ける。
   　商品・材料 → 在庫表の「仕入」欄に数量を足す
   　消耗品 　　→ 在庫を通さず、買った月の経費として数える（supplyCost）
   金額はどの入り口でも税込にそろえる（税抜の伝票は d.tax="ex" で10%を足す）。
   伝票に書かれた合計と読み取った明細の合計は必ず突き合わせて画面に出す（docTotalOf）。
   下書きは db に置いてあるので、途中で閉じても消えない。
   確定したものは db.buys に履歴として残し、丸ごと取り消せる（在庫からも引く） */

/* ★★★ v206：**APPVER と同じにするのをやめた。** ★★★
   `BUYVER` は「仕入れの**読み取りの作り**を最後に直した版」。
   これを `APPVER` に結びつけていたので、**読み取りを1行も触っていない版に上げただけで、
   仕分け途中の下書きが捨てられていた。**
   川口さんが店で使い始めているいま、これは実際に入力が消える道になる
   （引き継ぎの「版が混ざると仕入れの下書きが消える」はこれのこと）。

   ★ **読み取りの作りを直したときだけ、ここを上げること。**
     上げ忘れると、壊れた下書きが生き残る（v87でやらかした）。
     いまの値は v192（伝票の写真を文字にして読み取る作りを入れた版）。

   （もとのおぼえがき）下書きを読み取った版。**APPVER と同じ**にしてあった。
   読み取りの不具合を直しても、すでに作られた下書きは直らない。
   だから版を上げたら、それより前に読み取った仕分け待ちは起動時に捨てる（load を参照）。
   v87で BUYVER を上げ忘れて、壊れた下書きが生き残った。二度と忘れないよう APPVER に結びつけた */
const BUYVER=192;
const BUYSRC=["NBS","ミラビス","立替","その他"];
/* 列の見出しから、どの列が何かを当てる */
const BUYCOL={
  code :/品番|商品コード|コード|型番|JAN|code|item ?no/i,
  n    :/品名|商品名|品目|名称|商品|内容|item|name/i,
  qty  :/数量|個数|入数|本数|数$|qty|quantity/i,
  price:/単価|仕切|仕入単価|税抜単価|価格|price|unit/i,
  amt  :/金額|小計|合計|amount|total/i
};
const BUYLBL={code:"品番",n:"品名",qty:"数量",price:"単価",amt:"金額"};
/* 名前だけで「材料（施術で使う・消耗する物）」と言い切れるものだけを自動で決める。
   ジェルやクリームは売り物にも施術用にもなるので、あえて推測しない＝手で選んでもらう */
const MATHINT=/ガーゼ|コットン|脱脂綿|手袋|グローブ|カニューレ|スパチュラ|ヘラ|ペーパー|シーツ|綿棒|アルコール|消毒|洗剤|ゴミ袋|ラベル|替刃|チップ|紙コップ|マスク|ラップ|ティッシュ|バンド|ゴム/;
const bnum=s=>{const v=String(s??"").normalize("NFKC").replace(/[^0-9.\-]/g,"");
  return v&&!isNaN(+v)?Math.round(+v*100)/100:0;};

/* ========== 小分けして使うものの入り数（v89） ==========
   「【30枚セット】」「(1セット20包入り)」「1袋30枚」「(55包)」のように、
   1つ買うと中に何個入っているかが商品名に書いてあることがある。
   在庫は1枚・1包の単位で数えたいので、単価をその数で割り、入荷数をその数にする。
   例：バイオセルロース モイストマスクプラス【30枚セット】 ¥18,150 ×1
   　→ 1枚 ¥605 ×30枚（合計は ¥18,150 のまま変わらない）
   名前に数字が無ければ何もしない */
const PACKPAT=[
  /(\d+)\s*(?:枚|包|本|個|錠|粒|カプセル|回分)\s*入/,              // 30枚入り／20包入り
  /(\d+)\s*(?:枚|包|本|個|錠|粒|カプセル)\s*セット/,               // 30枚セット
  /[（(【\[]\s*(\d+)\s*(?:枚|包|本|個|錠|粒|カプセル)\s*[）)】\]]/, // (55包)
  /(?:1|１)\s*(?:袋|箱|本|セット|ケース)\s*(\d+)\s*(?:枚|包|個|本)/,// 1袋30枚
  /(\d+)\s*(?:枚|包)\s*$/                                          // 末尾の「100包」
];
function packOf(name){
  const s=String(name||"").normalize("NFKC");
  for(const re of PACKPAT){
    const m=s.match(re);
    if(m){ const n=+m[1]; if(n>1&&n<=10000) return n; }
  }
  return 0;
}
/* 割り切れるときだけ分ける。割り切れないと合計が伝票とずれて突合が合わなくなる */
const canSplit=r=>r.pack>1&&r.price0>0&&r.price0%r.pack===0;
/* 分けた単価とそのままの単価、どちらがマスタの原価に近いか。
   「ワコナルビューティー 100包」のように、もともと1袋単位で登録してある品を
   勝手にばらさないための歯止め */
function wantSplit(r,p){
  if(!canSplit(r)) return false;
  if(!p||!p.cost) return true;
  const unit=r.price0/r.pack;
  return Math.abs(p.cost-unit)<=Math.abs(p.cost-r.price0);
}
/* 分ける・分けないを、読み取ったままの値（qty0/price0）から作り直す */
function applySplit(r){
  if(r.split&&canSplit(r)){ r.qty=r.qty0*r.pack; r.price=r.price0/r.pack; }
  else { r.qty=r.qty0; r.price=r.price0; }
  return r;
}

/* 引用符つきCSVも読める行分割 */
function splitRow(line,sep){
  const out=[]; let cur="", q=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(q){ if(c==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===sep){ out.push(cur); cur=""; }
    else cur+=c;
  }
  out.push(cur);
  return out.map(s=>s.trim());
}

/* ========== PDFから明細を取り出す（v81） ==========
   ミラビスの請求明細書のように、1マスずつ座標つきで書かれたPDFなら、
   その座標で表に組み直せる（縦位置が同じもの＝1行、横位置の順＝列）。
   使うのはブラウザに元から入っている DecompressionStream だけで、外部ライブラリは足していない。
   紙をスキャンしただけのPDFは文字が入っていないので読めない。その場合はその旨を返す */
function pdfL1(x){
  const u=x instanceof Uint8Array?x:new Uint8Array(x);
  let s="";
  for(let i=0;i<u.length;i+=8192) s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));
  return s;
}
async function pdfInflate(u8){
  if(typeof DecompressionStream!=="function"||typeof Response!=="function") return null;
  for(const fmt of ["deflate","deflate-raw"]){
    try{
      const st=new Response(u8).body.pipeThrough(new DecompressionStream(fmt));
      return new Uint8Array(await new Response(st).arrayBuffer());
    }catch(e){}
  }
  return null;
}
/* ファイル全体から「N 0 obj」を拾い、中の stream を展開する。
   長さは必ず /Length を見る。圧縮されたバイト列にはたまたま "endstream" と読める並びが
   混じることがあり、そこで切ると展開に失敗して本文を丸ごと取り逃がすため（v81で踏んだ） */
async function pdfStreams(buf){
  const s=pdfL1(buf), u8=new Uint8Array(buf), out=[];
  /* 「/Length 12 0 R」のように別オブジェクトを指している長さを解く。
     圧縮されたバイト列にも「12 0 obj」と読める並びが紛れるので、
     数字ひとつだけが入って endobj で閉じる形に限って本物とみなす */
  const intOf=id=>{
    const m=s.match(new RegExp("(?:^|[^0-9])"+id+"\\s+\\d+\\s+obj\\s*(\\d+)\\s*endobj"));
    return m?+m[1]:0;
  };
  const re=/(\d+)\s+\d+\s+obj\b/g;
  let m;
  while((m=re.exec(s))){
    const from=m.index+m[0].length;
    const st=s.indexOf("stream",from);
    const endObj=s.indexOf("endobj",from);
    if(st<0||(endObj>=0&&endObj<st)){             // stream を持たないオブジェクト
      if(endObj>=0) re.lastIndex=endObj+6;
      continue;
    }
    const dict=s.slice(from,st);
    const ind=dict.match(/\/Length\s+(\d+)\s+\d+\s+R/);
    const dir=dict.match(/\/Length\s+(\d+)/);
    const len=ind?intOf(ind[1]):(dir?+dir[1]:0);
    let p=st+6;
    if(s[p]==="\r")p++;
    if(s[p]==="\n")p++;
    const end=len>0?p+len:s.indexOf("endstream",p);
    if(!(end>p)) continue;
    // 中身のバイト列を読み飛ばす。ここを飛ばさないと、binaryの中の
    // 「N 0 obj」に引っかかってオブジェクトの位置を取り違える（v81で踏んだ）
    re.lastIndex=end+9;
    // 画像は読まない。文字の対応表は無圧縮で入っていることがあるので、
    // 圧縮されていない stream もそのまま読む（ミラビスの明細書がこれ）
    if(/\/Subtype\s*\/Image|\/(DCT|JPX|CCITTFax|JBIG2)Decode/.test(dict)) continue;
    const data=/\/FlateDecode/.test(dict)
      ? await pdfInflate(u8.subarray(p,end))
      : u8.subarray(p,end);
    if(data) out.push(data);
  }
  return out;
}
/* ToUnicode の対応表。グリフ番号→文字 */
function parseCMap(txt){
  const map={};
  const hx=h=>parseInt(h,16);
  const uni=h=>{ let t=""; for(let i=0;i+3<h.length+1;i+=4) t+=String.fromCharCode(parseInt(h.substr(i,4),16)); return t; };
  let m, k;
  const bc=/beginbfchar([\s\S]*?)endbfchar/g;
  while((m=bc.exec(txt))){
    const re=/<([0-9A-Fa-f]+)>\s*<([0-9A-Fa-f]+)>/g;
    while((k=re.exec(m[1]))) map[hx(k[1])]=uni(k[2]);
  }
  const br=/beginbfrange([\s\S]*?)endbfrange/g;
  while((m=br.exec(txt))){
    const re=/<([0-9A-Fa-f]+)>\s*<([0-9A-Fa-f]+)>\s*(?:<([0-9A-Fa-f]+)>|\[([\s\S]*?)\])/g;
    while((k=re.exec(m[1]))){
      const a=hx(k[1]), b=hx(k[2]);
      if(k[3]!=null){ const base=hx(k[3]);
        for(let c=a;c<=b&&c-a<65536;c++) map[c]=String.fromCharCode(base+(c-a)); }
      else { let i=0, x; const re2=/<([0-9A-Fa-f]+)>/g;
        while((x=re2.exec(k[4]||""))) map[a+(i++)]=uni(x[1]); }
    }
  }
  return map;
}
/* 描画命令を追って、文字とその座標を集める */
function pdfRuns(content,cmap){
  const runs=[];
  let x=0, y=0, size=0;
  const dec=h=>{
    let t="";
    for(let i=0;i+4<=h.length;i+=4){ const c=parseInt(h.substr(i,4),16); if(cmap[c]!=null) t+=cmap[c]; }
    if(!t&&h.length%2===0){                      // 1バイト字形のPDFも一応みる
      for(let i=0;i+2<=h.length;i+=2){ const c=parseInt(h.substr(i,2),16); if(cmap[c]!=null) t+=cmap[c]; }
    }
    return t;
  };
  const re=/([-\d.]+)\s+([-\d.]+)\s+([-\d.]+)\s+([-\d.]+)\s+([-\d.]+)\s+([-\d.]+)\s+Tm|<([0-9A-Fa-f]*)>\s*Tj|\[([^\]]*)\]\s*TJ|([-\d.]+)\s+([-\d.]+)\s+Td/g;
  let m;
  while((m=re.exec(content))){
    if(m[1]!=null){ size=Math.abs(+m[1])||size; x=+m[5]; y=+m[6]; }
    else if(m[9]!=null){ x+=+m[9]; y+=+m[10]; }
    else {
      let t="";
      if(m[7]!=null) t=dec(m[7]);
      else { let h; const re2=/<([0-9A-Fa-f]+)>/g; while((h=re2.exec(m[8]||""))) t+=dec(h[1]); }
      if(t.trim()) runs.push({x,y,size,t});
    }
  }
  return runs;
}
/* 縦位置が同じものを1行にまとめ、横位置の順に並べて表にする。
   請求書には宛名・住所・電話番号など表でない文字も載っているので、
   「同じ横位置に何行もそろっている」ところを明細の表とみなして、そこだけ抜き出す */
function runsToTable(runs){
  const sorted=runs.slice().sort((a,b)=>b.y-a.y||a.x-b.x);
  const rows=[];
  let cur=null, curY=0;
  sorted.forEach(r=>{
    const tol=Math.max(2,(r.size||8)*0.4);
    if(!cur||Math.abs(curY-r.y)>tol){ cur=[]; rows.push(cur); curY=r.y; }
    cur.push(r);
  });
  rows.forEach(c=>c.sort((a,b)=>a.x-b.x));
  const plain=()=>rows.map(c=>c.map(x=>x.t.trim()));

  // マスが4つ以上ある行を集め、そのx座標が近いものを1つの「列」にまとめる
  const cand=rows.filter(r=>r.length>=4);
  if(cand.length<3) return plain();
  const xs=[]; cand.forEach(r=>r.forEach(c=>xs.push(c.x)));
  xs.sort((a,b)=>a-b);
  const groups=[];
  xs.forEach(x=>{
    const last=groups[groups.length-1];
    if(last&&x-last.x<=6){ last.n++; last.x=(last.x*(last.n-1)+x)/last.n; }
    else groups.push({x,n:1});
  });
  // 何行にもわたって同じ位置に出る＝表の列
  const strong=groups.filter(g=>g.n>=Math.max(4,cand.length*0.3)).map(g=>g.x);
  if(strong.length<3) return plain();

  const near=x=>{
    let bi=-1, bd=1e9;
    strong.forEach((sx,i)=>{ const d=Math.abs(sx-x); if(d<bd){ bd=d; bi=i; } });
    return bd<=10?bi:-1;
  };
  const out=[];
  rows.forEach(cells=>{
    const line=new Array(strong.length).fill("");
    let hit=0;
    cells.forEach(c=>{ const i=near(c.x); if(i<0) return;
      line[i]=(line[i]?line[i]+" ":"")+c.t.trim(); hit++; });
    if(hit>=Math.max(3,strong.length*0.6)) out.push(line);
  });
  return out.length>=2?out:plain();
}
/* 座標つきの文字を、表に組み直さずそのまま行にしたもの。
   明細の表から外れた「⑥今回御買上額 25,320」のような伝票ぜんたいの合計を
   突合に使いたいので、表とは別に取っておく（v82） */
function runsToPlain(runs){
  const sorted=runs.slice().sort((a,b)=>b.y-a.y||a.x-b.x);
  const rows=[]; let cur=null, curY=0;
  sorted.forEach(r=>{
    const tol=Math.max(2,(r.size||8)*0.4);
    if(!cur||Math.abs(curY-r.y)>tol){ cur=[]; rows.push(cur); curY=r.y; }
    cur.push(r);
  });
  return rows.map(c=>c.map(x=>x.t.trim()).join(" ")).join("\n");
}
async function pdfToText(file){
  const datas=await pdfStreams(await file.arrayBuffer());
  if(!datas.length) throw new Error("このPDFは開けませんでした（暗号化されているかもしれません）");
  let cmap={}, content="";
  datas.forEach(d=>{
    const t=pdfL1(d);
    if(/beginbf(char|range)/.test(t)) Object.assign(cmap,parseCMap(t));
    else if(/\bBT\b/.test(t)&&/T[jJ]/.test(t)) content+=t+"\n";
  });
  if(!content) throw new Error("このPDFには文字が入っていません。紙をスキャンしたPDFはこのアプリでは読めません");
  const runs=pdfRuns(content,cmap);
  if(!runs.length) throw new Error("PDFから文字を取り出せませんでした。明細をコピーして貼り付けてください");
  return {text:runsToTable(runs).map(r=>r.join("\t")).join("\n"), plain:runsToPlain(runs)};
}

/* ========== 突合（v82） ==========
   伝票そのものに書かれている合計と、読み取った明細の合計を突き合わせる。
   これが合っていれば「取りこぼしも二重読みも無い」と言い切れる。
   NBSのメールなら末尾の「合計 ： 12540」、ミラビスの請求明細書なら
   「⑥今回御買上額 25,320」がこれにあたる。
   ラベルは複数あたることがあるので、一番大きい数（＝総合計）を採る */
/* ラベルのうしろに「（税抜）」のような但し書きと空白が挟まることがあるので、
   括弧ひとつと空白は読み飛ばす（NBSの「御買上総額（税抜）　　7,500 円」がこれ。v84） */
const DOCTOT=/((?:今回)?(?:御|お)?買上(?:総)?額|合計金額|税込合計|請求金額|請求額|ご請求額|お支払い?金額|総計|合計)\s*(?:[（(][^）)]{0,12}[）)])?\s*[:：]?\s*([¥￥]?[0-9][0-9,]{1,11})/g;
/* 伝票が税抜で書かれているか（v84）。
   NBSの発注確認メールは「合計金額（税抜）」「御買上総額（税抜）」と書いてある。
   税込の断りが1つでもあれば税込とみなす（混在なら安全側に倒す） */
/* 手がかりが無ければ "" を返す（v90）。呼ぶ側が
   「仕入先ごとに前回選んだ税区分」→「税込」の順に決める */
function guessTax(txt){
  const s=String(txt||"").normalize("NFKC");
  if(/税込|内税/.test(s)) return "in";
  if(/税抜|税別|外税/.test(s)) return "ex";
  return "";
}
/* ---------- 仕入先ごとの決まりごと（v168） ----------
   利用者の指示：**「ミラビスの仕入れは個別で税込で反映するようにして」**

   **ミラビスの請求明細書は税抜で書かれている。** それなのに、伝票の文字に
   「税抜」「税別」「外税」が見つからず、前に選んだ覚えも無いときは
   **税込あつかいで反映していた**（`|| "in"` の既定）。
   そのぶん在庫の原価も月の原価も**10%少なく**入っていた。

   仕入先ごとの既定を決める。ミラビスは **税抜（＝品目ごとに消費税を足して税込にする）**。
   計算そのものは前からあった `buyUnit` がやっている：
   **1品ずつ 単価×1.1 を丸めて、それを在庫の原価と商品マスタの仕入単価にする。**
   伝票の合計に税をかけるのではなく、**個別に**税込へ直している。 */
const BUYTAXDEF={"ミラビス":"ex","NBS":"in"};
function buyTaxOf(src,txt){
  return guessTax(txt) || (db.buytax&&db.buytax[src]) || BUYTAXDEF[src] || "in";
}
/* 手入力の伝票でも同じ既定を使う */
const buyTaxDef=src=>(db.buytax&&db.buytax[src])||BUYTAXDEF[src]||"in";
function docTotalOf(txt){
  const s=String(txt||"").normalize("NFKC");
  let m, best=0, label="";
  DOCTOT.lastIndex=0;
  while((m=DOCTOT.exec(s))){
    const v=Math.round(bnum(m[2]));
    if(v>best){ best=v; label=m[1]; }
  }
  return {yen:best,label};
}

/* 明細ではない行。CSVの末尾についてくる合計行などを商品にしないためのふるい */
/* v192：レシートの写真から起こした文字には、合計より下の行がそのまま並ぶ。
   小計・お預り・お釣り・点数・伝票番号は品名ではないので、ここで落とす */
const BUYJUNK=/^(合計|総計|税|消費税|送料|配送料|手数料|値引|割引|ポイント|備考|以上|小計|請求|お buy|内税|外税|課税|非課税|対象額|お?預り|お?釣り?|釣銭|点数|お?買上|伝票番号|伝票№|レジ|責任者|担当者|電話|TEL)/;

/* 「品名」ではなく「文」を落とすためのふるい（v83）。
   メール本文に区切り文字も数字も無いと、汎用パーサーが1行＝1商品にしてしまい、
   宛名やあいさつ文まで仕入れ品目になっていた（実物のNBSメールで発覚）。
   句読点・宛名・定型のあいさつ・URLは、商品名には出てこない */
/* ここに当たったら、金額が付いていても商品ではない。
   商品名に句点は打たないし、「〜様」で終わることもない（v86）。
   列の当てそこないで金額の欄に数が入っても、あいさつ文が生き残らないようにするため */
const BUYNEVER=[
  /。/,                                            // 句点＝文
  /(様|御中|各位)\s*$/,                            // 宛名
  /(ありがとう|よろしくお願い|ございます|ございました|承りました|問合せ|問い合わせ)/,
  /(https?:|[@＠])/,                               // URL・メールアドレス
  /^[\s\-=＝─━_*＊#＃■□◆▼▲◇○●]+$/            // 区切り線
];
/* こちらは「文らしい」だけなので、値段が付いていれば商品として残す */
const BUYWEAK=[
  /、/,
  /(この度|下記|またの|ご利用|ご注文|お知らせ|返信|営業時間|発送|配送予定|ご確認)/
];
const isBuyNever=s=>{ const t=String(s||"").trim(); return BUYNEVER.some(re=>re.test(t)); };
const isBuyProse=s=>{ const t=String(s||"").trim();
  return isBuyNever(t)||BUYWEAK.some(re=>re.test(t)); };

/* 「16,500円 X 1個 = 16,500円 (税込  18,150円)」という書き方をほどく。
   ①税抜単価 ②個数 ③税抜金額 ④税込金額（あれば）。「X」は ×・x・* も受ける */
const SUBTOT=/^\s*([\d,]+)\s*円?\s*[×xX*✕]\s*([\d,]+)\s*(?:個|点|本|枚|セット)?\s*=\s*([\d,]+)\s*円?(?:\s*[（(]\s*税込\s*([\d,]+)\s*円?\s*[）)])?/;

/* 「※ 商品名 ： ○○」のようにラベルが縦に並ぶメール本文を、
   ラベルを見出しにした表に組み直す。NBSの注文確認メールがこの形。
   区切り文字が1つも無いので、行をそのまま明細にすると挨拶文まで商品になる（v79で実際にそうなった）。
   商品名の行を品目の切れ目とみなし、そこから次の商品名までのラベルを1品目の属性として集める */
function mailToTable(txt){
  const lines=String(txt||"").replace(/\r/g,"").split("\n");
  const LB=/^[\s※・*＊●□■◆‐―\-]*([^：:]{1,16}?)\s*[：:]\s*(.*)$/;
  const NAMELB=/^(商品名|品名|商品|品目|製品名)$/;
  // 品目より後ろに出てくる伝票ぜんたいの行。最後の品目の属性にしないよう捨てる
  const SKIPLB=/^(合計|総計|送料|配送料|手数料|消費税|税|値引|割引|支払方法|お支払方法|お支払い方法|決済方法|請求|お届け先|配送先|備考|合計金額|本体価格|税込価格|税抜価格|注文合計額|注文合計|お支払い金額|お支払金額|配送方法|発送方法)$/;
  const items=[], labels=[];
  let cur=null, firstAt=-1;
  lines.forEach((raw,i)=>{
    const line=raw.trim(); if(!line) return;
    const m=line.match(LB); if(!m) return;
    const k=m[1].trim().normalize("NFKC").replace(/\s/g,"");
    const v=m[2].trim();
    if(NAMELB.test(k)){ cur={}; items.push(cur); if(firstAt<0) firstAt=i; }
    // 「消費税10%対象（税込）」のような書き方もあるので、言葉が入っていれば伝票ぜんたいの行とみなす
    const foot=SKIPLB.test(k)||/消費税|本体価格|税込価格|税抜価格|注文合計|お支払|配送方法|発送方法|送料/.test(k);
    if(!cur||foot) return;                 // 商品名より前のラベル（宛名など）は品目ではない
    if(cur[k]==null){ cur[k]=v; if(!labels.includes(k)) labels.push(k); }
  });
  if(!items.length) return null;
  // 商品名より前に出てくる日付と注文番号は、伝票の情報として拾っておく
  const head=lines.slice(0,firstAt<0?lines.length:firstAt).join("\n");
  const dm=head.match(/(20\d{2})[-\/年](\d{1,2})[-\/月](\d{1,2})/);
  const nm=head.match(/(?:注文|受注|伝票)(?:番号|No\.?|ID)[\s：:＃#]*([A-Za-z0-9\-_]+)/i);
  const pad=s=>String(s).padStart(2,"0");

  // 「16,500円 X 1個 = 16,500円 (税込  18,150円)」のように、1つの欄に
  // 単価・個数・金額・税込金額が全部書いてあることがある（NBSの注文確認メール）。
  // bnum は数字を全部つないでしまうので、ほどかないと 4600146005060 のような
  // とんでもない金額になる（v87）。ほどいて 数量／単価／金額 の3列に分ける
  const expand=labels.filter(k=>{
    const v=items.map(it=>String(it[k]??"").trim()).filter(Boolean);
    return v.length&&v.every(x=>SUBTOT.test(x));
  });
  const outLabels=[];
  labels.forEach(k=>{ if(expand.includes(k)) outLabels.push("数量","単価","金額"); else outLabels.push(k); });
  const rows=items.map(it=>{
    const cells=[];
    labels.forEach(k=>{
      const v=String(it[k]??"");
      if(!expand.includes(k)){ cells.push(v); return; }
      const m=v.match(SUBTOT);
      const num=s=>Math.round(bnum(String(s||"").replace(/[^\d,.]/g,"")));
      const qty=Math.max(1,m?num(m[2]):1);
      // 税込が書いてあればそれを採る。仕入は税込にそろえる方針なので
      const yenTotal=m?(m[4]?num(m[4]):num(m[3])):0;
      cells.push(String(qty),String(Math.round(yenTotal/qty)),String(yenTotal));
    });
    return cells;
  });

  return {
    raw:[outLabels,...rows],
    head:0, mail:true,
    date: dm?`${dm[1]}-${pad(dm[2])}-${pad(dm[3])}`:"",
    no: nm?nm[1]:""
  };
}

/* 表を読んで、見出し行と列の割り当てを当てる */
/* ---------- 写真から起こした文字を、列に切り分ける（v192） ----------
   OCRは列を**空白**で返す。タブもカンマも無いので、これまでの区切り探しでは
   1行まるごとが品名になっていた（実測：レシート3品が3行とも「品名」になり、
   数量も単価も0のまま並んだ）。

   うしろに並ぶ数字を列として切り出す。
     ハンドソープ 2 380 760  → 品名／数量2／単価380／金額760
     ゴミ袋45L 2 320         → 品名／数量2／単価320
     コピー用紙A4 550円       → 品名／数量1／単価550
   見出しの行を頭に足して返すので、あとはこれまでの読み取り機がそのまま扱える。

   ★ 当たらなかった行はそのまま残す（店名・合計・消費税は `BUYJUNK` が落とす）。
   ★ 数量と単価を取り違えることがある。**画面の「列の割り当てを直す」で直せる**し、
     伝票の合計との突合も効くので、取り違えたまま気づかずに終わることはない。
   ★ タブがある文字とCSVには手を出さない（そちらは前からの区切り探しのほうが強い）。 */
/* 品名の最後は数字でもよい（「コピー用紙A4 550円」）。
   最短一致なので「ハンドソープ 2 380」の 2 を品名に取り込むことはない */
const RCPTLINE=/^(.*?[^\s,¥￥])\s+((?:[¥￥]?\d[\d,]*(?:\.\d+)?(?:円|個|点|本|枚|袋|ケース)?\s+){0,2}[¥￥]?\d[\d,]*(?:\.\d+)?(?:円)?)\s*$/;
function receiptToTable(txt){
  const lines=String(txt||"").replace(/\r/g,"").split("\n").map(l=>l.trim()).filter(Boolean);
  if(!lines.length) return "";
  if(lines.some(l=>l.includes("\t"))) return "";                       // タブで割れるならそちら
  if(lines.filter(l=>splitRow(l,",").length>=3).length>=2) return "";  // CSVはそのまま
  const out=[]; let hit=0;
  lines.forEach(l=>{
    const m=l.normalize("NFKC").match(RCPTLINE);
    if(!m){ out.push(l); return; }
    const name=m[1].trim();
    // 数字と記号だけの行は品名ではない（日付・電話番号・レジ番号）
    if(!/[A-Za-zぁ-ゟ゠-ヿ一-鿿]/.test(name)){ out.push(l); return; }
    const ns=m[2].trim().split(/\s+/).map(s=>bnum(s));
    let qty=1,price=0,amt="";
    if(ns.length>=3){ qty=ns[0]; price=ns[1]; amt=ns[2]; }
    else if(ns.length===2){
      if(ns[0]<=99&&ns[1]>ns[0]){ qty=ns[0]; price=ns[1]; }   // 「2 320」＝2個 320円
      else { qty=1; price=ns[0]; amt=ns[1]; }                 // 「320 640」＝単価と金額
    }else{ qty=1; price=ns[0]; amt=ns[0]; }                   // 「550円」＝1個 550円
    hit++;
    out.push([name,qty,price,amt].join("\t"));
  });
  if(hit<2) return "";                    // 1行しか当たらないなら、そもそも明細ではない
  return ["品名\t数量\t単価\t金額"].concat(out).join("\n");
}

function parseBuyText(txt){
  // まず「ラベルが縦に並ぶメール本文」かどうかを見る。そちらなら表に組み直してから進む
  const mt=mailToTable(txt);
  if(mt){
    const cols={};
    mt.raw[0].forEach((v,j)=>{
      for(const k in BUYCOL){ if(cols[k]==null&&BUYCOL[k].test(v)){ cols[k]=j; break; } }
    });
    // 「小計」のような金額らしいラベルでも、値が仕入単価より小さければ実際は個数。
    // 数量の項目が別に無く、見た全部の行がそう言っているときだけ読み替える
    // （読み替えが余計だったときは、画面の「列の割り当て」で戻せる）
    if(cols.amt!=null&&cols.qty==null&&cols.n!=null){
      let judged=0, smaller=0;
      mt.raw.slice(1).forEach(r=>{
        const v=bnum(r[cols.amt]); if(!v) return;
        const p=matchProduct(String(r[cols.n]||""),"");
        judged++; if(v<(p&&p.cost?p.cost:100)) smaller++;
      });
      if(judged&&smaller===judged){ cols.qty=cols.amt; delete cols.amt; }
    }
    return {raw:mt.raw,head:0,cols,mail:true,date:mt.date,no:mt.no};
  }
  /* v192：写真から起こした文字（空白区切り）なら、先に列へ切り分ける */
  const rc=receiptToTable(txt);
  if(rc) txt=rc;
  const lines=String(txt||"").replace(/\r/g,"").split("\n").filter(l=>l.trim());
  if(!lines.length) return {raw:[],head:-1,cols:{}};
  const tabs=lines.reduce((a,l)=>a+(l.match(/\t/g)||[]).length,0);
  const coms=lines.reduce((a,l)=>a+(l.match(/,/g)||[]).length,0);
  // 区切り文字は「同じ列数にそろって割れる行がいちばん多いもの」で選ぶ（v84）。
  // 数を数えるだけだと、金額の桁区切り（2,400円）でカンマが勝ってしまい、
  // NBSの発注確認メール（商品コード/商品名/…/合計金額 のスラッシュ区切り）が
  // 「2」と「400円」に割れていた
  let sep=",", best=0;
  ["\t",",","/"].forEach(s=>{
    const cnt={};
    lines.forEach(l=>{ const n=splitRow(l,s).length; if(n>=3) cnt[n]=(cnt[n]||0)+1; });
    Object.entries(cnt).forEach(([n,c])=>{
      const score=c*(+n);                       // そろっている行数 × 列数
      if(score>best){ best=score; sep=s; }
    });
  });
  const raw=lines.map(l=>splitRow(l,sep));
  const w=Math.max(...raw.map(r=>r.length));
  raw.forEach(r=>{ while(r.length<w) r.push(""); });

  // ① 見出しらしい行を探す（列名が2つ以上あたる行）
  let head=-1, cols={};
  // 表の本体がだいたい何列あるか。見出しらしい行がそれより極端に短いときは
  // 見出しではなく、ただの見出しラベルの寄せ集め（PDFに多い）なので採用しない
  const widths=raw.map(r=>r.filter(v=>v!=="").length).sort((a,b)=>a-b);
  const typical=widths[Math.floor(widths.length/2)]||1;
  // 見出しは頭から8行めまでとは限らない。メールは宛名やあいさつが長く、
  // NBSの発注確認メールでは見出しがずっと下にある（v84で40行まで見るようにした）。
  // 列名が2つ以上あたる行しか採らないので、広げても誤検出しにくい
  for(let i=0;i<Math.min(raw.length,40);i++){
    const c={}; let hit=0;
    raw[i].forEach((v,j)=>{
      for(const k in BUYCOL){ if(c[k]==null&&BUYCOL[k].test(v)){ c[k]=j; hit++; break; } }
    });
    if(hit>=2&&raw[i].filter(v=>v!=="").length>=typical*0.7){ head=i; cols=c; break; }
  }
  // ② 見出しが無い伝票は、中身から当てる（数字ばかりの列＝数量・単価、長い文字の列＝品名）
  if(head<0){
    // 「26.07.03」や「0017279592-1」は数字に見えて数にならないので、金額の列とは見なさない
    const numish=j=>raw.filter(r=>r[j]!==""&&/^[0-9,.\s¥￥\-]+$/.test(String(r[j]).normalize("NFKC"))
                                  &&bnum(r[j])>0).length;
    let nums=[]; for(let j=0;j<w;j++) if(numish(j)>=raw.length*0.6) nums.push(j);
    // 7桁以上の数字ばかりの列は「品番（商品コード）」であって金額ではない（v85）。
    // ここを外さないと、NBSの商品コード 37770702 がいちばん大きい数として
    // 単価に選ばれ、¥37,770,702 というとんでもない金額になる
    const codeish=j=>{
      const v=raw.map(r=>String(r[j]||"").trim().normalize("NFKC")).filter(Boolean);
      if(v.length<2) return false;
      const long=v.filter(x=>/^\d[\d-]*$/.test(x)&&x.replace(/\D/g,"").length>=7).length;
      return long>=v.length*0.8;
    };
    const codes=nums.filter(codeish);
    nums=nums.filter(j=>!codes.includes(j));
    if(codes.length&&cols.code==null) cols.code=codes[0];
    // 品名の列は「文字（かな・漢字・英字）が多い列」。ただの文字数で選ぶと、
    // 伝票№「0017279592-1」のような長い番号を品名だと思ってしまう
    const letters=s=>(String(s||"").match(/[A-Za-z぀-ヿ一-鿿ｦ-ﾟ]/g)||[]).length;
    let best=-1, nCol=0, byLen=-1, lenCol=0;
    for(let j=0;j<w;j++){
      if(nums.includes(j)||codes.includes(j)) continue;
      const L=raw.reduce((a,r)=>a+letters(r[j]),0)/raw.length;
      if(L>best){ best=L; nCol=j; }
      const S=raw.reduce((a,r)=>a+String(r[j]||"").length,0)/raw.length;
      if(S>byLen){ byLen=S; lenCol=j; }
    }
    cols=Object.assign(cols,{n:best>0?nCol:lenCol});
    const avg=j=>raw.reduce((a,r)=>a+bnum(r[j]),0)/raw.length;
    // 桁が現実離れしている列（平均100万円超）も金額とはみなさない。
    // 電話番号・郵便番号・注文番号がここに紛れる
    nums=nums.filter(j=>avg(j)<1000000);
    nums.sort((a,b)=>avg(a)-avg(b));
    if(nums.length>=2){ cols.qty=nums[0]; cols.price=nums[1]; }
    else if(nums.length===1) cols.qty=nums[0];
  }
  // 伝票に書かれている日付のうち一番新しいものを仕入日にする。
  // 今日の日付で入れると、先月の請求書が今月の在庫に載ってしまう
  const dd=[];
  const pad=x=>String(x).padStart(2,"0");
  raw.forEach(r=>r.forEach(v=>{
    const t=String(v||"").trim();
    let g=t.match(/^(\d{2})[.\/](\d{1,2})[.\/](\d{1,2})$/);
    if(g){ dd.push(`20${g[1]}-${pad(g[2])}-${pad(g[3])}`); return; }
    g=t.match(/^(20\d{2})[-.\/年](\d{1,2})[-.\/月](\d{1,2})日?$/);
    if(g) dd.push(`${g[1]}-${pad(g[2])}-${pad(g[3])}`);
  }));
  if(!dd.length){
    // マス1つがまるごと日付になっていない伝票（メール本文など）は、本文から拾う。
    // 「◆ ご注文日時 2026年07月21日」の形。今日の日付を使うと、
    // 先月の注文が今月の在庫に載ってしまう（v84）
    const t=String(txt||"").normalize("NFKC");
    const g=t.match(/(?:注文|受注|発注|伝票|請求|発行|出荷|納品)[^0-9]{0,8}(20\d{2})[-.\/年](\d{1,2})[-.\/月](\d{1,2})/)
         || t.match(/(20\d{2})[-.\/年](\d{1,2})[-.\/月](\d{1,2})/);
    if(g) dd.push(`${g[1]}-${pad(g[2])}-${pad(g[3])}`);
  }
  dd.sort();
  return {raw,head,cols,date:dd[dd.length-1]||""};
}

/* 品名から名簿ならぬ商品マスタを当てる。全角半角の違いは MNORM で吸収する */
/* 【4B】のようなブランド表記や記号を落とした「芯の名前」。
   仕入先のメールは商品名に必ずブランドが付くので、これが無いと当たらない */
const BSTRIP=s=>MNORM(s).replace(/[【\[（(][^】\]）)]*[】\]）)]/g,"")
                        .replace(/[^0-9a-z぀-ゟ゠-ヿ一-鿿]/g,"");
/* 候補が複数出たら、名前の長い（＝具体的な）ほうを採る。
   「バイオセルロース」と「バイオセルロースモイストマスクプラス」なら後者 */
const bestHit=list=>list.length
  ? list.slice().sort((a,b)=>MNORM(b.n).length-MNORM(a.n).length)[0] : null;

/* どの段で当たったかも返す（v82）。
   ①名前がそのまま／②品番 は「ぴったり」、③一部が含まれる／④芯の名前 は「似た名前」。
   似た名前で当てたぶんは別物のことがあるので、マスタの原価をそのまま書き換えない */
function matchProductEx(name,code){
  const k=MNORM(name);
  if(!k) return {p:null,how:""};
  let p=db.products.find(x=>MNORM(x.n)===k);                       // ① そのまま一致
  if(p) return {p,how:"exact"};
  if(code){ const c=MNORM(code); p=db.products.find(x=>x.code&&MNORM(x.code)===c); }  // ② 品番
  if(p) return {p,how:"code"};
  p=bestHit(db.products.filter(x=>{                                // ③ どちらかがどちらかを含む
    const q=MNORM(x.n); return q.length>=3&&(k.includes(q)||q.includes(k)); }));
  if(p) return {p,how:"part"};
  const kk=BSTRIP(name);                                           // ④ 芯の名前で当てる
  if(kk.length>=4) p=bestHit(db.products.filter(x=>{
    const q=BSTRIP(x.n); return q.length>=4&&(q.includes(kk)||kk.includes(q)); }));
  return p?{p,how:"core"}:{p:null,how:""};
}
const matchProduct=(name,code)=>matchProductEx(name,code).p;

/* ---------- Squareの商品を引き当てる（v108） ----------
   これまでは品名だけで当てていた（`x.n===li.name||li.name.startsWith(x.n)`）。
   品名だけだと **ダブる**：先にアプリで手入力した商品と、あとでSquareに作った同じ商品が
   名前のゆれ（【 】・全角半角・「プラス」の有無）で別物と判定されてしまう。

   直し方は「毎回ちかい商品を警告する」ではなく **一度だけ人が結んで、あとはIDで引く**。
   お客様がダブらないのは情報が細かいからではなく、`c.sqid` で結んであるからで、
   商品にも同じことをすればよい（`p.sqid`＝品目のID／`p.sqvar`＝バリエーションのID）。

   ★ 注文明細の `catalog_object_id` は品目のIDではなく **バリエーションのID**。
     だから `sqvar` を持たないと売れた品をIDで引けない（中継役 v10 が返す）。 */
function prodBySq(sqid,name){
  if(sqid){
    const byVar=db.products.find(p=>(p.sqvar||[]).includes(sqid));
    if(byVar) return byVar;
    const byId=db.products.find(p=>p.sqid===sqid);
    if(byId) return byId;
  }
  if(!name) return null;
  const k=MNORM(name);
  return db.products.find(p=>MNORM(p.n)===k)||null;   // 結んでいない商品は完全一致だけ
}
/* 「Squareのこれとアプリのこれは別物」と決めた組を覚える。次から「似ている」に出さない */
const skipKey=(sqid,pid)=>`${sqid}|${pid}`;

/* Squareのカタログ（物販だけ）とアプリの商品を突き合わせる。
   v99の「お客様の照合」と同じ形：一致／似ている／Squareだけ／アプリだけ の4つに分ける。
   **読み込んだだけでは商品を1件も変えない。** 反映を押したときだけ動く */
function prodMatch(list){
  const ps=db.products;
  const used=new Set(), hit=[], near=[], sqOnly=[];
  const retail=(list||[]).filter(x=>x.retail&&x.name);
  retail.forEach(x=>{
    let p=null, how="";
    if(x.sqid){
      p=ps.find(y=>y.sqid===x.sqid)||ps.find(y=>(y.sqvar||[]).some(v=>(x.vars||[]).includes(v)));
      if(p) how="SquareのID";
    }
    if(!p){ const k=MNORM(x.name);
      p=ps.find(y=>!y.sqid&&MNORM(y.n)===k); if(p) how="品名がそのまま"; }
    if(!p&&x.sku){ const c=MNORM(x.sku);
      p=ps.find(y=>!y.sqid&&y.code&&MNORM(y.code)===c); if(p) how="品番"; }
    if(p){ used.add(p.id); hit.push({x,p,how}); return; }
    // ここから下は「似ているかもしれない」。勝手に寄せない
    const m=matchProductEx(x.name,x.sku);
    if(m.p&&!m.p.sqid&&!used.has(m.p.id)&&!db.sqskip[skipKey(x.sqid,m.p.id)]){
      used.add(m.p.id);
      near.push({x,p:m.p,how:m.how==="part"?"名前の一部が同じ":"記号を外すと同じ"});
      return;
    }
    sqOnly.push(x);
  });
  const appOnly=ps.filter(p=>!used.has(p.id)&&!p.sqid);
  return {hit,near,sqOnly,appOnly,n:retail.length,nall:(list||[]).length,at:today()};
}
/* ぴったり当たったか（＝原価を黙って入れ替えてよいか） */
const MATCHSURE=h=>h==="exact"||h==="code";

/* 読み取った表から明細の下書きを作る */
function buyRowsFrom(pr){
  const {raw,head,cols}=pr;
  const body=raw.slice(head<0?0:head+1);
  const get=(r,k)=>cols[k]!=null?r[cols[k]]:"";
  const rows=body.map(r=>{
    const n=String(get(r,"n")||"").trim();
    if(!n||BUYJUNK.test(n.normalize("NFKC"))) return null;   // 合計行などは商品にしない
    // 品名に文字が1つも無い（「15,514」のような入金行）は商品ではない
    if(!/[A-Za-z぀-ヿ一-鿿ｦ-ﾟ]/.test(n)) return null;
    // 言い切れる文（句点・宛名・定型のあいさつ）は、金額が付いていても商品ではない（v86）
    if(isBuyNever(n)) return null;
    const qty=Math.max(1,Math.round(bnum(get(r,"qty"))||1));
    const amt=Math.round(bnum(get(r,"amt")));
    const code=String(get(r,"code")||"").trim();
    const mp=matchProductEx(n,code), p=mp.p;
    // 単価は「単価の列があればそれ」。無いときは、マスタに登録ずみならその仕入単価を使い、
    // 未登録のときだけ金額から割り戻す。金額の列を取り違えていたときに
    // マスタの仕入単価を壊さないための順番（v80）
    let price=cols.price!=null?Math.round(bnum(get(r,"price"))):0;
    if(!price&&p) price=p.cost;
    if(!price&&amt&&qty) price=Math.round(amt/qty);
    // 値段のつかない「文」は商品ではない（v83／v86で判定を単価そのものに変えた）。
    // 値段が付いている行は、文らしく見えても捨てない（伝票の書き方はさまざまなので）。
    // v85までは amt の列を見ていたが、列の当てそこないで amt に数が入ると
    // あいさつ文が生き残っていた。画面に単価0で並ぶのはこれ
    if(!(price>0)&&isBuyProse(n)) return null;
    // 区分の決め方：①マスタに一致→その区分 ②材料と言い切れる名前→材料
    // ③それ以外→空（＝手で選んでもらう。勝手に物販にすると在庫が狂う）
    let kind="", how="";
    if(p){ kind=p.kind; how="master"; }
    else if(YELLOW.includes(n)||REDS.includes(n)){ kind="材料"; how="list"; }
    else if(MATHINT.test(n)){ kind="材料"; how="guess"; }
    // upd＝マスタの仕入単価を、この伝票の単価に入れ替えるかどうか（v82）。
    // 値上がり・値下がりに気づけるよう、違うときだけ画面に出して選べるようにする。
    // ぴったり当たった品だけ最初からONにする。似た名前で当てたぶんは別物のことがあり、
    // そのまま入れ替えると関係のない商品の原価を壊す（ﾘﾍﾟｱｼﾞｪﾙ→ブースター＆…リペアジェル等）
    // 名前に入り数が書いてあれば、1枚・1包の単価に分ける（v89）。
    // 読み取ったままの値は qty0/price0 に残しておいて、画面で分ける／分けないを切り替えられる
    const row={n, code, qty, price, qty0:qty, price0:price, pack:packOf(n), split:false,
               pid:p?p.id:"", kind, how, mhow:mp.how, on:true, upd:MATCHSURE(mp.how)};
    row.split=wantSplit(row,p);
    return applySplit(row);
  }).filter(Boolean);
  // 金額のある行が1つでもあれば、0円の行（見出しや注意書きの取りこぼし）は
  // 最初からチェックを外しておく。消さずに残すのは、必要なら自分で入れられるように
  if(rows.some(r=>r.qty*r.price>0)) rows.forEach(r=>{ if(!(r.qty*r.price>0)) r.on=false; });
  return rows;
}

/* 一覧に出す単価。伝票が税抜で書かれているときは、ここで税込に直す（v82）。
   仕入は税込で見たい（NBSのメールはもともと税込、**ミラビスの請求明細書は税抜**）ので、
   一覧・合計・マスタの仕入単価は、どの入り口から入っても必ず税込にそろえる */
const TAXR=0.10;
/* 税込か税抜かは伝票ぜんたいで決めるが、品目ごとに変えることもできる（v90）。
   ミラビスの請求明細書のように、伝票の金額が税抜で書いてあるものは、
   商品べつに消費税をかけてから在庫と原価に積む必要がある */
const rowTax=(d,r)=>(r&&r.tax)||(d&&d.tax)||"in";
const buyUnit=(d,r)=>rowTax(d,r)==="ex"?Math.round(r.price*(1+TAXR)):Math.round(r.price);
/* 伝票に書いてあるとおりの単価（税を足す前）。突合はこちらで比べる */
const buyRaw=r=>Math.round(r.price);
function buyTotal(rows,d){
  return (rows||[]).filter(r=>r.on).reduce((a,r)=>a+r.qty*buyUnit(d,r),0);
}
/* 伝票に書かれたままの合計（税を足す前）。突合は伝票と同じ土俵で比べないと合わない（v84） */
function buyTotalRaw(rows){
  return (rows||[]).filter(r=>r.on).reduce((a,r)=>a+r.qty*Math.round(r.price),0);
}
/* 同じ伝票を二度入れないための目印 */
const buySig=d=>`${d.src}|${d.date}|${(d.no||"").trim()}|${buyTotal(d.rows,d)}`;
const buyDraft=id=>(db.buydrafts||[]).find(x=>x.id===id)||null;

/* ========== 仕分けの根拠（v93） ==========
   仕分けながら、もとの伝票を見くらべられるようにする。
   NBSはメール本文、ミラビスはPDF、その他は写真やPDFを右側に置く。
   保存先はブラウザなので、大きすぎるものは入れずに「文字だけ」にする */
const SRCMAX=40000;          // 控えておく本文の長さ
const SRCFILEMAX=1400000;    // 貼りつけるファイルの大きさ（data URI にしたあとの目安）
function fileToDataUrl(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error("ファイルを読めませんでした"));
    fr.onload=()=>res(fr.result);
    fr.readAsDataURL(file);
  });
}
/* 根拠として貼りつける。写真は縮めてから、PDFはそのまま（大きすぎたら入れない） */
async function buyAttachSrc(d,file){
  if(!d||!file) return "";
  const isImg=/^image\//.test(file.type)||/\.(jpe?g|png|gif|webp|heic)$/i.test(file.name);
  const isPdf=/pdf/i.test(file.type)||/\.pdf$/i.test(file.name);
  if(isImg){
    const url=await shrinkImage(file,1400,0.72);
    d.file={name:file.name,kind:"image",url};
    return "";
  }
  if(isPdf){
    if(file.size>SRCFILEMAX){
      d.file={name:file.name,kind:"toobig",url:""};
      return `${file.name} は大きい（${Math.round(file.size/1024)}KB）ので、画面には出しません。読み取った文字のほうで確かめてください`;
    }
    d.file={name:file.name,kind:"pdf",url:await fileToDataUrl(file)};
    return "";
  }
  d.file={name:file.name,kind:"other",url:""};
  return `${file.name} は画面に出せない形式です`;
}

/* 手で足す品目の空っぽの1行（v90） */
function blankBuyRow(){
  /* hand:true ＝ 人が足した行（v192b）。カードの並びが読み取ったものと逆になる
     （区分 → その中から選ぶ → 無ければ新しい名前）。
     `how` は選ぶと "master" に変わってしまうので、目印は別に持つ */
  return {n:"",code:"",qty:1,price:0,qty0:1,price0:0,pack:0,split:false,
          pid:"",kind:"",how:"manual",mhow:"",on:true,upd:true,hand:true};
}
/* 伝票が無い仕入れ（他の取引先・イレギュラーなもの）を手で入れる（v90）。
   読み取ったものと同じ一覧に並ぶので、そこから先のやり方は同じ */
function startBuyManual(src){
  const d={id:uid(),src,date:today(),no:"",note:"",cash:false,
           tax:buyTaxDef(src),                 // v168：ミラビスは税抜が既定
           from:"手入力",mail:false,rows:[blankBuyRow()],pr:null,
           doc:0,doclbl:"",at:today(),mailId:"",ver:BUYVER,manual:true};
  if(!Array.isArray(db.buydrafts)) db.buydrafts=[];
  db.buydrafts.unshift(d);
  buyOpen=d.id;                        // 作ったらそのまま入力画面へ（v92）
  return d;
}

/* 読み取った下書きを一覧に足す。入り口（メール／PDF／貼り付け）が違っても、
   ここから先はすべて同じ一覧に集まり、同じやり方で仕分ける（v82） */
function startBuyDraft(src,text,from,plain,mailId){
  const pr=parseBuyText(text);
  const rows=buyRowsFrom(pr);
  if(!rows.length){
    buyReadMsg="この本文からは仕入れの明細を見つけられませんでした。品名と数量・単価が並んでいる部分だけを選んで貼り付けるか、本文をそのまま伝えてください（書式に合わせて読めるようにします）。";
    toast("明細を読み取れませんでした"); return false;
  }
  // 数量・単価・金額のどの列も見つかっていないなら、そもそも仕入れの明細ではない。
  // ここで止めないと、あいさつ文が1行＝1商品として並ぶ（v83で入れた歯止め）
  if(pr.cols.qty==null&&pr.cols.price==null&&pr.cols.amt==null&&!rows.some(r=>r.qty*r.price>0)){
    buyReadMsg="読み取れたのは文章だけで、数量や金額の並びが見つかりませんでした。仕入れの明細ではないかもしれません。明細の部分だけを貼り付けるか、本文をそのまま伝えてください。";
    toast("数量や金額が見つかりませんでした"); return false;
  }
  // 伝票そのものに書かれている合計。表から外れた行にあることが多いので、
  // PDFのときは組み直す前の全文（plain）からも探す
  const dt=docTotalOf(plain||text);
  const d={id:uid(),src,date:pr.date||today(),no:pr.no||"",note:"",cash:false,
           tax:buyTaxOf(src,plain||text),      // 伝票の断り書き→仕入先ごとの前回→税込 の順で決める
           from:from||"",mail:!!pr.mail,rows,pr,doc:dt.yen,doclbl:dt.label,at:today(),
           mailId:mailId||"",                  // 同じメールを二度読まないための目印（v85）
           ver:BUYVER,                         // どの版で読み取ったか（v86）
           // 仕分けながら見くらべるための「根拠」。読み取ったもとの文字を控えておく（v93）。
           // PDFは組み直す前の全文（plain）のほうが伝票の見た目に近いので、あればそちら
           srcText:String(plain||text||"").slice(0,SRCMAX)};
  if(!Array.isArray(db.buydrafts)) db.buydrafts=[];
  db.buydrafts.unshift(d);
  db.buydraft=null;
  buyOpen=d.id;                        // 読み取ったら、その伝票だけの画面を開く（v92）
  return d;
}

/* ================= 伝票の写真を読む（v192） =================
   利用者の指示：**「川口立替の画像を添付したら読み込んで反映してくれるシステム作れるか？」**

   作りは**一手だけ足す**。写真を中継役に送って**文字にして返してもらい**、
   あとは「明細を貼り付ける」とまったく同じ読み取り機（`startBuyDraft`）に流す。
   だから、列の当てそこないを直す画面も、あいさつ文のふるいも、
   **伝票の合計との突合も、そのまま効く**。

   ★ 文字認識そのものは中継役（Googleドライブ）がやる。ブラウザではやらない。
     日本語の文字認識をブラウザに積むと数MBの荷物が増え、精度も落ちるため。
   ★ **読めた文字は必ず人に見せる。** 品目に組み立てられなかったときは
     貼り付けの箱にそのまま入れて、人が直せるようにする（読み直しの手間を返さない）。
   ★ 反映は人が押す。ここは自動にしない（誤読が在庫と原価に直行しないように）。

   限界（画面にも書いてある）：
     ・手書き、感熱紙のかすれたレシート、ピンぼけは読めない
     ・行は読めても「数量」「単価」の列が崩れることがある（→ 列の割り当てを直す）
     ・消費税は 10%（`TAXR`）の一本。軽減税率8%が混ざる伝票は1品ずつ直す */
const OCRMAX=1800, OCRQ=0.85;         // 文字がつぶれない大きさ。640pxでは小さすぎて読めない
async function ocrFile(file){
  if(!relayUrl("ping")) throw new Error("連携設定がまだです（連携タブの連携設定）");
  let data="";
  try{ data=await shrinkImage(file,OCRMAX,OCRQ); }
  catch(e){ data=await fileToDataUrl(file); }   // HEICなどブラウザが開けない形はそのまま送る
  if(!/^data:image\//.test(data))
    throw new Error("画像ではないようです（PDFは「伝票を添付する」から読めます）");
  if(data.length>7e6) throw new Error("写真が大きすぎます。少し離れて撮り直してください");
  const j=await relayPost("ocr",{data,name:file.name||"伝票.jpg",lang:"ja"});
  const t=String(j.text||"").trim();
  if(!t) throw new Error("文字を見つけられませんでした。明るいところで、伝票を平らにして撮り直してください");
  return t;
}
/* すでに貼ってある写真（データURL）を読む。手で作った伝票に写真を貼ったあと、
   打ち直さずに品目を足せるように */
async function ocrDataUrl(url,name){
  if(!relayUrl("ping")) throw new Error("連携設定がまだです（連携タブの連携設定）");
  if(!/^data:image\//.test(String(url||""))) throw new Error("この伝票に写真がありません");
  const j=await relayPost("ocr",{data:url,name:name||"伝票.jpg",lang:"ja"});
  const t=String(j.text||"").trim();
  if(!t) throw new Error("文字を見つけられませんでした。撮り直してから貼り直してください");
  return t;
}
/* 読めた文字を、いまの伝票に**足す**（作り直さない）。
   手で作ったときの空の行は、読めた品目と入れ替える */
async function buyAddFromOcr(d,text){
  const pr=parseBuyText(text);
  const rows=buyRowsFrom(pr);
  d.srcText=(String(d.srcText||"")+(d.srcText?"\n\n":"")+text).slice(0,SRCMAX);
  d.ocr=true;
  if(!rows.length) return 0;
  // 写真から読んだ行は「人が打った行」ではないので、読み取り用のカードで出す（v192b）
  rows.forEach(x=>{ x.hand=false; });
  d.rows=d.rows.filter(r=>String(r.n||"").trim()||r.qty*r.price>0).concat(rows);
  ocrUncheckEmpty(d);
  if(d.manual&&pr.date) d.date=pr.date;      // 手で作った伝票は、写真の日付のほうが確か
  if(!d.no&&pr.no) d.no=pr.no;
  const dt=docTotalOf(text);
  if(!d.doc&&dt.yen){ d.doc=dt.yen; d.doclbl=dt.label; }
  return rows.length;
}
/* 読めた文字から伝票の下書きを作る。組み立てられなかったら
   **その文字を貼り付けの箱に残して** false を返す（人が直せるように） */
function buyFromOcr(text,name){
  const d=startBuyDraft(buySrc,text,name?`写真（${name}）`:"写真",text);
  if(!d){
    buyPasteVal=text; buyPaste=true;
    buyReadMsg="写真の文字は読めましたが、品名と数量・単価の並びを見つけられませんでした。"
      +"下の箱に読めた文字を入れてあります。いらない行を消すか、品名・数量・単価の形に直して"
      +"「これを読み取る」を押してください。";
    return null;
  }
  ocrUncheckEmpty(d);
  d.ocr=true;
  return d;
}
/* 写真から起こしたものは、店名や日付の行まで品目として並ぶ。
   **金額の無い行は最初からチェックを外す**（人が消して回らなくていいように）。
   要るものだったら、チェックを入れれば戻る */
function ocrUncheckEmpty(d){
  d.rows.forEach(r=>{ if(!(r.qty*r.price)) r.on=false; });
  if(!d.rows.some(r=>r.on)) d.rows.forEach(r=>{ r.on=true; });   // 全部消えたら元に戻す
}

/* ファイルを文字にする。日本の伝票CSVはShift_JISが多いので、化けたら読み直す */
function readTextFile(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error("ファイルを読めませんでした"));
    fr.onload=()=>{
      const buf=fr.result;
      let t="";
      try{ t=new TextDecoder("utf-8").decode(buf); }catch(e){ t=""; }
      if(!t||(t.match(/�/g)||[]).length>2){
        try{ t=new TextDecoder("shift_jis").decode(buf); }catch(e){}
      }
      res(t);
    };
    fr.readAsArrayBuffer(file);
  });
}

/* 反映する。商品と材料は伝票の日付の月の在庫に入れ、
   消耗品は在庫を通さずその月の経費にする（履歴に残すだけ。v82） */
async function applyBuyDraft(id){
  const d=id?buyDraft(id):(db.buydrafts||[])[0]; if(!d) return;
  const rows=d.rows.filter(r=>r.on);
  if(!rows.length){ toast("反映する行がありません"); return; }
  // 手で足した行が空のままだと、名前の無い商品が登録されてしまう
  if(rows.some(r=>!String(r.n||"").trim())){ toast("品名が空の行があります"); return; }
  const undecided=rows.filter(r=>!r.kind);
  if(undecided.length){ toast(`区分の決まっていない行が${undecided.length}件あります`); return; }
  const m=(d.date||today()).slice(0,7);
  const buyId=uid();
  const items=[];
  /* v204：**原価を入れ替える前に、前の月ぜんぶに「いまの原価」を焼き込む。**
     こうしないと、9月に仕入れ直しただけで8月の材料原価も川口さんの支払明細も動いた
     （実測で ¥8,000→¥6,800）。伝票の月から先は新しい原価に従う（焼き込みを外す）ので、
     最終仕入原価法のままで、**締めた月だけが動かなくなる** */
  const willChange=rows.map(r=>{
    const price=buyUnit(d,r);
    const p=r.pid?db.products.find(x=>x.id===r.pid):null;
    return (p&&price&&p.cost!==price&&r.upd)?p.id:null;
  }).filter(Boolean);
  if(willChange.length) lockCostsBeforeChange(willChange,m);
  rows.forEach(r=>{
    const price=buyUnit(d,r);                 // 税込にそろえた単価
    let p=r.pid?db.products.find(x=>x.id===r.pid):null;
    if(!p){                                   // 商品マスタに無いものはここで登録する
      p={id:uid(),cat:d.src,n:r.n,cost:price,kind:r.kind||"消耗品"};
      if(r.code) p.code=r.code;
      db.products.push(p);
    }else{
      // 原価が伝票と違うとき、最新（＝この伝票の単価）に入れ替える。
      // 入れ替えるかどうかは行ごとに選べる（v82）
      if(price&&p.cost!==price&&r.upd) p.cost=price;
      if(r.kind&&p.kind!==r.kind) p.kind=r.kind;    // 区分を手で変えたらマスタにも残す
    }
    const kind=r.kind||p.kind;
    if(STOCKKIND(kind)){                              // 消耗品は在庫で数えない
      const c=cell(m,p.id); c.in+=r.qty;
      /* v182：棚卸しずみなら差を計算し直して、**月末在庫を「数えた実数」のまま**にする。
         ここが抜けていたので、数えたあとに仕入れを入れた月だけ
         月末在庫が実数からずれ、棚卸しの画面に出ない差が残っていた */
      if(c.cntAt&&!(c.cnt===undefined||c.cnt===null||c.cnt==="")) c.loss=bookQty(c)-(+c.cnt||0);
    }
    items.push({pid:p.id,n:p.n,qty:r.qty,price,kind});
  });
  const total=buyTotal(d.rows,d);
  const rec={id:buyId,src:d.src,date:d.date,no:(d.no||"").trim(),note:d.note||"",
             from:d.from||"",total,month:m,items,at:today(),sig:buySig(d),
             doc:d.doc||0,tax:d.tax||"in",mailId:d.mailId||"",
             adv:advOf(d)};   // 川口さんの立替か、店が直接払ったか（v129）
  // 現金で払ったぶんは出納帳の出金にも落とす（あとで取り消すときのために buyId を控える）
  if(d.cash&&total){
    const eid=uid();
    db.cashbook.entries.push({id:eid,date:d.date,amount:-total,
      note:`${d.src}${rec.no?" "+rec.no:""} 仕入`,cid:null,who:"",buyId});
    rec.cashId=eid;
  }
  db.buys.unshift(rec);
  db.buydrafts=(db.buydrafts||[]).filter(x=>x.id!==d.id);
  if(buyOpen===d.id) buyOpen=null;             // 反映が終わったら仕分け待ちの一覧に戻る
  delete buyPage[d.id];
  await save();
  renderBuy(); renderCashbook(); if(document.getElementById("invbody")) renderStock();
  const nSup=items.filter(it=>it.kind==="消耗品").length;
  const nSt=items.length-nSup;
  toast(`${m.replace("-","年")}月に反映しました（在庫${nSt}品目${nSup?`／消耗品${nSup}品目`:""}）`);
}

/* 取り込みを丸ごと取り消す。在庫から引き、出納帳の出金も消す */
async function undoBuy(id){
  const b=db.buys.find(x=>x.id===id); if(!b) return;
  if(!confirm(`${b.date.replace(/-/g,"/")}の${b.src}（${b.items.length}品目・${yen(b.total)}）を取り消します。\n在庫の仕入から引き、現金出納帳の出金も消します。よろしいですか？`))return;
  // 消耗品は在庫に入れていないので引かない（区分の無い古い履歴は在庫ぶんとして扱う）
  b.items.forEach(it=>{ if(it.kind==="消耗品") return;
    const c=cell(b.month,it.pid); c.in=Math.max(0,c.in-it.qty);
    if(c.cntAt&&!(c.cnt===undefined||c.cnt===null||c.cnt==="")) c.loss=bookQty(c)-(+c.cnt||0); });
  if(b.cashId) db.cashbook.entries=db.cashbook.entries.filter(e=>e.id!==b.cashId);
  db.buys=db.buys.filter(x=>x.id!==b.id);
  await save();
  renderBuy(); renderCashbook(); if(document.getElementById("invbody")) renderStock();
  toast("取り消しました");
}

/* 伝票1枚ぶんの見出し（日付・伝票番号・税・現金・突合） */
function buyHeadHtml(d){
  const total=buyTotal(d.rows,d);            // 税込にそろえた合計（在庫と原価に使う）
  const dup=db.buys.find(b=>b.sig===buySig(d));
  const doc=d.doc||0;
  // 突合は伝票と同じ土俵で。税抜の伝票なら、税を足す前の合計と突き合わせる
  const ex=d.tax==="ex";
  /* v192：税抜の伝票でも、**合計だけ税込**で刷ってあるものがある（レシートはほぼこれ）。
     ミラビスの請求明細書は税抜どうしなので、**伝票の合計に近いほうで突き合わせる**と
     どちらも合う。決め打ちにすると、レシートは税抜にしたとたん赤いままになる */
  const raw=buyTotalRaw(d.rows);
  const exIn=ex&&doc>0&&Math.abs(total-doc)<Math.abs(raw-doc);
  const cmp=ex?(exIn?total:raw):total;
  const lbl=ex?(exIn?"（税込）":"（税抜）"):"";
  const diff=doc?cmp-doc:0;
  /* v192：**差が消費税とほぼ同じなら、そう言う。**
     レシートは「明細は税抜・合計は税込」で刷られていることが多く、
     写真から読むとかならずこの差で赤くなる。理由が分からないと直しようがない */
  const taxGap=!ex&&doc>0&&diff<0
    &&Math.abs(doc-Math.round(cmp*(1+TAXR)))<=Math.max(2,Math.round(cmp*0.002));
  return `<div class="sheet" style="border:2px solid var(--accent);margin-bottom:0">
      <div class="schbar" style="margin:0 0 12px">
        <span class="kb" style="background:var(--accent);margin:0">${esc(d.src)}</span>
        <span class="title" style="font-size:16px;text-align:left">${
          d.from?esc(d.from):"読み取った明細"}</span>
        <button class="cbmini del" type="button" data-drop="${d.id}">この伝票をやめる</button>
      </div>
      ${dup?`<p class="note" style="color:var(--alert);margin:0 0 12px"><b>同じ伝票をすでに取り込んでいます</b>
        （${dup.date.replace(/-/g,"/")}／${yen(dup.total)}）。二重に入れると在庫が増えすぎます。</p>`:""}
      <div class="grid">
        <div><label class="f">仕入日</label>
          <input class="f-in" type="date" data-d="${d.id}" data-h="date" value="${d.date}"></div>
        <div><label class="f">伝票番号（任意）</label>
          <input class="f-in" data-d="${d.id}" data-h="no" value="${esc(d.no)}" placeholder="例：NBS-12345"></div>
        <div style="grid-column:1/-1"><label class="f">メモ（任意）</label>
          <input class="f-in" data-d="${d.id}" data-h="note" value="${esc(d.note)}"></div>
      </div>
      <div class="segk" style="margin-top:12px"><span>伝票の単価は</span>
        <button type="button" data-d="${d.id}" data-tax="in"${d.tax!=="ex"?' class="on"':""}>税込</button>
        <button type="button" data-d="${d.id}" data-tax="ex"${d.tax==="ex"?' class="on"':""}>税抜（+10%する）</button>
      </div>
      <p class="note" style="margin:8px 0 0">${d.tax==="ex"
        ?`<b>1品ずつ</b>消費税を足して税込にしてから、在庫と原価に積みます
          （伝票の合計 <b>${yen(buyTotalRaw(d.rows))}</b>（税抜）→ <b>${yen(total)}</b>（税込））。
          商品マスタの仕入単価にも、その<b>税込の単価</b>が入ります。
          品目ごとに変えたいときは、下のカードの「この単価は税抜」で切り替えられます。`
        :`伝票の金額をそのまま税込として扱い、<b>${yen(total)}</b> で在庫と原価に積みます。
          ${d.src==="ミラビス"
            ?`<b style="color:var(--alert)">ミラビスの請求明細書は税抜で書かれています。</b>
               「税抜（+10%する）」に切り替えてください。`
            :`税抜で書かれた伝票（ミラビスなど）は「税抜」に切り替えてください。`}`}
        この選び方は<b>${esc(d.src)}</b>のぶんとして覚えます。</p>
      <p class="note" style="margin:10px 0 0">
        <label><input type="checkbox" data-d="${d.id}" data-h="cash"${d.cash?" checked":""}>
          この仕入れは現金で払った（現金出納帳に ${yen(total)} の出金として記録する）</label></p>

      <div class="segk" style="margin-top:12px"><span>この代金を払ったのは</span>
        <button type="button" data-d="${d.id}" data-adv="kawa"${advOf(d)==="kawa"?' class="on"':""}>川口さんの立替</button>
        <button type="button" data-d="${d.id}" data-adv="salon"${advOf(d)==="salon"?' class="on"':""}>店（立替ではない）</button>
      </div>
      <p class="note" style="margin:8px 0 0">${advOf(d)==="kawa"
        ?`<b>川口さんの支払明細の「立替」に、この伝票の ${yen(total)} が入ります。</b>
          商品・材料・消耗品のどれでも、立て替えた代金はぜんぶ立替に入ります。`
        :`店が直接払ったぶんとして扱い、<b>立替には入れません。</b>`}</p>

      <div class="bmatch ${doc?(diff===0?"ok":"ng"):"na"}">
        ${doc?`伝票の${esc(d.doclbl||"合計")}${lbl} <b>${yen(doc)}</b>
          ／ 読み取った明細の合計${lbl} <b>${yen(cmp)}</b>　${
          diff===0?`→ ぴったり合っています（取りこぼしも二重読みもありません）${
            ex&&!exIn?`<br>税込にすると <b>${yen(total)}</b>。この金額で在庫と原価に入れます`:""}`
                 :`→ <b>${yen(Math.abs(diff))}${diff>0?"多い":"足りない"}</b>。${taxGap
                    ?`<br><b>差は消費税とちょうど同じです。</b>明細が税抜、合計が税込で
                      書かれた伝票（レシートに多い）だと思われます。上の
                      <b>「税抜（+10%する）」</b>に切り替えると ${yen(Math.round(cmp*(1+TAXR)))} になって合います`
                    :`チェックの入れ忘れ・数量・単価のどれかがずれています`}`}`
        :`伝票に書かれた合計を読み取れませんでした。
          読み取った明細の合計は <b>${yen(total)}</b>（税込）です。伝票の金額と見くらべてください`}
      </div>
      ${d.pr?`<details style="margin-top:4px"><summary class="note" style="cursor:pointer;margin:0">
        列の割り当てを直す（読み取りがずれているとき）</summary>
        <div class="grid" style="margin-top:10px">
          ${["n","qty","price","amt","code"].map(k=>`<div>
            <label class="f">${BUYLBL[k]}</label>
            <select class="f-in" data-d="${d.id}" data-col="${k}">
              <option value="">（使わない）</option>
              ${(d.pr.raw[d.pr.head<0?0:d.pr.head]||[]).map((v,j)=>
                `<option value="${j}"${d.pr.cols[k]===j?" selected":""}>${j+1}列目${
                  d.pr.head>=0&&v?`：${esc(String(v).slice(0,12))}`:""}</option>`).join("")}
            </select></div>`).join("")}
        </div>
        <p class="note" style="margin:8px 0 0">選び直すと下の一覧を作り直します。${
          d.mail?`<br><b>このメールは「${esc((d.pr.raw[0]||[]).join("／"))}」という項目でできています。</b>
            数量にあたる項目が選ばれているか確かめてください
            （たとえば「小計」が実は個数なら、数量に選び直します）。`:""}</p>
      </details>`:""}
    </div>`;
}

/* ---------- 手で入れる品目のカード（v192b） ----------
   利用者の指示：**「手で入力、カテゴリ別で商品・材料・消耗品とまず分けて、
   その中からプルダウンで選べるようにできないか？
   あと新しいものだったら名前から足して手入力できるようにしたい」**

   伝票から読んだ品目は「品名が先にあって、それがマスタのどれかを当てる」順。
   手で入れるときは**逆**で、「どの区分か → その中のどれか → 無ければ新しい名前」の順になる。
   同じカードでは両方に無理があるので、**手で足した行だけ別のカードにした**。

   ① 区分（商品・材料・消耗品）
   ② その区分に登録ずみのものだけのプルダウン（選ぶと品名と単価が入る）
   ③ 無ければ「＋ 新しいものを打つ」→ 名前の欄が出る（反映と同時にマスタに登録）
   ④ 数量・単価

   ★ 区分を先に決めるので、**プルダウンに関係のないものが出てこない**
     （商品48・材料19・消耗品0 が全部混ざった一覧から探していた）。 */
function buyItemHandHtml(d,r,i){
  const p=r.pid?db.products.find(x=>x.id===r.pid):null;
  const unit=buyUnit(d,r);
  const need=r.on&&!r.kind;
  const list=r.kind?db.products.filter(x=>x.kind===r.kind)
                     .sort((a,b)=>a.n.localeCompare(b.n,"ja")):[];
  return `<div class="bitem${r.on?"":" off"}${need?" need":""}">
    <div class="bi-h">
      <label class="bi-on"><input type="checkbox" data-d="${d.id}" data-r="${i}" data-f="on"${
        r.on?" checked":""}><span>入れる</span></label>
      <b style="flex:1;font-family:var(--min);font-size:13px;font-weight:500">${
        r.n?esc(r.n):`${i+1}品目`}</b>
      <button class="cbmini del" type="button" data-delrow="${d.id}" data-i="${i}"
        style="flex:none">消す</button>
    </div>

    <div class="segk" style="margin-top:0"><span>① 区分</span>
      ${KINDS.map(k=>`<button type="button" data-d="${d.id}" data-r="${i}" data-k="${k}"${
        r.kind===k?' class="on"':""}>${KLBL[k]}</button>`).join("")}
    </div>

    ${r.kind?`<div class="bi-m"><label><span>② ${KLBL[r.kind]}から選ぶ${
        list.length?`（${list.length}件）`:""}</span>
      <select class="f-in" data-d="${d.id}" data-r="${i}" data-f="pid">
        <option value=""${r.pid?"":" selected"}>＋ 新しいものを打つ</option>
        ${list.map(x=>`<option value="${x.id}"${x.id===r.pid?" selected":""}>${esc(x.n)}${
          x.cost?`　${yen(x.cost)}`:""}</option>`).join("")}
      </select></label></div>`
    :`<p class="bi-f" style="color:var(--alert)"><b>まず区分を選んでください。</b>
        選ぶと、その区分に登録ずみのものが出ます。</p>`}

    ${r.kind&&!r.pid?`<div class="bi-m"><label><span>③ 新しい品名</span>
      <input class="f-in" data-d="${d.id}" data-r="${i}" data-f="n" value="${esc(r.n)}"
        placeholder="例：ハンドソープ　この名前で登録します"></label></div>`:""}

    <div class="bi-g" style="margin-top:9px">
      <label><span>数量</span><input type="number" min="0" data-d="${d.id}" data-r="${i}" data-f="qty" value="${r.qty}"></label>
      <label><span>単価${rowTax(d,r)==="ex"?"（税抜）":"（税込）"}</span>
        <input type="number" min="0" data-d="${d.id}" data-r="${i}" data-f="price" value="${r.price}"></label>
      <label class="amt"><span>金額（税込）</span><b>${yen(r.qty*unit)}</b></label>
    </div>
    <p class="bi-f" style="margin-top:8px">
      <label style="cursor:pointer"><input type="checkbox" data-d="${d.id}" data-r="${i}" data-f="tax"${
        rowTax(d,r)==="ex"?" checked":""}> この単価は<b>税抜</b>${
        rowTax(d,r)==="ex"
          ?`　→ 消費税を足した <b>${yen(unit)}</b> で在庫と原価に積みます`
          :`（チェックを入れると ${yen(Math.round(r.price*(1+TAXR)))} で積みます）`}</label></p>

    ${p?`<div class="bi-cost">
        <span>登録ずみ：<b>${esc(p.n)}</b>（${KLBL[p.kind]||p.kind}${
          p.cost?`・前の原価 ${yen(p.cost)}`:""}）</span>
        ${p.cost&&unit&&p.cost!==unit
          ?`<label><input type="checkbox" data-d="${d.id}" data-r="${i}" data-f="upd"${
              r.upd?" checked":""}>原価を今回の ${yen(unit)} に変える</label>`:""}
      </div>`
     :r.kind&&String(r.n||"").trim()
      ?`<p class="bi-f"><span class="alert">マスタに無い名前です。</span>
         反映すると<b>${KLBL[r.kind]}</b>として「${esc(r.n)}」を登録します</p>`
      :""}
  </div>`;
}

/* 品目1つぶんのカード。横に長い表をやめたので、右端がはみ出さない（v82） */
function buyItemHtml(d,r,i){
  if(r.hand!==undefined?r.hand:!!d.manual) return buyItemHandHtml(d,r,i);
  const p=r.pid?db.products.find(x=>x.id===r.pid):null;

        r.on?" checked":""}><span>入れる</span></label>
      <input class="f-in" data-d="${d.id}" data-r="${i}" data-f="n" value="${esc(r.n)}"
        placeholder="品名を入れてください">
      <button class="cbmini del" type="button" data-delrow="${d.id}" data-i="${i}"
        style="flex:none">消す</button>
    </div>
    <div class="bi-g">
      <label><span>数量</span><input type="number" min="0" data-d="${d.id}" data-r="${i}" data-f="qty" value="${r.qty}"></label>
      <label><span>単価${rowTax(d,r)==="ex"?"（税抜）":"（税込）"}</span>
        <input type="number" min="0" data-d="${d.id}" data-r="${i}" data-f="price" value="${r.price}"></label>
      <label class="amt"><span>金額（税込）</span><b>${yen(r.qty*unit)}</b></label>
    </div>
    <p class="bi-f" style="margin-top:8px">
      <label style="cursor:pointer"><input type="checkbox" data-d="${d.id}" data-r="${i}" data-f="tax"${
        rowTax(d,r)==="ex"?" checked":""}> この単価は<b>税抜</b>${
        rowTax(d,r)==="ex"
          ?`　→ 消費税を足した <b>${yen(unit)}</b> で在庫と原価に積みます`
          :`（チェックを入れると ${yen(Math.round(r.price*(1+TAXR)))} で積みます）`}</label></p>
    <div class="bi-m"><label><span>商品マスタ</span>
      <select class="f-in" data-d="${d.id}" data-r="${i}" data-f="pid">
        <option value=""${r.pid?"":" selected"}>＋新しく登録する</option>
        ${db.products.slice().sort((a,b)=>a.n.localeCompare(b.n,"ja"))
          .map(x=>`<option value="${x.id}"${x.id===r.pid?" selected":""}>${esc(x.n)}（${KLBL[x.kind]||x.kind}）</option>`).join("")}
      </select></label></div>
    <div class="segk"><span>区分</span>
      ${KINDS.map(k=>`<button type="button" data-d="${d.id}" data-r="${i}" data-k="${k}"${
        r.kind===k?' class="on"':""}>${KLBL[k]}</button>`).join("")}
    </div>
    ${r.pack>1?`<div class="bi-cost">
      <span>名前から <b>${r.pack}</b> 入りと読みました</span>
      ${canSplit(r)
        ?`<label><input type="checkbox" data-d="${d.id}" data-r="${i}" data-f="split"${
            r.split?" checked":""}>1つずつに分ける（1つ ${yen(
            (d.tax==="ex"?Math.round(r.price0/r.pack*(1+TAXR)):Math.round(r.price0/r.pack)))
            }／${r.qty0*r.pack}個として在庫に入れる）</label>`
        :`<span style="color:var(--ink3)">単価 ${yen(r.price0)} を ${r.pack} で割り切れないので、
            分けずにそのまま入れます</span>`}</div>`:""}
    ${costDiff?`<div class="bi-cost">
      <span>登録ずみの原価 <b>${yen(p.cost)}</b> → 今回 <b>${yen(unit)}</b></span>
      <label><input type="checkbox" data-d="${d.id}" data-r="${i}" data-f="upd"${
        r.upd?" checked":""}>最新の ${yen(unit)} に変える</label></div>`:""}
    ${unit>=200000?`<div class="bi-cost" style="border-color:var(--alert);color:var(--alert)">
      <b>単価 ${yen(unit)} は高すぎませんか。</b>品番や注文番号を単価として読んでいるかもしれません。
      伝票を見くらべて、違っていたら上の「列の割り当てを直す」で選び直してください。</div>`:""}
    <p class="bi-f">${p?(MATCHSURE(r.mhow)
        ?`商品マスタの「${esc(p.n)}」にぴったり一致`
        :`<span class="alert">似た名前の「${esc(p.n)}」に当てました</span>（違っていたら選び直してください）`)
      :`<span class="alert">マスタに無いので、反映と同時に登録します</span>`}　${
      need?`<span class="alert">区分が未選択です</span>`
      :r.how==="master"?"区分はマスタどおり"
      :r.how==="guess"?"区分は名前から推測"

/* 仕分けは1品目ずつ見せる。下にずらっと並べると、どこまで見たか分からなくなる（v91）。
   ぜんぶ並べて見たいときは buyAllRows を立てる */
function buyPagerHtml(d,idx){
  const n=d.rows.length;
  const need=i=>d.rows[i].on&&!d.rows[i].kind;
  const left=d.rows.filter((r,i)=>need(i)).length;
  return `<div class="bpager">
    <button class="nav" data-page="${d.id}" data-p="${idx-1}"${idx<=0?" disabled":""}>◀ 前へ</button>
    <span class="now"><b>${idx+1}</b> / ${n}</span>
    <button class="nav" data-page="${d.id}" data-p="${idx+1}"${idx>=n-1?" disabled":""}>次へ ▶</button>
    ${left?`<button class="btn ghost" data-next0="${d.id}">未選択へ飛ぶ（${left}）</button>`:""}
    <button class="btn quiet" id="by-allrows">${buyAllRows?"1品目ずつ見る":"ぜんぶ並べて見る"}</button>
    <span class="num">${d.rows.map((r,i)=>`<button data-page="${d.id}" data-p="${i}"
      class="${i===idx?"on ":""}${need(i)?"need ":""}${r.on?"":"off"}"
      title="${esc(r.n||"（品名なし）")}">${i+1}</button>`).join("")}</span>
  </div>`;
}

/* 右に置く「根拠」。いま見ている品目の名前が本文にあれば、そこを黄色くする（v93） */
let buySrcTab={};            // 伝票ごとに、本文とファイルのどちらを見ているか
function buySrcHtml(d,cur){
  const hasTxt=!!(d.srcText&&d.srcText.trim());
  const f=d.file||null;
  const hasFile=!!(f&&f.url);
  const tab=buySrcTab[d.id]||(hasFile?"file":"text");
  const show=tab==="file"&&hasFile?"file":(hasTxt?"text":(hasFile?"file":""));
  const head=`<div class="bsrc-h">
      <b>もとの伝票</b>
      ${hasTxt&&hasFile?`<button class="cbmini${show==="text"?" del":""}" data-srctab="${d.id}" data-t="text">文字</button>
        <button class="cbmini${show==="file"?" del":""}" data-srctab="${d.id}" data-t="file">${
          f.kind==="image"?"写真":"PDF"}</button>`:""}
      <label class="cbmini" style="position:relative;overflow:hidden;cursor:pointer">${
        hasFile?"貼り直す":"写真・PDFを貼る"}
        <input type="file" data-srcfile="${d.id}" accept="image/*,.pdf,application/pdf"
          style="position:absolute;inset:0;opacity:0;cursor:pointer"></label>
      ${hasFile&&f.kind==="image"
        ?`<button class="cbmini" data-srcocr="${d.id}">この写真から品目を足す</button>`:""}
    </div>`;
  let body="";
  if(show==="file"&&f.kind==="image") body=`<img src="${f.url}" alt="${esc(f.name)}">`;
  else if(show==="file"&&f.kind==="pdf") body=`<embed src="${f.url}" type="application/pdf">`;
  else if(show==="text"){
    // いまの品目の名前を本文の中で目立たせる。
    // 【4B】のような括弧書きは伝票によって付いたり付かなかったりするので外し、
    // 残った芯の名前で探す。空白の入り方もずれるので \s* でつなぐ
    let t=esc(d.srcText);
    const key=String(cur&&cur.n||"")
      .replace(/[【\[（(][^】\]）)]*[】\]）)]/g," ").trim();
    if(key.length>=3){
      const parts=esc(key).split(/\s+/).filter(Boolean)
        .map(s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
      if(parts.length){
        try{ t=t.replace(new RegExp(parts.join("\\s*"),"g"),m=>`<mark>${m}</mark>`); }catch(e){}
      }
    }
    body=`<pre>${t}</pre>`;
  }
  else body=`<div class="empty">もとの伝票が残っていません。<br>
    上の「写真・PDFを貼る」で、伝票の写真やPDFを貼ると、ここに出ます。</div>`;
  return `<div class="bsrc">${head}<div class="bsrc-b">${body}</div></div>`;
}

function buyDraftHtml(d){
  const total=buyTotal(d.rows,d);
  const on=d.rows.filter(r=>r.on);
  const undecided=on.filter(r=>!r.kind).length;
  const cnt=k=>on.filter(r=>r.kind===k).reduce((a,r)=>a+r.qty*buyUnit(d,r),0);
  const one=d.rows.length>1&&!buyAllRows;
  const idx=Math.min(Math.max(0,buyPage[d.id]||0),d.rows.length-1);
  // 左に仕分け、右にもとの伝票。狭い画面では縦に積む（v93）
  return `${buyHeadHtml(d)}
    <div class="bwork" style="margin-top:10px">
    <div>${
      one?buyPagerHtml(d,idx)+buyItemHtml(d,d.rows[idx],idx)
        :(d.rows.length>1?buyPagerHtml(d,idx):"")+d.rows.map((r,i)=>buyItemHtml(d,r,i)).join("")}</div>
    ${buySrcHtml(d,d.rows[idx])}
    </div>
    <div class="sheet" style="margin-top:14px">
      <table class="chk"><tbody>
        <tr><th style="text-align:left">商品（在庫に入れる）</th><td>${yen(cnt("物販"))}</td></tr>
        <tr><th style="text-align:left">材料（在庫に入れる）</th><td>${yen(cnt("材料"))}</td></tr>
        <tr><th style="text-align:left">消耗品（買った月の経費）</th><td>${yen(cnt("消耗品"))}</td></tr>
        <tr class="bdtot"><th style="text-align:left">合計　${on.length}品目</th><td>${yen(total)}</td></tr>
      </tbody></table>
      <div class="actions" style="margin-top:12px">
        <button class="btn" data-apply="${d.id}"${undecided?" disabled":""}>${
          (d.date||"").slice(0,7).replace("-","年")}月に反映する</button>
        <button class="btn ghost" data-addrow="${d.id}">品目を手で足す</button>
      </div>
      <p class="note">${undecided?`<b style="color:var(--alert)">区分の決まっていない品目が${undecided}件あります。
        「商品」「材料」「消耗品」のどれかを選ぶと反映できます。</b><br>`:""}
        商品と材料は<b>${(d.date||"").slice(0,7).replace("-","年")}月の在庫の「仕入」欄</b>に数量が足されます。
        消耗品は在庫を通さず、その月の経費として数えます。まちがえたら下の履歴から取り消せます。</p>
    </div>`;
}

/* 仕分け待ちが何枚かあるとき、下に続けて並べると
   スクロールしただけで別の仕入先の伝票に入ってしまい、どこを見ているのか分からなくなる。
   そこで **1枚の伝票＝1ページ** にした（v92）。
   一覧で伝票を選ぶ → その伝票だけの画面で仕分ける → 反映したら一覧に戻る */
function buyDraftCardHtml(d){
  const on=d.rows.filter(r=>r.on);
  const undecided=on.filter(r=>!r.kind).length;
  const total=buyTotal(d.rows,d);
  return `<button class="navcard" data-open="${d.id}">
    <span class="nc-i">${esc((d.src||"？").slice(0,2))}</span>
    <span class="nc-t"><b>${esc(d.src)}${d.tax==="ex"?"　<small>税抜</small>":""}</b>
      <span>${d.date.replace(/-/g,"/")}　${on.length}品目　${esc(d.from||"")}</span></span>
    <span class="nc-v"><span class="${undecided?"warn":""}">${
      undecided?`未選択${undecided}`:"仕分けずみ"}</span><em>${yen(total)}</em></span>
    <span class="nc-a">›</span>
  </button>`;
}

function renderBuy(){
  const el=document.getElementById("buyhost");
  if(!el) return;
  if(buyOpen&&!buyDraft(buyOpen)) buyOpen=null;     // 反映や取り消しで消えていたら一覧へ
  if(buyOpen) return renderBuyOne(el,buyDraft(buyOpen));
  renderBuyList(el);
}

/* ---- 一覧：読み取り口と、仕分け待ちの伝票を並べるだけ ---- */
function renderBuyList(el){
  const ds=db.buydrafts||[];
  el.innerHTML=`${db.buypurge?`<div class="sheet" style="border-color:var(--alert);margin-bottom:14px">
      <b style="font-family:var(--min);font-size:13px">古い読み取りの下書き${db.buypurge}件を捨てました（v${APPVER}）</b>
      <p class="note" style="margin:8px 0 0">前の版には、あいさつ文を商品にする／商品コードを単価にする／
        「4,600円 X 1個 = 4,600円 (税込 5,060円)」の数字をつなげてしまう、といった不具合がありました。
        その版で読み取った仕分け待ちは信用できないので消してあります。
        <b>お手数ですが、もう一度読み込んでください。</b><br>
        取り込みずみの履歴・在庫・現金出納帳には手をつけていません。</p>
      <div class="actions"><button class="btn quiet" id="by-purgeok">わかりました</button></div>
    </div>`:""}
    ${buySupplyHtml()}${buyReaderHtml()}
    <div class="divider"><h2>仕分け待ちの仕入れ</h2></div>
    ${ds.length?`<p class="note" style="margin:0 0 10px">
        伝票を選ぶと、その伝票だけの画面になります（他の仕入先は出てきません）。</p>
      <div class="navlist">${ds.map(buyDraftCardHtml).join("")}</div>
      <div class="actions" style="margin-top:12px">
        <button class="btn danger" id="by-clear">仕分け待ち${ds.length}件をぜんぶ捨てる</button>
      </div>`
      :`<p class="note">いまは仕分け待ちの仕入れはありません。
        上の入り口から読み込むと、NBSのメールもミラビスの伝票も、ここに並びます。</p>`}
    ${buyHistoryHtml()}`;

  const pk=document.getElementById("by-purgeok");
  if(pk) pk.onclick=async()=>{ db.buypurge=0; await save(); renderBuy(); };
  const cl=document.getElementById("by-clear");
  if(cl) cl.onclick=async()=>{
    if(!confirm(`仕分け待ちの${ds.length}件をぜんぶ捨てます。\n取り込みずみの履歴・在庫・現金出納帳はそのままです。\nよろしいですか？`))return;
    db.buydrafts=[]; await save(); renderBuy(); toast("仕分け待ちを空にしました");
  };
  el.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{ buyOpen=b.dataset.open; renderBuy(); });

  /* ---- 読み取り口 ---- */
  const rmsg=(t,ok)=>{const e=document.getElementById("by-readmsg");
    if(e) e.innerHTML=`<p class="note" style="color:${ok?"var(--accent)":"var(--alert)"}">${esc(t)}</p>`;};
  if(buyReadMsg){ rmsg(buyReadMsg,false); buyReadMsg=""; }
  document.getElementById("by-src").onchange=e=>{ buySrc=e.target.value; renderBuy(); };
  document.getElementById("by-mail").onclick=()=>findBuyMail();
  document.getElementById("by-paste-t").onclick=()=>{
    buyPaste=!buyPaste; if(!buyPaste) buyPasteVal=""; renderBuy();
  };
  /* v192：写真から読み取る。中継役ごしに文字にして、貼り付けと同じ読み取り機に流す */
  document.getElementById("by-photo").onchange=async e=>{
    const f=e.target.files[0]; if(!f) return;
    e.target.value="";                                   // 同じ写真をもう一度選べるように
    rmsg(`${f.name} を読み取っています…（10秒ほどかかります）`,true);
    try{
      const text=await ocrFile(f);
      const d=buyFromOcr(text,f.name);
      if(d){ try{ await buyAttachSrc(d,f); }catch(err){} }
      await save(); renderBuy();                         // 読めなかった理由もここで出る
      if(d) toast(`写真から ${d.rows.length}品目を読みました`);
    }catch(err){ rmsg(err.message,false); }
  };
  document.getElementById("by-manual").onclick=async()=>{
    startBuyManual(buySrc);            // 作ったらすぐその伝票の画面へ（startBuyManual が開く）
    await save(); renderBuy();
    toast(`${buySrc}の仕入れを手で入力します`);
  };
  document.getElementById("by-file").onchange=async e=>{
    const f=e.target.files[0]; if(!f) return;
    rmsg(`${f.name} を読み取っています…`,true);
    try{
      const isPdf=/\.pdf$/i.test(f.name)||f.type==="application/pdf";
      const r=isPdf?await pdfToText(f):{text:await readTextFile(f),plain:""};
      if(!String(r.text||"").trim()){ rmsg("中身が空でした",false); return; }
      const d=startBuyDraft(buySrc,r.text,f.name,r.plain||r.text);
      // 読み取った伝票そのものを右に置けるよう、ファイルも一緒に控える（v93）
      if(d){ try{ await buyAttachSrc(d,f); }catch(err){} await save(); }
      renderBuy();                                  // 読めなかった理由もここで出る
    }catch(err){ rmsg(err.message,false); }
  };
  const pv=document.getElementById("by-paste");
  if(pv) pv.oninput=e=>{ buyPasteVal=e.target.value; };   // 描き直しで消えないように控える
  const rd=document.getElementById("by-read");
  if(rd) rd.onclick=async()=>{
    const txt=document.getElementById("by-paste").value;
    if(!txt.trim()){ toast("明細を貼り付けてください"); return; }
    const d=startBuyDraft(buySrc,txt,"貼り付け");
    if(d){ buyPaste=false; buyPasteVal=""; await save(); }
    renderBuy();
  };
  buyHistoryBind(el);
}

/* ---- 1枚の伝票だけの画面。ここには他の仕入先も読み取り口も履歴も出さない ---- */
function renderBuyOne(el,d){
  const ds=db.buydrafts||[];
  const i=ds.indexOf(d);
  el.innerHTML=`<div class="backbar">
      <button class="btn quiet" id="by-back2">← 仕分け待ちにもどる</button>
      <span class="title">${esc(d.src)}</span>
      ${ds.length>1?`<span class="note" style="margin:0">伝票 ${i+1} / ${ds.length}</span>`:""}
    </div>
    ${buyDraftHtml(d)}
    ${ds.length>1?`<div class="actions" style="margin-top:14px">
      <button class="btn quiet" data-dpage="${i-1}"${i<=0?" disabled":""}>◀ 前の伝票</button>
      <button class="btn quiet" data-dpage="${i+1}"${i>=ds.length-1?" disabled":""}>次の伝票 ▶</button>
    </div>`:""}`;

  document.getElementById("by-back2").onclick=()=>{ buyOpen=null; renderBuy(); };
  el.querySelectorAll("[data-dpage]").forEach(b=>b.onclick=()=>{

    buyOpen=t.id; renderBuy();
