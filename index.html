/* ---------- カルテの品物を選ぶプルダウンの中身（v204） ----------
   利用者の指摘：**「施術で使った材料の選択肢のプルダウンでの選択」が使いにくい。**
   材料19品目・物販48品目が **登録した順にただ並んでいた**ので、
   iPad では毎回いちばん下まで転がして探すことになっていた。

   ★ **形は変えない。** `<select>` のまま（iPad で確実に動くのはこれだけ。datalist は使えない）。
     **並べ方だけ**を変える：
       ① 先頭に「よく使うもの」… **過去のカルテで選ばれた回数**の多い順に8つ
       ② そのあとをカテゴリごとのまとまり（`<optgroup>`）に分ける
     `<optgroup>` は iOS の選択画面でも見出しとして出るので、指で探す距離が短くなる。
   ★ 消えた品物が選ばれていたときは「（消えた品物）」として残す。
     黙って「なし」に戻すと、原価が知らないうちに0になる。 */
function prodUseCount(key){
  const t={};
  (db.charts||[]).forEach(k=>(k[key]||[]).forEach(x=>{ if(x&&x.pid) t[x.pid]=(t[x.pid]||0)+1; }));
  return t;
}
function prodOptions(kind,key,pid,withCost){
  const list=db.products.filter(p=>p.kind===kind);
  const use=prodUseCount(key);
  const opt=p=>`<option value="${p.id}"${p.id===pid?" selected":""}>${esc(p.n)}${
    withCost?`（${yen(p.cost)}）`:""}${(+p.cost)?"":"　★原価なし"}</option>`;
  const often=list.filter(p=>use[p.id])
    .sort((a,b)=>use[b.id]-use[a.id]||a.n.localeCompare(b.n,"ja")).slice(0,8);
  const inOften=new Set(often.map(p=>p.id));
  const cats={};
  list.filter(p=>!inOften.has(p.id)).forEach(p=>{
    const c=String(p.cat||"").trim()||"その他"; (cats[c]=cats[c]||[]).push(p); });
  let out=`<option value="">なし</option>`;
  if(often.length) out+=`<optgroup label="よく使うもの">${often.map(opt).join("")}</optgroup>`;
  Object.keys(cats).sort((a,b)=>a.localeCompare(b,"ja")).forEach(c=>{
    out+=`<optgroup label="${esc(c)}">${
      cats[c].sort((a,b)=>a.n.localeCompare(b.n,"ja")).map(opt).join("")}</optgroup>`;
  });
  if(pid&&!list.some(p=>p.id===pid))
    out+=`<option value="${esc(pid)}" selected>（消えた品物）</option>`;
  return out;
}

/* ---------- 前回と同じ材料を入れる（v204） ----------
   利用者の求め：**カルテを書くたびに材料19品目から選び直すのが、いちばん重い。**

   ★ 方針は変えていない。利用者の指示
     **「同じメニューでも使う材料が違うから、カルテで材料を選んで原価を出す」**
     はそのまま。**原価はいまでもカルテで選んだものからしか出さない**（レシピは使わない）。
     このボタンがやるのは「**前回選んだものを入れておく**」だけ。違えば選び直す。

   探しかた（上から順に、見つかった時点で決める）：
     ① メニューの並びがそっくり同じカルテ（オプションまで含めて）
     ② 先頭のメニューが同じカルテ（オプション違いを拾う）
   どちらも **その施術日より前**の、いちばん新しいものを見る。 */
function lastMats(menu,exceptId,before){
  const key=s=>MNORM(String(s||""));
  const head=s=>key(String(s||"").split("／")[0]||"");
  const want=key(menu), wantHead=head(menu);
  if(!want) return null;
  const cand=(db.charts||[]).filter(k=>k.id!==exceptId
      && Array.isArray(k.mats) && k.mats.length
      && (!before||String(k.date||"")<=before))
    .sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")));
  const hit=cand.find(k=>key(k.menu)===want)
        ||(wantHead?cand.find(k=>head(k.menu)===wantHead):null);
  return hit?{mats:hit.mats.map(x=>({pid:x.pid,qty:+x.qty||1})),from:hit}:null;
}
/* ボタンの中身。新規カルテと、直す画面（モーダル）の両方から呼ぶ。
     menu   … いま入力欄に入っているメニュー（joinMenu ずみ）
     date   … 施術日
     cur    … いま選ばれている材料
     put    … 入れ直す関数 */
function lastMatsFill(menu,date,exceptId,cur,put){
  const r=lastMats(menu,exceptId,date);
  if(!r){ toast("同じメニューで材料を選んだカルテが見つかりません"); return; }
  /* すでに選んであるものを黙って捨てない */
  if(cur&&cur.length&&!confirm(`いま選んでいる材料${cur.length}件を、
${String(r.from.date).replace(/-/g,"/")}のカルテと同じ材料に入れ替えます。
よろしいですか？`)) return;
  put(r.mats);
  toast(`${String(r.from.date).replace(/-/g,"/")}のカルテと同じ材料を入れました（違えば選び直してください）`);
}

/* ---------- カルテを直すときの 材料／プレゼント／キャンペーン（v129） ----------
   利用者の指摘：**同じメニューでも使う材料が違うことがある。
   だからメニューにレシピを結ぶより、カルテで材料を選んで原価を出すほうがよい。**

   新規カルテのフォームには前から材料の窓があったが、

   お客様が会計するとカルテはSquareから自動でできるので、実際にはこちらが本番。ここに窓を足した。

   作りは新規フォームと同じだが、モーダルの中なので **id を使わず data-ke で引く**。
   同じ id が文書に2つあると querySelector が拾い違えるため。 */
const KEROW={mats :[matRow ,"matrow" ,"mat-p" ,"mat-q" ,"mat-x" ,"材料"      ,"材料"],
             gifts:[giftRow,"giftrow","gift-p","gift-q","gift-x","プレゼント","物販"],
             camps:[campRow,"camprow","camp-p","camp-q","camp-x","キャンペーン","物販"],

function keDraw(box,kind,list){

  box.querySelectorAll("."+xs).forEach(b=>b.onclick=()=>{
    if(box.querySelectorAll("."+cls).length<=1) keDraw(box,kind,[]);
    else b.closest("."+cls).remove();
    keCost(box.closest("[data-kebox]"));
  });
  box.querySelectorAll("select,input").forEach(i=>i.onchange=()=>{
    // 品物を選び直したら、それはもうSquareから来た行ではない（在庫で数え直す側に回す）
    const r=i.closest("."+cls);

/* 直す画面（モーダル）のメニュー欄・オプション欄（v144）。

    const o={pid:r.querySelector("."+ps).value, qty:+r.querySelector("."+qs).value||1};

/* いま選んでいるぶんの原価を、直しながら見えるように出す */
function keCost(root){
  if(!root) return;
  const out=root.querySelector("[data-kecost]"); if(!out) return;
  /* v204：**そのカルテの施術日の月**の原価で出す（欄にある日付を見る） */
  const de=root.querySelector('[data-kf="date"]');

}

/* カルテのメニュー欄・オプション欄を読む（v134／v144で増やせる形に）。
   Raw は**空の欄も残す**（増やすときに、いま出ている欄を保つため） */
const readMenusRaw=()=>[...document.querySelectorAll("#k-menus .kmenu")].map(e=>e.value.trim());
const readOptsRaw =()=>[...document.querySelectorAll("#k-opts .kopt")].map(e=>e.value.trim());
const readMenus=()=>readMenusRaw().filter(Boolean);
const readOpts =()=>readOptsRaw().filter(Boolean);
/* 施術の名前は「メニュー＋オプション」をまとめた1本の文字列にする（v134）。
   ★ここを分けないこと。売上の集計・支払明細・お客様ページ・カルテの見出しは
     ぜんぶ `k.menu` を見ている。3つ・5つに分けたのは**入力のしかた**であって、
     記録の形は今までどおり `k.menu` が正本。内訳は `k.menus` `k.opts` に控える */
const joinMenu=(menus,opts)=>[...(menus||[]),...(opts||[])].filter(Boolean).join("／");
/* いま入っているぶんの金額を出す（メニュー＋オプションの合計） */
function kPriceShow(){
  const pr=document.getElementById("k-price"); if(!pr) return;
  const ms=readMenus(), os=readOpts();
  if(!ms.length&&!os.length){ pr.innerHTML=""; return; }
  const sum=[...ms,...os].reduce((a,n)=>a+menuPrice(n),0);
  const miss=ms.filter(n=>!menuPrice(n));
  pr.innerHTML=`${esc([...ms,...os].join("／"))}　<b style="font-family:var(--mono)">¥${sum?sum.toLocaleString():"—"}</b>`
    +(miss.length?`　<em>メニュー外（そのまま記録します）</em>`:"");
  // お会計の欄は空のままでよい、と分かるように、合計を薄く出しておく（v146）
  const y=document.getElementById("k-yen");
  if(y) y.placeholder=sum?`${sum.toLocaleString()}（メニューから自動）`:"メニューから自動";
}
/* 新規カルテのメニュー欄／オプション欄を描き直す。
   **上限まで来たら「増やす」ボタンを隠す**（押しても増えない、が分からないため） */
function drawMenuRows(list){
  const box=document.getElementById("k-menus"); if(!box) return;
  const v=(list&&list.length?list.slice(0,KMENU_MAX):[""]);
  box.innerHTML=v.map((x,i)=>menuSelect(x,i,i?"k-menu"+(i+1):"k-menu")).join("");
  box.querySelectorAll(".kmenu").forEach(e=>{ e.oninput=kPriceShow; e.onchange=kPriceShow; });
  const b=document.getElementById("k-menu-add");
  if(b) b.style.display=v.length>=KMENU_MAX?"none":"";
  kPriceShow();
}
function drawOptRows(list){
  const box=document.getElementById("k-opts"); if(!box) return;
  const v=(list&&list.length?list.slice(0,KOPT_MAX):[""]);
  box.innerHTML=v.map((x,i)=>optSelect(i+1,x)).join("");
  box.querySelectorAll(".kopt").forEach(e=>e.onchange=kPriceShow);
  const b=document.getElementById("k-opt-add");
  if(b) b.style.display=v.length>=KOPT_MAX?"none":"";
  kPriceShow();
}
/* ---------- 今日のカルテは「1件」（v152） ----------
   利用者の指摘：**「今日のカルテがあるのに、これまでの記録にもすでに 8/29 でできていて、
   今日のカルテを作成したら、これまでの記録に反映されるほうがよい。
   今のままだと、作ったのにすでに記録にあるから混乱する」**

   そのとおりで、v146 では「すでにあります」と**知らせるだけ**だった（開くボタンを出した）。
   知らせても、下の入力欄はまっさらのままなので、そこに書けば2件目ができてしまう。

   **今日の記録がすでにあるなら、入力欄はその記録そのものにする。**
   書いて保存すると「これまでの記録」の今日のぶんが**新しくなる**（増えない）。

   ★ 同じ日に本当に2回来られたときのために「別の記録として新しく作る」も残す（`kNewForce`）。
   ★ 今日の記録が2件以上あるときは Squareのぶんを選ぶ（お会計と結びついている本体なので）。 */
let kNewForce=false;
function todaysChart(cid){
  const t=today();
  const ks=chartsOf(cid).filter(k=>k.date===t);
  if(!ks.length) return null;
  return ks.find(k=>k.src==="square")||ks[0];
}
function bindChartForm(c,k){
  const lookup=kPriceShow;
  drawMenuRows(k?(Array.isArray(k.menus)&&k.menus.length?k.menus
                 :String(k.menu||"").split("／").map(s=>s.trim()).filter(Boolean))
               :(prefill&&prefill.menu?[prefill.menu]:[]));
  drawOptRows(k?(k.opts||[]):[]);
  const mi=document.getElementById("k-menu");
  document.getElementById("k-menu-add").onclick=()=>
    drawMenuRows(readMenusRaw().concat([""]));
  document.getElementById("k-opt-add").onclick=()=>
    drawOptRows(readOptsRaw().concat([""]));
  drawMats(k?k.mats:(prefill&&prefill.mats));
  /* v204：前回と同じ材料を入れる（上の lastMats のおぼえがき参照） */
  const kml=document.getElementById("k-mat-last");
  if(kml) kml.onclick=()=>{
    const g=id=>{const e=document.getElementById(id); return e?e.value.trim():"";};
    lastMatsFill(joinMenu(readMenus(),readOpts()), g("k-date")||today(),
      k?k.id:null, readMats(), ms=>drawMats(ms));
  };
  document.getElementById("k-mat-add").onclick=()=>{
    document.getElementById("k-mats").insertAdjacentHTML("beforeend",matRow("",1));
    drawMats(readMats().concat([{pid:"",qty:1}]));
  };
  drawGifts(k?k.gifts:(prefill&&prefill.gifts));
  document.getElementById("k-gift-add").onclick=()=>{
    document.getElementById("k-gifts").insertAdjacentHTML("beforeend",giftRow("",1));
    drawGifts(readGifts().concat([{pid:"",qty:1}]));
  };
  kPhotos=(k&&Array.isArray(k.photos))?k.photos.slice()
         :((prefill&&Array.isArray(prefill.photos))?prefill.photos.slice():[]);
  drawPhotos();
  /* v198：ビフォー・アフターを一度に選べるよう **まとめて受ける**（multiple）。
     4枚を超えたぶんは黙って捨てず、何枚入って何枚入らなかったかを知らせる */
  const addPhoto=async e=>{
    const fs=[...(e.target.files||[])]; e.target.value="";
    if(!fs.length) return;
    let ok=0, over=0, ng=0;
    for(const f of fs){
      if(kPhotos.length>=KPHOTO_MAX){ over++; continue; }
      try{ kPhotos.push(await shrinkImage(f,640,0.72)); ok++; }
      catch(err){ ng++; }
    }
    drawPhotos();
    toast(`写真を${ok}枚入れました`
      +(over?`（${KPHOTO_MAX}枚までなので ${over}枚は入りません）`:"")
      +(ng?`／${ng}枚は読めませんでした`:""));
  };
  document.getElementById("k-pick").onchange=addPhoto;
  /* v134：端末のカメラ（写真を撮る）はやめて、ドライブの写真から選ぶ */
  document.getElementById("k-drive").onclick=()=>openDrivePicker(d=>{
    if(kPhotos.length>=KPHOTO_MAX){ toast(`写真は${KPHOTO_MAX}枚までです`); return false; }
    kPhotos.push(d); drawPhotos(); return true;
  });
  drawSales(k?k.sales:(prefill&&prefill.sales));
  document.getElementById("k-sale-add").onclick=()=>
    drawSales(readSales().concat([{pid:"",qty:1}]));
  drawCamps(k?k.camps:(prefill&&prefill.camps));
  document.getElementById("k-camp-add").onclick=()=>{
    document.getElementById("k-camps").insertAdjacentHTML("beforeend",campRow("",1));
    drawCamps(readCamps().concat([{pid:"",qty:1}]));
  };
  if(!k&&prefill){
    document.getElementById("k-date").value=prefill.date||today();
    if(prefill.staff) document.getElementById("k-staff").value=prefill.staff;
    if(prefill.menu&&mi) mi.value=prefill.menu;
    prefill=null;
  }
  lookup();
  document.getElementById("k-save").onclick=async()=>{
    const g=id=>document.getElementById(id).value.trim();
    if(!g("k-date")){ toast("施術日を入れてください"); return; }
    const menus=readMenus(), opts=readOpts(), sales=readSales();
    const sum=[...menus,...opts].reduce((a,n)=>a+menuPrice(n),0);
    const typed=g("k-yen");                       // 手で入れたお会計金額。空ならメニューの合計
    const kYen=typed!==""?(+typed||0):sum;
    const now={
      date:g("k-date"), staff:g("k-staff"),
      menu:joinMenu(menus,opts), menus:menus, opts:opts,
      price:kYen||null, disc:(+g("k-disc")||0)||undefined,
      level:g("k-level"), shots:g("k-shots"),
      skin:g("k-skin"), sales:sales,
      wish:g("k-wish"), next:g("k-next"), note:g("k-note"),
      mats:readMats(), gifts:readGifts(), camps:readCamps(),
      photos:kPhotos.slice(),
      /* v226：**手で打ったカルテは、その場で確認ずみ。**
         川口さんが自分の意思で入力したものなので、あとから「済」を押す必要はない。
         Squareから自動でできたカルテを**書き足したとき**も、ここを通る＝確認ずみになる */
      chk:1
    };
    if(k){
      // v152：今日の記録に**書き足す**。増やさない。
      // ★ `sqid` `src` `cash` `ret` `no` はそのまま残す（Squareとの結びつきと、
      //   いくら払ったかの控え。ここを消すと取り込み直しで二重になる）
      Object.assign(k,now);
      k.goods=goodsText(k.goods,sales);
    }else{
      db.charts.push(Object.assign({id:uid(),cid:c.id,parts:draftParts.join("・"),
        goods:goodsText("",sales)},now));
    }
    draftParts=[]; kPhotos=[]; kNewForce=false; karteOpen=false;   // v154：登録で入力は終わり
    markVisited(c.id,g("k-date"));                                 // v204：予約を「来店済み」に
    syncKarteSales(g("k-date"));
    await save(); renderList(); renderDetail();
    toast(k?"今日のカルテを更新しました":"カルテを保存しました");
  };
}

/* ---------- schedule ---------- */
const OPEN=7, CLOSE=21, SRC=["HPB","電話","LINE","直接","その他"];
/* ---------- ★ v220：1時間ぶんの高さ ----------
   携帯は札に「時刻2行＋お名前」が入らないので広げる（カルテッツは約49px）。
   ★ **CSS の --pxh と必ず同じ値にすること。** 札の位置も高さも、
     いまの時刻の赤いバーも、空きをタップしたときの時刻も、ぜんぶこの値で決まる。
     ずれると「押した時刻」と「入る時刻」が食い違う。 */
const PXH_NARROW=64, PXH_WIDE=44;
let PXH=PXH_WIDE;
const schNarrow=()=>!!(window.matchMedia&&window.matchMedia("(max-width:560px)").matches);
function setPXH(){
  PXH=schNarrow()?PXH_NARROW:PXH_WIDE;
  document.documentElement.style.setProperty("--pxh",PXH+"px");
  return PXH;
}
/* 画面を回したり、パソコンの窓を狭めたときに追いつく。
   ★ **入力の途中（apEdit があるとき）は描き直さない。** 打ちかけが消えるため */
let __pxhTimer=null;
window.addEventListener("resize",()=>{
  clearTimeout(__pxhTimer);
  __pxhTimer=setTimeout(()=>{
    if(PXH===(schNarrow()?PXH_NARROW:PXH_WIDE)) return;
    const app=document.getElementById("app");
    if(!app||app.dataset.tab!=="sched"||apEdit) return;
    renderSched();
  },200);
});
const DOW="日月火水木金土";
/* スタッフ別の色。[再来, 新規] の2段階 */
const COL={"川口香子":["#A5211F","#E07AA8"],"水野奈津子":["#2E6E8E","#5FA3C4"],"その他":["#6E5A8C","#9C86BC"]};
/* 休み・私用は担当の色ではなく灰色にする（お客様の予約と一目で分ける。v122） */
const OFFCOL="#B9B4AC";
const colOf=a=>a&&a.off?OFFCOL:(COL[a.staff]||COL["その他"])[isNew(a)?1:0];
let schDate=today(), schView="week", apEdit=null, prefill=null;

const nowStamp=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`};
const toMin=s=>{const[h,m]=String(s).split(":").map(Number);return h*60+(m||0)};
const toHM=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
const D=s=>new Date(s+"T00:00:00");
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const shiftDay=(s,n)=>{const t=D(s);t.setDate(t.getDate()+n);return iso(t)};
const weekStart=s=>shiftDay(s,-D(s).getDay());
const apptsOf=d=>db.appts.filter(a=>a.date===d).sort((a,b)=>(a.start||"").localeCompare(b.start||""));
const isNew=a=>a.kind==="新規";
const md=s=>{const d=D(s);return `${d.getMonth()+1}/${d.getDate()}`};

function nextAppt(cid){
  const up=db.appts.filter(a=>isBooking(a)&&a.cid===cid&&a.date>=today())
                   .sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start))[0];
  return up?`<div class="next">次回 ${up.date.replace(/-/g,"/")} ${up.start}　${esc(up.menu||"")}</div>`:"";
}

/* 重なった予約を横に並べるためのレーン計算 */
function lanes(list){
  const it=list.map(a=>({a,st:toMin(a.start),en:toMin(a.start)+(a.dur||60)}))
               .sort((x,y)=>x.st-y.st||y.en-x.en);
  const groups=[]; let g=[], end=-1;
  it.forEach(x=>{ if(g.length&&x.st>=end){groups.push(g);g=[];end=-1;} g.push(x); end=Math.max(end,x.en); });
  if(g.length) groups.push(g);
  groups.forEach(gr=>{
    const tail=[];
    gr.forEach(x=>{ let i=0; while(tail[i]!==undefined&&tail[i]>x.st) i++; tail[i]=x.en; x.lane=i; });
    gr.forEach(x=>x.n=tail.length);
  });
  return it;
}

function legendHtml(hint){
  /* v226：今日メールから取り込んだ予約の件数。
     ★ **取消は枠が付かない**（`evHtml` の `fresh` が `!off` を見ている）ので数えない。
     ★ 取り込むのは先の予約が多いので、**いま見ている週の外**のぶんも入る。
       画面の枠の数と合わないことがあるため、そう書いてある */
  const impN=(db.appts||[]).filter(a=>a.imp===today()&&a.status!=="cancel"&&!a.off).length;
  return `<div class="legend">${STAFF.map(s=>
    `<span><i style="background:${COL[s][0]}"></i><i style="background:${COL[s][1]}"></i>${esc(s)}</span>`).join("")}
    <span>薄いほうが新規</span>
    <span><i style="background:#F2A2C6"></i>終日（休暇など）</span>
    <span><i class="ring"></i>${impN?`今日取り込んだ予約 ${impN}件（先の週のぶんも含む）`:"今日取り込んだ予約"}</span>
    <span>「済」＝カルテ確認ずみ</span>
    <span>${hint}</span></div>`;
}

function evHtml(x){
  const a=x.a, w=100/x.n, L=x.lane*w;
  const off=a.status==="cancel";
  const top=(x.st-OPEN*60)/60*PXH, h=Math.max(20,(x.en-x.st)/60*PXH-2);
  /* ★ v220：携帯では担当者の括弧書きを出さない。**札の色で分かる**（凡例つき）。
     入れているとお名前が「済 ◯◯◯◯（川…」と切れて、いちばん要るものが読めない */
  const who=(!schNarrow()&&a.staff&&a.staff!=="その他")?`（${esc(a.staff)}）`:"";
  /* ★ v220：携帯は空白を詰める。「09:30 - 10:30」は空白のところで切れて3行になり、
     40px しかない列にお名前のぶんが残らなかった。詰めると「09:30-」「10:30」の2行 */
  const tm=schNarrow()?`${a.start}-${toHM(x.en)}`:`${a.start} - ${toHM(x.en)}`;
  /* v204：札の見た目（大きさ・色・並び）はそのまま、**頭の2文字だけ**を変える。
     これまで「キャンセル」と「無断キャンセル」がどちらも灰色の「取消」で、
     ドタキャンされた予定かどうかがカレンダーから分からなかった。
     「来店済み」も「予約完了」と見た目が同じで、施術が終わった枠かどうかも分からなかった。
     ★ ステータスは STAT の4つだけ。ここは文字を差し替えているだけで、
       欄も色も増やしていない */
  const st=statOf(a);
  /* ★ v226：「済」は **カルテを確認したかどうか**（`apDone`）で出す。
     v204〜v225 は `stat==="来店済み"` で出していたが、Squareの取り込みが
     自動でそれを付けるので、**川口さんが何もしていない枠にも「済」が出ていた**。 */
  const mark=off?(st==="無断キャンセル"?"無断 ":"取消 ")
            :(apDone(a)?"済 ":"");
  /* ★ v226：**今日メールから取り込んだ予約に枠を付ける**（利用者の指示）。
     「取り込みました」と出ても誰のことか分からず、メールを見に行くしかなかった。
     `a.imp` は取り込んだ日。**当日しか光らない**ので、消す手入れは要らない */
  const fresh=!off&&a.imp===today();
  return `<div class="ev${off?" cx":""}${fresh?" imp":""}" data-id="${a.id}"
    style="top:${top}px;height:${h}px;left:${L}%;width:calc(${w}% - 3px);background:${off?"#B9BDB6":colOf(a)}">
    <span class="t">${tm}</span>
    <span class="n">${mark}${isNew(a)&&!off?"新":""}${esc(a.name)}${who}</span></div>`;
}

function dayCols(days){
  return days.map(d=>{
    const now=d===today()?" now":"";
    const timed=apptsOf(d).filter(a=>!a.allday);
    const grid=Array.from({length:CLOSE-OPEN},()=>`<div class="hr"></div>`).join("");
    return `<div class="cday${now}" data-d="${d}">${grid}${lanes(timed).map(evHtml).join("")}</div>`;
  }).join("");
}

        <button data-v="month" aria-pressed="${schView==="month"}">月</button>
        <button data-v="week"  aria-pressed="${schView==="week"}">週</button>
        <button data-v="day"   aria-pressed="${schView==="day"}">日</button>
      </span></div>`;

  if(schView==="month"){
    const d=D(schDate), first=new Date(d.getFullYear(),d.getMonth(),1);
    const start=shiftDay(iso(first),-first.getDay());
    let cells="";
    for(let i=0;i<42;i++){
      const day=shiftDay(start,i), dd=D(day);
      const out=dd.getMonth()!==d.getMonth()?" out":"", now=day===today()?" now":"";
      const items=apptsOf(day).slice(0,4).map(a=>
        `<span class="mi" style="background:${a.allday?"#F2A2C6":colOf(a)};${a.allday?"color:#54203D":""}"
          >${a.allday?"":a.start+" "}${esc(a.name)}</span>`).join("");
      cells+=`<div class="mc${out}${now}" data-d="${day}"><span class="d">${dd.getDate()}</span>${items}
        ${apptsOf(day).length>4?`<span class="d">ほか${apptsOf(day).length-4}件</span>`:""}</div>`;
    }
    el.innerHTML=bar(`${d.getFullYear()}年${d.getMonth()+1}月`)+
      `<div class="mo">${[...DOW].map(w=>`<div class="mh">${w}</div>`).join("")}${cells}</div>`+
      legendHtml("日付をタップすると予定を追加できます")+`<div data-apf="1"></div>`;
    el.querySelectorAll(".mc").forEach(c=>c.onclick=()=>{schDate=c.dataset.d;schView="day";apEdit=null;renderSched()});
  }else{
    const days = schView==="week"
      ? Array.from({length:7},(_,i)=>shiftDay(weekStart(schDate),i))
      : [schDate];
    const t0=D(days[0]), t1=D(days[days.length-1]);
    const title = schView==="week"
      ? `${t0.getFullYear()}年${t0.getMonth()+1}月${t0.getDate()}日 – ${t1.getMonth()+1}月${t1.getDate()}日`
      : `${t0.getFullYear()}年${t0.getMonth()+1}月${t0.getDate()}日（${DOW[t0.getDay()]}）`;

    const heads=days.map(d=>{
      const w=D(d).getDay();
      /* ★ v220：携帯は2段（9/10 ／ 木）。1行だと隣の日とくっついて読めなかった */
      const lbl=schNarrow()?`<b>${md(d)}</b><i>${DOW[w]}</i>`:`${md(d)}(${DOW[w]})`;
      return `<div class="cday chead${w===0?" sun":w===6?" sat":""}${d===today()?" now":""}">${lbl}</div>`;
    }).join("");
    const allday=days.map(d=>{
      const off=apptsOf(d).filter(a=>a.allday)
        .map(a=>`<div class="off" data-id="${a.id}">${esc(a.name)}</div>`).join("");
      return `<div class="cday${d===today()?" now":""}" data-d="${d}" data-all="1">${off}</div>`;
    }).join("");
    const hours=Array.from({length:CLOSE-OPEN},(_,i)=>`<div class="hr"><span>${OPEN+i}時</span></div>`).join("");

    el.innerHTML=bar(title)+`
      <div class="cw">
        <div class="crow"><div class="cax"></div>${heads}</div>
        <div class="allday"><div class="cax">終日</div>${allday}</div>
        <div class="cbody"><div class="cax">${hours}</div>${dayCols(days)}</div>
      </div>
      ${legendHtml("空いているところをタップすると予定を追加できます")}
      <div data-apf="1"></div>`;

    const body=el.querySelector(".cbody");

    /* いまの時刻を赤いバーで示す（30秒ごとに動かす） */
    const drawNow=()=>{
      const host=document.getElementById("sched");
      if(!host||!host.querySelector(".cbody")) return false;
      host.querySelectorAll(".nowline,.nowtime").forEach(x=>x.remove());
      const n=new Date(), min=n.getHours()*60+n.getMinutes();
      if(min<OPEN*60||min>CLOSE*60) return true;
      const top=(min-OPEN*60)/60*PXH;
      const col=host.querySelector(".cbody .cday.now");
      if(col){ const d=document.createElement("div"); d.className="nowline";
        d.style.top=top+"px"; col.appendChild(d); }
      const ax=host.querySelector(".cbody .cax");
      if(ax){ const t=document.createElement("div"); t.className="nowtime";
        t.style.top=top+"px"; t.textContent=toHM(min); ax.appendChild(t); }
      return true;
    };
    drawNow();
    clearInterval(window.__nowTimer);
    window.__nowTimer=setInterval(()=>{ if(!drawNow()) clearInterval(window.__nowTimer); },30000);

    /* 今日が見えている週は、いまの時刻あたりまでスクロールしておく */
    if(days.includes(today())){
      const n=new Date(), min=n.getHours()*60+n.getMinutes();
      body.scrollTop=Math.max(0,(min-OPEN*60)/60*PXH-120);
    }

    const sb=body.offsetWidth-body.clientWidth;
    if(sb>0){
      el.querySelector(".crow").style.paddingRight=sb+"px";
      el.querySelector(".allday").style.paddingRight=sb+"px";
    }

    /* v196：click ではなく tapOn（pointerup）。iPad でも反応させるため。
       予約の札（.ev）の上は enableDrag が受け持つので、ここでは何もしない */
    el.querySelectorAll(".cbody .cday").forEach(col=>tapOn(col,e=>{
      if(e.target.closest(".ev")) return;
      const y=e.clientY-col.getBoundingClientRect().top;
      const min=Math.round((OPEN*60+y/PXH*60)/15)*15;
      openAp({date:col.dataset.d,start:toHM(Math.min(min,CLOSE*60-60))});
    }));
    el.querySelectorAll(".allday .cday").forEach(col=>tapOn(col,e=>{
      if(e.target.closest(".off")) return;
      openAp({date:col.dataset.d,allday:true,off:"day",name:OFFLBL("day"),kind:"再来"});
    }));
  }

  el.querySelectorAll(".off,.mi").forEach(b=>b.onclick=ev=>{
    ev.stopPropagation();
    const a=db.appts.find(x=>x.id===b.dataset.id); if(a) openAp(a);
  });
  if(schView!=="month") enableDrag(el,
    schView==="week"?Array.from({length:7},(_,i)=>shiftDay(weekStart(schDate),i)):[schDate]);
  const step=schView==="month"?"m":schView==="week"?7:1;
  const move=n=>{
    if(step==="m"){const d=D(schDate);d.setMonth(d.getMonth()+n);schDate=iso(d);}
    else schDate=shiftDay(schDate,step*n);
    apEdit=null; renderSched();
  };
  document.getElementById("prev").onclick=()=>move(-1);
  document.getElementById("next").onclick=()=>move(1);
  document.getElementById("tdy").onclick=()=>{schDate=today();apEdit=null;renderSched()};
  document.getElementById("ap-new").onclick=()=>{
    openApModal({id:null,cid:null,name:"",date:schDate,start:"10:00",dur:60,
      staff:STAFF[0],menu:"",src:"直接",kind:"再来",allday:false,note:"",off:""});
    apEditMode=true;
    document.getElementById("mo-form").innerHTML='<div data-apf="1"></div>';
    drawApForm();
  };
  el.querySelectorAll(".grp button").forEach(b=>b.onclick=()=>{schView=b.dataset.v;apEdit=null;renderSched()});
  if(apEdit) drawApForm();
}

function openAp(a){
  apEdit=Object.assign({id:null,cid:null,name:"",date:schDate,start:"10:00",dur:60,
    staff:STAFF[0],menu:"",src:"HPB",kind:"再来",allday:false,note:"",off:""},a||{});
  drawApForm();
  /* v196：入力欄はカレンダーの**下**に出る。iPad は画面が狭くて表の下まで見えないので、
     タップしたのに何も起きていないように見えていた。開いたら見えるところまで送る */
  const box=apfBox();                                    /* v206 */
  if(box&&typeof box.scrollIntoView==="function")
    requestAnimationFrame(()=>box.scrollIntoView({behavior:"smooth",block:"center"}));
}

/* ---------- 予定の種類（v122） ----------
   お客様の予約のほかに、休みや自分の用事を入れられるようにした。
   `a.off` が空でないものは **予約として数えない**（件数・見込み・リマインド・来店ペース）。

   ★ 「午後休み」は終日ではないので、`allday` だけで弾いていた今までの作りだと
     予約として数えられてしまう。だから `isBooking()` を1か所にまとめて、そこを通す。 */
const OFFKINDS=[["","お客様の予約"],["day","一日休み"],["am","午前休み"],
                ["pm","午後休み"],["private","予定あり（プライベート）"]];
const OFFLBL=k=>(OFFKINDS.find(x=>x[0]===k)||["",""])[1];
/* その予定の既定の時間帯 */
const OFFTIME={am:{start:"09:00",dur:240},pm:{start:"13:00",dur:360},private:{start:"12:00",dur:60}};
/* お客様の予約として数えるか。**集計はすべてこれを通すこと** */
const isBooking=a=>!!a&&!a.allday&&!a.off&&a.status!=="cancel";

/* 「一覧にない（直接入力）」を表す印。ふつうのメニュー名とぶつからない文字にしてある */
const MENUFREE="　一覧にない　";

/* ---------- 予定の入力欄をどこに出すか（v206で直した） ----------
   ★★ **`id="apf"` が画面に2つ出ていた。** ★★
     カレンダーの下（`renderSched`）と、予約詳細のモーダルの中（`mo-form`）の両方。
     `getElementById` は**文書の先に見つかったほう**を返すので、
     モーダルは body のいちばん後ろに足されるぶん**必ずカレンダー側が当たっていた**。
     その結果：
       ・予約詳細 →「編集」を押しても、**入力欄はモーダルの中に出ない**
       ・「予約を追加」を押しても、**入力欄はモーダルの中に出ない**
     （どちらもモーダルの下敷きになって見えないので、「押しても何も起きない」に見える）
     v200 で直したカルテの保存と**まったく同じ地雷**。総当たりの操作で見つけた。

   直しかた：このファイルの元からの決まりどおり **id をやめて `data-apf` で引く**。
   **モーダルが開いていればモーダルの中**、開いていなければカレンダーの下。 */
function apfBox(){
  return document.querySelector("#apmodal [data-apf]")
      || document.querySelector("#sched [data-apf]")
      || document.querySelector("[data-apf]");
}
function drawApForm(){
  const a=apEdit, box=apfBox();
  if(!box) return;
  /* ★ v206：**入れものは画面に1つだけにする。**
     カレンダーの空きをタップして入力欄を出したあと、予約の札を押して
     「編集」を押すと、**カレンダー側の入力欄が残ったまま**モーダルにも出て、
     `a-save` などの id が二重になっていた。
     このあとの結びつけは `document.getElementById` で引くので、
     二重だとモーダルの「予定を保存」に**手が付かない**（押しても何も起きない）。
     いま出すほう以外は、ここで空にする。
     ★ `apEdit` は1つしかないので、入力欄も1つでよい */
  document.querySelectorAll("[data-apf]").forEach(x=>{ if(x!==box) x.innerHTML=""; });
  box.innerHTML=`<div class="sheet" style="margin-top:16px">
    <div class="divider" style="margin-top:0"><h2>${a.id?"予定を編集":"予定を追加"}</h2></div>
    <div class="grid">
      <div style="grid-column:1/-1"><label class="f" for="a-off">予定の種類</label>
        <select class="f-in" id="a-off">
          ${OFFKINDS.map(([k,l])=>`<option value="${k}"${k===(a.off||"")?" selected":""}>${l}</option>`).join("")}
        </select>
        ${a.off?`<span class="note">お客様の予約ではないので、<b>来店者数にも売上の見込みにも数えません</b>。</span>`:""}</div>
      <div style="grid-column:1/-1${a.off?";display:none":""}"><label class="f" for="a-name">お客様・件名</label>
        <input class="f-in" id="a-name" autocomplete="off" value="${esc(a.name)}"
          placeholder="1文字入れると名簿から候補が出ます／新規のお客様や休暇は直接入力">
        <div class="pickbox" id="a-namehits" style="display:none"></div>
        <span class="note">お名前・ふりがな・電話のどれでも探せます。
          <b>名簿にいない方は、そのまま打てば新規として保存できます。</b></span></div>
      <div><label class="f" for="a-date">日付</label><input class="f-in" id="a-date" type="date" value="${a.date}"></div>
      <div style="${a.off?"display:none":""}"><label class="f" for="a-kind">区分</label><select class="f-in" id="a-kind">
        ${["再来","新規"].map(k=>`<option${k===a.kind?" selected":""}>${k}</option>`).join("")}</select></div>
      <div><label class="f" for="a-staff">担当</label>
        <div style="display:flex;gap:7px;align-items:center">
          <span id="a-chip" style="width:15px;height:15px;border-radius:4px;flex:none;background:${colOf(a)}"></span>
          <select class="f-in" id="a-staff">${STAFF.map(s=>`<option${s===a.staff?" selected":""}>${s}</option>`).join("")}</select>
        </div></div>
      <div style="${a.off?"display:none":""}"><label class="f" for="a-src">予約経路</label><select class="f-in" id="a-src">
        ${SRC.map(s=>`<option${s===a.src?" selected":""}>${s}</option>`).join("")}</select></div>
      <div><label class="f" for="a-start">開始</label><input class="f-in" id="a-start" type="time" step="900" value="${a.start}" ${a.allday?"disabled":""}></div>
      <div><label class="f" for="a-dur">所要（分）</label><input class="f-in" id="a-dur" type="number" min="15" step="15" value="${a.dur}" ${a.allday?"disabled":""}></div>
      <div style="grid-column:1/-1${a.off?";display:none":""}"><label class="f" for="a-mcat">メニュー</label>
        <select class="f-in" id="a-mcat" style="margin-bottom:6px"></select>
        <select class="f-in" id="a-menu"></select>
        <input class="f-in" id="a-menufree" style="margin-top:6px;display:none"
          placeholder="一覧にないメニューを直接入力" value="">
        <span class="note"><b>まずカテゴリを選び、その中から選びます。</b>
          一覧にないときは、いちばん下の「一覧にない（直接入力）」を選ぶと打ち込めます。<br>
          来店して急に変わったときは、ここを選び直して保存してください。
          <b>直した欄は、次のホットペッパーのメール取り込みで上書きしません。</b></span></div>
      <div style="grid-column:1/-1"><label class="f" for="a-note">メモ</label><input class="f-in" id="a-note" value="${esc(a.note)}"></div>
      <div style="grid-column:1/-1"><label style="font-size:13px;color:var(--ink2);cursor:pointer">
        <input type="checkbox" id="a-all" ${a.allday?"checked":""}> 終日の予定にする（休暇日など）</label>
        ${a.status==="cancel"?`<label style="font-size:13px;color:var(--alert);cursor:pointer;display:block;margin-top:6px">
          <input type="checkbox" id="a-cx" checked> 取消ずみ（チェックを外すと復活します）</label>`:""}</div>
    </div>
    <div class="actions">
      <button class="btn" id="a-save">予定を保存</button>
      ${a.id&&!a.allday?`<button class="btn ghost" id="a-karte">この予定でカルテを書く</button>`:""}
      ${a.id?`<button class="btn danger" id="a-del">削除</button>`:""}
      <button class="btn quiet" id="a-cancel">やめる</button>
    </div></div>`;
  if(box&&typeof box.scrollIntoView==="function") box.scrollIntoView({behavior:"smooth",block:"nearest"});   /* v206 */

  /* いま画面に入っている値を拾う（描き直す前に消えないように） */
  const readApForm=()=>{
    const g=id=>{const e=document.getElementById(id); return e?e.value:"";};
    return {name:g("a-name"), date:g("a-date"), start:g("a-start"),
            dur:+g("a-dur")||60, staff:g("a-staff"), kind:g("a-kind"),
            menu:apMenuValue(), src:g("a-src"), note:g("a-note")};   // v202
  };
  document.getElementById("a-off").onchange=e=>{
    const k=e.target.value;
    apEdit=Object.assign({},apEdit,readApForm(),{off:k});
    if(k){
      // 種類を選んだら、件名と時間帯を既定で埋める（あとから直せる）
      const lbl=OFFLBL(k);
      if(!apEdit.name||OFFKINDS.some(x=>x[1]===apEdit.name)) apEdit.name=lbl;
      apEdit.allday=(k==="day");
      const t=OFFTIME[k];
      if(t){ apEdit.start=t.start; apEdit.dur=t.dur; }
      apEdit.menu=""; apEdit.src="直接";
    }else if(OFFKINDS.some(x=>x[1]===apEdit.name)){ apEdit.name=""; apEdit.allday=false; }
    drawApForm();
  };
  const dur=document.getElementById("a-dur"), st=document.getElementById("a-start");
  /* ---------- ★ v218：先に入れた所要（分）が 60 分に戻る ----------
     利用者の指摘：**「スケジュールを手で入力するとき、最初に時間を120分入れて
     メニューなどを入れて保存すると、時間が60分に戻ってしまう。
     入力順を最後に時間にすると、その時間が反映される」**

     メニューを選ぶと `dur.value` を**そのメニューの目安の分数で必ず塗りつぶしていた**。
     だから「時間 → メニュー」の順だと、打った120分がメニューの60分に置きかわり、
     そのまま保存されていた（「メニュー → 時間」だと塗りつぶしのあとに打つので残る）。

     ★ **人が手で打った分数のほうを優先する。** 打った時点で `apEdit.durLock` に印を付け、
       印があるあいだはメニューを選んでも上書きしない。
       ・空にすると印は外れる（またメニューの目安が入るようになる）
       ・目安と違うときだけ、なぜ変わらなかったのかを一言出す
       ・`apEdit` は 予定の種類（a-off）を変えて描き直しても引き継がれるので印も残る
       ・`durLock` は保存する `o` には入らない（保存は欄から作り直すため） */
  if(dur) dur.oninput=dur.onchange=()=>{
    if(apEdit) apEdit.durLock=String(dur.value).trim()?1:0;
  };
  const chip=()=>document.getElementById("a-chip").style.background=
    colOf({staff:document.getElementById("a-staff").value, kind:document.getElementById("a-kind").value});
  document.getElementById("a-staff").onchange=chip;
  document.getElementById("a-kind").onchange=chip;
  document.getElementById("a-all").onchange=e=>{ st.disabled=dur.disabled=e.target.checked; };
  /* ---------- メニューはカテゴリから選ぶ（v202） ----------
     利用者の指示：**「メニューを選ぶときカテゴリーから選択していきたいから修正して」**

     打ち込み欄＋`<datalist>` だった。パソコンなら打つと候補が出るが、
     **iPad の Safari は候補をキーボードの上に小さく出すだけ**なので指では拾えない
     （カルテのメニューを v198 で `<select>` にしたのと同じ落とし穴）。
     メニューは95件あって1枚のプルダウンでは長いので、**カテゴリ → メニュー**の2段にする。

     ★ いま入っている名前が一覧に無いとき（ホットペッパーのメールから来た
       「◯◯／△△」のような組み合わせなど）は**消さない。**
       そのままの文字を末尾に足して選択済みにする。
     ★ どうしても一覧に無いものを入れたいときのために
       「一覧にない（直接入力）」を残してある。選ぶと下に打ち込み欄が出る。 */
  const mcat=document.getElementById("a-mcat"), msel=document.getElementById("a-menu"),
        mfree=document.getElementById("a-menufree");
  /* いまメニュー欄が指している値。直接入力に切りかえているときはそちらを読む */
  window.apMenuValue=()=>{
    if(!msel) return "";
    return msel.value===MENUFREE ? String(mfree?mfree.value:"").trim() : msel.value;
  };
  if(mcat&&msel){
    const all=MENUS().filter(m=>m.n);
    const cur=String(a.menu||"").trim();
    const hit=all.find(m=>MNORM(m.n)===MNORM(cur));
    const cats=[...new Set(all.map(m=>String(m.cat||"").trim()||"その他"))];
    const drawCat=()=>{
      mcat.innerHTML=`<option value="">（すべてのカテゴリ）</option>`
        +cats.map(c=>`<option value="${esc(c)}"${
          hit&&(String(hit.cat||"").trim()||"その他")===c?" selected":""}>${esc(c)}</option>`).join("");
    };
    const drawMenu=(keep)=>{
      const c=mcat.value;
      const list=c?all.filter(m=>(String(m.cat||"").trim()||"その他")===c):all;
      const v=keep===undefined?cur:keep;
      const inList=list.some(m=>MNORM(m.n)===MNORM(v));
      msel.innerHTML=`<option value="">（選んでください）</option>`
        +list.map(m=>`<option value="${esc(m.n)}"${MNORM(m.n)===MNORM(v)?" selected":""}>${esc(m.n)}${
          m.p?`　¥${m.p.toLocaleString()}`:""}</option>`).join("")
        +(v&&!inList?`<option value="${esc(v)}" selected>${esc(v)}（いま入っているもの）</option>`:"")
        +`<option value="${MENUFREE}">一覧にない（直接入力）</option>`;
      if(mfree) mfree.style.display="none";
    };
    drawCat(); drawMenu();
    mcat.onchange=()=>drawMenu("");
    msel.onchange=()=>{
      if(msel.value===MENUFREE){
        if(mfree){ mfree.style.display=""; mfree.focus(); }
        return;
      }
      if(mfree) mfree.style.display="none";
      const m=MENUS().find(x=>MNORM(x.n)===MNORM(msel.value));
      if(m&&dur){
        const std=m.min||guessDur(m.n);                 /* そのメニューの目安 */
        if(apEdit&&apEdit.durLock&&String(dur.value).trim()){
          /* ★ v218：手で入れた分数は消さない（上の durLock の説明を見ること） */
          if(+dur.value!==std)
            toast("所要は手で入れた"+(+dur.value)+"分のままにしました（このメニューの目安は"+std+"分）");
        }else dur.value=std;
      }
    };
  }

  /* ---------- お客様は1文字で絞り込む（v202） ----------
     利用者の指示：**「スケジュールから名前、メニューを手入力する場合、
     一文字入れたら候補を絞って選択できるようにしてほしい」**

     ここも `<datalist>` だった。**名簿は283名**あるので、iPad で候補が出ないと
     全部打つしかない。自前で一覧を出す。
     ・**1文字から**出る（お名前・ふりがな・電話のどれでも当たる）
     ・多いときは12件まで。押すと欄に入って、区分（新規／再来）も自動で決まる
     ・**打ちっぱなしでも保存できる**（名簿にいない新規のお客様・休暇の件名） */
  const nin=document.getElementById("a-name"), nbox=document.getElementById("a-namehits");
  const nameKind=()=>{
    const c=findCustByName(nin.value);                    /* v204 */
    const ki=document.getElementById("a-kind");
    if(ki) ki.value=(c&&chartsOf(c.id).length)?"再来":"新規";
    chip();
  };
  if(nin&&nbox){
    const hide=()=>{ nbox.style.display="none"; nbox.innerHTML=""; };
    const show=()=>{
      const q=KNORM(nin.value);
      if(!q){ hide(); return; }
      const num=q.replace(/[^0-9]/g,"");
      const hits=db.customers.filter(c=>
        KNORM(c.name).includes(q)||KNORM(c.kana||"").includes(q)
        ||(num.length>=3&&String(c.tel||"").replace(/[^0-9]/g,"").includes(num)))
        /* 頭から一致した人を先に出す。「さ」で「◯◯◯◯（お客様のお名前）」が
           先頭に来ると探しているものが見つけにくい */
        .sort((x,y)=>{
          const h=c=>(KNORM(c.name).startsWith(q)||KNORM(c.kana||"").startsWith(q))?0:1;
          return h(x)-h(y)||x.name.localeCompare(y.name,"ja");
        });
      if(!hits.length){
        nbox.innerHTML=`<div class="none">名簿に見あたりません。<b>このまま保存すれば新規のお客様になります。</b></div>`;
        nbox.style.display=""; return;
      }
      nbox.innerHTML=hits.slice(0,12).map(c=>{
        const n=chartsOf(c.id).length;
        return `<button type="button" data-pick="${esc(c.id)}">${esc(c.name)}
          <small>${[c.kana||"",c.tel||"",n?`カルテ${n}件`:"はじめて"].filter(Boolean).join("　")}</small></button>`;
      }).join("")+(hits.length>12?`<div class="none">ほか ${hits.length-12}名。もう少し打つと絞れます</div>`:"");
      nbox.style.display="";
      nbox.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{
        const c=db.customers.find(x=>x.id===b.dataset.pick);
        if(c){ nin.value=c.name; nameKind(); }
        hide();
      });
    };
    nin.oninput=show;
    nin.onfocus=show;
    nin.onchange=nameKind;
    /* 欄の外を押したら閉じる。候補そのものを押したときは onclick が先に走る */
    nin.onblur=()=>setTimeout(hide,180);
  }
  document.getElementById("a-save").onclick=async()=>{
    const g=id=>document.getElementById(id).value.trim();
    if(!g("a-name")){ toast("お客様のお名前または件名を入れてください"); return; }
    const all=document.getElementById("a-all").checked;
    /* v204：「取消ずみ（チェックを外すと復活します）」は**画面にあるだけで
       一度も読まれていなかった。** 外して保存しても取消のままだった */
    const cx=document.getElementById("a-cx");
    const hit=findCustByName(g("a-name"));                /* v204 */
    const o={id:a.id||uid(), cid:hit?hit.id:null, name:g("a-name"), date:g("a-date"),
             start:all?"":g("a-start"), dur:all?0:(+g("a-dur")||60), staff:g("a-staff"),
             kind:g("a-kind"), menu:apMenuValue(), src:g("a-src"), note:g("a-note"), allday:all,   // v202
             off:g("a-off")};
    const was=a.id?db.appts.find(x=>x.id===a.id):null;
    if(was){
      /* v158：ホットペッパーの控え（メールと結びつける番号・金額・カナ・取消の状態）を**残す**。
         これまでは丸ごと置きかえていたので、直すたびに resNo と mailId が消え、
         取消ずみの印まで外れていた */
      ["mailId","resNo","price","kana","hpbNew","stat","status"].forEach(f=>{
        if(o[f]===undefined&&was[f]!==undefined) o[f]=was[f];
      });
      /* ★ 人が変えた欄に印を付ける。次のメール取り込みで上書きしないため（applyMail 参照） */
      const ed=Object.assign({},was.edited);
      ["menu","staff","dur","start","date","kind","note"].forEach(f=>{
        if(String(o[f]==null?"":o[f])!==String(was[f]==null?"":was[f])) ed[f]=1;
      });
      /* v204：取消のチェックを読む。**先に書いておく**（下の引き継ぎの輪は
         `undefined` のときしか埋めないので、ここで入れたものは残る） */
      if(cx){
        o.status=cx.checked?"cancel":"";
        o.stat=cx.checked?(/キャンセル/.test(was.stat||"")?was.stat:"キャンセル"):"予約完了";
        ed.stat=1;
      }
      if(Object.keys(ed).length) o.edited=ed;
      db.appts[db.appts.findIndex(x=>x.id===a.id)]=Object.assign({created:a.created},o);
    }
    else db.appts.push(Object.assign({created:nowStamp()},o));
    schDate=o.date; apEdit=null;
    await save(); renderSched(); toast("保存しました");
  };
  document.getElementById("a-cancel").onclick=()=>{apEdit=null;renderSched()};
  if(a.id){
    document.getElementById("a-del").onclick=async()=>{
      if(!confirm("この予定を削除します。よろしいですか？"))return;
      db.appts=db.appts.filter(x=>x.id!==a.id); apEdit=null;
      await save(); renderSched(); toast("削除しました");
    };
    const kb=document.getElementById("a-karte");
    if(kb) kb.onclick=()=>{
      const c=db.customers.find(x=>x.id===a.cid)||findCustByName(a.name);   /* v204 */
      if(!c){ toast("このお客様がまだ名簿にいません。先に登録してください"); return; }
      prefill={date:a.date,staff:a.staff,menu:a.menu};
      karteOpen=true; kNewForce=false;             // v154
      sel=c.id; editing=false; apEdit=null;
      setTab("list"); document.getElementById("app").dataset.view="detail";
      renderList(); renderDetail();
    };
  }
}
function guessDur(name){
  const m=name.match(/(\d{2,3})\s*(分|min)/); if(m) return +m[1];
  for(const n of [150,120,90,70,60]) if(name.includes(String(n))) return n;
  return 60;
}

function renderHome(){

同じ方なら、新しく作らずに**その方にSquareを結びつけます**（おすすめ）。

　　［OK］　　　同じ方。結びつける
　　［キャンセル］別の方。新しく足す`);
      if(same){
        if(!dupC.sqid) dupC.sqid=x.sqid;
        else if(dupC.sqid!==x.sqid) dupC.sqids=[...new Set([...(dupC.sqids||[]),x.sqid])];

                :`${dupC.name}さんに結びつけました（取り込みは電波が戻ってからになります）`);
        return;
      }
    }
    if(!confirm(`${x.name}さんを名簿に追加します。
`
      +`Squareのお支払い（${String(x.last).replace(/-/g,"/")}　${yen(x.yen)}）が、
`
      +`この方の「これまでの記録」に入ります。よろしいですか？`)) return;
    db.customers.push({id:uid(),sqid:x.sqid,name:x.name,kana:"",tel:x.tel||"",
      birth:x.birth||"",first:"",tags:"",addr:x.addr||"",caution:"",memo:""});
    await save();
    b.disabled=true; b.textContent="取り込んでいます…";
    const r=await doSquareSync(m);
    renderList(); renderHome();
    toast(r?`${x.name}さんを名簿に追加しました（お買い上げがこれまでの記録に入りました）`
           :`${x.name}さんを名簿に追加しました（取り込みは電波が戻ってからになります）`);
  });
  const hCust=document.getElementById("h-cust");
  if(hCust) hCust.onclick=()=>{ setTab("sync"); setSyncPage("cust"); };
  const hProd=document.getElementById("h-prod");
  if(hProd) hProd.onclick=()=>{ setTab("sync"); setSyncPage("prod"); };
  el.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>setTab(b.dataset.go));
  el.querySelectorAll("[data-ht]").forEach(b=>b.onclick=()=>{
    // v117：水野さんの明細は「会計タブの中の1ページ」なので、タイルからは直行させる。
    // 川口さんが自分で入れる場所なので、会計の入口を経由させない

    setTab(b.dataset.ht);

const qNorm=s=>(s||"").replace(/[\s　]/g,"");
function importQuartets(){
  let cNew=0,cUpd=0,line=0,kNew=0,kDup=0;
  // 顧客
  const byName={}, byTel={};
  db.customers.forEach(c=>{ byName[qNorm(c.name)]=c; if(tel10(c.tel)) byTel[tel10(c.tel)]=c; });
  const byQ={};
  QC.forEach(([code,name,kana,tel,line0])=>{
    let c=byName[qNorm(name)]||(tel?byTel[tel]:null);
    if(!c){
      c={id:uid(),name,kana,tel,birth:"",first:"",tags:"",addr:"",caution:"",memo:""};
      db.customers.push(c); byName[qNorm(name)]=c; if(tel) byTel[tel]=c; cNew++;
    } else cUpd++;
    if(!c.kana&&kana) c.kana=kana;
    if(!c.tel&&tel) c.tel=tel;
    c.qcode=code;
    if(line0){ c.lineId=c.lineId||("Q:"+code); c.lineBlocked=(line0==="blk"); if(line0==="ok") line++; }
    byQ[code]=c;
  });
  // カルテ（同じ人・同じ日はカルテッツ側で上書き、無ければ追加）
  const idx={};
  db.charts.forEach(k=>{ idx[k.cid+"|"+k.date]=k; });
  QK.forEach(([code,d,st,menu,cond,orders,pay,disc,kind],i)=>{
    const c=byQ[code]; if(!c) return;
    const date=`20${d.slice(0,2)}-${d.slice(2,4)}-${d.slice(4,6)}`;
    const staff=st==="水"?"水野奈津子":"川口香子";
    const cur=idx[c.id+"|"+date];
    if(cur){
      cur.menu=menu||cur.menu; cur.staff=staff;
      if(pay) cur.price=pay;
      cur.skin=cond||cur.skin; cur.goods=orders||cur.goods;
      cur.kind=kind; cur.disc=disc; cur.qid="q"+i; kDup++;
    }else{
      const k={id:uid(),cid:c.id,date,staff,menu,price:pay,parts:"",machine:"",level:"",
        skin:cond,goods:orders,next:"",note:"",kind,disc,src:"quartets",qid:"q"+i};
      db.charts.push(k); idx[c.id+"|"+date]=k; kNew++;
    }
  });
  return {cNew,cUpd,line,kNew,kDup};
}

/* ---------- 同じ日のカルテをひとつにまとめる（v206） ----------
   利用者の指摘：**「1回の施術が終わりスクエアで会計したあと、物販を購入して
   もう一度スクエアで会計すると、同じお客様でカルテが2つできてしまう。
   カルテを一つにまとめるかどうかを選択する機能がほしい」**

   そのとおりで、Squareの決済は1件ごとに `sqid` が別なので、
   同じ日に2回会計すればカルテも2件になる（v188 で塞いだのは
   「手で書いたカルテ」＋「Squareのカルテ」の組で、Square同士は残っていた）。

   ★ **勝手にまとめない。** 同じ日に2回いらした本当に別の来店もあるので、
     「もう1件あります」と知らせて、押されたときだけまとめる。
   ★ **SquareのIDは両方持つ**（`sqids`）。片方を捨てると、次の取り込みで
     捨てたほうがもう一度カルテになって元どおり2件に戻る。
   ★ まとめたカルテは `merged` の印を付け、取り込みのときに
     **2件ぶんの合計**を入れ直す（1件ぶんの金額で上書きしない）。
   ★ 売上そのものは `db.sqsales`（Squareの決済の控え）から出しているので、
     まとめても**売上は1円も動かない**。在庫の販売数も商品IDで数えているので動かない。 */
/* 同じ日の、同じ方のカルテ（v206／v212で広げた）

   ★★★ v212：**名簿が2件に分かれているときも拾う。** ★★★
   利用者の指摘（2026-09-07）：「カルテの1168と1169が同じ人になっている」。
   実データを見たら、**同じ「坪井麻穂」さんが名簿に2件**あった。

     no.284　坪井麻穂（かな有り・電話なし・Squareの結びつき無し）… 手で書いたカルテ1件
     no.285　坪井麻穂（かな無し・電話あり・Squareの結びつき有り）… Square取込のカルテ1件

   ホームの「名簿に追加」を押したときに、**同じお名前がすでにあるかを見ていなかった**ので
   2件目ができ、cid が別なので
     ・取り込みの「手書きカルテを格上げする」道（v188）が当たらず、カルテも2枚になった
     ・この「同じ日のカルテ」も cid で見ていたので、**まとめる案内が1件も出なかった**
   同じ形が、この時点で名簿8組・カルテ2組あった。

   → **お名前が同じなら、cid が違っても候補に出す。**（まとめるときは名簿もひとつにする） */
function sameDayCharts(k){
  if(!k||!k.cid||!k.date) return [];
  const me=(db.customers||[]).find(c=>c.id===k.cid);
  const n=me?cNorm(me.name):"";
  return (db.charts||[]).filter(x=>{
    if(x.id===k.id||x.date!==k.date) return false;
    if(x.cid===k.cid) return true;
    if(!n||!x.cid) return false;
    const c=(db.customers||[]).find(y=>y.id===x.cid);
    return !!c&&cNorm(c.name)===n;
  });
}
/* そのカルテが「別のお客様として登録されている」ほうか（v212） */
function otherCust(k,x){ return !!(k&&x&&x.cid&&k.cid&&x.cid!==k.cid); }
function mergeCharts(keepId,dropId){
  const a=(db.charts||[]).find(x=>x.id===keepId);
  const b=(db.charts||[]).find(x=>x.id===dropId);
  if(!a||!b||a.id===b.id) return null;
  const uniq=(...ls)=>[...new Set([].concat(...ls).map(v=>String(v||"").trim()).filter(Boolean))];
  const add=(x,y)=>(+x||0)+(+y||0);
  /* ★ **Squareの決済にひもづいていない金額**（手で書いたカルテのぶん）を覚えておく。
     取り込みは決済の合計しか知らないので、これを足さないと
     **次の取り込みで手で書いたぶんが消える**（v206の見直しで見つけた）。
     ★ **残すほう（a）が手で書いたカルテで、消すほう（b）がSquareのカルテ**という
       組み合わせもある（b の sqid を a が引き継ぐ）。そのときは
       **a のもとの金額**がひもづかないぶんなので、両方を見る */
  /* ★ v226：まとめると `src` が "square" に変わることがある（下の行）。
     まとめる前に確認ずみだったカルテが、まとめた瞬間に「未確認」へ化けないよう、
     ここで見ておいて、あとで印を残す */
  const aWasChecked=kChecked(a)||kChecked(b);
  const noSq=x=>!x.sqid&&!(x.sqids||[]).length;
  const aHand=noSq(a)?(+a.price||0):0;
  const bHand=noSq(b)?(+b.price||0):0;
  const keepNum=(f)=>{ const v=add(a[f],b[f]); if(v) a[f]=v; else delete a[f]; };
  a.price=add(a.price,b.price);
  ["cash","ret","disc"].forEach(keepNum);
  const ds=[...(a.discs||[]),...(b.discs||[])];
  if(ds.length) a.discs=ds; else delete a.discs;
  a.menus=uniq(a.menus||String(a.menu||"").split("／"), b.menus||String(b.menu||"").split("／"));
  a.opts =uniq(a.opts||[], b.opts||[]);
  a.menu=joinMenu(a.menus,a.opts);
  ["sales","mats","gifts","camps"].forEach(f=>{
    const v=[...(a[f]||[]),...(b[f]||[])];
    if(v.length) a[f]=v; else delete a[f];
  });
  a.goods=uniq(String(a.goods||"").split("／"),String(b.goods||"").split("／")).join("／");
  /* 書いたものは消さない。片方にしか無ければそれを残し、両方あれば並べる */
  ["wish","note","next","parts","machine","level","shots","skin"].forEach(f=>{
    const x=String(a[f]||"").trim(), y=String(b[f]||"").trim();
    if(!y) return;
    a[f]=x?(x===y?x:x+NL+y):y;
  });
  if(Array.isArray(b.photos)&&b.photos.length)
    a.photos=[...(a.photos||[]),...b.photos].slice(0,KPHOTO_MAX);
  if(!a.src&&b.src) a.src=b.src;
  if(b.src==="square") a.src="square";
  if(aWasChecked) a.chk=1;                     /* v226：確認ずみは、まとめても確認ずみ */
  /* SquareのIDは両方持つ。捨てると次の取り込みでまた2件になる */
  const ids=new Set([...(a.sqids||[]),...(b.sqids||[]),b.sqid].filter(Boolean));
  if(!a.sqid&&b.sqid){ a.sqid=b.sqid; }
  ids.delete(a.sqid);
  if(ids.size) a.sqids=[...ids];
  /* ★ **まとめたら必ず印を付ける。** 印が無いと、取り込みが
     「決済1件ぶんの金額」でこのカルテを上書きしてしまう */
  a.merged=1;
  if(aHand+bHand) a.handYen=(+a.handYen||0)+aHand+bHand;
  db.charts=db.charts.filter(x=>x.id!==b.id);
  return {price:a.price,n:(a.sqids||[]).length+1};
}

    if(keDrv) keDrv.onclick=()=>openDrivePicker(d=>{
      if(kePhotos.length>=KPHOTO_MAX){ toast(`写真は${KPHOTO_MAX}枚までです`); return false; }

    root.querySelector("[data-kmadd]").onclick=()=>keMenuDraw(root,keMenuRead(root).concat([""]));
    root.querySelector("[data-koadd]").onclick=()=>keOptDraw(root,keOptRead(root).concat([""]));
    ["mats","gifts","camps","sales"].forEach(kind=>

    /* v204：前回と同じ材料を入れる */

        if(f==="disc"){ const v=+i.value||0; if(v) k.disc=v; else delete k.disc; return; }
        k[f]=i.value.trim();

      const ms=[...root.querySelectorAll("[data-km]")].map(e=>e.value.trim()).filter(Boolean);

      ["mats","gifts","camps","sales"].forEach(kind=>{
        const v=keRead(root.querySelector(`[data-ke="${kind}"]`),kind);

/* ---------- 予約詳細（モーダル）とドラッグ移動 ---------- */
const STAT=["予約完了","来店済み","キャンセル","無断キャンセル"];
const statOf=a=>a.stat||(a.status==="cancel"?"キャンセル":"予約完了");

/* ═══════════ カルテの「確認ずみ」（v226）═══════════
   利用者の指示（2026-09-12）：
   **「スケジュールの『済』は、カルテ入力が終わったら出るようにしてほしい。
     Squareから自動でできたカルテは川口さんが関与していないのに一覧に出てくる。
     そういうカルテに『済』ボタンを作って、押したらスケジュールに『済』と出してほしい。
     そうすれば、どのカルテを自分が入力して、どれが勝手にできただけなのかが分かるし、漏れがなくなる」**

   考え方はひとつだけ。**カルテを「人が見たかどうか」で分ける。**

   ・手で作ったカルテ（`src!=="square"`）＝川口さんが自分の意思で打ったもの → **はじめから確認ずみ**
   ・Squareの決済から自動でできたカルテ（`src==="square"`）→ **人が「済」を押すまで未確認**

   ★ 印は `k.chk`。**古いカルテには無いので、無いときは `src` で決める。**
     こうすると移行のコードが要らない（過去のSquareぶんは、そのまま「未確認」として並ぶ。
     利用者が見たいのはまさにそこ）。
   ★ 「済」を押しても、**金額も中身も1文字も変えない。** 見たという印だけを付ける。 */
const kChecked=k=>!!(k&&(k.chk||k.src!=="square"));
const kNeedChk=k=>!!(k&&!k.chk&&k.src==="square");
const kartesOfAppt=a=>(db.charts||[]).filter(k=>k.cid===a.cid&&k.date===a.date);
/* スケジュールの札に「済」を出すかどうか。**カルテの確認ずみで決める。**
   ★ カルテが1件も無いときだけ、人が予約詳細で選んだステータス（来店済み）を見る。
     「来たけれどカルテはまだ」を手で印だけ付けている場合に、それを消さないため。
   ★ `a.stat` そのものは今までどおり（v204のまま）。**札の意味だけが変わった**＝
     「来た」ではなく「カルテを確認した」 */
function apDone(a){
  const ks=kartesOfAppt(a);
  if(ks.length) return ks.some(kChecked);
  return statOf(a)==="来店済み";
}
/* 「済」を押したとき。★ ここが唯一の入口（カルテ一覧・カルテ詳細・予約詳細の3か所から呼ぶ） */
async function markKarteChecked(id){
  const k=(db.charts||[]).find(x=>x.id===id); if(!k) return false;
  k.chk=1;
  /* ★ v226：**ここで予約に触らない。** はじめ `markVisited` を呼んでいたが、
     それは予約に `stat:"来店済み"` と `edited:{stat:1}` を書き込む＝
     「押しても中身は1文字も変わりません」と言いながら**予約を書き換えていた**。
     札の「済」は `apDone`＝カルテの確認ずみで決まるので、ここは印だけでよい。
     （Squareの取り込みが `markVisited` を呼ぶのは今までどおり・v204） */
  await save();
  renderKarte(); renderSched(); renderList();
  toast("カルテを「済」にしました");
  return true;
}
/* ---------- カルテを書いたら「来店済み」にする（v204） ----------
   これまで「来店済み」は**予約詳細を開いてプルダウンを選び、「ステータス更新」を押す**
   しか道が無かった。施術のあとに毎回それをやる人はいないので、
   カレンダーは終わった枠も終わっていない枠も同じ見た目で並んでいた
   （＝「今日はあと何人残っているか」がカレンダーから読めない）。

   カルテを書いた＝その方は来た、なので**そこで自動的に付ける。** 手数は増えない。
   ★ 人が自分で「キャンセル」「無断キャンセル」を選んでいたら**触らない**（上書きしない）。
   ★ 付けたら `edited.stat` の印も付ける。付けないと次のメール取り込みで戻る。 */
function markVisited(cid,date){
  if(!cid||!date) return 0;
  let n=0;
  (db.appts||[]).forEach(a=>{
    if(a.cid!==cid||a.date!==date||a.off||a.allday) return;
    if(a.status==="cancel") return;                    // 取消ずみには触らない
    if(a.stat&&a.stat!=="予約完了") return;             // 人が選んだものは尊重する
    a.stat="来店済み";
    a.edited=Object.assign({},a.edited,{stat:1});
    n++;
  });
  return n;
}

/* ---------- 指でも押せるようにする（v196） ----------
   利用者の指摘：**「パソコンではスケジュールの時間帯でクリックしたら入力できたが、
   iPad（タッチパネル）では反応しない」**

   原因は click のほう。iOS の Safari は、リンクでもボタンでもない普通の <div> に
   click を配らない。配るかどうかの見分けに **cursor:pointer** を使っている。
   月表示のマス（`.mc`）には cursor:pointer が付いていたので iPad でも押せていたが、
   週・日表示の時間帯（`.cbody .cday`）には付いていなかった。

   直しは2つ重ねてある。
     1. CSS に `cursor:pointer` を足す（iOS に「押せる」と教える）
     2. click ではなく **pointerup** で拾う（マウスも指も同じ道を通る）
   2 のほうが確実なので、click は使わずに置き換えた。

   ★ 表は縦にスクロールする。指を滑らせたときに予約の入力欄が開いてしまわないよう、
     **動いた距離が10px以内・押していた時間が700ms以内**のときだけタップとみなす。
     スクロールが始まると pointercancel が来るので、そこでも取り消している。 */
function tapOn(el,fn){
  let x0=0,y0=0,t0=0,id=null;
  el.addEventListener("pointerdown",e=>{
    if(e.button&&e.button!==0){ id=null; return; }
    x0=e.clientX; y0=e.clientY; t0=Date.now(); id=e.pointerId;
  },{passive:true});
  el.addEventListener("pointerup",e=>{
    if(id===null||e.pointerId!==id) return;
    id=null;
    if(Math.abs(e.clientX-x0)>10||Math.abs(e.clientY-y0)>10) return;   // スクロールした
    if(Date.now()-t0>700) return;                                      // 長押しだった
    fn(e);
  });
  el.addEventListener("pointercancel",()=>{ id=null; });
}

/* ═══════════ 予約を長押しで動かす（v206で作り直した） ═══════════
   川口さんからの2つ：
     ①「スクロールするときに予定を触って移動してしまうことがある」
     ②「15分単位なのはいいが、希望のところにセットしにくい」

   直したところ：
     ・**長押しは 500ms**（350ms は指を置いただけでつかんでしまっていた）
     ・**つかんだ場所を保つ。** いままでは指の位置＝予約の**開始時刻**だったので、
       札の真ん中をつかむと札が上へ飛んでいた。いまは掴んだ位置のまま動く
     ・**落ちる先をカレンダーの中に出す**（`.dropg` の破線の枠）。
       いままでは画面上端の札に時刻が出るだけで、どこに入るのか見えなかった
     ・**指を離しても、すぐには動かさない。** 「この時間に変更しますか？」を出し、
       そこで **− 15分／＋ 15分／前の日／次の日** で細かく直してから「はい」。
       ★ これで、うっかり触って動いてしまっても**必ず気づける**（①の答え） */
const hm2min=s=>{const m=String(s||"").split(":"); return (+m[0]||0)*60+(+m[1]||0);};
const DRAG_HOLD=500;                        // 長押しと認める時間（ミリ秒）

function showDrop(date,time,dur){
  const col=document.querySelector(`.cbody .cday[data-d="${date}"]`);
  if(!col){ hideDrop(); return; }
  let g=document.getElementById("dropghost");
  if(!g){ g=document.createElement("div"); g.id="dropghost"; g.className="dropg"; }
  if(g.parentNode!==col) col.appendChild(g);
  const st=hm2min(time);
  g.style.top=((st-OPEN*60)/60*PXH)+"px";
  g.style.height=Math.max(18,(+dur||60)/60*PXH-2)+"px";
  g.textContent=`${time} 〜 ${toHM(st+(+dur||60))}`;
}
function hideDrop(){ document.getElementById("dropghost")?.remove(); }

/* 「この時間に変更しますか？」。決まった時刻を返す（やめたら null）。
   見た目は予約詳細と同じモーダル（.mo-ov）。新しい見た目は増やしていない */
let mvResolve=null;
function askMoveAppt(a,to){
  return new Promise(resolve=>{
    /* v206：前の確認が開いたままだったら、**必ず終わらせてから**開き直す。
       終わらせないと、前の「指を離したあとの処理」が待ちっぱなしになって
       画面が描き直されない */
    if(mvResolve){ const f=mvResolve; mvResolve=null; f(null); }
    document.getElementById("mvmodal")?.remove();
    let d=to.date, t=to.time;
    const dur=+a.dur||60;
    const ov=document.createElement("div");
    ov.id="mvmodal"; ov.className="mo-ov";
    mvResolve=resolve;
    const fin=v=>{ ov.remove(); if(mvResolve===resolve) mvResolve=null; resolve(v); };
    const draw=()=>{
      const fmt=(dd,tt)=>`${dd.slice(5).replace("-","/")}（${DOW[D(dd).getDay()]}） ${tt}`;
      const same=(d===a.date&&t===a.start);
      ov.innerHTML=`<div class="mo-box" style="max-width:440px">
        <div class="mo-hd"><span>予約の時間を変える</span><button data-mv="no" aria-label="閉じる">×</button></div>
        <div class="mo-bd">
          <div class="mo-row"><span>お客様</span><div class="mo-val">${esc(a.name||"")} 様${
            a.menu?`<br><small style="color:var(--ink3)">${esc(a.menu)}</small>`:""}</div></div>
          <div class="mo-row"><span>いま</span><div class="mo-val">${fmt(a.date,a.start)}</div></div>
          <div class="mo-row"><span>変更後</span><div class="mo-val">
            <b style="font-size:17px">${fmt(d,t)} 〜 ${toHM(hm2min(t)+dur)}</b>
            <br><small style="color:var(--ink3)">${dur}分${same?"　（いまと同じ時間です）":""}</small></div></div>
          <div class="mo-row"><span>細かく直す</span><div class="mo-val">
            <div class="actions" style="margin:0">
              <button class="btn quiet" data-mv="-15">− 15分</button>
              <button class="btn quiet" data-mv="+15">＋ 15分</button>
              <button class="btn quiet" data-mv="-1d">前の日</button>
              <button class="btn quiet" data-mv="+1d">次の日</button>
            </div>
            <span class="note">押すたびに上の「変更後」が動きます。</span></div></div>
        </div>
        <div class="mo-ft">
          <button class="btn" data-mv="ok"${same?" disabled":""}>この時間に変更する</button>
          <span class="sp"></span>
          <button class="btn quiet" data-mv="no">やめる</button>
        </div></div>`;
      ov.querySelectorAll("[data-mv]").forEach(b=>b.onclick=()=>{
        const k=b.dataset.mv;
        if(k==="ok"){ fin({date:d,time:t}); return; }
        if(k==="no"){ fin(null); return; }
        if(k==="-1d"||k==="+1d"){ d=shiftDay(d,k==="+1d"?1:-1); draw(); return; }
        /* 開けている時間からはみ出さない（開店 OPEN 時〜 閉店 CLOSE 時） */
        const n=Math.min(CLOSE*60-15,Math.max(OPEN*60,hm2min(t)+(k==="+15"?15:-15)));
        t=toHM(n); draw();
      });
    };
    draw();
    ov.onclick=e=>{ if(e.target===ov) fin(null); };
    document.body.appendChild(ov);
  });
}

function enableDrag(root,days){
  let st=null;
  root.querySelectorAll(".cbody .ev").forEach(elv=>{
    elv.addEventListener("pointerdown",e=>{
      if(e.button&&e.button!==0) return;
      const a=db.appts.find(x=>x.id===elv.dataset.id); if(!a) return;
      /* v206：**つかんだ場所**（札の上端から指までの距離）を覚える。
         これを引かないと、札の真ん中をつかんだときに開始時刻が指の位置に飛ぶ */
      const off=e.clientY-elv.getBoundingClientRect().top;
      st={elv,a,off,x0:e.clientX,y0:e.clientY,on:false,moved:false,
        t:setTimeout(()=>{
          st.on=true; elv.classList.add("dragging");
          elv.setPointerCapture(e.pointerId);
          if(navigator.vibrate) navigator.vibrate(15);
          showGhost(a.date,a.start); showDrop(a.date,a.start,a.dur);
        },DRAG_HOLD)};
    });
    elv.addEventListener("pointermove",e=>{
      if(!st) return;
      if(Math.abs(e.clientX-st.x0)>6||Math.abs(e.clientY-st.y0)>6) st.moved=true;
      if(!st.on) return;
      e.preventDefault();
      const hit=hitSlot(e.clientX,e.clientY,days,st.off);
      if(hit){ showGhost(hit.date,hit.time); showDrop(hit.date,hit.time,st.a.dur); }
    });
    const end=async e=>{
      if(!st) return;
      clearTimeout(st.t);
      const was=st.on, a=st.a, elv2=st.elv, moved=st.moved, off=st.off;
      elv2.classList.remove("dragging");
      const hit=was?hitSlot(e.clientX,e.clientY,days,off):null;
      st=null; hideGhost(); hideDrop();
      /* 長押しにならなかった＝ただのタップ。はらっただけなら何も開かない（v204） */
      if(!was){ if(!moved) openApModal(a); return; }
      if(!hit){ renderSched(); return; }
      /* v206：**ここで動かさない。** 必ず「この時間に変更しますか？」を出す。
         うっかり触って動かしてしまっても、ここで気づける（川口さんの指摘） */
      const from=`${a.date.slice(5).replace("-","/")} ${a.start}`;
      const ans=await askMoveAppt(a,hit);
      if(!ans||(ans.date===a.date&&ans.time===a.start)){ renderSched(); return; }
      a.date=ans.date; a.start=ans.time;
      /* v204：人が直した印。付けないと次の予約メールの取り込みで元の日時に戻る */
      a.edited=Object.assign({},a.edited,{date:1,start:1});
      await save(); schDate=ans.date; renderSched(); renderList();
      toast(`${a.name}様の予約を ${from} → ${ans.date.slice(5).replace("-","/")} ${ans.time} に移しました`);
    };
    elv.addEventListener("pointerup",end);
    elv.addEventListener("pointercancel",()=>{ if(st){clearTimeout(st.t);
      st.elv.classList.remove("dragging"); st=null; hideGhost(); hideDrop();} });
  });
}
function hitSlot(x,y,days,off){
  const el=document.elementFromPoint(x,y);
  const col=el&&el.closest?el.closest(".cbody .cday"):null;
  if(!col||!col.dataset.d) return null;
  const r=col.getBoundingClientRect();
  /* v206：つかんだ場所（off）を引いて、**札の上端**がどこに来るかで時刻を出す */
  const min=Math.round((OPEN*60+((y-(off||0))-r.top)/PXH*60)/15)*15;
  return {date:col.dataset.d,time:toHM(Math.max(OPEN*60,Math.min(min,CLOSE*60-15)))};
}

function showGhost(date,time){
  let g=document.getElementById("dragghost");

  g.textContent=`${date.slice(5).replace("-","/")}（${DOW[D(date).getDay()]}） ${time}`;
}
function hideGhost(){ document.getElementById("dragghost")?.remove(); }

/* ---------- オプションの選択肢（v134） ----------
   利用者の指示：**オプションを5つ増設。スクエアのカテゴリ→オプションの中の項目を
   プルダウンで選べるようにして、スクエアと連携するときに一緒に同期して。**

   出どころは2つあって、どちらも元はSquare。
   ・`db.sqcat`＝取り込みのたびに `relayGet("menu")` で入れ直す控え。**いちばん新しい姿**

const OPTCAT=c=>/オプション/.test(String(c||""));
function OPTIONS(){
  const out=[], seen=new Set();
  const add=(n,p,cat)=>{ n=String(n||"").trim(); if(!n||!OPTCAT(cat)) return;
    const k=MNORM(n); if(seen.has(k)) return; seen.add(k); out.push({n,p:+p||0}); };
  Object.values(((db.sqcat||{}).map)||{}).forEach(x=>add(x.n,x.p,x.cat));
  MENUS().forEach(m=>add(m.n,m.p,m.cat));

}

    if(!n||OPTCAT(cat)||retail) return;          // オプションと物販は入れない
    const k=MNORM(n); if(seen.has(k)) return;
    seen.add(k); out.push({n,p:+p||0,cat:String(cat||"").trim()});
  };
  Object.values(((db.sqcat||{}).map)||{}).forEach(x=>add(x.n,x.p,x.cat,x.r));
  MENUS().forEach(m=>add(m.n,m.p,m.cat,false));

}
/* 名前からメニュー（またはオプション）の値段を引く。3つのメニューと5つのオプションを足すため */
function menuPrice(n){

  const m=MENUS().find(x=>MNORM(x.n)===k);
  if(m&&m.p) return +m.p||0;
  const o=OPTIONS().find(x=>MNORM(x.n)===k);
  return o?+o.p||0:0;
}
/* ひらがな・カタカナのゆれも無視して探す（v202）。
   名簿のふりがなは**カタカナ**で入っている（ヤマシタアイキ）。
   iPadで「やま」と打ってもカタカナのふりがなに当たらないと、
   1文字で絞り込む意味が無い。MNORM（NFKCで半角カナも直る）のあと、
   カタカナをひらがなに寄せてから比べる。 */
const KNORM=s=>MNORM(s).replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));

const MNORM=s=>String(s||"").normalize("NFKC").replace(/[\s*✳・･\uFE0E\uFE0F]/g,"").toLowerCase();

const shiftMonth=(m,n)=>{const[y,mo]=m.split("-").map(Number);const d=new Date(y,mo-1+n,1);

function cell(m,pid){
  db.stock[m]=db.stock[m]||{};
  db.stock[m][pid]=db.stock[m][pid]||{open:0,in:0,adv:0,sold:0,gift:0,use:0,staff:0};
  return db.stock[m][pid];
}
/* v228：振替（ばらし）で動いたぶん。`swin`＝振替で入った数、`swout`＝振替で出した数。
   ★ 古い月には無い欄なので 0 になる＝**過去の数字はいっさい動かない**（`loss` と同じ入れ方） */
const SWIN=c=>+c.swin||0, SWOUT=c=>+c.swout||0;

/* v228：`+swin -swout` を足した。振替（ばらし）で増えた／減った数を帳簿に載せる */
const bookQty=c=>c.open+c.in+SWIN(c)-c.sold-c.gift-c.use-c.staff-SWOUT(c);
const endQty=c=>bookQty(c)-(+c.loss||0);

   利用者の指示：**毎月末にアプリと現物を全部突き合わせるのは効率が悪い。

/* v228：振替も「この月に動いた」に数える。数えないと、ばらしただけの商品が

const MOVEF=["in","sold","gift","use","staff","loss","swin","swout"];

     法人税法上の「法定評価方法」で、届出を出していなければこれが正式なやりかた。

   直しかた：**その月に使った原価を、その月に焼き込む（`db.costlock[月][商品ID]`）。**
   焼き込むのは**原価が変わる、まさにその瞬間**だけ。だから
     ・**操作は1つも増えない**（川口さんは今までどおり）
     ・焼き込むのは**入れ替える前の原価**なので、過去の月は「そのとき使っていた原価」のまま
     ・**伝票の月から先**は新しい原価に従う（焼き込みを外す）。
       同じ月に2回仕入れて値が違えば、最後の仕入値になる＝最終仕入原価法のまま
     ・焼き込むのは**原価が変わった商品だけ**。データは太らない

   ★ 原価を読むところは、ぜんぶ `costAt(商品ID, 月)` を通すこと。
     `p.cost` を直に読んでよいのは「いまの仕入単価」を出す画面（商品カード・仕入れの読み取り）だけ。 */
function costAt(pid,m){
  const v=(((db.costlock||{})[m])||{})[pid];
  if(v!==undefined) return +v||0;
  const p=db.products.find(x=>x.id===pid);
  return p?(+p.cost||0):0;
}
/* データのある月（在庫を付けた月＋カルテのある月）。焼き込む相手をここから選ぶ */
function costMonths(){
  const s=new Set(Object.keys(db.stock||{}));
  (db.charts||[]).forEach(k=>{ const m=String(k.date||"").slice(0,7); if(m) s.add(m); });
  return [...s].filter(Boolean).sort();
}
/* 原価を入れ替える**直前**に呼ぶ。
     pids       … 原価が変わる商品のID
     fromMonth  … 新しい原価が効きはじめる月（仕入伝票の月。手直しなら今月）
   fromMonth より前の月に**いまの原価**を焼き込み、fromMonth 以降の焼き込みは外す */
function lockCostsBeforeChange(pids,fromMonth){
  if(!pids||!pids.length||!fromMonth) return 0;
  if(!db.costlock) db.costlock={};
  let n=0;
  costMonths().filter(m=>m<fromMonth).forEach(m=>{
    const lk=db.costlock[m]=db.costlock[m]||{};
    pids.forEach(id=>{
      if(lk[id]!==undefined) return;                 // すでに焼き込んである月は触らない
      const p=db.products.find(x=>x.id===id); if(!p) return;
      lk[id]=+p.cost||0; n++;                        // ★入れ替える**前**の原価
    });
  });
  Object.keys(db.costlock).filter(m=>m>=fromMonth).forEach(m=>{
    pids.forEach(id=>{ if(db.costlock[m][id]!==undefined) delete db.costlock[m][id]; });
    if(!Object.keys(db.costlock[m]).length) delete db.costlock[m];
  });
  return n;
}
/* その月の原価が焼き込んであるか（画面に「確定ずみ」と出すため） */
const costLocked=m=>Object.keys(((db.costlock||{})[m])||{}).length;

function matUses(m){
  const out=[];
  (db.charts||[]).forEach(k=>{
    if(String(k.date||"").slice(0,7)!==m) return;
    const c=db.customers.find(x=>x.id===k.cid);
    (k.mats||[]).forEach(x=>{
      const p=db.products.find(y=>y.id===x.pid); if(!p) return;
      const q=+x.qty||1, cost=costAt(p.id,m);          /* v204：その月の原価 */
      out.push({date:k.date,who:c?c.name:"（名簿にいません）",staff:k.staff||"",
                n:p.n,qty:q,cost:cost,yen:q*cost,kid:k.id});
    });
  });
  return out.sort((a,b)=>a.date.localeCompare(b.date)||a.n.localeCompare(b.n,"ja"));
}
/* いま何がいくつ残っていて、いくらぶんか（月末在庫が0のものは出さない） */
function stockNow(kinds,m){
  return db.products.filter(p=>kinds.includes(p.kind))
    .map(p=>{const q=endQty(cell(m,p.id)), cost=costAt(p.id,m);   /* v204 */
             return {p,q,cost,yen:q*cost};})
    .filter(r=>r.q!==0)
    .sort((a,b)=>b.yen-a.yen||a.p.n.localeCompare(b.p.n,"ja"));
}
/* この月にスタッフが買ったもの（在庫の「スタッフ」欄。カルテとは無関係）。
   品名・個数・単価・原価を、買ったものだけ、金額の大きい順に。
   ★ v174 の staffBuys() は cell() を使っていた。cell() は**無い月・無い品の記録を作る**ので、
     12か月ぶんをまとめて読む年間一覧では db.stock（正本の db.json）が太っていく。
     ここは db.stock を**直接読むだけ**にしてある（v178） */
function staffRows(m){
  const st=(db.stock||{})[m]||{};
  return db.products.filter(p=>p.kind==="物販"||p.kind==="材料")
    .map(p=>{const q=Math.round(+(st[p.id]||{}).staff||0), cost=costAt(p.id,m);   /* v204 */
             return {p,q,cost,yen:q*cost};})
    .filter(r=>r.q)
    .sort((a,b)=>b.yen-a.yen||a.p.n.localeCompare(b.p.n,"ja"));
}
const sumYen=rows=>rows.reduce((a,r)=>a+r.yen,0);

function stCountSum(m,kinds){
  const s={todo:0,ok:0,ng:0,none:0,move:0,all:0};
  db.products.filter(p=>kinds.includes(p.kind)).forEach(p=>{
    s.all++; s[stState(m,p).k]++;
  });
  s.move=s.todo+s.ok+s.ng;
  return s;
}
const yen=n=>"¥"+Math.round(n).toLocaleString();
function hue(cat){
  if(CATCOL[cat]) return CATCOL[cat];
  let h=0; for(const ch of cat) h=(h*31+ch.charCodeAt(0))%360;
  return CATCOL[cat]=`hsl(${h},34%,42%)`;
}
/* 写真は長辺320pxのJPEGに縮めて保存する（保存容量を食わないように） */
function shrinkImage(file,max=320,q=0.72){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error("画像を読めませんでした"));
    fr.onload=()=>{
      const im=new Image();
      im.onerror=()=>rej(new Error("画像を開けませんでした"));
      im.onload=()=>{
        const r=Math.min(1,max/Math.max(im.width,im.height));
        const w=Math.round(im.width*r), h=Math.round(im.height*r);
        const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
        cv.getContext("2d").drawImage(im,0,0,w,h);
        res(cv.toDataURL("image/jpeg",q));
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
/* ドライブから来た写真（データURL）も、同じように長辺で縮める（v134） */
function shrinkDataUrl(d,max=640,q=0.72){
  return new Promise((res,rej)=>{
    const im=new Image();
    im.onerror=()=>rej(new Error("画像を開けませんでした"));
    im.onload=()=>{
      const r=Math.min(1,max/Math.max(im.width,im.height));
      const w=Math.round(im.width*r), h=Math.round(im.height*r);
      const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
      cv.getContext("2d").drawImage(im,0,0,w,h);
      res(cv.toDataURL("image/jpeg",q));
    };
    im.src=d;
  });
}

/* ---------- Googleドライブの写真から選ぶ（v134） ----------
   利用者の指示：**カルテの「写真を撮る」は使わないから消して、
   グーグルドライブのフォトから選べるように連携してほしい。**

   端末のカメラは使わない。ドライブに上がっている画像を一覧して、選んだ1枚を
   長辺640pxに縮めてカルテに入れる（今までの「画像を選ぶ」と同じ入れ物）。

   ★ 中継役に `drivepics`（一覧・小さな見本つき）と `drivepic`（1枚を大きく）が要る。
     **square-relay_15.gs 以降**。古い中継役だと「action を指定してください」が返る
   ★ 見本を1枚ずつ取りに行くので、1回に出すのは24枚まで。多いときは名前でしぼる */
/* エラーの見分け（v136）。**中継役が古いのか、ドライブ側で断られたのかを分けて出す。**
   v134→v135 のとき、貼り替えもデプロイも済んでいるのに写真が出ないことがあった。
   中身は `403 insufficient authentication scopes`＝中継役の承認では
   ドライブのAPIを直に叩けない、というものだったが、画面には
   「貼り直してください」としか出ていなかったので、原因にたどり着けなかった */
function gdHint(err){
  const e=String(err||"");
  if(/action を指定してください/.test(e))
    return `<b>中継役が古いままです。</b>square-relay_16.gs 以降を貼り替えて、
      <b>「デプロイを管理 → 鉛筆 → 新しいバージョン → デプロイ」</b>まで済ませてください。`;
  if(/insufficient authentication scopes/i.test(e))
    return `<b>中継役が v15 のままです。</b>square-relay_16.gs に貼り替えて、
      <b>「デプロイを管理 → 鉛筆 → 新しいバージョン → デプロイ」</b>まで済ませてください。`;
  // v138：**貼り替えでは直らない側**。承認（スコープ）が足りていない
  if(/権限がありません|authorization|not authorized|scope|permission|denied|403/i.test(e))
    return `<b>中継役はちゃんと動いています。貼り替えても直りません。</b>
      足りないのは<b>「ドライブを読んでよい」というGoogleの承認だけ</b>です
      （中継役はいままで、自分で作った db.json と写真フォルダしか触っていなかったため）。<br>
      <b>「ドライブの写真を使えるようにする手順.md」</b>のとおりに、
      ① Apps Script の <b>appsscript.json</b> に権限を3行足す
      ② エディタで <b>ドライブの写真を見る</b> を1回実行して「許可」
      ③ デプロイし直す ── の3つをしてください。<b>1回きりの作業です。</b>`;
  // v142：形式が合わなくて開けないだけのとき。**つなぎ方の話ではない**
  if(/画像を開けませんでした|画像を読めませんでした|ブラウザで開けません|そのままでは開けません/.test(e))
    return `<b>iPhoneの写真（HEIC）は、パソコンのブラウザがそのままでは開けません。</b>
      一覧の見本が見えているのは、それがGoogleの作ったJPEGだからです。<br>
      中継役を <b>square-relay_17.gs</b> に貼り替えて
      <b>「デプロイを管理 → 鉛筆 → 新しいバージョン → デプロイ」</b>まで済ませると、
      GoogleにJPEGへ変換させてから受け取るようになります（承認のやり直しは要りません）。`;
  if(/連携設定がまだです/.test(e))
    return `連携タブで中継役のURLと合言葉を入れてください。`;
  return `連携タブで中継役のURLと合言葉を確かめてください。
    ドライブの写真には <b>square-relay_16.gs</b> 以降が要ります。`;
}
/* ---------- いつもの場所（v140） ----------
   利用者の指摘：**「salon de kou のアカウントのフォトから選びたいのに、
   関係ないファイル（Chromeから保存・会計・川口香子…）が出てくる」**

   ★ Googleフォトは**ドライブとは別のサービス**で、いまは外部から一覧できない。
     2019年に「ドライブの中のGoogleフォト」が廃止、2025年3月に
     外部アプリがフォトのライブラリ全体を読む権限も廃止された（自分が上げた写真だけ）。
     **だから「フォトの一覧」は作れない。** 代わりに
     **カルテ用のフォルダを1つ決めて、そこを最初に開く**ようにした。

   `db.gdhome`＝{id,name}。db に入れるので6台ぜんぶで同じ場所が開く。 */
const gdHome=()=>(db.gdhome&&db.gdhome.id)?db.gdhome:null;
let gd={folder:"",name:"マイドライブ",parent:"",pics:[],folders:[],q:"",busy:false,err:"",more:false,take:null};
function openDrivePicker(take){
  const h=gdHome();
  gd={folder:h?h.id:"",name:h?h.name:"マイドライブ",parent:"",pics:[],folders:[],
      q:"",busy:true,err:"",more:false,take:take};
  document.getElementById("gdmodal")?.remove();
  const ov=document.createElement("div");
  ov.id="gdmodal"; ov.className="mo-ov";
  document.body.appendChild(ov);
  ov.onclick=e=>{ if(e.target===ov) closeDrivePicker(); };
  drawDrivePicker();
  gdLoad(gd.folder,"");
}
function closeDrivePicker(){ document.getElementById("gdmodal")?.remove(); }
async function gdLoad(folder,q){
  gd.busy=true; gd.err=""; drawDrivePicker();
  try{
    const j=await relayGet("drivepics",
      "&folder="+encodeURIComponent(folder||"")+"&q="+encodeURIComponent(q||""));
    gd.folder=folder||""; gd.q=q||"";
    gd.name=j.name||"マイドライブ"; gd.parent=j.parent||"";
    gd.folders=j.folders||[]; gd.pics=j.pics||[]; gd.more=!!j.more;
  }catch(e){ gd.err=e.message||"ドライブにつながりません"; gd.pics=[]; gd.folders=[]; gd.more=false; }
  gd.busy=false; drawDrivePicker();
}
async function gdPick(id){
  const take=gd.take;
  try{
    gd.busy=true; drawDrivePicker();
    const j=await relayGet("drivepic","&id="+encodeURIComponent(id));
    if(!j.data) throw new Error("その写真を取れませんでした");
    const d=await shrinkDataUrl(j.data,640,0.72).catch(()=>{
      throw new Error("画像を開けませんでした（HEICなど、ブラウザが開けない形式かもしれません）");
    });
    if(take&&take(d)===false){ gd.busy=false; drawDrivePicker(); return; }
    closeDrivePicker(); toast("ドライブの写真を入れました");
  }catch(e){ gd.busy=false; gd.err=e.message||"写真を取れませんでした"; drawDrivePicker(); }
}
function drawDrivePicker(){

      ${(!gd.busy&&!gd.err&&!gdHome())?`<p class="note">

        iPadやiPhoneなら「画像を選ぶ」で端末の写真から直接入れられます。</p>`:""}
      ${gd.more?`<p class="note">この場所は写真が多いので、<b>新しい順に見きれていません。</b>

    </div>

      <span class="sp"></span>

const TILES=[["end","月末在庫"],["sold","売上原価"],["in","仕入"],
             ["gift","プレゼント"],["use","消耗品"],["staff","スタッフ購入"],

const TILELABEL=Object.fromEntries(TILES);

/* v166：利用者の問い **「『繰入』手入力とあるが何を想定してる？」**
   → 「消耗品へ繰り入れた場合の『消耗品』を入力する箇所が必要」と続いたので、
   **この欄がまさにそれ**なのに名前で伝わっていなかった。「消耗品へ」と書く。 */

   利用者の指摘：**「スタッフ欄に1と入れたが決定ボタンがない。どうしたらよいか分からない」**

   直したのは2つ。**カードの上に「決定ボタンはありません」と書く**ことと、

   ★ 数字そのものの作りは変えていない。今まで入れたぶんも入っている。 */
const STLBL=f=>({open:"月初",in:"入荷",sold:stKinds.includes("物販")?"販売":"販売（在庫合わせ）",
  gift:"プレゼント",use:USETILE(),staff:"スタッフ購入",

/* サマリーの数字の内訳。何がいくつ動いていくらになったのかを出す */
function breakdown(k,total){
  const rows=db.products.filter(p=>stKinds.includes(p.kind)).map(p=>{
    const c=cell(stMonth,p.id);
    const q=k==="end"?endQty(c):c[k];
    return {p,q,cost:costAt(p.id,stMonth),amt:q*costAt(p.id,stMonth)};   /* v204 */
  }).filter(r=>r.q!==0).sort((a,b)=>Math.abs(b.amt)-Math.abs(a.amt)||b.q-a.q);
  if(!rows.length) return `<div class="bd"><p class="note" style="margin:0">
